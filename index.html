      <p class="formula-legenda">d100 + modificatore</p>
      <ul class="legenda legenda--compatta">
        <li><span class="leg-num">${segno(R.abilita)}</span><div>per ogni stella di esperienza del conducente (★ da 0 a 3)</div></li>
        <li><span class="leg-num">+</span><div>il bonus di ogni oggetto equipaggiato</div></li>
        <li><span class="leg-num">${segno(R.scorta)}</span><div>con la scorta armata (costa ${mo(R.costoScorta)} a viaggio)</div></li>
        <li><span class="leg-num">${segno(-R.pericolo)}</span><div>per ogni punto di pericolo della tratta</div></li>
        <li><span class="leg-num">${segno(R.neve)}</span><div>con la neve, ${segno(R.bufera)} con la bufera</div></li>
        <li><span class="leg-num">${segno(R.danneggiato)}</span><div>se il mezzo è danneggiato</div></li></ul>
      <p class="fioco piccolo">Il totale indica la riga della tabella degli eventi. Un 1 naturale è sempre la prima riga, un 100 naturale l'ultima.</p></section>
    <section class="legenda-sez"><h3 class="t3">La tabella degli eventi</h3>
      <ul class="eventi-legenda">${eventi.map(e => `<li><b>${esc(intervallo(e))}</b><div><strong>${esc(e.nome)}</strong><span class="fioco">${esc(effetti(e))}${e.mitiga ? `. Attenua: ${esc((CATEGORIE_EQUIP[e.mitiga] || e.mitiga).toLowerCase())}` : ''}</span></div></li>`).join('') || '<li class="vuoto">Ancora nessun evento.</li>'}</ul></section>
    <section class="legenda-sez"><h3 class="t3">L'equipaggiamento</h3><p class="fioco" style="margin:6px 0 0">Ogni conducente ha un posto per categoria. L'oggetto aggiunge il suo bonus al tiro; se l'evento è legato alla sua categoria, perdite e ritardi si dimezzano, il conducente torna ferito invece che morto e il mezzo danneggiato invece che perso.</p>

        <li><span class="leg-num">${ico('lanterna')}</span><div><strong>Legna e olio di balena</strong><span class="fioco">Good Mead, Lonelywood e Termalaine bruciano la legna dei boschi vicini. Nelle altre città la legna è troppo preziosa: ci si scalda e si fa luce con l'olio di balena, che arriva dai balenieri della costa del Sea of Moving Ice.</span></div></li></ul></section>
    <section class="legenda-sez"><h3 class="t3">I simboli</h3><ul class="legenda legenda--compatta">
      <li><span class="leg-num">★</span><div><strong>Esperienza del conducente</strong><span class="fioco">Da ☆☆☆ (alle prime armi) a ★★★ (veterano della pista).</span></div></li>
      <li><span class="leg-num"><span class="stato-mezzo st-buono">ok</span></span><div><strong>Stato del mezzo</strong><span class="fioco">In ordine, danneggiato (${segno(R.danneggiato)} al tiro) o perso.</span></div></li>

}

    h += `<section class="sezione" style="margin-top:6px"><h2>Come si tira</h2>

    }).join('') + `</div><div class="azioni"><button class="btn btn--piccolo" data-a="nuovo" data-tab="commercio" data-tipo="evento">${ico('piu')}Nuova riga</button></div></section>`;
    h += `<section class="sezione"><h2>Equipaggiamento in vendita</h2>` + Object.entries(CATEGORIE_EQUIP).map(([cat, l]) => {
      const ogg = comm('oggetto', o => o.categoria === cat);
      return `<h3 class="gruppo-azione">${l}</h3><ul class="lista">` + ogg.map(o => `<li><button class="riga riga-btn" data-a="modifica" data-tab="commercio" data-id="${esc(o.id)}"><div class="corpo"><div class="tit">${esc(o.nome)} <span class="fioco">+${esc(o.bonus || 0)}</span></div><div class="sub">${mo(o.costo)}${o.effetto ? ', ' + esc(o.effetto) : ''}</div></div></button></li>`).join('') + '</ul>';
    }).join('') + `<div class="azioni"><button class="btn btn--piccolo" data-a="nuovo" data-tab="commercio" data-tipo="oggetto">${ico('piu')}Nuovo oggetto</button></div></section>`;
    return h;
  }

  // SPEDIZIONI (vista principale)
  const mancano = [];
  if (!comm('tratta').length) mancano.push('una tratta');
  if (!comm('mezzo', m => m.stato !== 'perso').length) mancano.push('un mezzo');
  if (!elenco('voci', v => v.conducente && v.stato !== 'morto').length) mancano.push('un conducente');
  if (!comm('merce').length) mancano.push('una merce');
  h += `<div class="azioni" style="margin-top:6px"><button class="btn btn--primario" data-a="sp-nuova" ${mancano.length ? 'disabled' : ''}>${ico('slitta')}Nuova spedizione</button>
    <button class="btn" data-a="nuovo" data-tab="commercio" data-tipo="movimento">${ico('piu')}Movimento di cassa</button></div>`;
  if (mancano.length) h += `<p class="fioco piccolo">Per partire serve ancora ${mancano.join(', ')}: si aggiungono in Flotta e Mercato.</p>`;
  const viaggio = comm('spedizione', s => s.stato === 'in-viaggio');
  const segrete = comm('spedizione', s => s.segreto && s.esito);
  const fatte = comm('spedizione', s => s.stato !== 'in-viaggio' && !s.segreto).sort((a, b) => String(b.risolta || '').localeCompare(String(a.risolta || '')));
  if (segrete.length) h += `<section class="sezione"><h2>Esiti segreti <span class="conta">${segrete.length}</span></h2>${segrete.map(cartaSpedizione).join('')}</section>`;
  h += `<section class="sezione"><h2>In viaggio <span class="conta">${viaggio.length}</span></h2>${viaggio.length ? viaggio.map(cartaSpedizione).join('') : '<p class="vuoto">Nessuna spedizione in viaggio.</p>'}</section>`;
  if (fatte.length) h += `<section class="sezione"><h2>Spedizioni concluse</h2>${fatte.slice(0, 12).map(cartaSpedizione).join('')}</section>`;
  const mov = comm('movimento').sort((a, b) => String(b.data || b.agg || '').localeCompare(String(a.data || a.agg || '')));
  h += `<section class="sezione"><h2>Cassa</h2>` + (mov.length ? '<ul class="lista">' + mov.slice(0, 15).map(m =>
    `<li><button class="riga riga-btn" data-a="modifica" data-tab="commercio" data-id="${esc(m.id)}"><div class="corpo"><div class="tit tronca">${esc(m.testo)}</div><div class="sub">${dataBella(m.data)}</div></div><strong class="importo ${Number(m.importo) < 0 ? 'neg' : ''}">${Number(m.importo) > 0 ? '+' : ''}${mo(m.importo)}</strong></button></li>`).join('') + '</ul>' : '<p class="vuoto">Ancora nessun movimento.</p>') + '</section>';
  return h;
}

function cartaSpedizione(sp) {
  const tr = DB.commercio[sp.tratta], mz = DB.commercio[sp.mezzo], merce = DB.commercio[sp.merce];
  const cond = DB.voci[sp.conducente];
  const chi = [cond ? cond.nome : '', mz ? mz.nome : ''].filter(Boolean).join(' con ');
  const cosa = (sp.quantita || 0) + ' carichi di ' + (merce ? merce.nome.toLowerCase() : 'merce');
  if (sp.stato === 'in-viaggio') {
    return `<article class="spedizione"><div class="corpo"><h3>${esc(nomeTratta(tr))}</h3><p class="sub">${esc(cosa)}${chi ? ', ' + esc(chi) : ''}${sp.meteo && sp.meteo !== 'sereno' ? ', ' + esc(METEO[sp.meteo]).toLowerCase() : ''}</p></div>
      <div class="azioni" style="margin-top:10px"><button class="btn btn--primario btn--piccolo" data-a="sp-risolvi" data-id="${esc(sp.id)}">Risolvi il viaggio</button>
      <button class="btn btn--testo btn--piccolo" data-a="sp-annulla" data-id="${esc(sp.id)}">Annulla</button></div></article>`;
  }
  const e = sp.esito || {};
  const perso = sp.stato === 'persa';
  return `<article class="spedizione conclusa${perso ? ' persa' : ''}"><div class="corpo"><h3>${esc(nomeTratta(tr))}</h3>
    <p class="esito-nome">${esc(e.nome || '')} <span class="fioco">tiro ${esc(sp.dado)}${Number(sp.mod) ? (Number(sp.mod) > 0 ? ' +' : ' ') + esc(sp.mod) : ''} = ${esc(sp.totale)}</span></p>
    <p class="sub">${esc(e.arrivati)} carichi su ${esc(e.qta)} arrivati in ${esc(e.giorni)} ${Number(e.giorni) === 1 ? 'giorno' : 'giorni'}${e.conducente && cond ? ', ' + esc(cond.nome) + (e.conducente === 'morto' ? ' è morto' : ' è ferito') : ''}${(e.note || []).length ? '. ' + esc(e.note.join('. ')) : ''}</p></div>
    <strong class="importo ${Number(e.netto) < 0 ? 'neg' : ''}">${Number(e.netto) > 0 ? '+' : ''}${mo(e.netto)}</strong>
    ${sp.segreto ? `<div class="azioni" style="margin-top:8px"><button class="btn btn--primario btn--piccolo" data-a="sp-rivela" data-id="${esc(sp.id)}">${ico('occhio')}Rivela al gruppo</button></div>` : ''}</article>`;
}

      <div class="riga-campi">${sel('merce', 'merce', null, 'Merce')}
      <label class="campo"><span>Carichi</span><input type="number" name="quantita" value="1" min="1" inputmode="numeric" data-a="sp-calcola"></label></div>
      <label class="campo"><span>Per un contratto</span><select name="contratto" data-a="sp-calcola"><option value="">Nessuno, vendita libera</option>${contratti.map(c => `<option value="${esc(c.id)}">${esc((DB.commercio[c.merce] || {}).nome || 'Merce')} per ${esc(nomeDi(c.luogo))}</option>`).join('')}</select></label>
      <div class="campo"><span class="etichetta">Meteo</span><div class="pillole">${Object.entries(METEO).map(([k, l], i) => `<label><input type="radio" name="meteo" value="${k}" ${i === 0 ? 'checked' : ''} data-a="sp-calcola"><span>${l}</span></label>`).join('')}</div></div>
      <label class="interruttore"><span>Scorta armata (+${R.scorta}, costa ${mo(R.costoScorta)})</span><input type="checkbox" name="scorta" data-a="sp-calcola"></label>

}
function leggiFormSpedizione(f) {
  const val = n => { const el = f.querySelector(`[name="${n}"]`); return el ? el.value : ''; };
  return {
    tipo: 'spedizione', tratta: val('tratta'), mezzo: val('mezzo'), conducente: val('conducente'), merce: val('merce'),
    quantita: Math.max(1, Number(val('quantita')) || 1), contratto: val('contratto'),
    meteo: (f.querySelector('[name="meteo"]:checked') || {}).value || 'sereno', scorta: f.querySelector('[name="scorta"]').checked ? 1 : 0
  };
}
function aggiornaAnteprimaSpedizione() {
  const f = document.getElementById('form-spedizione');
  const box = document.getElementById('sp-anteprima');
  if (!f || !box) return;
  const sp = leggiFormSpedizione(f);
  const m = modificatoreSpedizione(sp);
  const mz = DB.commercio[sp.mezzo];
  const troppo = mz && Number(mz.capacita) && sp.quantita > Number(mz.capacita);
  // una slitta con i cani segnati: oltre quello che la muta tira (Rime pag. 20) avviso, ma non blocco
  const muta = mz && mz.sottotipo === 'slitta' && Number(mz.cani) ? carichiCani(mz.cani) : 0;
  const pesante = muta && !troppo && sp.quantita > muta;
  box.innerHTML = `<div class="mod-tot"><span>Modificatore al d100</span><strong>${m.totale >= 0 ? '+' : ''}${m.totale}</strong></div>` +
    (m.righe.length ? '<ul>' + m.righe.map(r => `<li><span>${esc(r[0])}</span><span>${r[1] >= 0 ? '+' : ''}${r[1]}</span></li>`).join('') + '</ul>' : '<p class="fioco piccolo">Nessun bonus né malus.</p>') +
    (troppo ? `<p class="errore">${esc(mz.nome)} porta al massimo ${esc(mz.capacita)} carichi.</p>` : '') +
    (pesante ? `<p class="avviso-carico">Con ${esc(mz.cani)} cani la muta tira circa ${muta} carichi (360 libbre a cane, Rime pag. 20): servono più cani o meno merce.</p>` : '');
}

function aggiornaContoSlitta() {
  const f = document.getElementById('form-slitta');
  const box = document.getElementById('slitta-conto');
  if (!f || !box) return;
  const cani = clamp(Number(f.elements.cani.value) || 0, 0, 20);
  box.textContent = `Costa ${mo(NUMERI_RIME.slitta + cani * NUMERI_RIME.cane)} (slitta ${NUMERI_RIME.slitta} mo + ${cani} × ${NUMERI_RIME.cane} mo). ` +
    (cani ? `La muta tira circa ${carichiCani(cani)} carichi: lo segno come carico massimo, poi si cambia dal mezzo.` : 'Senza cani la tira qualcuno a mano: il carico massimo lo decidete voi.');
}
function compraSlitta(f) {
  const nome = f.elements.nome.value.trim();
  if (!nome) { avviso('Dai un nome alla slitta'); return false; }
  const cani = clamp(Number(f.elements.cani.value) || 0, 0, 20);
  const costo = NUMERI_RIME.slitta + cani * NUMERI_RIME.cane;
  salva('commercio', { tipo: 'mezzo', sottotipo: 'slitta', nome, cani, capacita: carichiCani(cani) || '', stato: 'buono', note: `Comprata per ${costo} mo (Rime pag. 20).` });
  if (f.elements.cassa.checked) salva('commercio', { tipo: 'movimento', testo: `Acquisto: ${nome}, slitta con ${cani} ${cani === 1 ? 'cane' : 'cani'}`, importo: -costo, data: oggiISO() });
  avviso(f.elements.cassa.checked ? `Slitta comprata: ${mo(costo)} dalla cassa` : 'Slitta aggiunta alla flotta');
  return true;
}

  const cond = DB.voci[sp.conducente];

function apriConducente(id) {

      <label class="campo"><span>Paga a viaggio (mo)</span><input type="number" name="paga" value="${esc(c && c.paga !== undefined ? c.paga : 2)}" min="0" step="0.5" inputmode="decimal"></label>
      ${Object.entries(CATEGORIE_EQUIP).map(([cat, l]) => `<label class="campo"><span>${l}</span><select name="eq-${cat}"><option value="">Niente</option>${comm('oggetto', o => o.categoria === cat).map(o => `<option value="${esc(o.id)}" ${eq[cat] === o.id ? 'selected' : ''}>${esc(o.nome)} (+${esc(o.bonus || 0)}, ${mo(o.costo)})</option>`).join('')}</select></label>`).join('')}
      <label class="interruttore"><span>Paga dalla cassa l'equipaggiamento nuovo</span><input type="checkbox" name="paga-cassa" checked></label>
      <div class="foglio-piede">${c ? `<button type="button" class="btn btn--testo" data-a="cond-togli" data-id="${esc(id)}">Non è più conducente</button>` : ''}<button type="button" class="btn" data-a="chiudi">Annulla</button><button class="btn btn--primario" type="submit">${ico('check')}Salva</button></div>
    </form>`);
}
function salvaConducente(f) {
  let id = f.dataset.id;
  if (!id) {
    const nome = f.querySelector('[name="nome"]').value.trim();
    if (!nome) { avviso('Scrivi chi è il conducente'); return; }
    id = risolviNome(nome);
    if (!id || !DB.voci[id] || !['png', 'pg'].includes(DB.voci[id].tipo)) id = salva('voci', { tipo: 'png', nome, ruolo: 'Conducente di slitte' }).id;
  }
  const c = DB.voci[id];
  const equip = {};
  let spesa = 0;
  const nuovi = [];
  Object.keys(CATEGORIE_EQUIP).forEach(cat => {
    const v = f.querySelector(`[name="eq-${cat}"]`).value;
    if (v) equip[cat] = v;
    if (v && v !== (c.equip || {})[cat]) { const o = DB.commercio[v]; spesa += Number(o && o.costo) || 0; if (o) nuovi.push(o.nome); }
  });
  salva('voci', { id, conducente: 1, abilita: Number((f.querySelector('[name="abilita"]:checked') || {}).value) || 0, paga: Number(f.querySelector('[name="paga"]').value) || 0, equip });
  if (spesa && f.querySelector('[name="paga-cassa"]').checked) {
    salva('commercio', { tipo: 'movimento', testo: 'Equipaggiamento per ' + c.nome + ': ' + nuovi.join(', '), importo: -spesa, data: oggiISO() });
  }
  chiudiFoglio();
  render();
}

// =====================================================================
// 8. AL TAVOLO E NELLA VALLE
// ---------------------------------------------------------------------
// Strumenti per la serata e per Icewind Dale, tutti nella vista #/tavolo:
//   valle     il tempo che passa (giorno della campagna, luna nuova e sacrifici), la luce,
//             il freddo (abiti, indebolimento, acqua gelida, bufera) e la reputazione con le città
//   turni     iniziativa e condizioni: le gestisce il Master, i giocatori vedono turno e condizioni
//   viaggio   quanto ci vuole tra due luoghi, soste dei cani, prove del navigatore
//   bottino   il bottino comune: monete, chi porta cosa, sintonie
//   date      le date delle prossime sessioni e chi c'è
//   dicerie   le voci di taverna sentite in gioco
//
// Niente tabelle nuove nel foglio (Code.gs resta com'è): tutto sta in tabelle che ci sono già.
//   config     'calendario', 'bufera', 'iniziativa' (+ 'iniziativa-pf' segreta con i punti ferita),
//              'incontri' (segreta, del Master), una riga per diceria ('dic-'), per data proposta
//              ('data-') e per disponibilità ('disp-'): ogni telefono scrive righe sue, niente conflitti
//   voci       sul personaggio: abiti, indebolimento, acqua (ora in cui è entrato in acqua gelida),
//              cosPunteggio, condizioni, iniziativa
//   commercio  tipo 'bottino' (oggetti) e 'moneta' (il fondo comune), accanto alla compagnia
//   rapporti   pg = 'gruppo' per la reputazione del gruppo con una città o una fazione
// In fondo al file: le note private cifrate dei personaggi (sezione della scheda), con le chiavi
// del Master in config 'chiaveNote' (pubblica) e 'chiaveNote-privata' (segreta).
// Le regole sono riassunti scritti per l'app con il numero di pagina (Rime of the Frostmaiden
// e Manuale del Giocatore): le tabelle del Master (incontri) le incolla lui e restano segrete.
// =====================================================================
const SEZIONI_TAVOLO = {
  valle: { nome: 'La valle', ico: 'neve' },
  turni: { nome: 'Turni', ico: 'arma' },
  viaggio: { nome: 'Viaggio', ico: 'slitta' },
  bottino: { nome: 'Bottino', ico: 'oggetto' },

// Calendario di Harptos: 12 mesi di 30 giorni e 5 feste (più lo Scudoincontro negli anni bisestili)
const MESI_HARPTOS = ['Martello', 'Alturiak', 'Ches', 'Tarsakh', 'Mirtul', 'Kythorn', 'Flamerule', 'Eleasis', 'Eleint', 'Marpenoth', 'Uktar', 'Nightal'];
const FESTE_HARPTOS = { 0: 'Mezzinverno', 3: 'Erbaverde', 6: 'Mezzestate', 8: 'Altoraccolto', 10: 'Festa della Luna' };

// ---------------------------------------------------------------------
// Funzioni di appoggio usate da più sezioni

function personaggi() { return elenco('voci', v => v.tipo === 'pg').sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'it')); }
function opzioniPersonaggi(vuoto) { const o = { '': vuoto }; personaggi().forEach(p => { o[p.id] = p.nome; }); return o; }
function righeConfig(prefisso) { return elenco('config', r => r.id.indexOf(prefisso) === 0 && r.valore && typeof r.valore === 'object'); }
function nuovoIdConfig(prefisso) { return prefisso + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function dataOra(ms) { return new Date(ms).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }); }

// Il giorno della campagna: giorno di partenza + giorni passati in ogni sessione + spostamenti a mano
function calendario(ore) {
  const c = cfg('calendario', null) || {};
  const sessioni = elenco('sessioni');
  const passati = sessioni.reduce((s, x) => s + (Number(x.giorni) || 0), 0);
  // i giorni interi dell'orologio del gruppo (vedi più sotto) si sommano a quelli delle sessioni
  const giorniOrologio = Math.floor((ore === undefined ? oreCampagna() : ore) / 24);
  const giorno = (Number(c.inizio) || 1) + passati + (Number(c.extra) || 0) + giorniOrologio;
  const ciclo = Number(c.ciclo) || 30;
  const out = { c, giorno, ciclo, passati, decade: Math.floor((giorno - 1) % 30 / 10) + 1, harptos: '' };
  // data di Harptos, se il Master ha detto da che giorno dell'anno si parte
  if (Number(c.annoInizio) && Number(c.giornoAnno)) {
    let anno = Number(c.annoInizio), g = Number(c.giornoAnno) - 1 + (giorno - 1);
    const lungo = a => a % 4 === 0 ? 366 : 365;
    while (g >= lungo(anno)) { g -= lungo(anno); anno++; }
    while (g < 0) { anno--; g += lungo(anno); }
    out.harptos = dataHarptos(g, anno) + ', ' + anno + ' DR';
  }
  // luna: giorni alla prossima luna nuova (0 = stanotte). La piena cade a metà del ciclo; la luna fa luce
  // anche nelle due notti prima e nelle due dopo (piena = true), perché è quasi tonda (scelta del tavolo, 1.6.1)
  if (c.luna !== undefined && c.luna !== '') {
    const tra = ((Number(c.luna) - giorno) % ciclo + ciclo) % ciclo;
    const daPiena = Math.abs(tra - Math.round(ciclo / 2));
    out.luna = { tra, daPiena, piena: daPiena <= 2 };
  }
  return out;
}
// ---------------------------------------------------------------------
// OROLOGIO DEL GRUPPO
// Il tempo di gioco in ore dalla mezzanotte del primo giorno: l'ora è il resto diviso 24, i giorni interi
// fanno avanzare il calendario. Ogni cambio è una riga config 'ora-…' a sé, { d: ore in più o in meno }
// oppure { s: ore esatte messe a mano }, con quando, perché e chi. Così due telefoni che cambiano l'ora
// insieme non si pestano i piedi: due "+1 ora" fanno due ore, e tra due ore messe a mano vale l'ultima.
// Annullare un cambio (per esempio un viaggio) lo segna annullato e il conto si rifà da solo.
// I tasti dei riposi muovono solo l'orologio: le risorse delle schede hanno i loro tasti.
// ---------------------------------------------------------------------
const ORA_INIZIO = 8;   // senza cambi la campagna è alle 8 del mattino del primo giorno
function cambiOrario() {
  return Object.values(DB.config).filter(r => /^ora-/.test(r.id) && !r.eliminato && r.valore && typeof r.valore === 'object')
    .map(r => Object.assign({}, r.valore, { id: r.id }))
    .sort((a, b) => (Number(a.quando) || 0) - (Number(b.quando) || 0) || String(a.id).localeCompare(String(b.id)));
}
function oreCampagna() {
  let ore = ORA_INIZIO;
  cambiOrario().forEach(c => {
    if (c.annullato) return;
    if (c.s !== undefined && c.s !== '') ore = Number(c.s) || 0; else ore += Number(c.d) || 0;
  });
  return Math.max(0, Math.round(ore * 60) / 60);
}
function testoOra(ore) {
  const minuti = Math.round((((ore % 24) + 24) % 24) * 60) % 1440;
  return String(Math.floor(minuti / 60)).padStart(2, '0') + ':' + String(minuti % 60).padStart(2, '0');
}
function testoDurata(d) {
  const ass = Math.abs(Number(d) || 0), h = Math.floor(ass), m = Math.round((ass - h) * 60);
  return (Number(d) < 0 ? '−' : '+') + (h ? h + (h === 1 ? ' ora' : ' ore') : '') + (h && m ? ' e ' : '') + (m ? m + ' minuti' : '') + (!h && !m ? '0 ore' : '');
}
function cambiaOrario(valore, perche) {
  salva('config', { id: 'ora-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), valore: Object.assign({ quando: Date.now(), perche: perche || '', chi: chiSono() }, valore) });
}
// Bufera in corso: da quando comincia finché il Master la chiude, o finché l'orologio supera la sua durata
function buferaAttiva(ore) {
  const b = cfg('bufera', null);
  if (!b || !b.inizio || b.fine) return false;
  if (b.oraInizio !== undefined && b.oraInizio !== '' && Number(b.ore)) return (ore === undefined ? oreCampagna() : ore) < Number(b.oraInizio) + Number(b.ore);
  return true;
}
// Luce (Rime pag. 11): finché dura l'inverno di Auril non è mai più che fioca. Senza bufera c'è penombra
// dalle 10 alle 14; il resto è buio, tranne quando in cielo ci sono l'aurora o la luna piena. L'aurora
// (pag. 5) compare prima di mezzanotte e sparisce prima dell'alba. Le ore esatte di aurora e luna il
// manuale non le dice: le ha scelte il tavolo (1.6.1). Aurora da mezzanotte alle 6, l'alba della valle;
// prima, dalle 20 a mezzanotte, fa luce la luna, ma solo nelle notti vicine alla luna piena (vedi calendario:
// la notte di luna piena e le due prima e dopo). Le due fasce non si sovrappongono.
const LUCE = { giorno: [10, 14], aurora: [0, 6], luna: [20, 24] };
function luceA(ore) {
  ore = ore === undefined ? oreCampagna() : ore;
  const h = ((ore % 24) + 24) % 24;
  const dentro = ([a, b]) => a < b ? h >= a && h < b : h >= a || h < b;
  if (buferaAttiva(ore)) return { tipo: 'buio', causa: 'bufera', testo: 'Buio', perche: "c'è la bufera" };
  if (dentro(LUCE.giorno)) return { tipo: 'fioca', causa: 'giorno', testo: 'Luce fioca', perche: 'la penombra di mezzogiorno' };
  if (dentro(LUCE.aurora)) return { tipo: 'fioca', causa: 'aurora', testo: 'Luce fioca', perche: "l'aurora di Auril" };
  const cal = calendario(ore);
  if (cal.luna && cal.luna.piena && dentro(LUCE.luna)) return { tipo: 'fioca', causa: 'luna', testo: 'Luce fioca', perche: cal.luna.daPiena === 0 ? 'la luna piena' : 'la luna quasi piena' };
  return { tipo: 'buio', causa: 'notte', testo: 'Buio', perche: h < LUCE.giorno[0] ? 'prima della penombra' : 'dopo la penombra' };
}
// La pillola con ora e luce: in Al tavolo, nella Home e sulla mappa. La causa c'è sempre (anche "dopo la

function pillolaOra(cls) {

// giorno dell'anno (0-364/365) → "12 Kythorn" o il nome della festa
function dataHarptos(g, anno) {
  for (let m = 0; m < 12; m++) {
    if (g < 30) return (g + 1) + ' ' + MESI_HARPTOS[m];
    g -= 30;
    if (FESTE_HARPTOS[m] !== undefined) {
      if (g === 0) return FESTE_HARPTOS[m];
      g -= 1;
      if (m === 6 && anno % 4 === 0) { if (g === 0) return 'Scudoincontro'; g -= 1; }
    }
  }
  return 'Nightal';
}
function testoLuna(l) {
  if (!l) return '';
  if (l.tra === 0) return 'Stanotte c\'è la luna nuova';
  if (l.tra === 1) return 'Domani notte c\'è la luna nuova';
  return 'Luna nuova tra ' + l.tra + ' giorni' + (l.daPiena === 0 ? ' (stanotte la luna è piena)' : l.piena ? ' (la luna è quasi piena e fa luce)' : '');
}

// Una riga del freddo: abiti, indebolimento e acqua gelida di un personaggio
function rigaFreddo(p) {

// ---------------------------------------------------------------------
// VIAGGIO: quanto ci vuole, soste dei cani, navigatore. Le regole sono riassunte da Rime pag. 10-12 e 20.
// Sulle strade tra le Dieci-Città uso le ore a piedi della tratta (campo "ore" o la nota del pacchetto),
// sulla tundra e in montagna le miglia all'ora del mezzo.
// ---------------------------------------------------------------------
const MEZZI_VIAGGIO = {
  slitta: { nome: 'Slitta con i cani', tundra: 1, montagna: .5, strada: .5 },
  racchette: { nome: 'A piedi con le racchette', tundra: .5, montagna: .25, strada: 1 },
  piedi: { nome: 'A piedi senza racchette', tundra: .25, montagna: .125, strada: 1 }
};
let VIAGGIO = { da: '', a: '', terreno: 'strada', miglia: 10, mezzo: 'racchette', meteo: 'sereno' };
// ore a piedi di una tratta: il campo ore, altrimenti cerco "N ore" nella nota (il pacchetto le scrive così)
function orePiedi(tr) {
  if (!tr) return 0;
  if (Number(tr.ore)) return Number(tr.ore);
  const m = String(tr.note || '').match(/a piedi[^.]*?(\d+(?:[.,]\d+)?)(?:\s*o\s*(\d+))?\s*or[ae](\s*e mezza)?/i);
  if (!m) return 0;
  return (Number(m[2] || m[1].replace(',', '.')) || 0) + (m[3] ? .5 : 0);
}
function trattaTra(da, a) { return comm('tratta', t => (t.da === da && t.a === a) || (t.da === a && t.a === da))[0] || null; }
// La strada da un luogo a un altro passando per le tratte: ogni tratta con le ore è un pezzo di strada
// che si fa nei due sensi. Cerco il giro più corto in ore (Dijkstra); il pericolo pesa come due ore in più
// per ogni punto oltre l'1, così tra due giri quasi uguali vince quello sicuro (Targos, Bryn Shander, Easthaven).
function stradaTra(da, a) {
  if (!da || !a || da === a) return null;
  const vicini = {};
  comm('tratta').forEach(t => {
    const ore = orePiedi(t);
    if (!ore || !t.da || !t.a) return;
    const costo = ore + 2 * Math.max(0, (Number(t.pericolo) || 1) - 1);
    (vicini[t.da] = vicini[t.da] || []).push({ verso: t.a, ore, costo, t });
    (vicini[t.a] = vicini[t.a] || []).push({ verso: t.da, ore, costo, t });
  });
  const dist = { [da]: 0 }, prima = {}, fatti = new Set();
  for (;;) {
    let u = null;
    Object.keys(dist).forEach(k => { if (!fatti.has(k) && (u === null || dist[k] < dist[u])) u = k; });
    if (u === null || u === a) break;
    fatti.add(u);
    (vicini[u] || []).forEach(e => {
      const d = dist[u] + e.costo;
      if (dist[e.verso] === undefined || d < dist[e.verso]) { dist[e.verso] = d; prima[e.verso] = { da: u, e }; }
    });
  }
  if (dist[a] === undefined) return null;
  const tappe = [a], pezzi = [];
  for (let x = a; x !== da; x = prima[x].da) { pezzi.unshift(prima[x].e); tappe.unshift(prima[x].da); }
  return { tappe, pezzi, ore: Math.round(pezzi.reduce((t, e) => t + e.ore, 0) * 10) / 10 };
}
function calcolaViaggio(V) {
  const m = MEZZI_VIAGGIO[V.mezzo] || MEZZI_VIAGGIO.racchette;
  const out = { note: [] };
  if (V.terreno === 'strada') {
    const strada = stradaTra(V.da, V.a);
    if (!strada) {
      const tr = trattaTra(V.da, V.a);
      return { errore: tr ? 'La tratta tra questi due luoghi non ha le ore di viaggio: aggiungile nella tratta, oppure scegli tundra e scrivi le miglia.' : 'Non trovo una strada tra questi due luoghi, nemmeno passando per altre città: crea la tratta (partenza, arrivo e ore a piedi), oppure scegli tundra o montagna e scrivi le miglia.', manca: !tr };
    }
    out.marcia = strada.ore * m.strada;
    out.base = strada.ore;
    out.tappe = strada.tappe;
    out.pezzi = strada.pezzi.map(e => e.ore);
  } else {
    const miglia = Math.max(0, Number(V.miglia) || 0);
    if (!miglia) return { errore: 'Scrivi quante miglia ci sono' };
    out.marcia = miglia / m[V.terreno === 'montagna' ? 'montagna' : 'tundra'];
  }
  out.marcia = Math.round(out.marcia * 10) / 10;
  // i cani: un'ora di sosta dopo ogni ora di traino, altrimenti indebolimento (Rime pag. 20)
  out.soste = V.mezzo === 'slitta' ? Math.max(0, Math.ceil(out.marcia) - 1) : 0;
  out.totale = Math.round((out.marcia + out.soste) * 10) / 10;
  const oreAperto = Math.ceil(out.totale);
  if (V.meteo === 'bufera') out.note.push(`Bufera: ${oreAperto} prove del navigatore, Saggezza (Sopravvivenza) CD 15 a fine ora. Ogni prova fallita è un'ora senza avanzare; se fallisce di 5 o più e non siete legati, uno di voi si perde (Rime pag. 11).`);
  if (V.terreno === 'montagna') out.note.push(`Montagna: ${oreAperto} prove di chi guida, Saggezza (Sopravvivenza) CD 15 a fine ora. Se fallisce si torna indietro e si perde un'ora; di 5 o più arriva una valanga (Rime pag. 11).`);
  if (V.mezzo === 'piedi' && V.terreno !== 'strada') out.note.push('Senza racchette nella neve alta si va a metà velocità: costano 2 mo (Rime pag. 20).');
  const esposti = personaggi().filter(p => !razzaAdattataAlFreddo(p) && (p.abiti || 'asciutti') !== 'asciutti');
  out.note.push(esposti.length ? `Freddo: ${esposti.map(p => p.nome).join(', ')} ${esposti.length === 1 ? 'fa' : 'fanno'} il tiro su Costituzione CD 10 a ogni ora all'aperto (${oreAperto}).` : 'Freddo: con gli abiti pesanti asciutti nessuno tira.');
  if (out.totale > 4) out.note.push('La penombra dura solo dalle 10 alle 14: il resto del viaggio è al buio.');
  return out;
}

// ---------------------------------------------------------------------
// BOTTINO COMUNE: oggetti (commercio, tipo 'bottino') e fondo comune di monete (tipo 'moneta').

// Dalla 1.6 un oggetto può venire dal catalogo (campo catalogo = id dell'oggetto) con un nome vostro,

// il bottino si scrive a mano come prima. La lista si ricalcola solo quando cambiano le righe.
// Dalla 1.7 un oggetto può avere "ex": gli id che aveva prima di cambiare nome, così il bottino già

let CATALOGO = { firma: null, lista: [], perNome: {}, perId: {} };
function catalogoOggetti() {
  const righe = Object.values(DB.config).filter(r => /^catalogo-\d+$/.test(r.id) && !r.eliminato && r.valore && Array.isArray(r.valore.oggetti));
  const firma = righe.map(r => r.id + ':' + (r._ts || '') + ':' + r.valore.oggetti.length).sort().join('|');
  if (firma !== CATALOGO.firma) {
    const lista = [].concat(...righe.map(r => r.valore.oggetti)).filter(o => o && o.id && o.nome)
      .sort((x, y) => String(x.nome).localeCompare(String(y.nome), 'it'));
    CATALOGO = { firma, lista, perNome: {}, perId: {} };
    lista.forEach(o => { (o.ex || []).forEach(x => { CATALOGO.perId[x] = o; }); });
    lista.forEach(o => { CATALOGO.perId[o.id] = o; CATALOGO.perNome[norm(o.nome)] = o; });
  }
  return CATALOGO.lista;
}
function oggettoCatalogo(chiave) {
  if (!chiave) return null;
  catalogoOggetti();
  return CATALOGO.perId[chiave] || CATALOGO.perNome[norm(chiave)] || null;
}
// la riga sotto il nome: categoria, rarità, sintonia (testo del catalogo, già in italiano)
function sottotitoloCatalogo(o) {
  return [o.categoria, o.rarita, o.sintonia ? (typeof o.sintonia === 'string' ? 'sintonia ' + o.sintonia : 'richiede sintonia') : ''].filter(Boolean).join(', ');
}
// la descrizione proposta quando si sceglie un oggetto: il riassunto degli effetti e da dove viene
function testoCatalogo(o) {
  const dove = o.pag ? (o.libro || 'Guida del DM') + ' pag. ' + o.pag : '';
  const coda = [sottotitoloCatalogo(o), dove].filter(Boolean).join('; ');
  return (o.effetti || '') + (coda ? ' (' + coda + ')' : '');
}

// ---------------------------------------------------------------------
// CARICHE, TABELLE E SINTONIA DEGLI OGGETTI (1.7)
// Il catalogo dice quante cariche ha un oggetto e come tornano (cariche, ricarica), quali tabelle si tirano
// (tabella) e cosa serve per usarlo (requisiti; la sintonia richiesta sta in "sintonia"). Sull'oggetto del
// bottino (commercio, tipo 'bottino') restano:
//   cariche   { scorta: massimo }: i massimi tirati con i dadi quando l'avete trovato, o scritti a mano
//   usate     { scorta: cariche spese }: è un contatore (CONTATORI in 1-core.js), una carica spesa sul telefono
//             e una sul PC fanno due; l'alba da una parte e un uso dall'altra lasciano l'uso dopo l'alba
//   ricarica  come tornano le cariche, solo per gli oggetti scritti a mano (gli altri la prendono dal catalogo)
//   variante  il colore della borsa dei trucchi, il tipo di danno dell'anello di resistenza, i grani della
//             collana del rosario: quello che si sceglie o si tira una volta, quando lo trovate
// Un oggetto con una scorta sola la chiama "Cariche"; quelli con più poteri al giorno (gli strumenti dei
// bardi, il bastone dei tuoni e fulmini) hanno una scorta per potere. I tiri delle tabelle restano sul telefono
// di chi tira: nel foglio finisce solo quello che si segna sull'oggetto.
// ---------------------------------------------------------------------
// L'ultimo tiro del bottino, mostrato sotto il suo oggetto finché non se ne fa un altro o si chiude:
// { id, t: indice della tabella o null, riga: indice della riga uscita o -1, n, testo, dettaglio, avviso, ultima: tabella da proporre }
let ULTIMO_TIRO = null;

// Le scorte di cariche di un oggetto: [{ k, max, dado, ricarica, usate, sola }]. max = 0 vuol dire che il
// massimo è ancora da tirare (dado). Le cariche usate non superano mai il massimo.
function scorteDi(o) {
  const cat = oggettoCatalogo(o.catalogo);
  const proprie = o.cariche && typeof o.cariche === 'object' ? o.cariche : {};
  const dalCatalogo = !!(cat && cat.cariche);
  const def = dalCatalogo ? cat.cariche : (Object.keys(proprie).length ? proprie : null);
  if (!def) return [];
  const molte = typeof def === 'object';
  const ric = dalCatalogo ? cat.ricarica : o.ricarica;
  const usate = o.usate && typeof o.usate === 'object' ? o.usate : {};
  return Object.entries(molte ? def : { Cariche: def }).map(([k, v]) => {
    const fisso = /^\d+$/.test(String(v).trim());
    const max = Number(proprie[k]) > 0 ? Math.round(Number(proprie[k])) : fisso ? Number(v) : 0;
    return { k, max, dado: fisso ? '' : String(v), ricarica: String((ric && typeof ric === 'object' ? ric[k] : ric) || ''), usate: clamp(Number(usate[k]) || 0, 0, max), sola: !molte };
  });
}
// Tira un'espressione di dadi: "2d4+2", "d100", "1d6-1", "3d6". Restituisce { n, dettaglio } o null.
function tiraDadi(espr) {
  const m = String(espr || '').replace(/\s+/g, '').toLowerCase().match(/^(\d*)d(\d+|%)([+-]\d+)?$/);
  if (!m) return null;
  const facce = m[2] === '%' ? 100 : Number(m[2]), agg = Number(m[3] || 0);
  const dadi = Array.from({ length: clamp(Number(m[1] || 1), 1, 100) }, () => 1 + Math.floor(Math.random() * facce));
  const somma = dadi.reduce((t, d) => t + d, 0);
  return { n: somma + agg, dettaglio: dadi.length > 1 || agg ? dadi.join(' + ') + (agg ? (agg > 0 ? ' + ' : ' − ') + Math.abs(agg) : '') : '' };
}
// Quante cariche tornano con una ricarica: "1d6+1 all'alba" si tira, "2 ogni 12 ore" ne dà 2,
// tutto il resto ("tutte all'alba", "dopo 7 giorni", "dopo un riposo lungo") le rimette tutte.
function quanteTornano(ricarica, max) {
  const t = String(ricarica || '').trim();
  const d = t.match(/^(\d*d\d+(?:\s*[+-]\s*\d+)?)/i);
  if (d) { const r = tiraDadi(d[1]); return { n: r ? r.n : max, come: d[1].replace(/\s+/g, '') + (r ? ' = ' + r.n : '') }; }
  const f = t.match(/^(\d+)(?!\s*d)\b/);
  if (f) return { n: Number(f[1]), come: '+' + f[1] };
  return { n: max, come: 'tutte' };
}

// Perché un personaggio non può entrare in sintonia con un oggetto: null se può, altrimenti { testo, limite }.
// Le regole sono della Guida del DM (pag. 136 e 138), riassunte: al massimo tre oggetti a testa (limite: true,
// la sintonia fallisce e basta) e mai due copie dello stesso oggetto; alcuni oggetti chiedono una classe, una
// razza o di saper lanciare incantesimi con le proprie capacità ("con un incantatore", "con un bardo",
// "con un nano"). Le copie, la classe e la razza le dico ma non blocco: il Master può fare eccezioni, e due
// oggetti dello stesso nome del catalogo possono essere diversi (un anello di resistenza al fuoco e uno al
// freddo). Se della classe o della razza non so niente non dico niente. senzaId: l'oggetto che sto
// modificando, che non conta tra i tre.
function motivoNoSintonia(pgId, cat, senzaId) {
  const pg = DB.voci[pgId];
  if (!pg) return null;
  const sue = comm('bottino', x => x.sintonia === pgId && x.id !== senzaId);
  if (sue.length >= 3) return { limite: true, testo: pg.nome + ' è già in sintonia con 3 oggetti, il massimo: prima ne deve lasciare uno' };
  if (cat && sue.some(x => oggettoCatalogo(x.catalogo) === cat)) return { testo: pg.nome + ' è già in sintonia con un altro ' + cat.nome + ': con due copie dello stesso oggetto non si può (se sono di due tipi diversi decide il Master)' };
  const req = cat && typeof cat.sintonia === 'string' ? norm(cat.sintonia) : '';
  if (!req) return null;
  const classi = classiDi(pg);
  // le classi: quelle delle regole incluse e quelle scritte a mano nella voce ("Guerriero, Campione")
  const scritte = norm([pg.classe, pg.chiaveClasse, pg.chiaveClasse2].join(' '));
  const ha = k => classi.some(c => c.chiave === k) || new RegExp('\\b' + k + '\\b').test(scritte);
  if (/\bnano\b/.test(req)) {
    const razza = norm([pg.razza, chiaveRazzaDi(pg)].join(' '));
    return !razza || /\bnan[oaie]\b/.test(razza) ? null : { testo: 'Serve un nano: ' + pg.nome + ' non lo è' };
  }
  if (!classi.length && !scritte) return null;
  if (/incantatore/.test(req)) {
    // il barbaro totemico lancia incantesimi dal 3° livello: i rituali del Cercatore di spiriti
    const totemico = classi.some(c => c.chiave === 'barbaro' && c.sc && c.sc === REGOLE.classi.barbaro.sottoclassi.totemico && c.liv >= 3);
    const lancia = totemico || ['bardo', 'chierico', 'druido', 'mago', 'stregone', 'warlock', 'paladino', 'ranger'].some(ha) || /\b(cavaliere mistico|mistificatore arcano)\b/.test(scritte);
    return lancia ? null : { testo: 'Serve un incantatore: ' + pg.nome + ' non lancia incantesimi' };
  }
  const chieste = ['barbaro', 'bardo', 'chierico', 'druido', 'guerriero', 'ladro', 'mago', 'monaco', 'paladino', 'ranger', 'stregone', 'warlock'].filter(k => new RegExp('\\b' + k + '\\b').test(req));
  if (chieste.length && !chieste.some(ha)) return { testo: 'Serve ' + chieste.map(k => 'un ' + k).join(', ').replace(/, ([^,]*)$/, ' o $1') + ': ' + pg.nome + ' non lo è' };
  return null;
}

// Un oggetto del bottino legato al catalogo, appena creato o salvato: richiede sintonia come dice il catalogo,
// le cariche che si tirano con i dadi si tirano adesso (una volta sola: poi restano sull'oggetto) e, se
// sintonia è vero, entra in sintonia con chi lo porta, se può. Restituisce le note da dire a chi l'ha aggiunto.
function completaDaCatalogo(rec, sintonia) {
  const cat = oggettoCatalogo(rec.catalogo);
  const note = [];
  if (!cat) return note;
  rec.richiede = cat.sintonia ? 1 : 0;
  if (!rec.richiede) rec.sintonia = '';
  if (cat.cariche) {
    const proprie = Object.assign({}, rec.cariche && typeof rec.cariche === 'object' ? rec.cariche : {});
    Object.entries(typeof cat.cariche === 'object' ? cat.cariche : { Cariche: cat.cariche }).forEach(([k, v]) => {
      if (Number(proprie[k]) > 0 || /^\d+$/.test(String(v).trim())) return;
      const r = tiraDadi(v);
      if (!r) return;
      proprie[k] = Math.max(1, r.n);
      note.push((k === 'Cariche' ? 'cariche' : k.toLowerCase()) + ' ' + v + ' = ' + proprie[k]);
    });
    if (Object.keys(proprie).length) rec.cariche = proprie;
  }
  if (sintonia && rec.richiede && rec.portatore && !rec.sintonia) {
    const no = motivoNoSintonia(rec.portatore, cat, rec.id);
    if (no) note.push(no.testo); else { rec.sintonia = rec.portatore; note.push('in sintonia con ' + nomeDi(rec.portatore)); }
  }
  return note;
}

// Le cose segnate sull'oggetto una volta per tutte (campo "variante"): il colore della borsa, il tipo di danno
// dell'anello, i grani della collana, "Saggezza: 12". Stanno in un testo solo, separate da punto e virgola,
// così nel foglio si leggono e nel modulo Modifica si correggono a mano.
function partiVariante(o) { return String(o.variante || '').split(/\s*;\s*/).map(s => s.trim()).filter(Boolean); }
// una parte appartiene a una tabella se è una delle sue righe o comincia con il suo titolo ("Carisma: 9").
// Confronto senza maiuscole e accenti: nel modulo le cose segnate si possono anche scrivere a mano
function dellaTabella(parte, t) { const p = norm(parte); return (t.righe || []).some(r => norm(r[r.length - 1]) === p) || (!!t.titolo && p.indexOf(norm(t.titolo) + ' ') === 0); }

// Ricarica le scorte di un oggetto del bottino la cui ricarica passa il filtro ("alba", "riposo lungo", o tutte):
// salva le cariche usate e restituisce cosa è tornato ("Bacchetta dei dardi: 1d6+1 = 5"), '' se non c'era niente.
function ricaricaOggetto(o, filtro) {
  const usate = Object.assign({}, o.usate || {});
  const detti = [];
  scorteDi(o).forEach(s => {
    if (!s.usate || !s.ricarica || !filtro(s.ricarica)) return;
    const r = quanteTornano(s.ricarica, s.max);
    usate[s.k] = Math.max(0, s.usate - r.n);
    detti.push((s.sola ? '' : s.k + ' ') + r.come);
  });
  if (!detti.length) return '';
  salva('commercio', { id: o.id, usate });
  return o.nome + ': ' + detti.join(', ');
}

// L'ALBA DALL'OROLOGIO (1.7): quando l'orologio del gruppo passa le 6 (la fine dell'aurora, vedi LUCE) e qualche
// oggetto ha cariche che tornano all'alba, Al tavolo propone "È l'alba" (in La valle e nel Bottino). La riga config
// 'alba' { k } ricorda l'ultima alba fatta o saltata con "Non serve": k è il numero dell'alba, 0 = quella del primo
// giorno, che viene prima delle 8 di partenza e quindi conta come fatta. Le albe si contano dall'orologio: se
// torna indietro (un viaggio annullato) un'alba già fatta non si ripropone.
function albaNumero(ore) { return Math.floor(((ore === undefined ? oreCampagna() : ore) - LUCE.aurora[1]) / 24); }
function albaFatta() { return Number((cfg('alba', null) || {}).k) || 0; }
function caricheDaAlba() { return comm('bottino').some(o => scorteDi(o).some(s => s.usate && /alba/i.test(s.ricarica))); }
function riquadroAlba() {
  if (albaNumero() <= albaFatta() || !caricheDaAlba()) return '';
  return `<div class="riquadro-alba" role="status">${ico('lanterna')}<div><strong>Sono passate le 6: è l'alba</strong><span class="fioco piccolo">Ci sono oggetti con cariche che tornano all'alba.</span>
    <div class="azioni azioni--strette"><button class="btn btn--primario btn--piccolo" data-a="tav-alba">È l'alba: ricarica gli oggetti</button><button class="btn btn--testo btn--piccolo" data-a="tav-alba-no">Non serve</button></div></div></div>`;
}

// Cariche, varianti e tabelle sotto un oggetto del bottino. I rombi si toccano come quelli della scheda
// (pieno = usa una carica, vuoto = la recupera); oltre le 12 cariche c'è il numero con i tasti.
function extraBottino(o) {
  const cat = oggettoCatalogo(o.catalogo);
  const id = esc(o.id);
  let h = '';
  const scorte = scorteDi(o);
  // la scorta "principale" è quella di cui conta l'ultima carica (il bastone dello charme ne ha due)
  const principale = scorte.find(s => s.k === 'Cariche') || scorte[0];
  const finite = !!(principale && principale.max && principale.usate >= principale.max);
  if (scorte.length) {
    h += '<div class="cariche-bottino">' + scorte.map(s => {
      const nome = s.sola ? '' : `<span class="cb-nome">${esc(s.k)}</span>`;
      const dati = `data-id="${id}" data-k="${esc(s.k)}"`;
      const classe = 'cb' + (s.sola ? '' : ' cb--nome');   // con il nome della scorta: nome a sinistra, comandi a destra
      if (!s.max) return `<div class="${classe}">${nome}<span class="cb-comandi"><button class="btn btn--piccolo" data-a="tav-cariche-tira" ${dati}>${ico('dado')}Tira ${esc(s.dado)}</button><span class="fioco piccolo">quante ${s.sola ? 'cariche ha' : 'ne ha'} quando lo trovate</span></span></div>`;
      const rimaste = s.max - s.usate;
      const comandi = s.max > 12
        ? `<span class="pip-num">${rimaste}<small> su ${s.max}</small></span><input type="number" class="cb-quante" min="1" max="${s.max}" value="1" inputmode="numeric" aria-label="Quante">
          <button class="btn btn--piccolo" data-a="tav-carica" ${dati} data-on="1">Usa</button><button class="btn btn--testo btn--piccolo" data-a="tav-carica" ${dati} data-on="0">Recupera</button>`
        : '<span class="pips">' + Array.from({ length: s.max }, (_, i) => `<button class="pip ${i < rimaste ? 'on' : ''}" data-a="tav-carica" ${dati} data-on="${i < rimaste ? 1 : 0}" aria-label="${esc(s.k)}: ${i < rimaste ? 'usa una carica' : 'recupera una carica'}"></button>`).join('') + '</span>';
      return `<div class="${classe}${rimaste <= 0 ? ' esaurita' : ''}">${nome}<span class="cb-comandi">${comandi}</span></div>`;
    }).join('') + '</div>';
    const ricariche = [...new Set(scorte.map(s => s.ricarica).filter(Boolean))];
    if (ricariche.length) h += `<div class="cb-ricarica"><span class="fioco piccolo">Tornano: ${esc(ricariche.join('; '))}</span>${scorte.some(s => s.usate && s.ricarica) ? `<button class="btn btn--testo btn--piccolo" data-a="tav-ricarica" data-id="${id}">${ico('orologio')}Ricarica</button>` : ''}</div>`;
    else if (scorte.some(s => s.max)) h += '<div class="cb-ricarica"><span class="fioco piccolo">Non tornano da sole</span></div>';
  }

  // le tabelle. Quelle con "variante" valgono solo per la loro (la borsa grigia ha la sua): finché non sapete
  // qual è compare la scelta. Le tabelle "trovato" si tirano o si scelgono una volta e il risultato resta
  // sull'oggetto; quelle "ultima" (il d20 dell'ultima carica) compaiono solo a cariche finite.
  const tabelle = cat && cat.tabella ? [].concat(cat.tabella) : [];
  const varianti = [...new Set(tabelle.map(t => t.variante).filter(Boolean))];
  const parti = partiVariante(o);
  const variante = varianti.find(v => parti.some(p => norm(p) === norm(v))) || '';   // il nome del catalogo
  const parteVariante = parti.find(p => norm(p) === norm(variante)) || '';           // come è scritta sull'oggetto
  const tasto = (testo, dati, primario) => `<button class="btn ${primario ? 'btn--primario' : 'btn--testo'} btn--piccolo" data-a="tav-variante" data-id="${id}" ${dati}>${testo}</button>`;
  if (varianti.length) h += variante
    ? `<div class="cb-segnato"><span>${esc(variante.charAt(0).toUpperCase() + variante.slice(1))}</span>${tasto('Cambia', `data-togli="${esc(parteVariante)}"`)}</div>`
    : `<div class="cb-segnato"><span class="piccolo">Qual è?</span>${varianti.map(v => `<button class="chip chip--tasto" data-a="tav-variante" data-id="${id}" data-var="1" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`;
  const tiro = ULTIMO_TIRO && ULTIMO_TIRO.id === o.id ? ULTIMO_TIRO : null;
  tabelle.forEach((t, i) => {
    if (t.variante && t.variante !== variante) return;
    if (t.quando === 'ultima' && !finite) return;
    const titolo = t.titolo || 'Tabella';
    const segnati = t.quando === 'trovato' ? parti.filter(p => dellaTabella(p, t)) : [];
    if (segnati.length && !t.piu) {
      // "Carisma: 16" si mostra come "Carisma: 16", una riga della tabella ("fuoco (granato)") dopo il titolo
      const valore = /^[^:]*:/.test(segnati[0]) && dellaTabella(segnati[0], { titolo }) ? segnati[0].slice(segnati[0].indexOf(':') + 1).trim() : segnati[0];
      h += `<div class="cb-segnato"><span>${esc(titolo)}: <strong>${esc(valore)}</strong></span>${tasto('Cambia', `data-togli="${esc(segnati[0])}"`)}</div>`;
      return;
    }
    const righe = t.righe || [];
    const uscita = tiro && tiro.t === i ? tiro.riga : -1;
    const scegli = t.quando === 'trovato';   // quelle di quando lo trovate si possono anche scegliere, se il Master lo dice
    // chiusa anche dopo un tiro: la riga uscita è già nel riquadro del risultato, e le tabelle d100 sono lunghe.
    // Aperta solo quando bisogna scegliere una riga (le tabelle senza dado di quando lo trovate)
    const lista = righe.length ? `<details${scegli && !t.dado ? ' open' : ''}><summary>${scegli ? (t.dado ? 'Tira o scegli' : 'Scegli') : 'Vedi la tabella'} (${righe.length} ${righe.length === 1 ? 'riga' : 'righe'})</summary><ol class="elenco-impulsi elenco-tabella">` +
      righe.map((r, j) => {
        const a = r[0], b = r.length > 2 ? r[1] : r[0], testo = r[r.length - 1];
        const num = t.dado === 'carta' ? '' : a === b ? String(a) : a + '–' + b;
        return `<li class="${j === uscita ? 'uscito' : ''}${num ? '' : ' senza-num'}">${num ? `<b>${esc(num)}</b>` : ''}<span>${esc(testo)}${scegli ? ' ' + tasto(t.piu ? 'Aggiungi' : 'È questo', `data-t="${i}" data-v="${esc(testo)}"`) : ''}</span></li>`;
      }).join('') + '</ol></details>' : '';
    const tira = t.dado ? `<button class="btn btn--piccolo" data-a="tav-tira" data-id="${id}" data-t="${i}">${ico('dado')}${t.dado === 'carta' ? 'Pesca una carta' : 'Tira ' + esc(t.dado)}</button>` : '';
    const quando = scegli && !/quando l/i.test(titolo) ? ' <span class="fioco piccolo">quando lo trovate</span>' : '';
    h += `<div class="tab-bottino${t.quando === 'ultima' ? ' tb-ultima' : ''}"><div class="tb-testa"><span class="tb-titolo">${esc(titolo)}${quando}</span>${tira}</div>
      ${segnati.length ? `<div class="cb-segnati">${segnati.map(p => `<span class="chip chip--mini">${esc(p)}<button class="chip-x" data-a="tav-variante" data-id="${id}" data-togli="${esc(p)}" aria-label="Togli ${esc(p)}">×</button></span>`).join('')}</div>` : ''}${lista}</div>`;
  });
  // quello scritto a mano nel campo "Segnato sull'oggetto" che non appartiene a nessuna tabella
  const altre = parti.filter(p => !varianti.some(v => norm(v) === norm(p)) && !tabelle.some(t => dellaTabella(p, t)));
  if (altre.length) h += `<div class="cb-segnato fioco piccolo">Segnato: ${esc(altre.join('; '))}</div>`;

  if (tiro) {
    const t = tiro.t !== null ? tabelle[tiro.t] : null;
    const riga = t && tiro.riga >= 0 ? t.righe[tiro.riga] : null;
    const testo = riga ? riga[riga.length - 1] : tiro.testo || '';
    let comandi = '';
    if (t && t.quando === 'trovato') {
      if (riga) comandi += tasto(ico('check') + (t.piu ? "Aggiungi all'oggetto" : "Segna sull'oggetto"), `data-t="${tiro.t}" data-v="${esc(testo)}"`, true);
      else if (t.piene || t.vuote) comandi += tasto(ico('check') + 'Segna sui rombi', `data-t="${tiro.t}" data-n="${tiro.n}"`, true);
      else if (!(t.righe || []).length) comandi += tasto(ico('check') + "Segna sull'oggetto", `data-t="${tiro.t}" data-v="${esc((t.titolo || 'Tiro') + ': ' + tiro.n)}"`, true);
    }
    if (tiro.ultima !== undefined) comandi += `<button class="btn btn--primario btn--piccolo" data-a="tav-tira" data-id="${id}" data-t="${tiro.ultima}">${ico('dado')}Tira il d20</button>`;
    // il primo risultato del d20 dell'ultima carica è quello brutto (ULTIMA in lotto1.py): se l'oggetto è
    // distrutto o perduto propongo di toglierlo, chiedendo conferma come sempre
    if (t && t.quando === 'ultima' && tiro.riga === 0 && /distrutt|perdut/.test(testo)) comandi += `<button class="btn btn--piccolo" data-a="elimina" data-tab="commercio" data-id="${id}">${ico('elimina')}Toglilo dal bottino</button>`;
    h += `<div class="esito-dado esito-bottino" role="status">${tiro.n !== null ? `<span class="n">${esc(tiro.n)}</span>` : ''}<div class="eb-testo">
      ${tiro.avviso ? `<strong>${esc(tiro.avviso)}</strong>` : ''}${testo ? `<span>${esc(testo)}</span>` : ''}${tiro.dettaglio ? `<span class="fioco piccolo">${esc(tiro.dettaglio)}</span>` : ''}
      <div class="azioni azioni--strette">${comandi}<button class="btn btn--testo btn--piccolo" data-a="tav-tiro-chiudi">Chiudi</button></div></div></div>`;
  }
  return h;
}

let BOTTINO_SCHEDA = null;   // la scheda aperta in "Chi porta cosa": '' = del gruppo, altrimenti l'id del personaggio
function sezioneBottino() {
  const pgs = personaggi();
  const fondo = comm('moneta').reduce((t, m) => t + (Number(m.importo) || 0), 0);
  const oggetti = comm('bottino').sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'it'));
  let h = `<section class="sezione"><h2>Fondo comune</h2>
    <div class="giorno-campagna"><span class="num-grande">${esc(mo(fondo).replace(' mo', ''))}</span><div><strong>monete d'oro del gruppo</strong><span class="fioco">${pgs.length ? 'divise in ' + pgs.length + ' fanno ' + mo(Math.floor(Math.max(0, fondo) / pgs.length)) + ' a testa' : ''}</span></div></div>
    <div class="azioni"><button class="btn btn--piccolo" data-a="tav-monete">${ico('piu')}Entrate o spese</button>
      ${fondo > 0 && pgs.length ? `<button class="btn btn--piccolo" data-a="tav-dividi">Dividi in parti uguali</button>` : ''}</div>`;
  const ultimi = comm('moneta').sort((a, b) => String(b.agg || '').localeCompare(String(a.agg || ''))).slice(0, 6);
  if (ultimi.length) h += '<ul class="lista lista--corta">' + ultimi.map(m => `<li class="riga"><div class="corpo">${esc(m.testo || 'Movimento')}</div><strong class="${Number(m.importo) < 0 ? 'cera' : ''}">${Number(m.importo) > 0 ? '+' : ''}${esc(mo(m.importo))}</strong></li>`).join('') + '</ul>';
  h += '</section>';

  // chi porta cosa: una scheda per il gruppo e una per personaggio, con quanti oggetti ha ciascuno.
  // Un portatore che non è (più) un personaggio del gruppo conta come "del gruppo".
  const di = id => oggetti.filter(o => id ? o.portatore === id : !pgs.some(p => p.id === o.portatore));
  const schede = [{ id: '', nome: 'Del gruppo' }].concat(pgs.map(p => ({ id: p.id, nome: p.nome })));
  // si parte sempre dalla scheda del gruppo: lì arriva il bottino dell'import, da dividere
  if (BOTTINO_SCHEDA === null || !schede.some(x => x.id === BOTTINO_SCHEDA)) BOTTINO_SCHEDA = '';
  const qui = di(BOTTINO_SCHEDA);
  const sintonie = BOTTINO_SCHEDA ? oggetti.filter(o => o.sintonia === BOTTINO_SCHEDA).length : 0;
  const peso = qui.reduce((t, o) => t + (Number(o.peso) || 0) * (Number(o.quantita) || 1), 0);
  // l'alba ricarica insieme tutti gli oggetti che tornano all'alba (anche quelli nelle altre schede)
  const allAlba = caricheDaAlba();
  const alba = riquadroAlba();   // l'orologio ha passato le 6: la proposta sta in cima
  h += `<section class="sezione"><h2>Chi porta cosa <span class="conta">${oggetti.length}</span></h2>${alba}
    <div class="schede-bottino" role="tablist">${schede.map(x => `<button class="chip chip--tasto ${x.id === BOTTINO_SCHEDA ? 'on' : ''}" role="tab" aria-selected="${x.id === BOTTINO_SCHEDA}" data-a="tav-bot-scheda" data-k="${esc(x.id)}">${esc(x.nome)} <span class="conta">${di(x.id).length}</span></button>`).join('')}</div>
    <p class="fioco piccolo">${[peso ? peso + ' lb in tutto' : '', BOTTINO_SCHEDA ? 'sintonie ' + sintonie + ' su 3' : 'le cose di tutti, non ancora assegnate'].filter(Boolean).join(', ')}</p>`;
  h += qui.length ? '<ul class="lista">' + qui.map(o => {
    const base = oggettoCatalogo(o.catalogo);
    const extra = extraBottino(o);   // cariche e tabelle, sotto la riga, larghe quanto la pagina
    const sotto = [base && norm(base.nome) !== norm(o.nome) ? base.nome : '', base ? sottotitoloCatalogo(base) : '', base && base.requisiti ? 'serve: ' + base.requisiti.charAt(0).toLowerCase() + base.requisiti.slice(1) : '',
      Number(o.valore) ? mo(o.valore) : '', Number(o.peso) ? o.peso + ' lb' : '', o.sessione && DB.sessioni[o.sessione] ? 'sessione ' + DB.sessioni[o.sessione].numero : ''].filter(Boolean);
    return `<li class="riga riga-bottino" id="bot-${esc(o.id)}"><div class="corpo"><div class="tit">${Number(o.quantita) > 1 ? esc(o.quantita) + ' × ' : ''}${esc(o.nome)}${o.richiede ? ' <span class="chip chip--mini">sintonia' + (o.sintonia ? ': ' + esc(nomeDi(o.sintonia)) : '') + '</span>' : ''}</div>
        <div class="sub">${sotto.map(esc).join(', ')}</div>${o.note ? `<div class="sub desc-bottino">${testoRicco(o.note, 'riga')}</div>` : ''}</div>
        <button class="btn btn--testo btn--piccolo" data-a="tav-vendi" data-id="${esc(o.id)}">Vendi</button>
        <button class="btn-icona btn-icona--mini" data-a="modifica" data-tab="commercio" data-id="${esc(o.id)}" aria-label="Modifica ${esc(o.nome)}">${ico('modifica')}</button>${extra ? `<div class="extra-bottino">${extra}</div>` : ''}</li>`;
  }).join('') + '</ul>' : `<p class="vuoto">${BOTTINO_SCHEDA ? esc(nomeDi(BOTTINO_SCHEDA)) + ' non porta niente del gruppo.' : 'Niente da dividere.'}</p>`;
  h += `<div class="azioni"><button class="btn btn--piccolo" data-a="tav-bot-nuovo" data-k="${esc(BOTTINO_SCHEDA)}">${ico('piu')}Aggiungi un oggetto${BOTTINO_SCHEDA ? ' a ' + esc(nomeDi(BOTTINO_SCHEDA)) : ''}</button>
    ${allAlba && !alba ? `<button class="btn btn--piccolo" data-a="tav-alba">${ico('lanterna')}È l'alba: ricarica gli oggetti</button>` : ''}</div>`;
  return h + `<p class="fioco piccolo">L'import propone da solo il bottino della serata. ${catalogoOggetti().length ? `Il catalogo ha ${catalogoOggetti().length} oggetti: nell'oggetto scrivi per cercare. Con il catalogo arrivano anche le cariche (i rombi: tocca un rombo pieno per usarne una) e le tabelle da tirare.` : "Con il catalogo degli oggetti (un pacchetto da importare) l'oggetto si sceglie da un elenco."} Le monete divise vanno poi sulla scheda di ognuno su D&amp;D Beyond.</p></section>`;
}

// ---------------------------------------------------------------------
// DATE DELLE SESSIONI: una riga per data proposta e una per ogni "ci sono / forse / no"
// ---------------------------------------------------------------------
function chiaveMia() { return IMPOST.master ? 'master' : IMPOST.pg && DB.voci[IMPOST.pg] ? IMPOST.pg : norm(IMPOST.io || '') ? 'io-' + norm(IMPOST.io).replace(/\s+/g, '-') : ''; }
function persone() {
  const lista = personaggi().map(p => ({ k: p.id, nome: p.giocatore ? p.giocatore + ' (' + p.nome + ')' : p.nome }));
  lista.push({ k: 'master', nome: cfg('master', '') ? cfg('master', '') + ' (Master)' : 'Master' });
  return lista;
}
function sezioneDate() {
  const adesso = Date.now();
  const date = righeConfig('data-').map(r => Object.assign({ id: r.id }, r.valore)).filter(d => d.quando)
    .sort((a, b) => String(a.quando).localeCompare(String(b.quando)));
  const future = date.filter(d => new Date(d.quando).getTime() + (Number(d.durata) || 4) * 3600000 > adesso);
  const disp = {};
  righeConfig('disp-').forEach(r => { (disp[r.valore.data] = disp[r.valore.data] || {})[r.valore.chi] = r.valore.stato; });
  const mia = chiaveMia();
  const gente = persone();
  let h = `<section class="sezione"><h2>Prossime sessioni</h2>
    <div class="azioni" style="margin-top:0"><button class="btn btn--primario btn--piccolo" data-a="tav-data">${ico('piu')}Proponi una data</button></div>`;
  if (!future.length) h += '<p class="vuoto">Nessuna data in programma.</p>';
  h += future.map(d => {
    const q = new Date(d.quando);
    const giorno = q.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
    const st = disp[d.id] || {};
    const si = gente.filter(g => st[g.k] === 'si').length;
    return `<article class="data-sessione"><div class="ds-testa"><div><strong>${esc(giorno)}</strong><span class="fioco"> alle ${esc(q.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }))}</span>${d.nota ? `<div class="piccolo">${esc(d.nota)}</div>` : ''}</div>
      <span class="conta">${si} su ${gente.length}</span></div>
      <div class="chips">${gente.map(g => `<span class="chip disp-${esc(st[g.k] || 'nd')}">${esc(g.nome)}${st[g.k] === 'si' ? ' ✓' : st[g.k] === 'no' ? ' ✗' : st[g.k] === 'forse' ? ' ?' : ''}</span>`).join('')}</div>
      ${mia ? `<div class="azioni">${[['si', 'Ci sono'], ['forse', 'Forse'], ['no', 'Non ci sono']].map(([k, l]) => `<button class="btn btn--piccolo${st[mia] === k ? ' btn--primario' : ''}" data-a="tav-disp" data-id="${esc(d.id)}" data-stato="${k}">${l}</button>`).join('')}</div>` : '<p class="fioco piccolo">Scegli il tuo personaggio nelle impostazioni per dire se ci sei.</p>'}
      <div class="azioni"><a class="btn btn--testo btn--piccolo" href="${esc(linkCalendario(d))}" target="_blank" rel="noopener">${ico('esterno')}Aggiungi a Google Calendar</a>
      ${d.da === chiSono() || IMPOST.master ? `<button class="btn btn--testo btn--piccolo" data-a="tav-data-togli" data-id="${esc(d.id)}">Togli</button>` : ''}</div></article>`;
  }).join('');
  return h + '</section>';
}
// link "aggiungi evento" di Google Calendar: le ore senza Z valgono nel fuso del calendario di chi lo apre
function linkCalendario(d) {
  const q = new Date(d.quando), fine = new Date(q.getTime() + (Number(d.durata) || 4) * 3600000);
  const f = x => x.getFullYear() + String(x.getMonth() + 1).padStart(2, '0') + String(x.getDate()).padStart(2, '0') + 'T' + String(x.getHours()).padStart(2, '0') + String(x.getMinutes()).padStart(2, '0') + '00';
  const titolo = 'D&D: ' + cfg('campagna', 'Taverna');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(titolo) + '&dates=' + f(q) + '/' + f(fine) + '&details=' + encodeURIComponent((d.nota ? d.nota + '\n' : '') + 'Data proposta in Taverna');
}

// DICERIE: voci di taverna sentite in gioco (dall'import o a mano). Il Master può prepararne di segrete
// e rivelarle quando i personaggi le sentono.

const VERITA = { '': 'Da verificare', si: 'Era vera', parte: 'Vera in parte', no: 'Era falsa' };
function sezioneDicerie() {
  const tutte = righeConfig('dic-').map(r => Object.assign({ id: r.id, segreto: r.segreto, agg: r.agg }, r.valore)).filter(d => d.testo)
    .sort((a, b) => String(b.agg || '').localeCompare(String(a.agg || '')));
  const pubbliche = tutte.filter(d => !d.segreto), preparate = tutte.filter(d => d.segreto);
  const riga = d => `<li class="diceria v-${esc(d.vera || 'nd')}"><div class="corpo"><p>${testoRicco(d.testo, 'riga')}</p>
      <p class="piccolo fioco">${[d.chi ? 'da ' + esc(nomeDi(d.chi)) : '', d.dove ? 'a ' + esc(nomeDi(d.dove)) : '', d.sessione && DB.sessioni[d.sessione] ? 'sessione ' + esc(DB.sessioni[d.sessione].numero) : ''].filter(Boolean).join(', ')}</p>
      <div class="chips">${Object.entries(VERITA).map(([k, l]) => `<button class="chip chip--tasto${(d.vera || '') === k ? ' on' : ''}" data-a="tav-vera" data-id="${esc(d.id)}" data-v="${k}">${l}</button>`).join('')}</div></div>
      <div class="azioni-riga">${d.segreto ? `<button class="btn btn--piccolo btn--primario" data-a="tav-dic-rivela" data-id="${esc(d.id)}">Rivela</button>` : ''}<button class="btn-icona btn-icona--mini" data-a="tav-diceria" data-id="${esc(d.id)}" aria-label="Modifica">${ico('modifica')}</button></div></li>`;
  let h = `<section class="sezione"><h2>Voci di taverna <span class="conta">${pubbliche.length}</span></h2>
    <div class="azioni" style="margin-top:0"><button class="btn btn--primario btn--piccolo" data-a="tav-diceria">${ico('piu')}Segna una diceria</button></div>
    ${pubbliche.length ? '<ul class="dicerie">' + pubbliche.map(riga).join('') + '</ul>' : '<p class="vuoto">Nessuna diceria. Le aggiunge anche l\'import, quando in una sessione qualcuno racconta una voce.</p>'}</section>`;
  if (IMPOST.master) {
    h += `<section class="sezione"><h2>${ico('nascosto')}Preparate dal Master <span class="conta">${preparate.length}</span></h2>
      <p class="fioco piccolo" style="margin-top:0">Le vedi solo tu. Quando i personaggi le sentono, toccare "Rivela" le fa comparire a tutti.</p>
      <div class="azioni" style="margin-top:0"><button class="btn btn--piccolo" data-a="tav-diceria" data-segreta="1">${ico('piu')}Prepara una diceria</button></div>
      ${preparate.length ? '<ul class="dicerie">' + preparate.map(riga).join('') + '</ul>' : ''}</section>`;
  }
  return h;
}

// ---------------------------------------------------------------------
// Tutte le azioni della vista (pulsanti e moduli tav-* in 9-avvio.js)
// ---------------------------------------------------------------------
async function azioneTavolo(a, el, form) {
  // le note private hanno il loro gestore (più sotto): tutte asincrone, con la crittografia del browser
  if (a.indexOf('tav-priv-') === 0 || a.indexOf('tav-master-') === 0) return azioneNotePrivate(a, el, form);
  const val = n => { const x = form && form.querySelector(`[name="${n}"]`); return x ? x.value.trim() : ''; };
  switch (a) {
    // --- la valle ---
    case 'tav-giorno': {
      // i tasti vecchi del giorno ora passano dall'orologio: due telefoni insieme fanno due giorni
      cambiaOrario({ d: 24 * Number(el.dataset.d) }, Number(el.dataset.d) > 0 ? 'Passa un giorno' : 'Un giorno indietro');
      break;
    }
    case 'tav-ora': {
      const d = Number(el.dataset.d) || 0;
      if (d < 0 && oreCampagna() + d < 0) { avviso("L'orologio è già all'inizio della campagna"); return; }
      cambiaOrario({ d }, el.dataset.perche || (d > 0 ? 'Un\'ora in più' : 'Un\'ora in meno'));
      avviso((el.dataset.perche ? el.dataset.perche + ': ' : '') + 'sono le ' + testoOra(oreCampagna()));
      break;
    }
    case 'tav-ora-imposta':
      apriFoglio(`<div class="foglio-testa"><h2 class="t2">Che ore sono?</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>
        <form data-a="tav-ora-imposta-salva"><p class="fioco" style="margin-top:0">L'ora del giorno ${esc(calendario().giorno)}: per cambiare giorno usa "Passa un giorno".</p>
          <label class="campo"><span>Ora</span><input type="time" name="ora" value="${esc(testoOra(oreCampagna()))}" required></label>
          <div class="foglio-piede"><button type="button" class="btn" data-a="chiudi">Annulla</button><button class="btn btn--primario" type="submit">${ico('check')}Imposta</button></div></form>`);
      return;
    case 'tav-ora-imposta-salva': {
      const m = /^(\d{1,2}):(\d{2})/.exec(val('ora'));
      if (!m) return;
      const giorno = Math.floor(oreCampagna() / 24);
      cambiaOrario({ s: giorno * 24 + clamp(Number(m[1]), 0, 23) + clamp(Number(m[2]), 0, 59) / 60 }, 'Ora messa a mano');
      chiudiFoglio();
      break;
    }
    case 'tav-ora-persi':
      apriFoglio(`<div class="foglio-testa"><h2 class="t2">Ci siamo persi</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>
        <form data-a="tav-ora-persi-salva"><p class="fioco" style="margin-top:0">Ogni prova del navigatore fallita è un'ora senza avanzare (Rime pag. 11).</p>
          <label class="campo"><span>Ore perse</span><input type="number" name="ore" value="1" min="0.5" max="48" step="0.5" inputmode="decimal" required></label>
          <div class="foglio-piede"><button type="button" class="btn" data-a="chiudi">Annulla</button><button class="btn btn--primario" type="submit">${ico('check')}Aggiungi</button></div></form>`);
      return;
    case 'tav-ora-persi-salva': {
      const n = clamp(Number(String(val('ore')).replace(',', '.')) || 0, 0, 48);
      if (n) cambiaOrario({ d: n }, 'Ci siamo persi');
      chiudiFoglio();
      break;
    }
    case 'tav-ora-annulla': {
      // annullare un cambio (un viaggio segnato per sbaglio, un'ora di troppo): resta nella lista, barrato
      const r = DB.config[el.dataset.id];
      if (!r || !r.valore) return;
      salva('config', { id: r.id, valore: Object.assign({}, r.valore, { annullato: 1 }) });
      avviso('Cambio annullato: sono le ' + testoOra(oreCampagna()));
      break;
    }
    case 'tav-calendario': {
      const c = cfg('calendario', null) || {};
      const cal = calendario();
      apriFoglio(`<div class="foglio-testa"><h2 class="t2">Il calendario</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>
        <form data-a="tav-calendario-salva">
          <label class="campo"><span>Oggi è il giorno della campagna numero</span><input type="number" name="oggi" min="1" inputmode="numeric" value="${esc(cal.giorno)}"><small>Cambiandolo, sposto il giorno di partenza: i giorni passati nelle sessioni restano.</small></label>
          <label class="campo"><span>La prossima luna nuova è il giorno numero</span><input type="number" name="luna" min="1" inputmode="numeric" value="${esc(cal.luna ? cal.giorno + cal.luna.tra : '')}" placeholder="Lo dice il Master"><small>Da lì conto un ciclo ogni ${esc(cal.ciclo)} giorni.</small></label>
          <label class="campo"><span>Giorni del ciclo della luna</span><input type="number" name="ciclo" min="10" max="60" inputmode="numeric" value="${esc(cal.ciclo)}"></label>
          <p class="fioco piccolo">Facoltativo: che giorno è oggi nel calendario di Harptos, per vedere la data accanto al numero.</p>
          <div class="riga-campi"><label class="campo"><span>Giorno</span><input type="number" name="hg" min="1" max="30" inputmode="numeric" value="${esc(c.hg || '')}"></label>
          <label class="campo"><span>Mese</span><select name="hm"><option value="">Nessuno</option>${MESI_HARPTOS.map((m, i) => `<option value="${i}" ${String(c.hm) === String(i) ? 'selected' : ''}>${m}</option>`).join('')}</select></label>
          <label class="campo"><span>Anno DR</span><input type="number" name="ha" inputmode="numeric" value="${esc(c.annoInizio || 1489)}"></label></div>
          <div class="foglio-piede"><button type="button" class="btn" data-a="chiudi">Annulla</button><button class="btn btn--primario" type="submit">${ico('check')}Salva</button></div></form>`);
      return;
    }
    case 'tav-calendario-salva': {
      const c = Object.assign({}, cfg('calendario', null) || {});
      const ora = calendario();
      const oggi = Math.max(1, Number(val('oggi')) || ora.giorno);
      c.inizio = (Number(c.inizio) || 1) + (oggi - ora.giorno);
      if (val('luna')) c.luna = Number(val('luna')); else delete c.luna;
      c.ciclo = clamp(Number(val('ciclo')) || 30, 10, 60);
      if (val('hm') !== '' && Number(val('hg'))) {
        // la data di oggi diventa il giorno dell'anno del giorno 1 della campagna (mesi di 30 giorni più le feste)
        const m = Number(val('hm')), g = clamp(Number(val('hg')), 1, 30), anno = Number(val('ha')) || 1489;
        let doy = 0;
        for (let i = 0; i < m; i++) { doy += 30; if (FESTE_HARPTOS[i] !== undefined) doy += 1 + (i === 6 && anno % 4 === 0 ? 1 : 0); }
        c.hg = g; c.hm = m;
        c.annoInizio = anno;
        c.giornoAnno = doy + g - (oggi - 1);
        while (c.giornoAnno < 1) { c.annoInizio--; c.giornoAnno += c.annoInizio % 4 === 0 ? 366 : 365; }
      } else { delete c.hg; delete c.hm; delete c.annoInizio; delete c.giornoAnno; }
      setCfg('calendario', c);
      chiudiFoglio();
      break;
    }
    case 'tav-abiti': salva('voci', { id: el.dataset.id, abiti: el.dataset.v }); break;
    case 'tav-ind': { const p = DB.voci[el.dataset.id]; if (p) salva('voci', { id: p.id, indebolimento: clamp((Number(p.indebolimento) || 0) + Number(el.dataset.d), 0, 6) }); break; }
    case 'tav-acqua': {
      const p = DB.voci[el.dataset.id];
      if (!p) return;
      if (Number(p.acqua)) { salva('voci', { id: p.id, acqua: 0, abiti: (p.abiti || 'asciutti') === 'asciutti' ? 'bagnati' : p.abiti }); avviso(p.nome + ' è fuori dall\'acqua: abiti bagnati finché non li cambia'); break; }
      salva('voci', { id: p.id, acqua: Date.now(), abiti: 'bagnati' });
      // per il conto dei minuti serve il punteggio di Costituzione (sulla voce c'è solo il modificatore)
      if (!Number(p.cosPunteggio)) {
        apriFoglio(`<div class="foglio-testa"><h2 class="t2">${esc(p.nome)} in acqua gelida</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>
          <form data-a="tav-cos-salva" data-id="${esc(p.id)}"><label class="campo"><span>Punteggio di Costituzione (il numero, non il modificatore)</span><input type="number" name="cos" min="1" max="30" inputmode="numeric" required></label>
          <p class="fioco piccolo">Si resiste senza danni per tanti minuti quanto questo punteggio. Lo chiedo una volta sola.</p>
          <div class="foglio-piede"><button type="button" class="btn" data-a="chiudi">Dopo</button><button class="btn btn--primario" type="submit">${ico('check')}Salva</button></div></form>`);
        return;
      }
      break;
    }
    case 'tav-cos-salva': salva('voci', { id: form.dataset.id, cosPunteggio: clamp(Number(val('cos')) || 0, 1, 30) }); chiudiFoglio(); break;
    case 'tav-bufera': {
      const b = cfg('bufera', {}) || {};
      if (el.dataset.fine) {
        // finita: se l'orologio non è ancora arrivato alla fine della bufera, il tempo passato al riparo si conta
        if (b.oraInizio !== undefined && b.oraInizio !== '' && Number(b.ore)) {
          const resto = Number(b.oraInizio) + Number(b.ore) - oreCampagna();
          if (resto > 0) cambiaOrario({ d: Math.round(resto * 60) / 60 }, 'Bufera, al riparo finché passa');
        }
        setCfg('bufera', Object.assign({}, b, { fine: Date.now() }));
        break;
      }
      const ore = (1 + Math.floor(Math.random() * 4)) + (1 + Math.floor(Math.random() * 4));   // 2d4
      setCfg('bufera', { inizio: Date.now(), ore, oraInizio: oreCampagna() });
      avviso('Bufera: durerà ' + ore + ' ore di gioco, fino alle ' + testoOra(oreCampagna() + ore));
      break;
    }

    // --- turni ---
    case 'tav-mia-ini': { if (IMPOST.pg) salva('voci', { id: IMPOST.pg, iniziativa: val('n') === '' ? '' : Number(val('n')) }); avviso('Iniziativa segnata'); break; }
    case 'tav-cond-pg': {
      const p = DB.voci[el.dataset.id];
      if (!p) return;
      const c = p.condizioni || [];
      salva('voci', { id: p.id, condizioni: c.includes(el.dataset.c) ? c.filter(x => x !== el.dataset.c) : c.concat([el.dataset.c]) });
