    }
    case 'tav-ini': {
      const ini = iniziativa();
      const n = ini.ordine.length;
      const op = el.dataset.op;
      if (op === 'pg') {
        // aggiungo i personaggi che mancano, con l'iniziativa che hanno segnato
        personaggi().forEach(p => {
          const gia = ini.ordine.find(x => x.pg === p.id);
          if (gia) { if (p.iniziativa !== undefined && p.iniziativa !== '') gia.init = Number(p.iniziativa); return; }
          ini.ordine.push({ id: 'pg-' + p.id, nome: p.nome, tipo: 'pg', pg: p.id, init: p.iniziativa === undefined || p.iniziativa === '' ? 0 : Number(p.iniziativa), condizioni: [] });
        });
      }
      if (op === 'inizia') { ini.attiva = 1; ini.round = 1; ini.turno = 0; }
      if (op === 'avanti' && n) { ini.turno = (Number(ini.turno) || 0) + 1; if (ini.turno >= n) { ini.turno = 0; ini.round = (Number(ini.round) || 1) + 1; } }
      if (op === 'indietro' && n) { ini.turno = (Number(ini.turno) || 0) - 1; if (ini.turno < 0) { ini.turno = n - 1; ini.round = Math.max(1, (Number(ini.round) || 1) - 1); } }
      if (op === 'fine') { ini.attiva = 0; }
      if (op === 'svuota') { ini.ordine = []; ini.attiva = 0; salva('config', { id: 'iniziativa-pf', valore: {}, segreto: 1 }); }
      // ordine: iniziativa più alta prima; a parità i personaggi prima dei nemici
      if (op === 'pg' || op === 'inizia') ini.ordine.sort((x, y) => (Number(y.init) || 0) - (Number(x.init) || 0) || (x.tipo === 'pg' ? -1 : 1));
      setCfg('iniziativa', ini);
      sincronizza();   // il cambio di turno deve arrivare subito agli altri telefoni
      break;
    }
    case 'tav-ini-nemico':
      apriFoglio(`<div class="foglio-testa"><h2 class="t2">Nemici o alleati</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>
        <form data-a="tav-ini-nemico-salva">
          <label class="campo"><span>Nome</span><input type="text" name="nome" required placeholder="Es. Lupo invernale"></label>
          <div class="riga-campi"><label class="campo"><span>Quanti</span><input type="number" name="n" min="1" max="20" value="1" inputmode="numeric"></label>
          <label class="campo"><span>Iniziativa</span><input type="number" name="init" inputmode="numeric" required></label></div>
          <div class="riga-campi"><label class="campo"><span>Punti ferita</span><input type="number" name="pf" min="0" inputmode="numeric"></label>
          <label class="campo"><span>CA</span><input type="number" name="ca" min="0" inputmode="numeric"></label></div>
          <label class="campo"><span>Da che parte sta</span><select name="tipo"><option value="nemico">Nemico</option><option value="alleato">Alleato</option></select></label>
          <p class="fioco piccolo">Punti ferita e CA li vedi solo tu.</p>
          <div class="foglio-piede"><button type="button" class="btn" data-a="chiudi">Annulla</button><button class="btn btn--primario" type="submit">${ico('check')}Aggiungi</button></div></form>`);
      return;
    case 'tav-ini-nemico-salva': {
      const ini = iniziativa(), pf = Object.assign({}, cfg('iniziativa-pf', null) || {});
      const quanti = clamp(Number(val('n')) || 1, 1, 20);
      for (let i = 1; i <= quanti; i++) {
        const id = 'x-' + Date.now().toString(36) + i;
        ini.ordine.push({ id, nome: val('nome') + (quanti > 1 ? ' ' + i : ''), tipo: val('tipo') || 'nemico', init: Number(val('init')) || 0, condizioni: [] });
        if (val('pf') || val('ca')) pf[id] = { pf: Number(val('pf')) || 0, max: Number(val('pf')) || 0, ca: Number(val('ca')) || 0 };
      }
      ini.ordine.sort((x, y) => (Number(y.init) || 0) - (Number(x.init) || 0) || (x.tipo === 'pg' ? -1 : 1));
      setCfg('iniziativa', ini);
      salva('config', { id: 'iniziativa-pf', valore: pf, segreto: 1 });
      chiudiFoglio();
      sincronizza();
      break;
    }
    case 'tav-ini-voce': {
      const ini = iniziativa(), i = Number(el.dataset.i), x = ini.ordine[i];
      if (!x) return;
      const p = (cfg('iniziativa-pf', null) || {})[x.id] || {};
      apriFoglio(`<div class="foglio-testa"><h2 class="t2">${esc(x.nome)}</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>
        <form data-a="tav-ini-voce-salva" data-i="${i}">
          <div class="riga-campi"><label class="campo"><span>Iniziativa</span><input type="number" name="init" inputmode="numeric" value="${esc(x.init)}"></label>
          ${x.tipo !== 'pg' ? `<label class="campo"><span>Punti ferita</span><input type="number" name="pf" inputmode="numeric" value="${esc(p.pf === undefined ? '' : p.pf)}"></label>` : ''}</div>
          ${x.tipo !== 'pg' ? `<label class="campo"><span>Danni o cure (es. -7 o +5)</span><input type="number" name="delta" inputmode="numeric"></label>` : ''}
          <label class="interruttore"><span>Sta mantenendo la concentrazione</span><input type="checkbox" name="conc" ${x.conc ? 'checked' : ''}></label>
          ${x.tipo !== 'pg' ? `<div class="campo"><span class="etichetta">Condizioni</span><div class="chips chips--condizioni">${CONDIZIONI.map(c => `<label class="chip chip--tasto"><input type="checkbox" name="c" value="${esc(c)}" ${(x.condizioni || []).includes(c) ? 'checked' : ''}> ${esc(c)}</label>`).join('')}</div></div>` : '<p class="fioco piccolo">Le condizioni di un personaggio le segna il suo giocatore.</p>'}
          <div class="foglio-piede"><button type="button" class="btn btn--pericolo" data-a="tav-ini-togli" data-i="${i}">Togli</button><button class="btn btn--primario" type="submit">${ico('check')}Salva</button></div></form>`);
      return;
    }
    case 'tav-ini-voce-salva': {
      const ini = iniziativa(), i = Number(form.dataset.i), x = ini.ordine[i];
      if (!x) return;
      x.init = Number(val('init')) || 0;
      x.conc = form.querySelector('[name="conc"]').checked ? 1 : 0;
      if (x.tipo !== 'pg') {
        x.condizioni = Array.from(form.querySelectorAll('[name="c"]:checked')).map(c => c.value);
        const pf = Object.assign({}, cfg('iniziativa-pf', null) || {});
        const p = Object.assign({}, pf[x.id] || {});
        if (val('pf') !== '') p.pf = Number(val('pf'));
        if (val('delta')) p.pf = Math.max(0, (Number(p.pf) || 0) + Number(val('delta')));
        pf[x.id] = p;
        salva('config', { id: 'iniziativa-pf', valore: pf, segreto: 1 });
      }
      setCfg('iniziativa', ini);
      chiudiFoglio();
      sincronizza();
      break;
    }
    case 'tav-ini-togli': {
      const ini = iniziativa(), i = Number(el.dataset.i);
      ini.ordine.splice(i, 1);
      if (Number(ini.turno) >= ini.ordine.length) ini.turno = 0;
      setCfg('iniziativa', ini);
      chiudiFoglio();
      sincronizza();
      break;

    // --- viaggio ---
    case 'tav-v': {
      const f = el.closest('form');
      ['da', 'a', 'terreno', 'miglia', 'mezzo', 'meteo'].forEach(k => { const x = f.querySelector(`[name="${k}"]`); if (x) VIAGGIO[k] = x.value; });

    }
    case 'tav-viaggio-fatto': {
      const r = calcolaViaggio(VIAGGIO);
      if (r.errore || !VIAGGIO.a) return;
      const via = (r.tappe || []).slice(1, -1);
      const testo = `Viaggio da #[${nomeDi(VIAGGIO.da)}] a #[${nomeDi(VIAGGIO.a)}]${via.length ? ' passando per ' + via.map(id => '#[' + nomeDi(id) + ']').join(', ') : ''}: ${String(r.totale).replace('.', ',')} ore, ${MEZZI_VIAGGIO[VIAGGIO.mezzo].nome.toLowerCase()}${VIAGGIO.meteo === 'bufera' ? ', nella bufera' : ''}.`;
      aggiungiTappe(r.tappe || [VIAGGIO.da, VIAGGIO.a]);
      const ser = serata();
      if (ser) salva('config', { id: 'seg-' + Date.now().toString(36) + 'v', valore: { quando: Date.now(), tipo: 'luogo', testo: testo.replace(/#\[([^\]]+)\]/g, '$1'), chi: chiSono() } });
      else {
        const s = indice().sessioni.slice(-1)[0];
        if (s) salva('sessioni', { id: s.id, eventi: (s.eventi || []).concat([{ t: testo, l: VIAGGIO.a }]) });
      }
      setCfg('posizione', VIAGGIO.a);
      // le ore del viaggio passano sull'orologio; se era uno sbaglio, "Annulla" nella lista dei cambi
      cambiaOrario({ d: r.totale }, 'Viaggio da ' + nomeDi(VIAGGIO.da) + ' a ' + nomeDi(VIAGGIO.a));
      MAPPA.sporca = true;
      avviso((ser ? 'Viaggio segnato nel taccuino' : 'Viaggio aggiunto all\'ultima sessione') + ', il gruppo è a ' + nomeDi(VIAGGIO.a) + ' alle ' + testoOra(oreCampagna()) + '. Si annulla da La valle');
      VIAGGIO.da = VIAGGIO.a; VIAGGIO.a = '';
      break;
    }
    case 'tav-nuova-tratta': {
      // la tratta che manca (o quella senza ore), con partenza e arrivo già scelti
      const tr = trattaTra(VIAGGIO.da, VIAGGIO.a);
      if (tr) apriEditor('commercio', tr.id); else apriEditor('commercio', null, { tipo: 'tratta', da: VIAGGIO.da, a: VIAGGIO.a, pericolo: 1 });
      return;
    }
    case 'tav-incontri': salva('config', { id: 'incontri', valore: val('tabella'), segreto: 1 }); avviso('Tabella salvata: la vedi solo tu'); break;
    case 'tav-incontro': {
      const righe = String(cfg('incontri', '')).split('\n').map(r => r.trim().match(/^(\d{1,3})(?:\s*[-–]\s*(\d{1,3}))?[\s.:)]+(.+)$/)).filter(Boolean);
      if (!righe.length) return;
      const max = Math.max(...righe.map(m => Number(m[2] || m[1]) || 0)) || 20;
      const n = 1 + Math.floor(Math.random() * max);
      const m = righe.find(x => n >= Number(x[1]) && n <= Number(x[2] || x[1]));
      const box = document.getElementById('esito-incontro');
      if (box) { box.innerHTML = `<span class="n">${n}</span><div>${m ? esc(m[3]) : 'Nessuna riga per questo numero'}</div>`; box.hidden = false; }
      return;
    }

    // --- bottino ---
    case 'tav-monete':
      apriFoglio(`<div class="foglio-testa"><h2 class="t2">Fondo comune</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>
        <form data-a="tav-monete-salva"><label class="campo"><span>Monete d'oro (negativo per una spesa)</span><input type="number" name="importo" step="0.1" inputmode="decimal" required></label>
        <label class="campo"><span>Per cosa</span><input type="text" name="testo" placeholder="Es. ricompensa di Duvessa, stanze al Northlook"></label>
        <div class="foglio-piede"><button type="button" class="btn" data-a="chiudi">Annulla</button><button class="btn btn--primario" type="submit">${ico('check')}Segna</button></div></form>`);
      return;
    case 'tav-monete-salva':
      salva('commercio', { id: nuovoId('commercio'), tipo: 'moneta', importo: Number(val('importo')) || 0, testo: val('testo') || 'Movimento', data: oggiISO() });
      chiudiFoglio();
      break;
    case 'tav-dividi': {
      const pgs = personaggi();
      const fondo = comm('moneta').reduce((t, m) => t + (Number(m.importo) || 0), 0);

      salva('commercio', { id: nuovoId('commercio'), tipo: 'moneta', importo: -quota * pgs.length, testo: `Divise in ${pgs.length}: ${mo(quota)} a testa`, data: oggiISO() });
      break;
    }
    case 'tav-bot-scheda': BOTTINO_SCHEDA = el.dataset.k || ''; break;
    case 'tav-bot-nuovo': apriEditor('commercio', null, { tipo: 'bottino', portatore: el.dataset.k || '' }); return;
    case 'tav-vendi': {
      const o = DB.commercio[el.dataset.id];
      if (!o) return;
      apriFoglio(`<div class="foglio-testa"><h2 class="t2">Vendi ${esc(o.nome)}</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>
        <form data-a="tav-vendi-salva" data-id="${esc(o.id)}"><label class="campo"><span>Quante monete d'oro ne ricavate in tutto</span><input type="number" name="ricavo" min="0" step="0.1" inputmode="decimal" value="${esc(Math.round((Number(o.valore) || 0) * (Number(o.quantita) || 1) / 2))}" required>
        <small>Di solito si vende a metà del valore; decide il Master.</small></label>
        <div class="foglio-piede"><button type="button" class="btn" data-a="chiudi">Annulla</button><button class="btn btn--primario" type="submit">${ico('check')}Vendi</button></div></form>`);
      return;
    }
    case 'tav-vendi-salva': {
      const o = DB.commercio[form.dataset.id];
      if (!o) return;
      salva('commercio', { id: nuovoId('commercio'), tipo: 'moneta', importo: Number(val('ricavo')) || 0, testo: 'Venduto: ' + o.nome, data: oggiISO() });
      elimina('commercio', o.id);
      chiudiFoglio();
      avviso('Venduto: il ricavo è nel fondo comune');

    // --- cariche, tabelle e cose segnate degli oggetti del bottino (1.7) ---
    case 'tav-carica': {
      // rombo pieno = uso una carica, rombo vuoto = la recupero; oltre le 12 cariche vale il numero scritto accanto
      const o = DB.commercio[el.dataset.id];
      const scorte = o ? scorteDi(o) : [];
      const s = scorte.find(x => x.k === el.dataset.k);
      if (!s || !s.max) return;
      const campo = el.closest('.cb') && el.closest('.cb').querySelector('.cb-quante');
      const quante = campo ? clamp(Math.round(Number(campo.value) || 1), 1, s.max) : 1;
      const usate = clamp(s.usate + (el.dataset.on === '1' ? quante : -quante), 0, s.max);
      if (usate === s.usate) return;

      salva('commercio', { id: o.id, usate: Object.assign({}, o.usate || {}, { [s.k]: usate }) });
      ULTIMO_TIRO = null;

      const ultima = [].concat((oggettoCatalogo(o.catalogo) || {}).tabella || []).findIndex(t => t.quando === 'ultima');
      const principale = scorte.find(x => x.k === 'Cariche') || scorte[0];

      break;

    case 'tav-ricarica': {
      const o = DB.commercio[el.dataset.id];

      ULTIMO_TIRO = detto ? { id: o.id, t: null, riga: -1, n: null, avviso: 'Ricaricato', testo: detto.slice(o.nome.length + 2) } : null;
      break;
    }
    case 'tav-alba': {
      // all'alba tornano insieme le cariche di tutti gli oggetti che si ricaricano all'alba, di chiunque siano;

      const detti = comm('bottino').map(o => ricaricaOggetto(o, r => /alba/i.test(r))).filter(Boolean);
      if (albaNumero() > albaFatta()) setCfg('alba', { k: albaNumero() });
      ULTIMO_TIRO = null;
      avviso(detti.length ? "All'alba: " + detti.join('; ') : "All'alba non c'era niente da ricaricare");
      break;
    }
    case 'tav-alba-no': setCfg('alba', { k: albaNumero() }); break;
    case 'tav-cariche-tira': {
      // le cariche che l'oggetto ha quando lo trovate, se il catalogo le dà con i dadi e non sono ancora tirate
      const o = DB.commercio[el.dataset.id];
      const s = o && scorteDi(o).find(x => x.k === el.dataset.k);
      const r = s && !s.max ? tiraDadi(s.dado) : null;
      if (!r) return;
      salva('commercio', { id: o.id, cariche: Object.assign({}, o.cariche || {}, { [s.k]: Math.max(1, r.n) }) });
      ULTIMO_TIRO = { id: o.id, t: null, riga: -1, n: Math.max(1, r.n), avviso: (s.sola ? 'Cariche' : s.k) + ' quando lo trovate', testo: '', dettaglio: s.dado + (r.dettaglio ? ': ' + r.dettaglio : '') };
      break;
    }
    case 'tav-tira': {
      // una tabella dell'oggetto: il dado giusto, e la riga uscita evidenziata. Il tiro resta su questo telefono
      const o = DB.commercio[el.dataset.id];
      const i = Number(el.dataset.t);
      const t = o ? [].concat((oggettoCatalogo(o.catalogo) || {}).tabella || [])[i] : null;
      if (!t || !t.dado) return;
      const righe = t.righe || [];
      let n = null, dettaglio = '', riga = -1;
      if (t.dado === 'carta') {
        // una carta a caso del mazzo: quelle già usate l'app non le conosce, se ne esce una si pesca ancora
        riga = Math.floor(Math.random() * righe.length);
        dettaglio = 'pescata a caso tra ' + righe.length + ' carte';
      } else {
        const r = tiraDadi(t.dado);
        if (!r) return;
        n = r.n;
        dettaglio = t.dado + (r.dettaglio ? ': ' + r.dettaglio : '');
        riga = righe.findIndex(x => n >= x[0] && n <= x[x.length > 2 ? 1 : 0]);
      }
      ULTIMO_TIRO = { id: o.id, t: i, riga, n, avviso: t.titolo || '', testo: '', dettaglio };
      break;
    }
    case 'tav-tiro-chiudi': ULTIMO_TIRO = null; break;
    case 'tav-variante': {
      // segno sull'oggetto quello che vale per sempre: la variante, il risultato di una tabella "trovato"
      const o = DB.commercio[el.dataset.id];
      if (!o) return;
      const tabelle = [].concat((oggettoCatalogo(o.catalogo) || {}).tabella || []);
      const t = el.dataset.t !== undefined ? tabelle[Number(el.dataset.t)] : null;
      // il numero tirato riempie o svuota una scorta: lo segno sui rombi, non nel testo
      if (t && el.dataset.n !== undefined && (t.piene || t.vuote)) {
        const s = scorteDi(o).find(x => x.k === (t.piene || t.vuote));
        if (!s || !s.max) { avviso('Prima tirate le cariche dell\'oggetto'); return; }
        const n = clamp(Number(el.dataset.n) || 0, 0, s.max);
        salva('commercio', { id: o.id, usate: Object.assign({}, o.usate || {}, { [s.k]: t.piene ? s.max - n : n }) });
        ULTIMO_TIRO = null;
        avviso((t.piene ? 'Ne restano ' + n : 'Ne restano ' + (s.max - n)) + ' su ' + s.max);
        break;
      }
      let parti = partiVariante(o);
      if (el.dataset.togli !== undefined) {
        const j = parti.indexOf(el.dataset.togli);
        if (j >= 0) parti.splice(j, 1);
      } else if (el.dataset.v) {
        // una variante nuova prende il posto della vecchia; un risultato prende il posto di quello della stessa
        // tabella, tranne nelle tabelle "piu" (i grani della collana, le toppe della tunica), dove si aggiunge
        if (el.dataset.var) { const varianti = tabelle.map(x => x.variante).filter(Boolean); parti = parti.filter(p => !varianti.some(v => norm(v) === norm(p))); }
        else if (t && !t.piu) parti = parti.filter(p => !dellaTabella(p, t));
        parti.push(el.dataset.v);
      }
      const testo = parti.join('; ');
      if (testo.length > 1000) { avviso("Troppe cose segnate sull'oggetto: togline qualcuna da Modifica"); return; }
      salva('commercio', { id: o.id, variante: testo });
      if (ULTIMO_TIRO && ULTIMO_TIRO.id === o.id && el.dataset.v) ULTIMO_TIRO = null;
      break;
    }

    // --- date ---
    case 'tav-data':
      apriFoglio(`<div class="foglio-testa"><h2 class="t2">Proponi una data</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>
        <form data-a="tav-data-salva"><div class="riga-campi"><label class="campo"><span>Giorno</span><input type="date" name="giorno" required value="${esc(oggiISO())}"></label>
        <label class="campo"><span>Ora</span><input type="time" name="ora" required value="20:30"></label></div>
        <label class="campo"><span>Durata (ore)</span><input type="number" name="durata" min="1" max="12" value="4" inputmode="numeric"></label>
        <label class="campo"><span>Nota</span><input type="text" name="nota" placeholder="Es. da Gigi, porta le pizze"></label>
        <div class="foglio-piede"><button type="button" class="btn" data-a="chiudi">Annulla</button><button class="btn btn--primario" type="submit">${ico('check')}Proponi</button></div></form>`);
      return;
    case 'tav-data-salva': {
      const id = nuovoIdConfig('data-');
      salva('config', { id, valore: { quando: val('giorno') + 'T' + (val('ora') || '20:30'), durata: Number(val('durata')) || 4, nota: val('nota'), da: chiSono() } });
      const mia = chiaveMia();
      if (mia) salva('config', { id: 'disp-' + id.slice(5) + '-' + mia, valore: { data: id, chi: mia, stato: 'si' } });
      chiudiFoglio();
      break;
    }
    case 'tav-disp': {
      const mia = chiaveMia();
      if (!mia) return;
      salva('config', { id: 'disp-' + el.dataset.id.slice(5) + '-' + mia, valore: { data: el.dataset.id, chi: mia, stato: el.dataset.stato } });
      break;
    }
    case 'tav-data-togli':
      if (!await chiedi('Togliere questa data?', 'Sparisce per tutti, con le risposte.', 'Togli', true)) return;
      elimina('config', el.dataset.id);
      righeConfig('disp-').filter(r => r.valore.data === el.dataset.id).forEach(r => elimina('config', r.id));
      break;

    // --- dicerie ---
    case 'tav-diceria': {
      const r = el.dataset.id ? DB.config[el.dataset.id] : null;
      const d = r ? r.valore : {};
      apriFoglio(`<div class="foglio-testa"><h2 class="t2">${r ? 'Modifica la diceria' : el.dataset.segreta ? 'Diceria da preparare' : 'Nuova diceria'}</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>
        <form data-a="tav-diceria-salva" data-id="${esc(r ? r.id : '')}" data-segreta="${el.dataset.segreta ? 1 : 0}">
          <label class="campo"><span>Cosa si dice</span><textarea name="testo" required data-menzioni placeholder="Scrivi @ per citare una persona e # per un luogo">${esc(d.testo || '')}</textarea></label>
          <div class="riga-campi"><label class="campo"><span>Chi la racconta</span><input type="text" name="chi" value="${esc(d.chi ? nomeDi(d.chi) : '')}" list="dl-png"></label>
          <label class="campo"><span>Dove</span><input type="text" name="dove" value="${esc(d.dove ? nomeDi(d.dove) : '')}" list="dl-luoghi-dic"></label></div>
          <datalist id="dl-png">${elenco('voci', v => v.tipo === 'png' || v.tipo === 'fazione').map(v => `<option value="${esc(v.nome)}">`).join('')}</datalist>
          <datalist id="dl-luoghi-dic">${elenco('voci', v => v.tipo === 'luogo').map(v => `<option value="${esc(v.nome)}">`).join('')}</datalist>
          <div class="foglio-piede">${r ? `<button type="button" class="btn btn--pericolo" data-a="tav-diceria-togli" data-id="${esc(r.id)}">Togli</button>` : '<button type="button" class="btn" data-a="chiudi">Annulla</button>'}<button class="btn btn--primario" type="submit">${ico('check')}Salva</button></div></form>`);
      return;
    }
    case 'tav-diceria-salva': {
      const id = form.dataset.id || nuovoIdConfig('dic-');
      const prima = DB.config[id] ? DB.config[id].valore : {};
      const rif = (x, tipo) => x ? (risolviNome(x, tipo) || x) : '';
      const rec = { id, valore: Object.assign({}, prima, { testo: val('testo'), chi: rif(val('chi')), dove: rif(val('dove'), 'luogo') }) };
      if (!form.dataset.id && form.dataset.segreta === '1') rec.segreto = 1;
      salva('config', rec);
      chiudiFoglio();
      break;
    }
    case 'tav-diceria-togli': elimina('config', el.dataset.id); chiudiFoglio(); break;
    case 'tav-vera': { const r = DB.config[el.dataset.id]; if (r) salva('config', { id: r.id, valore: Object.assign({}, r.valore, { vera: el.dataset.v }) }); break; }
    case 'tav-dic-rivela': salva('config', { id: el.dataset.id, segreto: 0 }); avviso('Adesso la vedono tutti'); break;
  }
  render();
}

// =====================================================================
// NOTE PRIVATE CIFRATE
// ---------------------------------------------------------------------
// Il foglio Google lo legge chiunque abbia la chiave del gruppo. Per i segreti del proprio personaggio
// ogni giocatore può tenere delle note cifrate sul telefono prima che partano: nel foglio arriva solo
// testo illeggibile, il testo in chiaro sta in memoria finché l'app resta aperta (mai nel telefono).
//   - una chiave a caso (K) cifra le note, con AES-GCM;
//   - K viene chiusa con la frase segreta del giocatore (PBKDF2, 300.000 giri): solo lui la riapre;
//   - se il giocatore vuole, K viene chiusa anche con la chiave pubblica del Master (RSA-OAEP).
// Il Master crea la sua coppia di chiavi una volta: la pubblica sta in config 'chiaveNote' (la vedono
// tutti), la privata, chiusa con la sua frase, in config 'chiaveNote-privata', che è segreta e quindi
// arriva solo ai telefoni del Master. Senza la frase le note non si recuperano (il Master sì, se condivise).
// Sul personaggio: privato = { v: 1, c: '<pacchetto in JSON>' }. Il pacchetto è una stringa sola apposta:
// l'unione automatica tra telefoni lo sostituisce intero e non mescola pezzi di versioni diverse.
// Le funzioni crittografiche del browser ci sono solo in un contesto sicuro (https, come GitHub Pages).
// =====================================================================
const NOTE_APERTE = {};          // id del personaggio → { k, grezza, kg, testo, bozza, master }
let CHIAVE_MASTER_APERTA = null; // la chiave privata del Master, sbloccata finché l'app resta aperta
const GIRI_FRASE = 300000;
const MAX_NOTE = 20000;          // caratteri: cifrate devono stare in una cella del foglio

function cifraturaPossibile() { return !!(window.crypto && crypto.subtle && window.isSecureContext !== false); }
// base64 a pezzi: con String.fromCharCode(...tutto) un testo lungo sfonda la pila delle chiamate
function inBase64(buf) { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function daBase64(t) { const s = atob(t || ''); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
async function chiaveDaFrase(frase, sale) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(frase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: sale, iterations: GIRI_FRASE, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function cifraAes(chiave, dati) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  return { iv: inBase64(iv), dati: inBase64(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, chiave, dati)) };
}
async function decifraAes(chiave, iv, dati) { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: daBase64(iv) }, chiave, daBase64(dati))); }
function paccoNote(pg) {
  try { const p = pg && pg.privato && pg.privato.c ? JSON.parse(pg.privato.c) : null; return p && p.kg ? p : null; } catch (x) { return null; }
}
// K chiusa con la chiave pubblica del Master; mk dice con quale chiave (se il Master la rifà, va ricondivisa)
async function perIlMaster(grezza, chiaveM) {
  const pub = await crypto.subtle.importKey('spki', daBase64(chiaveM.pub), { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
  return { km: inBase64(await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, pub, grezza)), mk: chiaveM.id };
}
// Per il foglio dei conflitti: di una versione delle note dico solo quando è stata salvata
function descriviNote(v) {
  try {
    const p = v && v.c ? JSON.parse(v.c) : null;
    if (!p) return 'nessuna nota';
    return 'note cifrate' + (p.agg ? ', salvate il ' + new Date(p.agg).toLocaleString('it-IT', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) : '');
  } catch (x) { return 'note cifrate'; }
}
// Due dispositivi hanno salvato le note insieme: con le note aperte (la chiave in memoria) metto
// i due testi uno dopo l'altro, quello del foglio prima, e salvo. Senza chiave si sceglie una versione.
async function unisciNotePrivate(id, mio, loro) {
  const aperte = NOTE_APERTE[id];
  try {
    const pm = JSON.parse(mio.c), pl = JSON.parse(loro.c);
    if (!aperte || pm.kg !== pl.kg || pl.kg !== aperte.kg) { avviso('Per unirle apri le note con la tua frase, poi riprova'); return false; }
    const dec = async q => new TextDecoder().decode(await decifraAes(aperte.k, q.iv, q.dati));
    const tl = await dec(pl), tm = await dec(pm);
    const testo = tl === tm ? tl : tl + '\n\n— da questo dispositivo —\n' + tm;
    const corpo = await cifraAes(aperte.k, new TextEncoder().encode(testo));
    if (!salvaPacco(id, Object.assign({}, pl, { iv: corpo.iv, dati: corpo.dati, agg: Date.now() }))) return false;
    aperte.testo = aperte.bozza = testo; aperte.agg = Date.now();
    avviso('Note unite: controlla il testo');
    return true;
  } catch (x) { avviso('Non riesco a unirle: scegli una delle due versioni'); return false; }
}
function salvaPacco(pgId, pacco) {
  const c = JSON.stringify(pacco);
  if (c.length > LIMITE_CAMPO - 500) { avviso("Le note sono troppo lunghe per una cella del foglio: accorciale un po'"); return false; }
  salva('voci', { id: pgId, privato: { v: 1, c } });
  return true;
}

// La sezione in fondo alla scheda. La vede chi la scrive (il personaggio scelto su questo telefono)
// e il Master; agli altri giocatori dice solo che le note esistono.
function sezioneNotePrivate(pg) {
  const mio = IMPOST.pg === pg.id;
  const master = !!IMPOST.master;
  const pacco = paccoNote(pg);
  if (!mio && !master && !pacco) return '';
  const id = esc(pg.id);
  let h = `<section class="sezione note-private"><h2>Note private</h2>`;
  if (!cifraturaPossibile()) return h + `<p class="fioco" style="margin-top:0">Le note cifrate si aprono solo dall'app pubblicata, quella con l'indirizzo https.</p></section>`;
  const aperte = NOTE_APERTE[pg.id];
  const chiaveM = cfg('chiaveNote', null);
  const conMaster = pacco && pacco.km && chiaveM && pacco.mk === chiaveM.id;
  if (aperte && pacco) {
    const solaLettura = aperte.master && !mio;
    h += `<p class="fioco piccolo" style="margin-top:0">${solaLettura ? `Le stai leggendo come Master: le scrive ${esc(pg.nome)}.` : "Aperte su questo telefono finché non le chiudi o chiudi l'app. Nel foglio arrivano solo cifrate."}</p>
      <textarea class="alto" data-a="tav-priv-testo" data-id="${id}" maxlength="${MAX_NOTE}" spellcheck="false" ${solaLettura ? 'readonly' : ''} placeholder="Segreti, obiettivi, quello che il personaggio sa e gli altri no">${esc(aperte.bozza !== undefined ? aperte.bozza : aperte.testo)}</textarea>
      <div class="azioni">${solaLettura ? '' : `<button class="btn btn--primario btn--piccolo" data-a="tav-priv-salva" data-id="${id}">${ico('check')}Salva</button>`}
      <button class="btn btn--piccolo" data-a="tav-priv-chiudi" data-id="${id}">${ico('nascosto')}Chiudi</button>
      ${mio && chiaveM && !conMaster ? `<button class="btn btn--testo btn--piccolo" data-a="tav-priv-condividi" data-id="${id}">Falle leggere al Master</button>` : ''}
      ${mio && pacco.km ? `<button class="btn btn--testo btn--piccolo" data-a="tav-priv-smetti" data-id="${id}">Non condividere più</button>` : ''}</div>`;
  } else if (pacco) {
    const quando = pacco.agg ? new Date(pacco.agg).toLocaleDateString('it-IT', { day: 'numeric', month: 'long' }) : '';
    const chi = pacco.km ? (conMaster ? `le leggono ${esc(pg.nome)} e il Master` : `condivise con una vecchia chiave del Master: ${esc(pg.nome)} deve condividerle di nuovo`) : `le legge solo ${esc(pg.nome)}`;
    h += `<p class="fioco" style="margin-top:0">Cifrate: ${chi}${quando ? '. Ultima modifica il ' + quando : ''}.</p><div class="azioni">` +
      (mio ? `<button class="btn btn--piccolo" data-a="tav-priv-apri" data-id="${id}">${ico('occhio')}Apri</button>` : '') +
      (master && conMaster ? `<button class="btn btn--piccolo" data-a="tav-priv-master" data-id="${id}">${ico('occhio')}Apri come Master</button>` : '') + '</div>';
  } else {
    h += `<p class="fioco" style="margin-top:0">Per i segreti del personaggio: le cifri qui con una frase che sai solo tu, e nel foglio del gruppo arrivano illeggibili. Se vuoi, le può leggere anche il Master.</p>
      <div class="azioni"><button class="btn btn--piccolo" data-a="tav-priv-crea" data-id="${id}">${ico('piu')}Crea le note private</button></div>`;
  }
  // la chiave del Master: si crea una volta, serve per leggere le note che i giocatori condividono
  if (master) {
    h += chiaveM ? `<p class="fioco piccolo">La tua chiave per le note è pronta${CHIAVE_MASTER_APERTA ? ' e sbloccata su questo telefono' : ''}. <button class="btn btn--testo btn--piccolo" data-a="tav-master-crea">Rifai la chiave</button></p>`
      : `<p class="fioco piccolo">Per leggere le note che i giocatori vorranno condividere con te, crea una volta la tua chiave. <button class="btn btn--testo btn--piccolo" data-a="tav-master-crea">Crea la chiave del Master</button></p>`;
  }
  return h + '</section>';
}

// Tutte le azioni delle note (tav-priv-* e tav-master-*): arrivano da azioneTavolo
async function azioneNotePrivate(a, el, form) {
  const val = n => { const x = form && form.querySelector(`[name="${n}"]`); return x ? x.value : ''; };
  const id = (el && el.dataset && el.dataset.id) || (form && form.dataset.id) || '';
  const pg = DB.voci[id];
  const pacco = paccoNote(pg);
  const chiaveM = cfg('chiaveNote', null);
  const foglioFrase = (titolo, azione, testo, doppia) => apriFoglio(`<div class="foglio-testa"><h2 class="t2">${titolo}</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>
    <form data-a="${azione}" data-id="${esc(id)}">${testo}
      <label class="campo"><span>Frase segreta</span><input type="password" name="frase" autocomplete="${doppia ? 'new-password' : 'current-password'}" required></label>
      ${doppia ? '<label class="campo"><span>Ripetila</span><input type="password" name="frase2" autocomplete="new-password" required></label>' : ''}
      <div class="foglio-piede"><button type="button" class="btn" data-a="chiudi">Annulla</button><button class="btn btn--primario" type="submit">${ico('check')}Avanti</button></div></form>`);
  // le note di un personaggio aperte con la chiave del Master
  const apriComeMaster = async () => {
    const grezza = new Uint8Array(await crypto.subtle.decrypt({ name: 'RSA-OAEP' }, CHIAVE_MASTER_APERTA, daBase64(pacco.km)));
    const k = await crypto.subtle.importKey('raw', grezza, 'AES-GCM', false, ['encrypt', 'decrypt']);
    const testo = new TextDecoder().decode(await decifraAes(k, pacco.iv, pacco.dati));
    NOTE_APERTE[id] = { k, grezza, kg: pacco.kg, testo, bozza: testo, master: true, agg: pacco.agg };
  };
  if (!cifraturaPossibile()) { avviso('Le note cifrate funzionano solo dall\'indirizzo https dell\'app'); return; }
  switch (a) {
    case 'tav-priv-testo':
      // mentre si scrive tengo la bozza in memoria: un ridisegno (arriva un aggiornamento) non deve perderla
      if (NOTE_APERTE[id]) NOTE_APERTE[id].bozza = el.value;
      return;
    case 'tav-priv-crea':
      foglioFrase('Note private', 'tav-priv-crea-salva', `<p class="fioco" style="margin-top:0">Scegli una frase che ricordi: senza, le note non si riaprono e nessuno può recuperarla.</p>
        <label class="interruttore"><span>Può leggerle anche il Master</span><input type="checkbox" name="master" ${chiaveM ? 'checked' : 'disabled'}></label>
        ${chiaveM ? '' : '<p class="fioco piccolo">Il Master non ha ancora creato la sua chiave: potrai condividerle più avanti.</p>'}`, true);
      return;
    case 'tav-priv-crea-salva': {
      const frase = val('frase');
      if (frase.length < 8) { avviso('Serve una frase di almeno 8 caratteri'); return; }
      if (frase !== val('frase2')) { avviso('Le due frasi non sono uguali'); return; }
      avviso('Preparo la cifratura…');
      const grezza = crypto.getRandomValues(new Uint8Array(32));
      const sale = crypto.getRandomValues(new Uint8Array(16));
      const chiusa = await cifraAes(await chiaveDaFrase(frase, sale), grezza);
      const k = await crypto.subtle.importKey('raw', grezza, 'AES-GCM', false, ['encrypt', 'decrypt']);
      const corpo = await cifraAes(k, new TextEncoder().encode(''));
      const nuovo = { sale: inBase64(sale), ivg: chiusa.iv, kg: chiusa.dati, iv: corpo.iv, dati: corpo.dati, agg: Date.now() };
      const box = form.querySelector('[name=master]');
      if (box && box.checked && chiaveM) Object.assign(nuovo, await perIlMaster(grezza, chiaveM));
      if (!salvaPacco(id, nuovo)) return;
      NOTE_APERTE[id] = { k, grezza, kg: nuovo.kg, testo: '', bozza: '', agg: nuovo.agg };
      chiudiFoglio();
      avviso('Note private pronte: scrivi e salva');
      break;
    }
    case 'tav-priv-apri':
      foglioFrase('Apri le note', 'tav-priv-apri-salva', '', false);
      return;
    case 'tav-priv-apri-salva': {
      if (!pacco) return;
      let grezza;
      try { grezza = await decifraAes(await chiaveDaFrase(val('frase'), daBase64(pacco.sale)), pacco.ivg, pacco.kg); }
      catch (x) { avviso('Frase sbagliata'); return; }
      const k = await crypto.subtle.importKey('raw', grezza, 'AES-GCM', false, ['encrypt', 'decrypt']);
      const testo = new TextDecoder().decode(await decifraAes(k, pacco.iv, pacco.dati));
      NOTE_APERTE[id] = { k, grezza, kg: pacco.kg, testo, bozza: testo, agg: pacco.agg };
      chiudiFoglio();
      break;
    }
    case 'tav-priv-salva': {
      const aperte = NOTE_APERTE[id];
      if (!aperte || !pacco) return;
      // ricreate su un altro telefono (frase nuova): la chiave che ho in mano non vale più
      if (pacco.kg !== aperte.kg) { delete NOTE_APERTE[id]; avviso('Le note sono state ricreate su un altro telefono: riaprile'); break; }
      const area = [...document.querySelectorAll('[data-a="tav-priv-testo"]')].find(t => t.dataset.id === id);
      let testo = area ? area.value : (aperte.bozza || '');
      // nel frattempo un altro dispositivo le ha salvate: non butto via le sue righe. Se ho solo aggiunto
      // in fondo, aggiungo in fondo alle sue; altrimenti metto le due versioni una dopo l'altra
      let unite = false;
      if (pacco.agg && aperte.agg && Number(pacco.agg) !== Number(aperte.agg)) {
        const suo = new TextDecoder().decode(await decifraAes(aperte.k, pacco.iv, pacco.dati));
        if (suo !== aperte.testo && suo !== testo) {
          testo = testo.indexOf(aperte.testo) === 0 ? suo + testo.slice(aperte.testo.length) : suo + '\n\n— da questo dispositivo —\n' + testo;
          unite = true;
        }
      }
      if (testo.length > MAX_NOTE) { avviso(`Al massimo ${MAX_NOTE} caratteri`); return; }
      const corpo = await cifraAes(aperte.k, new TextEncoder().encode(testo));
      const agg = Date.now();
      if (!salvaPacco(id, Object.assign({}, pacco, { iv: corpo.iv, dati: corpo.dati, agg }))) return;
      aperte.testo = aperte.bozza = testo; aperte.agg = agg;
      avviso(unite ? 'Le note erano cambiate su un altro dispositivo: le ho unite alle tue, controlla' : 'Note salvate, cifrate');
      break;
    }
    case 'tav-priv-chiudi': delete NOTE_APERTE[id]; break;
    case 'tav-priv-condividi': {
      const aperte = NOTE_APERTE[id];
      if (!aperte || !pacco || !chiaveM) return;
      if (!salvaPacco(id, Object.assign({}, pacco, await perIlMaster(aperte.grezza, chiaveM)))) return;
      avviso('Adesso le può leggere anche il Master');
      break;
    }
    case 'tav-priv-smetti': {
      // tolgo la copia della chiave per il Master: quello che ha già letto resta letto
      if (!pacco) return;
      const senza = Object.assign({}, pacco);
      delete senza.km; delete senza.mk;
      if (!salvaPacco(id, senza)) return;
      avviso('Il Master non potrà più aprirle');
      break;
    }
    case 'tav-priv-master': {
      if (!pacco || !pacco.km || !chiaveM || pacco.mk !== chiaveM.id) return;
      if (!CHIAVE_MASTER_APERTA) { foglioFrase('Chiave del Master', 'tav-master-apri-salva', '<p class="fioco" style="margin-top:0">La frase con cui hai creato la tua chiave. Resta sbloccata finché l\'app è aperta.</p>', false); return; }
      try { await apriComeMaster(); } catch (x) { avviso('Non riesco ad aprirle: forse sono state condivise con una chiave diversa'); return; }
      break;
    }
    case 'tav-master-apri-salva': {
      const priv = cfg('chiaveNote-privata', null);
      if (!priv) { avviso('Su questo telefono manca la chiave del Master: sincronizza e riprova'); return; }
      let pkcs8;
      try { pkcs8 = await decifraAes(await chiaveDaFrase(val('frase'), daBase64(priv.sale)), priv.iv, priv.dati); }
      catch (x) { avviso('Frase sbagliata'); return; }
      CHIAVE_MASTER_APERTA = await crypto.subtle.importKey('pkcs8', pkcs8, { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['decrypt']);
      chiudiFoglio();
      if (pacco && pacco.km) { try { await apriComeMaster(); } catch (x) { avviso('Non riesco ad aprirle: forse sono state condivise con una chiave diversa'); } }
      break;
    }
    case 'tav-master-crea':
      foglioFrase('Chiave del Master', 'tav-master-crea-salva', chiaveM
        ? '<p class="fioco" style="margin-top:0">Ne hai già una. Rifacendola, le note condivise con quella vecchia non le apri più finché i giocatori non le condividono di nuovo.</p>'
        : '<p class="fioco" style="margin-top:0">Serve una volta sola. I giocatori che vogliono ti fanno leggere le loro note private; tu le apri con questa frase.</p>', true);
      return;
    case 'tav-master-crea-salva': {
      const frase = val('frase');
      if (frase.length < 8) { avviso('Serve una frase di almeno 8 caratteri'); return; }
      if (frase !== val('frase2')) { avviso('Le due frasi non sono uguali'); return; }
      avviso('Creo la chiave…');
      const coppia = await crypto.subtle.generateKey({ name: 'RSA-OAEP', modulusLength: 3072, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' }, true, ['encrypt', 'decrypt']);
      const spki = await crypto.subtle.exportKey('spki', coppia.publicKey);
      const sale = crypto.getRandomValues(new Uint8Array(16));
      const chiusa = await cifraAes(await chiaveDaFrase(frase, sale), await crypto.subtle.exportKey('pkcs8', coppia.privateKey));
      // l'impronta della chiave pubblica: le note sanno con quale chiave sono state condivise
      const impronta = [...new Uint8Array(await crypto.subtle.digest('SHA-256', spki)).slice(0, 6)].map(b => b.toString(16).padStart(2, '0')).join('');
      setCfg('chiaveNote', { pub: inBase64(spki), id: impronta });
      salva('config', { id: 'chiaveNote-privata', valore: { sale: inBase64(sale), iv: chiusa.iv, dati: chiusa.dati, id: impronta }, segreto: 1 });
      CHIAVE_MASTER_APERTA = coppia.privateKey;
      chiudiFoglio();
      avviso('Chiave del Master pronta');
      break;
    }
  }
  render();
}

// =====================================================================
// 7. EVENTI E AVVIO
// ---------------------------------------------------------------------
// Un solo gestore per i clic: ogni elemento cliccabile ha data-a="azione"
// e qui uno switch decide cosa fare. Stessa cosa per i moduli (submit)
// e per i campi (change / input).
// =====================================================================
document.addEventListener('click', async e => {
  // menzione a qualcosa che non è ancora nel wiki: apro subito il modulo per crearla
  const ignota = e.target.closest('a.m--ignota');
  if (ignota) {
    e.preventDefault();
    const parti = ignota.getAttribute('href').split('/');
    apriEditor('voci', null, { nome: decodeURIComponent(parti[2] || ''), tipo: TIPI_VOCE[parti[3]] ? parti[3] : 'png' });
    return;
  }
  const el = e.target.closest('[data-a]');
  if (!el || el.matches('input, select, textarea, form')) return;
  const a = el.dataset.a;
  // gli strumenti della vista Al tavolo hanno il loro gestore (8-tavolo.js)
  if (a.indexOf('tav-') === 0) { await azioneTavolo(a, el, null); return; }
  switch (a) {
    case 'chiudi':
      // il "clic fantasma" che segue un tocco sulla mappa non deve richiudere il foglio appena aperto
      if (el.classList.contains('velo') && Date.now() - FOGLIO_APERTO_AL < 450) break;
      chiudiFoglio();
      break;
    case 'indietro': if (history.length > 1) history.back(); else location.hash = '#/home'; break;
    case 'sync': if (CONFLITTI.length) apriConflitti(); else sincronizza(true); break;
    case 'sync-ora': sincronizza(true); break;
    case 'conflitti': apriConflitti(); break;
    case 'conflitto': risolviConflitto(Number(el.dataset.i), el.dataset.scelta); break;

    // --- modifica dei dati ---
    case 'nuovo': apriEditor(el.dataset.tab, null, el.dataset.tipo ? { tipo: el.dataset.tipo } : null); break;
    case 'modifica': apriEditor(el.dataset.tab, el.dataset.id); break;
    case 'elimina': {
      const tab = el.dataset.tab, id = el.dataset.id, r = DB[tab][id];
      if (!r) break;
      const nome = r.nome || r.titolo || r.testo || 'questo elemento';
      const ok = await chiedi(`Eliminare "${nome}"?`, 'Sparisce per tutto il gruppo. Le menzioni nei testi restano come testo semplice.', 'Elimina', true);
      if (!ok) break;
      elimina(tab, id);
      MAPPA.sporca = true;
      if (tab === 'commercio') { render(); avviso('Eliminato'); break; }
      location.hash = { voci: '#/wiki', missioni: '#/missioni', sessioni: '#/diario' }[tab] || '#/home';
      avviso('Eliminato');
      break;
    }
    case 'mis-stato': {
      const m = DB.missioni[el.dataset.id], st = el.dataset.stato;
      if (!m) break;
      salva('missioni', { id: m.id, stato: st, chiusaIn: st === 'attiva' ? '' : (ultimaSessioneId() || '') });
      avviso(st === 'attiva' ? 'Missione riaperta' : 'Missione segnata come ' + STATI_MISSIONE[st].toLowerCase());
      MAPPA.sporca = true;
      render();
      break;
    }
    case 'rap': cambiaRapporto(el.dataset.pg, el.dataset.png, Number(el.dataset.d)); render(); break;
    // scorciatoie: PNG della guida incontrato, voce segreta rivelata o prevista stasera
    case 'incontrato': salva('voci', { id: el.dataset.id, guida: 0 }); avviso('Segnato come incontrato'); render(); break;
    case 'rivela': {
      const v = DB.voci[el.dataset.id];
      if (!v || !await chiedi('Rivelare "' + v.nome + '"?', 'Da adesso la vedono tutti, con la descrizione e la posizione sulla mappa. Se nella descrizione ci sono segreti, toglili prima.', 'Rivela')) break;
      salva('voci', { id: v.id, segreto: 0, previsto: 0 });
      MAPPA.sporca = true;
      avviso(v.nome + ' adesso è visibile a tutti');
      render();
      break;
    }
    case 'previsto': { const v = DB.voci[el.dataset.id]; if (v) { salva('voci', { id: v.id, previsto: v.previsto ? 0 : 1 }); render(); } break; }
    case 'rap-nota': apriNotaRapporto(el.dataset.pg, el.dataset.png); break;
    case 'fav-ok': {
      const r = DB.rapporti[el.dataset.rap];
      if (!r) break;
      const i = Number(el.dataset.i);
      salva('rapporti', { id: r.id, favori: (r.favori || []).map((f, k) => k === i ? Object.assign({}, f, { ok: f.ok ? 0 : 1 }) : f) });
      render();
      break;
    }
    case 'siamo-qui': {
      const id = el.dataset.id;
      const da = posizioneGruppo();
      setCfg('posizione', id, DB.voci[id] && DB.voci[id].demo);
      if (!(DB.voci[id] && DB.voci[id].demo)) aggiungiTappe([da, id]);
      avviso('Il gruppo ora è a ' + nomeDi(id));
      MAPPA.sporca = true;
      if (rotta().vista === 'mappa') { await mappaApri(MAPPA.id); mappaSeleziona(id, false); } else render();
      break;
    }
    case 'sugg': inserisciSuggerimento(el.dataset.nome); break;
    case 'ed-immagine-via': {
      const form = el.closest('form');
      form.querySelector('[name="immagine"]').value = '';
      form.querySelector('#anteprima-img').innerHTML = ico('immagine');
      el.remove();
      break;
    }

    // --- scheda del personaggio ---
    case 'liv': {
      // con due classi il tasto dice quale (data-c = 2 per la seconda); il livello totale resta al massimo 20
      const pg = DB.voci[el.dataset.id];
      const campo = el.dataset.c === '2' ? 'livello2' : 'livello';
      const d = Number(el.dataset.d);
      if (d > 0 && livelloTotale(pg) >= 20) break;
      salva('voci', { id: pg.id, [campo]: clamp((Number(pg[campo]) || 1) + d, 1, 20) });
      render();
      break;
    }
    case 'ris': {
      // tocco un rombo pieno = uso una carica; un rombo vuoto = la recupero
      const pg = DB.voci[el.dataset.id];
      const r = risorseDi(pg).find(x => x.id === el.dataset.r);
      if (!r) break;
      const usati = clamp(r.usati + (el.dataset.on === '1' ? 1 : -1), 0, r.max);
      salva('voci', { id: pg.id, risorse: Object.assign({}, pg.risorse || {}, { [r.id]: usati }) });
      render();
      break;
    }
    case 'riposo': {
      const pg = DB.voci[el.dataset.id];
      const lungo = el.dataset.tipo === 'lungo';
      const nuove = Object.assign({}, pg.risorse || {});
      const ris = risorseDi(pg);
      ris.forEach(r => { if (r.riposo === 'breve' || (lungo && r.riposo === 'lungo')) nuove[r.id] = 0; });
      // i Dadi Vita tornano con il riposo lungo: metà del totale, almeno uno. Con due classi i gruppi
      // sono due: recupero prima i dadi più grandi, che curano di più
      if (lungo) {
        const dadi = ris.filter(r => r.riposo === 'lungo-meta').sort((a, b) => (b.dado || 0) - (a.dado || 0));
        let quanti = Math.max(1, Math.floor(dadi.reduce((t, r) => t + r.max, 0) / 2));
        dadi.forEach(r => { const presi = Math.min(r.usati, quanti); nuove[r.id] = r.usati - presi; quanti -= presi; });
      }
      salva('voci', { id: pg.id, risorse: nuove });
      // gli oggetti del bottino che porta e che tornano "dopo un riposo lungo" (la verga del patto) si ricaricano con lui
      const oggetti = comm('bottino', o => o.portatore === pg.id).map(o => ricaricaOggetto(o, r => (lungo ? /riposo (lungo|breve)/i : /riposo breve/i).test(r))).filter(Boolean);
      avviso((lungo ? 'Riposo lungo: risorse ricaricate' : 'Riposo breve: ricaricate le risorse del riposo breve') + (oggetti.length ? '. ' + oggetti.join('; ') : ''));
      render();
      break;
    }
    case 'meta': {
      const pg = DB.voci[el.dataset.id];
      // contano solo le opzioni che la scheda mostra: le due di Tasha solo se accese tra le opzionali
      const tasha = (pg.opzionali || []).includes('tasha-metamagie');
      const scelte = (pg.metamagie || []).filter(k => REGOLE.metamagia.some(o => o.id === k && (!o.tasha || tasha)));
      const o = el.dataset.o;
      const max = valoriScheda(pg).nMetamagie;
      if (scelte.includes(o)) scelte.splice(scelte.indexOf(o), 1);
      else if (scelte.length >= max) { avviso(`Al tuo livello conosci ${max} opzioni: togline una prima`); break; }
      else scelte.push(o);
      salva('voci', { id: pg.id, metamagie: scelte });
      render();
      break;
    }
    case 'totem': {
      // l'animale del totem per quel livello (3 o 6). Toccare quello già scelto lo toglie:
      // lo segno vuoto invece di cancellarlo, così l'unione tra telefoni non lo fa ricomparire
      const pg = DB.voci[el.dataset.id];
      const totem = Object.assign({}, pg.totem && typeof pg.totem === 'object' ? pg.totem : {});
      totem[el.dataset.liv] = totem[el.dataset.liv] === el.dataset.t ? '' : el.dataset.t;
      salva('voci', { id: pg.id, totem });
      render();
      break;
    }
    case 'opz-tasha': {
      // capacità opzionali di Tasha accese o spente sulla scheda
      const pg = DB.voci[el.dataset.id];
      const accese = (pg.opzionali || []).filter(k => k !== el.dataset.o);
      if (accese.length === (pg.opzionali || []).length) accese.push(el.dataset.o);
      salva('voci', { id: pg.id, opzionali: accese });
      render();
      break;
    }
    case 'talento-togli': {
      const pg = DB.voci[el.dataset.id];
      salva('voci', { id: pg.id, talenti: (pg.talenti || []).filter(k => k !== el.dataset.t) });
      avviso('Talento tolto dalla scheda');
      render();
      break;
    }
    case 'dado-impulso': case 'dado-tabella': {
      const d100 = a === 'dado-tabella';
      mostraTiroImpulso(1 + Math.floor(Math.random() * (d100 ? 100 : 20)), d100);
      break;
    }
    case 'impulsi-elenco': apriElencoImpulsi(); break;
    case 'mappa-legenda': apriLegendaMappa(); break;
    case 'comm-legenda': apriLegendaCommercio(); break;
    case 'ritratto': {
      const v = DB.voci[el.dataset.id];
      if (v && v.immagine) apriFoglio(`<div class="foglio-testa"><h2 class="t2">${esc(v.nome)}</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>
        <figure class="ritratto-grande"><img src="${esc(v.immagine)}" alt="Ritratto di ${esc(v.nome)}">${v.ruolo ? `<figcaption>${esc(v.ruolo)}</figcaption>` : ''}</figure>`);
      break;
    }
    case 'tabella-impulsi': apriTabellaImpulsi(); break;
    case 'cap-nuova': apriNuovaCapacita(el.dataset.id); break;
    case 'cap-togli': {
      const pg = DB.voci[el.dataset.id];
      const i = Number(el.dataset.i);
      if (!await chiedi('Togliere la capacità?', `"${(pg.extra || [])[i].nome}" sparisce dalla scheda.`, 'Togli', true)) break;
      salva('voci', { id: pg.id, extra: (pg.extra || []).filter((x, k) => k !== i) });
      render();
      break;
    }

    // --- compagnia commerciale ---
    case 'comm-prepara': preparaCommercio(); break;
    case 'comm-slitta': apriCompraSlitta(); break;
    case 'comm-olio': aggiungiOlioDiBalena(); avviso("Aggiunto l'olio di balena tra le merci"); render(); break;
    case 'comm-regole': {
      const R = regoleCommercio();
      const campi = [['abilita', 'Bonus per ogni stella di esperienza'], ['scorta', 'Bonus della scorta armata'], ['costoScorta', 'Costo della scorta (mo)'], ['pericolo', 'Malus per ogni livello di pericolo'], ['neve', 'Neve (negativo)'], ['bufera', 'Bufera (negativo)'], ['danneggiato', 'Mezzo danneggiato (negativo)']];
      apriFoglio(`<div class="foglio-testa"><h2 class="t2">Numeri del tiro</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>
        <form data-a="comm-regole-salva">${campi.map(([k, l]) => `<label class="campo"><span>${l}</span><input type="number" name="${k}" value="${esc(R[k])}" step="0.5" inputmode="numeric"></label>`).join('')}
        <div class="foglio-piede"><button type="button" class="btn btn--testo" data-a="comm-regole-base">Valori iniziali</button><button type="button" class="btn" data-a="chiudi">Annulla</button><button class="btn btn--primario" type="submit">${ico('check')}Salva</button></div></form>`);
      break;
    }
    case 'comm-regole-base': setCfg('regoleCommercio', Object.assign({}, REGOLE_COMMERCIO_BASE)); chiudiFoglio(); render(); break;
    case 'sp-nuova': apriSpedizione(); break;
    case 'sp-risolvi': apriRisoluzione(el.dataset.id); break;
    case 'sp-tira': {
      // un attimo di suspense: il numero gira prima di fermarsi
      const box = document.getElementById('dado-grande');
      el.disabled = true;
      const fine = 1 + Math.floor(Math.random() * 100);
      const giri = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 14;
      let k = 0;
      const passo = () => {
        if (k++ < giri) { box.textContent = 1 + Math.floor(Math.random() * 100); setTimeout(passo, 35 + k * 9); }
        else { box.classList.add('fermo'); mostraEsito(el.dataset.id, fine); }
      };
      passo();
      break;
    }
    case 'sp-registra': {
      const seg = document.getElementById('sp-segreto');
      registraEsito(el.dataset.id, Number(el.dataset.dado), seg && seg.checked);
      break;
    }
    case 'sp-annulla':
      if (await chiedi('Annullare la spedizione?', 'Il viaggio sparisce come se non fosse mai partito.', 'Annulla la spedizione', true)) { elimina('commercio', el.dataset.id); render(); }
      break;
    case 'sp-rivela': {
      salva('commercio', { id: el.dataset.id, segreto: 0 });
      applicaEffetti(DB.commercio[el.dataset.id]);
      avviso('Esito rivelato al gruppo');
      render();
      break;
    }
    case 'cond-modifica': apriConducente(el.dataset.id || null); break;
    case 'cond-togli': salva('voci', { id: el.dataset.id, conducente: 0 }); chiudiFoglio(); render(); break;

    // --- taccuino della serata (condiviso: vedi azioneSerata in 5-importa.js) ---
    case 'tac-inizia': azioneSerata('inizia', el); break;
    case 'tac-termina': azioneSerata('termina', el); break;
    case 'tac-riprendi': azioneSerata('riprendi', el); break;
    case 'tac-registra': azioneSerata('registra', el); break;
    case 'tac-svuota': azioneSerata('svuota', el); break;
    case 'tac-togli': azioneSerata('togli', el); break;
    case 'tac-tipo': {
      await azioneSerata('segna', el);
      setTimeout(() => { const i = document.querySelector('.taccuino input'); if (i) i.focus(); }, 30);
      break;
    }

    // --- dati ---
    case 'demo-carica': caricaDemo(); break;
    case 'demo-rimuovi':
      if (await chiedi('Rimuovere i dati di esempio?', 'Tolgo le sessioni, le voci e la mappa di esempio. I vostri dati restano.', 'Rimuovi')) rimuoviDemo();
      break;
    case 'backup-esporta': {
      const blob = new Blob([JSON.stringify({ app: 'taverna', versione: VERSIONE, creato: new Date().toISOString(), db: DB }, null, 1)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'taverna-backup-' + oggiISO() + '.json';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 3000);
      break;
    }
    case 'svuota':
      if (await chiedi('Svuotare questo dispositivo?', 'Cancello tutti i dati salvati qui, comprese le modifiche non ancora inviate. Quello che è già sul foglio del gruppo torna alla prossima sincronizzazione.', 'Svuota', true)) {
        DB = vuotoDB(); OUTBOX = {}; BASI = {}; CONFLITTI = []; IMPOST.ultimoSync = 0; IDX = null;
        salvaLocaleSubito();
        MAPPA.sporca = true; MAPPA.caricata = false; MAPPA.id = null;
        location.hash = '#/home';
        render();
        sincronizza();
      }
      break;

    // --- import della sessione ---
    case 'imp-copia': {
      const testo = promptImport();
      const ok = await copiaTesto(testo);
      if (ok) avviso('Prompt copiato: incollalo in AI Studio insieme all\'audio');
      else apriFoglio(`<div class="foglio-testa"><h2 class="t2">Copia il prompt</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div><p class="fioco">Il browser non mi lascia copiare: seleziona tutto il testo e copialo a mano.</p><textarea readonly style="min-height:50vh;font-size:13px">${esc(testo)}</textarea>`);
      break;
    }
    case 'imp-schema': case 'imp-istruzioni': {
      // da incollare una volta sola in AI Studio (vedi GUIDA-AI-STUDIO.md)
      const testo = a === 'imp-schema' ? JSON.stringify(schemaAI(), null, 2) : istruzioniAI();
      if (await copiaTesto(testo)) avviso(a === 'imp-schema' ? 'Schema copiato: incollalo in Structured output → Edit' : 'Istruzioni copiate: incollale in System instructions');
      else apriFoglio(`<div class="foglio-testa"><h2 class="t2">Copia a mano</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div><textarea readonly style="min-height:50vh;font-size:13px">${esc(testo)}</textarea>`);
      break;
    }
    case 'rev-tutte': {
      const y = window.scrollY;
      IMPORT.tutte = !IMPORT.tutte;
      render(); window.scrollTo(0, y);
      break;
    }
    case 'imp-incolla':
      try {
        // con l'audio diviso in pezzi le risposte si incollano una dopo l'altra
        const nuovo = await navigator.clipboard.readText();
        IMPORT.risposta = IMPORT.risposta && IMPORT.risposta.trim() ? IMPORT.risposta.trim() + '\n\n' + nuovo : nuovo;
        try { localStorage.setItem('taverna.bozzaImport', IMPORT.risposta); } catch (x) { /* niente */ }
        render();
      } catch (x) { avviso('Il browser non mi lascia leggere gli appunti: incolla a mano nel riquadro'); }
      break;
    case 'imp-leggi': {
      const ta = document.querySelector('[data-a="imp-risposta"]');
      if (ta) IMPORT.risposta = ta.value;
      leggiRisposta();
      break;
    }
    case 'imp-annulla': IMPORT = nuovoImport(); clearTimeout(TIMER_BOZZA); try { localStorage.removeItem('taverna.bozzaImport'); localStorage.removeItem('taverna.bozzaRevisione'); } catch (x) { /* niente */ } render(); break;
    // --- correggere la revisione (1.7, vedi 5-importa.js) ---
    case 'rev-aggiungi': {
      const g = el.dataset.gruppo;
      IMPORT.proposte[g].push({ t: '', l: '', ok: true, motivo: '' });
      salvaBozzaRevisione();
      const y = window.scrollY; render(); window.scrollTo(0, y);
      const ta = document.querySelector(`[data-a="rev-testo"][data-gruppo="${g}"][data-i="${IMPORT.proposte[g].length - 1}"]`);
      if (ta) ta.focus();
      break;
    }
    case 'rev-stessa-apri': apriStessaVoce(el.dataset.gruppo, Number(el.dataset.i)); break;
    case 'rev-stessa': {
      const r = stessaVoce(el.dataset.gruppo, Number(el.dataset.i), el.dataset.id);
      chiudiFoglio();
      if (!r) break;
      salvaBozzaRevisione();
      render();
      const carta = document.getElementById('rev-' + el.dataset.gruppo + '-' + el.dataset.i);
      if (carta) carta.scrollIntoView({ block: 'center' });
      avviso(`${r.vecchio} è ${r.giusto}${r.menzioni ? ': ' + r.menzioni + (r.menzioni === 1 ? ' testo aggiornato' : ' testi aggiornati') : ''}`);
      break;
    }
    case 'rev-correzioni-incolla':
      try {
        const nuovo = await navigator.clipboard.readText();
        IMPORT.correzioni = IMPORT.correzioni && IMPORT.correzioni.trim() ? IMPORT.correzioni.trim() + '\n' + nuovo : nuovo;
        salvaBozzaRevisione();
        const y = window.scrollY; render(); window.scrollTo(0, y);
      } catch (x) { avviso('Il browser non mi lascia leggere gli appunti: incolla a mano nel riquadro'); }
      break;
    case 'rev-correzioni-applica': {
      // fatte tutte in una volta; nel riquadro restano solo quelle che non ho capito, così un secondo tocco
      // non le rifà (due "aggiungi la gesta" farebbero due gesta)
      const ta = document.querySelector('[data-a="rev-correzioni"]');
      if (ta) IMPORT.correzioni = ta.value;
      const esiti = applicaCorrezioni(IMPORT.correzioni);
      IMPORT.esitoCorrezioni = esiti;
      IMPORT.correzioni = esiti.filter(e => !e.ok).map(e => e.grezza).join('\n');
      salvaBozzaRevisione();
      const y = window.scrollY; render(); window.scrollTo(0, y);
      const fatte = esiti.filter(e => e.ok).length;
      avviso(!esiti.length ? 'Nessuna correzione nel riquadro' : fatte + (fatte === 1 ? ' correzione applicata' : ' correzioni applicate') + (esiti.length > fatte ? ', ' + (esiti.length - fatte) + ' da guardare' : ''));
      break;
    }
    case 'imp-wiki-copia': {
      const testo = wikiPerAI();
      if (await copiaTesto(testo)) avviso("Wiki copiato: incollalo nella chat dell'AI, o scaricalo come file per il progetto");
      else apriFoglio(`<div class="foglio-testa"><h2 class="t2">Il wiki per l'AI</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div><p class="fioco">Il browser non mi lascia copiare: seleziona tutto il testo e copialo a mano, oppure scaricalo.</p><textarea readonly style="min-height:50vh;font-size:13px">${esc(testo)}</textarea><div class="azioni"><button class="btn" data-a="imp-wiki-scarica">${ico('esporta')}Scarica come file</button></div>`);
      break;
    }
    case 'imp-wiki-scarica': scaricaTesto(wikiPerAI(), 'taverna-wiki-per-ai-' + oggiISO() + '.txt'); break;
    case 'imp-salva': applicaImport(); break;
    case 'annulla-import': annullaImport(el.dataset.id); break;

    // --- mappa ---
    case 'mappa-menu': mappaMenu(); break;
    case 'mappa-vai': document.getElementById('menu-mappa').hidden = true; location.hash = '#/mappa/' + encodeURIComponent(el.dataset.id); break;
    case 'mappa-nuova': { const menu = document.getElementById('menu-mappa'); if (menu) menu.hidden = true; apriNuovaMappa(el.dataset.luogo || null); break; }
    case 'mappa-rinomina': {
      document.getElementById('menu-mappa').hidden = true;
      const m = DB.mappe[MAPPA.id];
      if (!m) break;
      apriFoglio(`<div class="foglio-testa"><h2 class="t2">Rinomina la mappa</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>
        <form data-a="mappa-rinomina-salva"><label class="campo"><span>Nome</span><input type="text" name="nome" value="${esc(m.nome || '')}" required></label>
        <div class="foglio-piede"><button type="button" class="btn" data-a="chiudi">Annulla</button><button class="btn btn--primario" type="submit">${ico('check')}Salva</button></div></form>`);
      break;
    }
    case 'mappa-zoom': mappaZoom(Number(el.dataset.f)); break;
    case 'mappa-gruppo': {
      const pos = posizioneGruppo();
      const pin = pos ? antenatoSuMappa(pos, MAPPA.id) : null;
      if (pin) mappaSeleziona(pin.id, true);
      else if (pos && pinDiLuogo(pos)) location.hash = '#/mappa/' + encodeURIComponent(pinDiLuogo(pos).mappa) + '?luogo=' + encodeURIComponent(pos);
      else avviso(pos ? 'Il luogo in cui si trova il gruppo non è su nessuna mappa' : 'Non so ancora dove si trova il gruppo');
      break;
    }
    case 'mappa-chiudi-scheda': mappaSeleziona(null); break;
    case 'mappa-trova':
      document.getElementById('risultati').hidden = true;
      document.getElementById('mappa-cerca').value = '';
      document.getElementById('mappa-cerca').blur();
      mappaSeleziona(el.dataset.id, true);
      break;
    case 'mappa-neve': IMPOST.neve = !IMPOST.neve; salvaLocale('impost'); el.classList.toggle('on', IMPOST.neve); mappaNeve(); break;
    case 'mappa-percorso-azzera': azzeraPercorso(); avviso('Il percorso riparte da qui'); MAPPA.sporca = true; mappaCostruisciPin(); mappaDisegna(); document.getElementById('menu-mappa').hidden = true; break;
    case 'mappa-percorso': IMPOST.percorso = !IMPOST.percorso; salvaLocale('impost'); el.classList.toggle('on', IMPOST.percorso); mappaCostruisciPin(); mappaDisegna(); break;
    case 'carto': impostaCartografo(MAPPA.cartografo === true ? false : true); break;
    case 'carto-uno': impostaCartografo(MAPPA.cartografo === 'uno' ? false : 'uno'); break;
    case 'carto-esci': impostaCartografo(false); break;
    case 'pin-segreto': {
      const v = DB.voci[el.dataset.id];
      if (!v) break;
      salva('voci', { id: v.id, segreto: v.segreto ? 0 : 1 }, v.demo ? { locale: true } : {});
      avviso(v.segreto ? 'Ora lo vedono tutti' : 'Ora lo vedi solo tu');
      mappaCostruisciPin();
      mappaSeleziona(v.id, false);
      break;
    }
    case 'pin-togli':
      if (await chiedi('Togliere il segnaposto?', 'Il luogo resta nel wiki: sparisce solo dalla mappa.', 'Togli', true)) {
        salva('voci', { id: el.dataset.id, mappa: '', x: '', y: '' });
        mappaSeleziona(null);
        mappaCostruisciPin();
        mappaDisegna();
      }
      break;
  }
});

document.addEventListener('submit', e => {
  const f = e.target;
  e.preventDefault();
  if (f.classList.contains('editor')) { salvaEditor(f); return; }
  if ((f.dataset.a || '').indexOf('tav-') === 0) { azioneTavolo(f.dataset.a, f, f); return; }
  switch (f.dataset.a) {
    case 'tac-segna': {
      azioneSerata('segna', null).then(() => setTimeout(() => { const i = document.querySelector('.taccuino input'); if (i) i.focus(); }, 30));
      break;
    }
    case 'imp-collega': collega(f); break;
    case 'rap-salva': salvaNotaRapporto(f); break;
    case 'carto-salva': salvaNuovoPunto(f); break;
    case 'mappa-crea': creaMappa(f); break;
    case 'cap-salva': {
      const pg = DB.voci[f.dataset.id];
      const val = n => f.querySelector(`[name="${n}"]`).value.trim();
      if (!val('nome') || !val('testo')) { avviso('Servono nome e descrizione'); return; }
      const nuova = { id: Date.now().toString(36), nome: val('nome'), azione: val('azione'), testo: val('testo'), riposo: val('riposo') };
      if (Number(val('usi'))) nuova.usi = Number(val('usi'));
      salva('voci', { id: pg.id, extra: (pg.extra || []).concat([nuova]) });
      chiudiFoglio();
      render();
      break;
    }
    case 'pacchetto-importa': importaPacchetto(f); break;
    case 'dado-manuale': {
      // un numero tirato al tavolo: d20 da 1 a 20, d100 da 1 a 100
      const d100 = f.querySelector('[name="dado"]').value === '100';
      const n = Math.round(Number(f.querySelector('[name="n"]').value));
      if (!(n >= 1 && n <= (d100 ? 100 : 20))) { avviso(d100 ? 'Scrivi un numero da 1 a 100' : 'Scrivi un numero da 1 a 20'); break; }
      mostraTiroImpulso(n, d100);
      break;
    }
    case 'tabella-salva': setCfg('tabellaImpulsi', f.querySelector('[name="tabella"]').value.trim()); chiudiFoglio(); render(); break;
    case 'sp-salva': {
      const sp = leggiFormSpedizione(f);
      const mz = DB.commercio[sp.mezzo];
      if (mz && Number(mz.capacita) && sp.quantita > Number(mz.capacita)) { avviso(mz.nome + ' porta al massimo ' + mz.capacita + ' carichi'); return; }
      if (!sp.tratta || !sp.mezzo || !sp.conducente || !sp.merce) { avviso('Scegli tratta, mezzo, conducente e merce'); return; }
      salva('commercio', Object.assign(sp, { stato: 'in-viaggio', partenza: oggiISO() }));
      chiudiFoglio();
      avviso('Spedizione partita');
      render();
      break;
    }
    case 'sp-manuale': {
      const d = Number(f.querySelector('[name="dado"]').value);
      if (!(d >= 1 && d <= 100)) { avviso('Scrivi un numero da 1 a 100'); return; }
      mostraEsito(f.dataset.id, Math.round(d));
      break;
    }
    case 'cond-salva': salvaConducente(f); break;
    case 'comm-slitta-salva': if (compraSlitta(f)) { chiudiFoglio(); render(); } break;
    case 'comm-regole-salva': {
      const nuove = {};
      Object.keys(REGOLE_COMMERCIO_BASE).forEach(k => { const el = f.querySelector(`[name="${k}"]`); if (el && el.value !== '') nuove[k] = Number(el.value); });
      setCfg('regoleCommercio', nuove);
      chiudiFoglio();
      render();
      break;
    }
    case 'mappa-rinomina-salva': {
      const nome = f.querySelector('[name="nome"]').value.trim();
      const m = DB.mappe[MAPPA.id];
      if (nome && m) { salva('mappe', { id: m.id, nome }, m.demo ? { locale: true } : {}); mappaBriciole(); }
      chiudiFoglio();
      break;
    }
  }
});

document.addEventListener('change', async e => {
  const el = e.target;
  if ((el.dataset.a || '').indexOf('tav-') === 0) { azioneTavolo(el.dataset.a, el, el.form); return; }
  switch (el.dataset.a) {
    case 'ed-tipo': editorCambiaTipo(el.form, el.value); break;
    case 'ed-sintonia': sintoniaEditor(el.form, el.name); break;
    case 'talento-scegli': {
      // un talento scelto dal menu della scheda
      const pg = DB.voci[el.dataset.id];
      if (!el.value || (pg.talenti || []).includes(el.value)) break;
      salva('voci', { id: pg.id, talenti: (pg.talenti || []).concat(el.value) });
      render();
      break;
    }
    case 'ed-classe': {
      // mostro solo le sottoclassi della classe scelta (data-sotto: l'elenco della prima o della seconda classe)
      const sel = el.form.querySelector(`[name="${el.dataset.sotto || 'chiaveSotto'}"]`);
      [...sel.options].forEach(o => { if (o.dataset.classe) o.hidden = o.dataset.classe !== el.value; });
      if (sel.selectedOptions[0] && sel.selectedOptions[0].hidden) sel.value = '';
      break;
    }
    case 'sp-calcola': aggiornaAnteprimaSpedizione(); break;
    case 'imp-file': {
      // una risposta salvata in un file: va nel riquadro come se l'avessi incollata (anche più file, uno dopo l'altro)
      const file = el.files[0];
      if (!file) return;
      try {
        const nuovo = await file.text();
        IMPORT.risposta = IMPORT.risposta && IMPORT.risposta.trim() ? IMPORT.risposta.trim() + '\n\n' + nuovo : nuovo;
        try { localStorage.setItem('taverna.bozzaImport', IMPORT.risposta); } catch (x) { /* niente */ }
        render();
        avviso('File aperto: adesso premi "Leggi la risposta"');
      } catch (x) { avviso('Non riesco a leggere questo file'); }
      break;
    }
    case 'ed-immagine': {
      const file = el.files[0];
      if (!file) return;
      let canvas;
      try { ({ canvas } = await ridimensionaImmagine(file, 320, true, .82)); }
      catch (x) { avviso('Non riesco a usare questa immagine: ' + x.message); return; }
      // una cella del foglio Google tiene al massimo 50.000 caratteri: se serve abbasso la qualità
      let url = canvas.toDataURL('image/jpeg', .82);
      for (const q of [.72, .62, .5]) { if (url.length <= 40000) break; url = canvas.toDataURL('image/jpeg', q); }
      const form = el.closest('form');
      form.querySelector('[name="immagine"]').value = url;
      form.querySelector('#anteprima-img').innerHTML = `<img src="${url}" alt="">`;
      break;
    }
    case 'imp-pg': IMPOST.pg = el.value; salvaLocale('impost'); break;
    case 'imp-io': IMPOST.io = el.value.trim(); salvaLocale('impost'); break;
    case 'imp-campagna': setCfg('campagna', el.value.trim()); render(); break;
    case 'imp-master': setCfg('master', el.value.trim()); break;
    case 'imp-neve': IMPOST.neve = el.checked; salvaLocale('impost'); break;
    case 'imp-percorso': IMPOST.percorso = el.checked; salvaLocale('impost'); MAPPA.sporca = true; break;
    case 'backup-importa': {
      const file = el.files[0];
      if (!file) return;
      try {
        const j = JSON.parse(await file.text());
        if (!j.db) throw new Error('il file non è un backup di Taverna');
        // Prima il ripristino rimandava al foglio ogni campo diverso: un backup vecchio riportava indietro
        // le modifiche di tutto il gruppo. Adesso di base aggiungo solo quello che manca o che nel backup è più recente.
        const modo = await scegli('Ripristinare il backup?', 'Posso aggiungere solo quello che qui manca (o che nel backup è più recente), oppure riportare tutto com\'era nel backup: in quel caso le modifiche fatte dopo, anche dagli altri, tornano indietro per tutti.',
          [{ k: 'mancanti', l: 'Aggiungi solo quello che manca', primario: true }, { k: 'tutto', l: 'Riporta tutto com\'era nel backup' }]);
        if (!modo) return;
        let n = 0;
        TABELLE.forEach(t => Object.values(j.db[t] || {}).forEach(r => {
          const qui = DB[t][r.id];
          if (modo === 'mancanti' && qui && !qui.eliminato && String(qui.agg || '') >= String(r.agg || '')) return;
          const copia = normalizza(Object.assign({}, r));
          delete copia._ts; delete copia.agg; delete copia.autore;   // la firma la rimette salva()
          salva(t, copia, r.demo ? { locale: true } : {});
          n++;
        }));
        salvaLocaleSubito();
        MAPPA.sporca = true;
        avviso(n ? n + ' elementi ripristinati' : 'Niente da ripristinare: qui è già tutto aggiornato');
        render();
      } catch (x) { avviso('Backup non valido: ' + x.message); }
      break;
    }
    case 'pacchetto-file': {
      const file = el.files[0];
      el.value = '';
      if (file) await leggiPacchetto(file);
      break;
    }
    case 'mappa-immagine': {
      const file = el.files[0];
      if (!file || !MAPPA.id) return;
      document.getElementById('menu-mappa').hidden = true;
      try { await caricaImmagineMappa(MAPPA.id, file); }
      catch (x) { avviso('Non riesco a usare questa immagine: ' + x.message); return; }
      mappaApri(MAPPA.id);
      break;
    }
    case 'imp-numero': IMPORT.numero = Number(el.value) || prossimoNumero(); break;
    case 'imp-data': IMPORT.data = el.value; break;
    case 'imp-seg': IMPORT.segnalibri = el.checked; break;
    case 'imp-fisse': IMPOST.aiIstruzioni = el.checked ? VERSIONE_SCHEMA_AI : 0; salvaLocale('impost'); render(); break;
    case 'imp-pezzi': IMPORT.pezzi = Number(el.value) || 1; IMPORT.pezzo = Math.min(Number(IMPORT.pezzo) || 1, IMPORT.pezzi); render(); break;
    case 'imp-pezzo': IMPORT.pezzo = Number(el.value) || 1; render(); break;
    case 'rev-monete': IMPORT.proposte.monete = Math.round(Number(el.value) || 0); salvaBozzaRevisione(); break;
    case 'rev-azione': {
      const p = IMPORT.proposte[el.dataset.gruppo][Number(el.dataset.i)];
      if (el.value === 'crea' || el.value === 'salta') p.azione = el.value;
      else { p.azione = 'aggiorna'; p.bersaglio = el.value.slice(2); }
      salvaBozzaRevisione();
      render();
      break;
    }
    case 'rev-ok': {
      IMPORT.proposte[el.dataset.gruppo][Number(el.dataset.i)].ok = el.checked;
      const li = el.closest('.righe-rev > li');
      if (li) li.classList.toggle('fuori', !el.checked);
      salvaBozzaRevisione();
      break;
    }
    case 'rev-nome': {
      // il nome (o il titolo) di una proposta: le menzioni e i riferimenti lo seguono (rinominaProposta)
      const r = rinominaProposta(el.dataset.gruppo, Number(el.dataset.i), el.value);
      if (!r) { el.value = IMPORT.proposte[el.dataset.gruppo][Number(el.dataset.i)].dati[el.dataset.gruppo === 'voci' ? 'nome' : 'titolo']; break; }
      salvaBozzaRevisione();
      const y = window.scrollY; render(); window.scrollTo(0, y);
      avviso(`${r.vecchio} → ${r.nuovo}${r.menzioni ? ': ' + r.menzioni + (r.menzioni === 1 ? ' testo aggiornato' : ' testi aggiornati') : ''}${r.unita ? '. È già nel wiki: la aggiorno' : ''}${r.doppia ? '. Era già proposta con questo nome: ora sono una' : ''}`);
      break;
    }
  }
});

document.addEventListener('input', e => {

    case 'tav-priv-testo': if (NOTE_APERTE[el.dataset.id]) NOTE_APERTE[el.dataset.id].bozza = el.value; break;
    case 'wiki-cerca': {
      filtraWiki(el.value);
      const q = new URLSearchParams();
      const tipo = rotta().q.get('tipo');
      if (tipo) q.set('tipo', tipo);
      if (el.value) q.set('q', el.value);
      history.replaceState(null, '', '#/wiki' + (q.toString() ? '?' + q : ''));
      ROTTA_PRECEDENTE = location.hash;
      break;
    }
    case 'imp-risposta':
      IMPORT.risposta = el.value;
      try { localStorage.setItem('taverna.bozzaImport', el.value); } catch (x) { /* niente */ }
      break;
    case 'rev-sessione': IMPORT.proposte.sessione[el.dataset.k] = el.value; salvaBozzaRevisione(); break;

    case 'rev-correzioni': IMPORT.correzioni = el.value; salvaBozzaRevisione(); break;
    case 'rev-stessa-cerca': {

      document.querySelectorAll('.scelta-wiki > li').forEach(li => { li.hidden = !!n && !li.dataset.cerca.includes(n); });
