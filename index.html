// ---------------------------------------------------------------------
// WIKI: elenco delle voci con ricerca e filtri per tipo
// ---------------------------------------------------------------------
function vistaWiki(tipo, q) {
  const I = indice();
  const filtri = [['', 'Tutti'], ['png', 'PNG'], ['luogo', 'Luoghi'], ['fazione', 'Fazioni'], ['oggetto', 'Oggetti'], ['pg', 'Compagnia']];
  const voci = elenco('voci', v => !tipo || v.tipo === tipo)
    .sort((a, b) => (I.ultimaVolta[b.id] || 0) - (I.ultimaVolta[a.id] || 0) || String(a.nome).localeCompare(String(b.nome), 'it'));
  let h = `<div class="testa-vista"><h1 class="t1">Wiki</h1><div class="azioni">
    <button class="btn btn--primario btn--piccolo" data-a="nuovo" data-tab="voci" data-tipo="${esc(tipo || 'png')}">${ico('piu')}Nuova voce</button></div></div>
    <div class="cerca">${ico('cerca')}<input type="search" placeholder="Cerca per nome, ruolo o soprannome" data-a="wiki-cerca" value="${esc(q)}" aria-label="Cerca nel wiki"></div>
    <nav class="filtri">${filtri.map(([k, l]) => `<a href="#/wiki${k ? '?tipo=' + k : ''}" class="${tipo === k ? 'attivo' : ''}">${l}</a>`).join('')}</nav>`;
  if (!voci.length) return h + '<p class="vuoto">Nessuna voce qui. Le voci nascono dall\'import delle sessioni, dalle menzioni nei testi oppure con "Nuova voce".</p>';
  h += '<ul class="lista" id="lista-wiki">' + voci.map(v => {
    const ult = I.ultimaVolta[v.id];
    const dove = v.tipo !== 'luogo' && v.luogo ? nomeDi(v.luogo) : '';
    // se il ruolo cita già il luogo ("Anziana di Good Mead") non lo ripeto
    const sub = [v.ruolo, dove && !norm(v.ruolo).includes(norm(dove)) ? dove : ''].filter(Boolean).join(', ') || (v.tipo === 'luogo' ? (ICONE_LUOGO[v.icona] || 'Luogo') : (TIPI_VOCE[v.tipo] || TIPI_VOCE.png).nome);
    const cerca = norm([v.nome, v.ruolo, (v.alias || []).join(' '), dove, v.classe].join(' '));
    return `<li data-cerca="${esc(cerca)}"><a class="riga" href="#/voce/${encodeURIComponent(v.id)}">${sigillo(v)}<div class="corpo">
      <div class="tit tronca">${esc(v.nome)}${v.stato === 'morto' ? ' <span class="fioco piccolo">morto</span>' : ''}${v.segreto ? ' <span class="fioco piccolo">segreto</span>' : ''}${v.guida && !ult && v.tipo !== 'luogo' ? ' <span class="da-incontrare">da incontrare</span>' : ''}</div>
      <div class="sub tronca">${esc(sub)}</div></div>${ult ? `<span class="ultima" title="Ultima apparizione: sessione ${ult}">${ult}</span>` : ''}</a></li>`;
  }).join('') + '</ul><p class="vuoto" id="wiki-nessuno" hidden>Nessuna voce corrisponde alla ricerca.</p>';
  return h;
}
function filtraWiki(q) {
  const n = norm(q);
  let visibili = 0;
  document.querySelectorAll('#lista-wiki > li').forEach(li => {
    const ok = !n || li.dataset.cerca.includes(n);
    li.hidden = !ok;
    if (ok) visibili++;
  });
  const vuoto = document.getElementById('wiki-nessuno');
  if (vuoto) vuoto.hidden = visibili > 0;
}

// ---------------------------------------------------------------------
// SCHEDA DI UNA VOCE: PNG, luogo, fazione, oggetto o membro della compagnia
// ---------------------------------------------------------------------
function vistaVoce(id) {
  const v = DB.voci[id];
  if (!visibile(v)) return nonTrovato('Questa voce non esiste più.');
  const I = indice();
  const t = TIPI_VOCE[v.tipo] || TIPI_VOCE.png;
  const luogo = v.luogo ? (risolvi(v.luogo, 'luogo') || v.luogo) : null;
  const sopra = v.tipo === 'luogo' ? (ICONE_LUOGO[v.icona] || 'Luogo') : v.tipo === 'pg' ? 'Della compagnia' : t.nome;
  let h = `<header class="intestazione">${sigillo(v, 'sigillo--grande')}<div class="corpo">
    <p class="sopra">${esc(sopra)}${v.segreto ? ', visibile solo al Master' : ''}</p>
    <h1 class="t1">${esc(v.nome)}</h1>
    ${v.ruolo ? `<p class="sotto">${esc(v.ruolo)}</p>` : ''}
    ${(v.alias || []).length ? `<p class="sotto piccolo">Detto anche ${v.alias.map(esc).join(', ')}</p>` : ''}</div></header>`;

  // Fatti rapidi: stato, dove si trova, classe e livello
  const chips = [];
  if (v.stato && v.stato !== 'vivo') chips.push(`<span class="chip" style="--tc:var(--cera)">${ico(v.stato === 'morto' ? 'teschio' : 'occhio')}${esc(STATI_PNG[v.stato] || v.stato)}</span>`);
  if (luogo) chips.push(chipVoce(luogo));
  if (v.tipo === 'pg' && (v.classe || v.livello)) chips.push(`<span class="chip t-persona">${ico('pg')}${esc([v.classe, v.livello ? 'livello ' + v.livello : ''].filter(Boolean).join(', '))}</span>`);
  if (v.tipo === 'pg' && v.giocatore) chips.push(`<span class="chip">Giocata da ${esc(v.giocatore)}</span>`);
  if (chips.length) h += `<div class="chips" style="margin-top:18px">${chips.join('')}</div>`;

  if (['png', 'fazione'].includes(v.tipo) && v.atteggiamento !== undefined && v.atteggiamento !== '') {
    h += `<div style="display:flex;align-items:center;gap:12px;margin-top:16px"><span class="fioco">Verso il gruppo</span>${scala(v.atteggiamento, 2)}<strong style="font-weight:700">${esc(ATTEGGIAMENTI[v.atteggiamento] || '')}</strong></div>`;
  }
  if (v.tipo === 'pg') {
    h += `<div class="azioni"><a class="btn btn--primario btn--piccolo" href="#/scheda/${encodeURIComponent(id)}">${ico('scheda')}Apri la scheda</a>${v.link ? `<a class="btn btn--piccolo" href="${esc(v.link)}" target="_blank" rel="noopener">${ico('esterno')}D&amp;D Beyond</a>` : ''}</div>`;
  }
  if (v.guida && !(I.sessioniDi[id] || []).length) {
    h += `<p class="nota-guida">${ico('diario')}Dalla guida della valle: non l'avete ancora incontrato. Compare nel diario appena lo citate in una sessione.</p>`;
  }
  if (v.descrizione) h += `<section class="sezione"><div class="lettura">${testoRicco(v.descrizione)}</div></section>`;

  // Luoghi: chi ci trovi, luoghi interni, mappa
  if (v.tipo === 'luogo') {
    // anche chi sta nei luoghi interni (le locande di una città)
    const abitanti = [id].concat(discendenti(id)).reduce((a, x) => a.concat(I.abitanti[x] || []), []).map(x => DB.voci[x]).filter(x => visibile(x));
    const figli = (I.figli[id] || []).map(x => DB.voci[x]).filter(Boolean);
    const pinMappa = pinDiLuogo(id);
    const azioni = [];
    if (pinMappa) azioni.push(`<a class="btn btn--primario btn--piccolo" href="#/mappa/${encodeURIComponent(pinMappa.mappa)}?luogo=${encodeURIComponent(id)}">${ico('mappa')}Mostra sulla mappa</a>`);
    if (v.mappaInterna && DB.mappe[v.mappaInterna] && visibile(DB.mappe[v.mappaInterna])) azioni.push(`<a class="btn btn--piccolo" href="#/mappa/${encodeURIComponent(v.mappaInterna)}">${ico('entra')}Apri la mappa interna</a>`);
    if (posizioneGruppo() !== id) azioni.push(`<button class="btn btn--piccolo" data-a="siamo-qui" data-id="${esc(id)}">${ico('lanterna')}Il gruppo è qui</button>`);
    if (azioni.length) h += `<div class="azioni">${azioni.join('')}</div>`;
    const incontrati = abitanti.filter(a => !a.guida || (I.sessioniDi[a.id] || []).length);
    const daIncontrare = abitanti.filter(a => a.guida && !(I.sessioniDi[a.id] || []).length);
    if (incontrati.length) h += `<section class="sezione"><h2>Chi trovi qui <span class="conta">${incontrati.length}</span></h2><ul class="lista">${incontrati.map(rigaVoce).join('')}</ul></section>`;
    if (daIncontrare.length) h += `<section class="sezione"><h2>Chi potreste incontrare <span class="conta">${daIncontrare.length}</span></h2><ul class="lista lista-guida">${daIncontrare.map(rigaVoce).join('')}</ul></section>`;
    if (figli.length) h += `<section class="sezione"><h2>Luoghi interni</h2><div class="chips">${figli.map(f => chipVoce(f.id)).join('')}</div></section>`;
    const eventi = (I.eventiIn[id] || []).slice().sort((a, b) => (b.n || 0) - (a.n || 0));
    if (eventi.length) h += `<section class="sezione"><h2>Cosa abbiamo fatto qui</h2><ul class="storia">${eventi.map(e =>
      `<li><a class="n" href="#/sessione/${encodeURIComponent(e.s)}">${esc(e.n)}</a><div class="t">${testoRicco(e.t, 'riga')}</div></li>`).join('')}</ul></section>`;
  }

  // Rapporti tra ogni membro della compagnia e questo PNG (o fazione)
  if (['png', 'fazione'].includes(v.tipo)) {
    const pgs = elenco('voci', x => x.tipo === 'pg');
    h += `<section class="sezione"><h2>Con la compagnia</h2>`;
    if (!pgs.length) h += '<p class="vuoto">Aggiungi i personaggi della compagnia nel wiki (tipo "Compagno") per tenere traccia dei rapporti con ciascuno.</p>';
    pgs.forEach(pg => {
      const rid = pg.id + '__' + id;
      const r = DB.rapporti[rid] && visibile(DB.rapporti[rid]) ? DB.rapporti[rid] : { valore: 0, favori: [] };
      const val = Number(r.valore) || 0;
      h += `<div class="rapporto"><div class="alto">${sigillo(pg, 'sigillo--piccolo')}<div class="nome"><div>${esc(pg.nome)}</div><div class="valore">${scala(val, 3)}<span>${esc(RAPPORTI[val])}</span></div></div>
        <button class="btn-icona" data-a="rap" data-pg="${esc(pg.id)}" data-png="${esc(id)}" data-d="-1" aria-label="Peggiora il rapporto">${ico('meno')}</button>
        <button class="btn-icona" data-a="rap" data-pg="${esc(pg.id)}" data-png="${esc(id)}" data-d="1" aria-label="Migliora il rapporto">${ico('piu')}</button>
        <button class="btn-icona" data-a="rap-nota" data-pg="${esc(pg.id)}" data-png="${esc(id)}" aria-label="Aggiungi favore o nota">${ico('segna')}</button></div>
        ${listaFavori(r, rid)}</div>`;
    });
    h += '</section>';
  }
  // Scheda di un compagno: i suoi rapporti
  if (v.tipo === 'pg') {
    const rap = elenco('rapporti', r => r.pg === id && DB.voci[r.png] && visibile(DB.voci[r.png])).sort((a, b) => Math.abs(b.valore || 0) - Math.abs(a.valore || 0));
    h += `<section class="sezione"><h2>I suoi rapporti</h2>`;
    h += rap.length ? '<ul class="lista">' + rap.map(r => {
      const png = DB.voci[r.png];
      const aperti = (r.favori || []).filter(f => !f.ok && f.tipo !== 'nota').length;
      return `<li><a class="riga" href="#/voce/${encodeURIComponent(png.id)}">${sigillo(png, 'sigillo--piccolo')}<div class="corpo"><div class="tit">${esc(png.nome)}</div><div class="sub">${esc(RAPPORTI[Number(r.valore) || 0])}${aperti ? ', ' + aperti + (aperti === 1 ? ' favore in sospeso' : ' favori in sospeso') : ''}</div></div>${scala(r.valore, 3)}</a></li>`;
    }).join('') + '</ul>' : '<p class="vuoto">Nessun rapporto registrato. Si aggiornano dalla scheda dei PNG o dall\'import.</p>';
    h += '</section>';
  }

  // Missioni collegate (come committente o come luogo)
  const missioni = (I.missioniDi[id] || []).map(x => DB.missioni[x]).filter(m => visibile(m));
  if (missioni.length) h += `<section class="sezione"><h2>Missioni</h2>${missioni.map(rigaMissione).join('')}</section>`;

  // Cronologia: righe di storia scritte nell'import + sessioni in cui è citata
  const righe = [];
  (v.storia || []).forEach(x => { const s = DB.sessioni[x.s]; if (x.t) righe.push({ s: s && visibile(s) ? s : null, t: x.t }); });
  (I.sessioniDi[id] || []).forEach(sid => {
    if (righe.some(r => r.s && r.s.id === sid)) return;
    const s = DB.sessioni[sid];
    if (s) righe.push({ s, t: null });
  });
  righe.sort((a, b) => ((b.s && b.s.numero) || 0) - ((a.s && a.s.numero) || 0));
  if (righe.length) {
    h += `<section class="sezione"><h2>Cronologia</h2><ul class="storia">${righe.map(r =>
      `<li>${r.s ? `<a class="n" href="#/sessione/${encodeURIComponent(r.s.id)}">${esc(r.s.numero)}</a>` : '<span class="n"></span>'}<div class="t">${r.t ? testoRicco(r.t, 'riga') : 'Compare in <a href="#/sessione/' + encodeURIComponent(r.s.id) + '">' + esc(r.s.titolo) + '</a>'}</div></li>`).join('')}</ul></section>`;
  }

  h += `<div class="azioni" style="margin-top:34px">
    <button class="btn" data-a="modifica" data-tab="voci" data-id="${esc(id)}">${ico('modifica')}Modifica</button>
    <button class="btn btn--pericolo" data-a="elimina" data-tab="voci" data-id="${esc(id)}">${ico('elimina')}Elimina</button></div>`;
  return h;
}
function rigaVoce(v) {
  return `<li><a class="riga" href="#/voce/${encodeURIComponent(v.id)}">${sigillo(v)}<div class="corpo"><div class="tit tronca">${esc(v.nome)}</div><div class="sub tronca">${esc(v.ruolo || (TIPI_VOCE[v.tipo] || TIPI_VOCE.png).nome)}</div></div></a></li>`;
}
function listaFavori(r, rid) {
  const fav = r.favori || [];
  if (!fav.length) return '';
  return '<ul class="favori">' + fav.map((f, i) => {
    const s = DB.sessioni[f.s];
    return `<li class="${f.ok ? 'saldato' : ''}"><span class="tipo">${esc(TIPI_FAVORE[f.tipo] || 'Nota')}</span><span style="flex:1">${testoRicco(f.t, 'riga')}${s && visibile(s) ? ` <span class="fioco piccolo">(sessione ${esc(s.numero)})</span>` : ''}</span>
      ${f.tipo !== 'nota' ? `<button class="btn btn--testo btn--piccolo" data-a="fav-ok" data-rap="${esc(rid)}" data-i="${i}">${f.ok ? 'Riapri' : 'Saldato'}</button>` : ''}</li>`;
  }).join('') + '</ul>';
}

// Ritaglio della mappa centrato sul gruppo, per la home.
// Uso le unità cqw (larghezza del contenitore) per centrare il punto senza misurare nulla in JS.
async function riempiMiniMappa(el) {
  const pin = pinDiLuogo(el.dataset.luogo);
  if (!pin) { el.closest('.dove-mappa').style.display = 'none'; return; }
  const mappa = DB.mappe[pin.mappa];
  const url = await urlImmagineMappa(mappa);
  if (!url || !el.isConnected) { if (!url) el.closest('.dove-mappa').style.display = 'none'; return; }
  let w = mappa.w, h = mappa.h;
  if (!w || !h) {
    const img = new Image(); img.src = url;
    try { await img.decode(); w = img.naturalWidth; h = img.naturalHeight; } catch (e) { return; }
  }
  const zoom = 330;                       // l'immagine è larga 3,3 volte il riquadro
  const r = h / w;
  el.style.backgroundImage = `url("${url}")`;
  el.style.backgroundSize = zoom + 'cqw auto';
  el.style.backgroundPosition = `calc(50% - ${((pin.x - .5) * zoom).toFixed(2)}cqw) calc(50% - ${((pin.y - .5) * zoom * r).toFixed(2)}cqw)`;
  el.classList.add('pronta');
}

function apriEditor(tab, id, preset) {
  const rec = id ? Object.assign({}, DB[tab][id]) : Object.assign({}, preset || {});
  if (tab === 'commercio' && !id) Object.assign(rec, PREDEFINITI_COMMERCIO[rec.tipo] || {}, preset || {}, rec.tipo === 'movimento' ? { data: oggiISO() } : {});
  if (tab === 'voci' && !TIPI_VOCE[rec.tipo]) rec.tipo = 'png';
  if (tab === 'sessioni' && !id) { rec.numero = rec.numero || prossimoNumero(); rec.data = rec.data || oggiISO(); }
  if (tab === 'missioni' && !rec.stato) rec.stato = 'attiva';
  if (tab === 'voci' && rec.tipo === 'luogo' && !rec.icona) rec.icona = 'citta';
  const titoli = { voci: id ? 'Modifica voce' : 'Nuova voce', missioni: id ? 'Modifica missione' : 'Nuova missione', sessioni: id ? 'Modifica sessione' : 'Nuova sessione', commercio: (TITOLI_COMMERCIO[rec.tipo] || ['Nuovo', 'Modifica'])[id ? 1 : 0] };
  const schema = schemaDi(tab, rec.tipo);
  const puoSegreti = IMPOST.master || !IMPOST.url;
  const nomiVoci = elenco('voci').map(v => `<option value="${esc(v.nome)}">`).join('');

  let h = `<div class="foglio-testa"><h2 class="t2">${titoli[tab]}</h2><button type="button" class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>

          <div class="azioni" style="margin:0"><label class="btn btn--piccolo">${ico('immagine')}Scegli<input type="file" accept="image/*" data-a="ed-immagine" hidden></label>

function salvaEditor(form) {
  const tab = form.dataset.tab;
  const id = form.dataset.id || null;
  const prima = id ? DB[tab][id] : null;
  const rec = id ? { id } : {};
  const schema = schemaDi(tab, form.dataset.tipo);
  if (tab === 'voci') rec.tipo = (form.querySelector('[name="tipo"]:checked') || {}).value || 'png';
  if (tab === 'commercio') rec.tipo = form.dataset.tipo;
  for (const blocco of form.querySelectorAll('[data-i]')) {
    if (blocco.hidden) continue;
    const c = schema[Number(blocco.dataset.i)];
    if (c.t === 'tipo') continue;
    const el = blocco.querySelector(`[name="${c.k}"]`);
    switch (c.t) {
      case 'testo': case 'data': case 'ricco': case 'scelta':
        rec[c.k] = el.value.trim();
        break;
      case 'numero':
        rec[c.k] = el.value === '' ? '' : Number(el.value);
        break;
      case 'lista':
        rec[c.k] = el.value.split(',').map(s => s.trim()).filter(Boolean);
        break;
      case 'rif': {
        // salvo l'id se il nome corrisponde a una voce, altrimenti il nome così com'è
        const n = el.value.trim();
        rec[c.k] = n ? (risolviNome(n, c.k === 'luogo' ? 'luogo' : null) || n) : '';
        break;
      }
      case 'atteggiamento': {
        const sel = blocco.querySelector('[name="atteggiamento"]:checked');
        rec[c.k] = sel && sel.value !== '' ? Number(sel.value) : '';
        break;
      }
      case 'presenti':
        rec[c.k] = [...blocco.querySelectorAll('[name="presenti"]:checked')].map(x => x.value);
        break;
      case 'eventi':
        rec[c.k] = el.value.split('\n').map(s => s.trim()).filter(Boolean).map(t => {
          // il primo luogo citato con # lega l'evento a quel luogo
          let l = '';
          t.replace(RE_MENZIONE, (x, sig, nb, nn) => { if (!l && sig === '#') l = risolviNome(nb || nn, 'luogo') || (nb || nn); return x; });
          const vecchio = (prima && prima.eventi || []).find(e => e.t === t);
          return { t, l: l || (vecchio ? vecchio.l : '') };
        });
        break;
      case 'citazioni':
        rec[c.k] = el.value.split('\n').map(s => s.trim()).filter(Boolean).map(r => {
          const m = r.match(/^([^:]{1,40}):\s*(.+)$/);
          return m ? { chi: m[1].trim(), testo: m[2].trim() } : { chi: '', testo: r };
        });
        break;
      case 'immagine':
        rec[c.k] = el.value;
        break;
      case 'segreto':
        rec[c.k] = el.checked ? 1 : 0;
        break;
      case 'regole': {
        const q = n => blocco.querySelector(`[name="${n}"]`);
        rec.chiaveClasse = q('chiaveClasse').value;
        const opt = q('chiaveSotto').selectedOptions[0];
        rec.chiaveSotto = opt && opt.dataset.classe === rec.chiaveClasse ? q('chiaveSotto').value : '';
        rec.chiaveRazza = q('chiaveRazza').value;
        rec.razza = rec.chiaveRazza ? REGOLE.razze[rec.chiaveRazza].nome : q('razza').value.trim();
        // nel foglio resta anche la classe scritta per esteso, comoda da leggere
        rec.classe = rec.chiaveClasse ? descrizioneClasse({ chiaveClasse: rec.chiaveClasse, chiaveSotto: rec.chiaveSotto }) : q('classe').value.trim();
        const car = {};
        Object.keys(CARATTERISTICHE).forEach(k => { const val = q('car-' + k).value; if (val !== '') car[k] = Number(val); });
        rec.car = car;
        break;
      }
    }
  }
  // Controlli minimi
  const obblig = tab === 'voci' ? 'nome' : tab === 'commercio' ? (schema.find(c => c.obblig) || {}).k : 'titolo';
  if (obblig && !rec[obblig]) {
    avviso('Manca: ' + ((schema.find(c => c.k === obblig) || {}).l || obblig).toLowerCase());
    const campo = form.querySelector(`[name="${obblig}"]`); if (campo) campo.focus();
    return;
  }
  if (tab === 'commercio') {
    salva('commercio', rec);
    chiudiFoglio();
    avviso('Salvato');
    render();
    return;
  }
  if (tab === 'voci') {
    const doppione = elenco('voci', v => v.id !== id && norm(v.nome) === norm(rec.nome))[0];
    if (doppione && !id) { avviso(`Esiste già "${doppione.nome}": aprila e modificala`); return; }
    // se cambio nome, il vecchio resta come alias: le menzioni già scritte continuano a funzionare
    if (prima && prima.nome && norm(prima.nome) !== norm(rec.nome)) {
      rec.alias = Array.from(new Set([].concat(rec.alias || [], prima.nome)));
    }
  }
  if (tab === 'missioni' && prima && (prima.stato || 'attiva') !== rec.stato) {
    rec.chiusaIn = rec.stato === 'attiva' ? '' : (ultimaSessioneId() || '');
  }
  if (tab === 'missioni' && !id) rec.apertaIn = ultimaSessioneId() || '';
  const salvato = salva(tab, rec);
  chiudiFoglio();
  avviso('Salvato');
  const dest = { voci: '#/voce/', missioni: '#/missione/', sessioni: '#/sessione/' }[tab] + encodeURIComponent(salvato.id);
  if (location.hash !== dest) location.hash = dest; else render();
  if (MAPPA.montata) MAPPA.sporca = true;
}
function ultimaSessioneId() {
  const s = indice().sessioni;
  return s.length ? s[s.length - 1].id : null;
}

function suggerisci(ta) {
  const box = document.getElementById('suggerimenti');
  const pos = ta.selectionStart;
  const prima = ta.value.slice(0, pos);
  const m = prima.match(/(?:^|[\s(])([@#])(\[?)([^\]\n@#]{0,30})$/);
  if (!m) { box.hidden = true; return; }
  const sig = m[1], q = norm(m[3]);
  const cand = elenco('voci', v => (sig === '#' ? v.tipo === 'luogo' : true) &&
      (!q || norm(v.nome).includes(q) || (v.alias || []).some(a => norm(a).includes(q))))
    .sort((a, b) => (norm(a.nome).startsWith(q) ? 0 : 1) - (norm(b.nome).startsWith(q) ? 0 : 1) || a.nome.localeCompare(b.nome, 'it'))
    .slice(0, 6);
  if (!cand.length) { box.hidden = true; return; }
  box.innerHTML = cand.map(v => `<button type="button" data-a="sugg" data-nome="${esc(v.nome)}" class="t-${classeDi(v)}">${ico(iconaVoce(v))}<span>${esc(v.nome)}</span><small>${esc(v.ruolo || TIPI_VOCE[v.tipo].nome)}</small></button>`).join('');
  box.dataset.inizio = String(pos - (1 + m[2].length + m[3].length));
  box.dataset.fine = String(pos);
  box.dataset.sig = sig;
  box._ta = ta;
  // sotto il campo se c'è spazio, altrimenti sopra
  const r = ta.getBoundingClientRect();
  box.hidden = false;
  const alto = box.offsetHeight;
  const sotto = r.bottom + 6 + alto < window.innerHeight;
  box.style.left = Math.max(8, r.left) + 'px';
  box.style.width = Math.min(r.width, window.innerWidth - 16) + 'px';
  box.style.top = (sotto ? r.bottom + 6 : Math.max(8, r.top - alto - 6)) + 'px';
}
function inserisciSuggerimento(nome) {
  const box = document.getElementById('suggerimenti');
  const ta = box._ta;
  if (!ta) return;
  const inizio = Number(box.dataset.inizio), fine = Number(box.dataset.fine);
  const testo = (box.dataset.sig || '@') + (/\s/.test(nome) ? '[' + nome + ']' : nome) + ' ';
  ta.value = ta.value.slice(0, inizio) + testo + ta.value.slice(fine);
  const caret = inizio + testo.length;
  ta.focus();
  ta.setSelectionRange(caret, caret);
  box.hidden = true;
}

// Coordinate: ogni luogo ha x,y tra 0 e 1 (frazione dell'immagine), così
// i segnaposto restano al loro posto anche se si cambia la risoluzione.
// Lo schermo si ottiene così:  schermo = mondo * s + t
//   mondo = coordinate in pixel dell'immagine originale (w x h)
//   s     = scala dello zoom, tx/ty = spostamento
// L'immagine viene disegnata su un canvas grande quanto lo schermo: a ogni
// fotogramma disegno solo la parte visibile, scegliendo una versione già
// ridotta dell'immagine (metà, un quarto...) adatta allo zoom. Così quando
// si allontana non compaiono riquadri vuoti e il disegno resta pulito.
// Segnaposto, percorso e nomi stanno in uno strato "a schermo" sopra il
// canvas: restano nitidi e sempre della stessa grandezza.

// Il primo luogo, risalendo da id verso i "contenitori", che ha un segnaposto sulla mappa indicata
function antenatoSuMappa(id, mapId) {
  let v = DB.voci[id];
  for (let giri = 0; v && giri < 12; giri++) {
    if (visibile(v) && v.mappa === mapId && v.x !== undefined && v.x !== '') return v;
    const p = risolvi(v.luogo, 'luogo');
    if (!p || p === v.id) break;

// Un segnaposto per questo luogo su qualsiasi mappa (il luogo stesso o il primo contenitore che ce l'ha)
function pinDiLuogo(id) {
  let v = DB.voci[id];
  for (let giri = 0; v && giri < 12; giri++) {
    if (visibile(v) && v.mappa && DB.mappe[v.mappa] && visibile(DB.mappe[v.mappa]) && v.x !== undefined && v.x !== '') return { id: v.id, mappa: v.mappa, x: Number(v.x), y: Number(v.y) };
    const p = risolvi(v.luogo, 'luogo');

// Tutti i luoghi contenuti (anche indirettamente) in un luogo
function discendenti(id) {
  const I = indice();
  const out = [], coda = [id];
  while (coda.length && out.length < 300) {
    const x = coda.shift();
    (I.figli[x] || []).forEach(f => { if (!out.includes(f) && f !== id) { out.push(f); coda.push(f); } });
  }
  return out;
}
function missioniQui(id) {
  const I = indice();
  const ids = [id].concat(discendenti(id));
  const out = [];
  ids.forEach(x => (I.missioniDi[x] || []).forEach(mid => {
    const m = DB.missioni[mid];
    if (visibile(m) && (m.stato || 'attiva') === 'attiva' && !out.includes(m)) out.push(m);
  }));
  return out;
}

// ---------------------------------------------------------------------
// Immagini delle mappe: cache locale in IndexedDB, originale sul Drive
// ---------------------------------------------------------------------
async function urlImmagineMappa(m) {
  if (!m) return null;
  if (m.demo) {
    if (!URL_MAPPE.demo) URL_MAPPE.demo = await immagineDemo();
    return URL_MAPPE.demo;
  }
  const chiavi = [];
  if (m.fileId) chiavi.push('file:' + m.fileId);
  chiavi.push('locale:' + m.id);
  for (const k of chiavi) {
    if (URL_MAPPE[k]) return URL_MAPPE[k];
    try {
      const b = await idb('get', k);
      if (b) { URL_MAPPE[k] = URL.createObjectURL(b); return URL_MAPPE[k]; }
    } catch (e) { /* IndexedDB non disponibile: provo il server */ }
  }
  if (m.fileId && IMPOST.url && IMPOST.chiave) {
    try {
      const r = await chiamaServer({ azione: 'immagine', fileId: m.fileId }, 120000);
      const bin = atob(r.base64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      const b = new Blob([arr], { type: r.mime || 'image/jpeg' });
      try { await idb('put', 'file:' + m.fileId, b); } catch (e) { /* niente cache, pazienza */ }
      URL_MAPPE['file:' + m.fileId] = URL.createObjectURL(b);
      return URL_MAPPE['file:' + m.fileId];
    } catch (e) {
      console.warn('Immagine della mappa non scaricata', e);
    }
  }
  return null;
}

// Prepara l'immagine per il disegno: la versione intera e copie dimezzate fino a ~900 px.
// Tengo in memoria le ultime due mappe aperte (passare da una città alla valle è immediato).
const CACHE_LIVELLI = new Map();
function livelliImmagine(url) {
  if (CACHE_LIVELLI.has(url)) {
    const p = CACHE_LIVELLI.get(url);
    CACHE_LIVELLI.delete(url); CACHE_LIVELLI.set(url, p);   // la segno come usata di recente
    return p;
  }
  const p = (async () => {
    const img = new Image();
    img.src = url;
    try { await img.decode(); } catch (e) { /* se decode fallisce controllo comunque le dimensioni */ }
    if (!img.naturalWidth) return null;
    const livelli = [];
    let base;
    try { base = await createImageBitmap(img); } catch (e) { base = img; }
    livelli.push({ src: base, w: img.naturalWidth, h: img.naturalHeight });
    let w = img.naturalWidth, h = img.naturalHeight;
    while (w > 900) {
      w = Math.round(w / 2); h = Math.round(h / 2);
      const prec = livelli[livelli.length - 1].src;
      let ridotta;
      try { ridotta = await createImageBitmap(prec, { resizeWidth: w, resizeHeight: h, resizeQuality: 'high' }); }
      catch (e) {
        ridotta = document.createElement('canvas');
        ridotta.width = w; ridotta.height = h;
        const g = ridotta.getContext('2d');
        g.imageSmoothingQuality = 'high';
        g.drawImage(prec, 0, 0, w, h);
      }
      livelli.push({ src: ridotta, w, h });
    }
    return livelli;
  })();
  CACHE_LIVELLI.set(url, p);
  while (CACHE_LIVELLI.size > 2) {
    const [k, vecchio] = CACHE_LIVELLI.entries().next().value;
    CACHE_LIVELLI.delete(k);
    vecchio.then(l => (l || []).forEach(x => { if (x.src.close) x.src.close(); }));
  }
  return p;
}

// Carica l'immagine di una mappa: la riduco a 4096 px di lato, la tengo qui e la mando sul Drive del gruppo.
// pronta = { w, h } quando l'immagine è già della misura giusta (pacchetti): niente ricompressione e niente avvisi.
// Restituisce true se l'immagine è arrivata sul Drive.
async function caricaImmagineMappa(mapId, file, pronta) {
  const muto = !!pronta;
  if (!muto) avviso("Preparo l'immagine…");
  const { blob, w, h } = pronta ? { blob: file, w: pronta.w, h: pronta.h } : await ridimensionaImmagine(file, 4096, false, .85);
  // la tengo subito in memoria: così si vede anche dove IndexedDB non è disponibile
  URL_MAPPE['locale:' + mapId] = URL.createObjectURL(blob);
  try { await idb('put', 'locale:' + mapId, blob); } catch (e) { console.warn('Immagine non salvata in IndexedDB', e); }
  const m = DB.mappe[mapId];
  const vecchio = m && m.fileId ? m.fileId : '';   // l'immagine precedente sul Drive, da cestinare
  salva('mappe', { id: mapId, w, h, fileId: '' }, m && m.demo ? { locale: true } : {});
  let sulDrive = false;
  if (IMPOST.url && IMPOST.chiave && !(m && m.demo)) {
    try {
      if (!muto) avviso('Invio la mappa al Drive del gruppo…');
      const b64 = await blobInBase64(blob);
      const r = await chiamaServer({ azione: 'caricaImmagine', nome: (m && m.nome ? m.nome : mapId) + '.jpg', mime: 'image/jpeg', base64: b64, vecchio }, 180000);
      URL_MAPPE['file:' + r.fileId] = URL_MAPPE['locale:' + mapId];
      try { await idb('put', 'file:' + r.fileId, blob); } catch (e) { /* resta la copia in memoria */ }
      salva('mappe', { id: mapId, fileId: r.fileId });
      sulDrive = true;
      if (!muto) avviso('Mappa condivisa con il gruppo');
    } catch (e) {
      if (!muto) avviso('Mappa salvata qui, ma non sul Drive: ' + e.message);
    }
  } else if (!muto) {
    avviso('Mappa salvata su questo dispositivo');
  }
  if (m && m.demo) { // una mappa di esempio con un'immagine vera non è più "di esempio" solo per l'immagine
    URL_MAPPE.demo = URL.createObjectURL(blob);
  }
  MAPPA.sporca = true;
  MAPPA.caricata = false;
  return sulDrive;
}

// ---------------------------------------------------------------------
// Apertura della mappa (o cambio mappa)
// ---------------------------------------------------------------------
async function mappaApri(mapId, luogoFocus) {
  if (!MAPPA.montata) mappaMonta();
  const idFocus = luogoFocus ? risolvi(luogoFocus, 'luogo') : null;
  if (!mapId && idFocus) { const p = pinDiLuogo(idFocus); if (p) mapId = p.mappa; }
  // dalla barra in basso torno sull'ultima mappa guardata, non sempre su quella principale
  if (!mapId && MAPPA.id && DB.mappe[MAPPA.id] && visibile(DB.mappe[MAPPA.id])) mapId = MAPPA.id;
  if (!mapId || !DB.mappe[mapId] || !visibile(DB.mappe[mapId])) mapId = mappaPrincipale();
  const cambiata = mapId !== MAPPA.id;
  if (cambiata && MAPPA.id && MAPPA.caricata) salvaVista();
  if (cambiata) { MAPPA.caricata = false; mappaSeleziona(null); document.getElementById('menu-mappa').hidden = true; }
  MAPPA.id = mapId;
  mappaBriciole();
  const m = mapId ? DB.mappe[mapId] : null;
  if (!m) { mappaVuota('nessuna'); mappaNeve(); return; }

  if (!MAPPA.caricata || MAPPA.sporca) {
    const token = ++MAPPA.token;
    const url = await urlImmagineMappa(m);
    if (token !== MAPPA.token) return;     // nel frattempo è partita un'altra apertura
    if (!url) { mappaVuota('immagine', m); mappaNeve(); return; }
    const livelli = await livelliImmagine(url);
    if (token !== MAPPA.token) return;
    if (!livelli) { mappaVuota('immagine', m); mappaNeve(); return; }
    document.getElementById('mappa-vuota').hidden = true;
    MAPPA.livelli = livelli;
    MAPPA.w = livelli[0].w;
    MAPPA.h = livelli[0].h;
    MAPPA.etichette = m.etichette || [];   // nomi delle regioni (solo sulla mappa di esempio)
    mappaMisura(false);
    if (!MAPPA.caricata) {
      const v = MAPPA.viste[mapId];
      if (v) { MAPPA.s = v.s; MAPPA.tx = v.tx; MAPPA.ty = v.ty; }
      else {
        // Prima apertura: inquadro tutti i segnaposto, senza avvicinarmi più di "copri".
        // Il centro può essere fissato dalla mappa (cx, cy); senza segnaposto parto dal centro dell'immagine.
        const pts = elenco('voci', v => v.tipo === 'luogo' && v.mappa === mapId && v.x !== undefined && v.x !== '').map(v => [Number(v.x), Number(v.y)]);
        let cx = .5, cy = .5, s = MAPPA.sCopri;
        if (pts.length > 1) {
          const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
          const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
          cx = (x0 + x1) / 2; cy = (y0 + y1) / 2;
          // margine per i nomi dei segnaposto e per i comandi sopra e sotto
          s = clamp(Math.min(MAPPA.W * .78 / Math.max(1, (x1 - x0) * MAPPA.w), MAPPA.H * .66 / Math.max(1, (y1 - y0) * MAPPA.h)), MAPPA.sMin, MAPPA.sCopri);
        }
        if (m.cx !== undefined && m.cx !== '') cx = Number(m.cx);
        if (m.cy !== undefined && m.cy !== '') cy = Number(m.cy);
        const mw = MAPPA.w * s, mh = MAPPA.h * s;
        MAPPA.s = s;
        MAPPA.tx = MAPPA.W / 2 - cx * mw;
        MAPPA.ty = MAPPA.H / 2 - cy * mh;
        // all'apertura niente bordi vuoti da un lato solo: se l'immagine è più piccola dello schermo la centro
        MAPPA.tx = mw >= MAPPA.W ? clamp(MAPPA.tx, MAPPA.W - mw, 0) : (MAPPA.W - mw) / 2;
        MAPPA.ty = mh >= MAPPA.H ? clamp(MAPPA.ty, MAPPA.H - mh, 0) : (MAPPA.H - mh) / 2;
      }
      mappaLimita();
    }
    MAPPA.caricata = true;
    mappaCostruisciPin();
    if (MAPPA.sel) {
      if (MAPPA.pins.some(p => p.v.id === MAPPA.sel)) document.getElementById('scheda-mappa').innerHTML = mappaSchedaHTML(MAPPA.sel);
      else mappaSeleziona(null);
    }
  }
  mappaNeve();
  mappaDisegna();

  if (idFocus) {
    const pin = antenatoSuMappa(idFocus, mapId);
    if (pin) setTimeout(() => mappaSeleziona(pin.id, true), 60);
    MAPPA.primaVolta = false;
  } else if (MAPPA.primaVolta && !MAPPA.viste[mapId]) {
    // Il momento d'apertura: si parte dalla valle intera e si scende sul gruppo
    MAPPA.primaVolta = false;
    const pg = MAPPA.gruppoPin;
    if (pg) {
      MAPPA.s = MAPPA.sMin * 1.05;
      MAPPA.tx = (MAPPA.W - MAPPA.w * MAPPA.s) / 2;
      MAPPA.ty = (MAPPA.H - MAPPA.h * MAPPA.s) / 2;
      mappaLimita();
      mappaDisegna();
      setTimeout(() => {
        const s = clamp(MAPPA.sCopri * 1.35, MAPPA.sMin, MAPPA.sMax);
        mappaAnima(s, MAPPA.W / 2 - pg.x * MAPPA.w * s, MAPPA.H / 2 - pg.y * MAPPA.h * s, 1500);
      }, 250);
    }
  }
}

// Calcolo delle scale: "copri" riempie lo schermo, "min" mostra tutta la mappa
function mappaMisura(mantieniCentro) {
  const palco = document.getElementById('palco');
  const W0 = MAPPA.W, H0 = MAPPA.H;
  MAPPA.W = palco.clientWidth;
  MAPPA.H = palco.clientHeight;
  // canvas in pixel reali dello schermo (al massimo il doppio, per non pesare sui telefoni)
  const tela = document.getElementById('mappa-tela');
  MAPPA.dpr = Math.min(2, window.devicePixelRatio || 1);
  const cw = Math.round(MAPPA.W * MAPPA.dpr), ch = Math.round(MAPPA.H * MAPPA.dpr);
  if (tela && (tela.width !== cw || tela.height !== ch)) { tela.width = cw; tela.height = ch; }
  if (!MAPPA.w || !MAPPA.W) return;
  const contieni = Math.min(MAPPA.W / MAPPA.w, MAPPA.H / MAPPA.h);
  const copri = Math.max(MAPPA.W / MAPPA.w, MAPPA.H / MAPPA.h);
  MAPPA.sCopri = Math.min(copri, contieni * 3.2);
  MAPPA.sMin = contieni * .86;
  MAPPA.sMax = Math.max(MAPPA.sCopri * 7, 2.5);
  if (mantieniCentro && W0) {
    MAPPA.tx += (MAPPA.W - W0) / 2;
    MAPPA.ty += (MAPPA.H - H0) / 2;
    mappaLimita();
  }
}
// Impedisce di trascinare la mappa troppo fuori dallo schermo
function mappaLimitiT(s, tx, ty) {
  const W = MAPPA.W, H = MAPPA.H, mw = MAPPA.w * s, mh = MAPPA.h * s;
  const mx = W * .38, my = H * .38;
  // quando la mappa diventa più piccola dello schermo il margine si stringe fino a centrarla
  const sx = mx * clamp((mw / W - .6) / .4, 0, 1), sy = my * clamp((mh / H - .6) / .4, 0, 1);
  tx = mw <= W ? clamp(tx, (W - mw) / 2 - sx, (W - mw) / 2 + sx) : clamp(tx, W - mw - mx, mx);
  ty = mh <= H ? clamp(ty, (H - mh) / 2 - sy, (H - mh) / 2 + sy) : clamp(ty, H - mh - my, my);
  return [tx, ty];
}
function mappaLimita() {
  MAPPA.s = clamp(MAPPA.s, MAPPA.sMin, MAPPA.sMax);
  [MAPPA.tx, MAPPA.ty] = mappaLimitiT(MAPPA.s, MAPPA.tx, MAPPA.ty);
}
function salvaVista() { if (MAPPA.id) MAPPA.viste[MAPPA.id] = { s: MAPPA.s, tx: MAPPA.tx, ty: MAPPA.ty }; }
function mappaRichiedi() { if (!MAPPA.raf) MAPPA.raf = requestAnimationFrame(mappaDisegna); }

// ---------------------------------------------------------------------
// Segnaposto, marcatore del gruppo e percorso
// ---------------------------------------------------------------------
function mappaCostruisciPin() {
  const strato = document.getElementById('strato-pin');
  const I = indice();
  // luoghi visitati: tutti quelli del percorso, più i loro "contenitori"
  const visitati = new Set();
  const seq = percorsoGruppo();
  seq.forEach(p => {
    let v = DB.voci[p.id];
    for (let g = 0; v && g < 12; g++) { visitati.add(v.id); const su = risolvi(v.luogo, 'luogo'); if (!su || su === v.id) break; v = DB.voci[su]; }
  });
  const luoghi = elenco('voci', v => v.tipo === 'luogo' && v.mappa === MAPPA.id && v.x !== undefined && v.x !== '');
  // Sulle mappe del manuale (nomiStampati) i luoghi del pacchetto sono già disegnati e scritti sull'immagine:
  // il loro segnaposto diventa un anello attorno al punto stampato e il nome compare solo se lo tocchi.
  // I luoghi aggiunti da voi restano medaglioni con il nome, come sulle altre mappe.
  const mappaStampata = !!(DB.mappe[MAPPA.id] && DB.mappe[MAPPA.id].nomiStampati);
  MAPPA.pins = luoghi.map(v => {
    const imp = IMPORTANZA[v.icona] || 2;
    const stampato = mappaStampata && !!v.pacchetto;
    const nMissioni = missioniQui(v.id).length;
    const visitato = visitati.has(v.id) || v.scoperta === 'visitato';
    const el = document.createElement('button');
    el.type = 'button';
    el.className = ['pin', imp === 3 ? 'pin--minore' : '', stampato ? 'pin--stampato' : '', visitato ? '' : 'pin--noto', v.segreto ? 'pin--segreto' : '', MAPPA.sel === v.id ? 'sel' : ''].join(' ').replace(/\s+/g, ' ').trim();
    el.dataset.id = v.id;
    el.setAttribute('aria-label', v.nome + (nMissioni ? ', ' + nMissioni + ' missioni in corso' : ''));
    el.innerHTML = `<span class="pin-med">${ico(iconaVoce(v))}</span><span class="pin-nome">${esc(v.nome)}</span>${nMissioni ? `<span class="badge">${nMissioni}</span>` : ''}`;
    return { v, el, x: Number(v.x), y: Number(v.y), imp, stampato, lw: 0, ordine: (MAPPA.sel === v.id ? 0 : imp) * 10 - Math.min(9, (I.sessioniDi[v.id] || []).length) };
  });
  // il gruppo: segnalino a forma di lanterna sopra il segnaposto del luogo in cui si trova
  const pos = posizioneGruppo();
  MAPPA.gruppoPin = pos ? (p => p && MAPPA.pins.find(x => x.v.id === p.id))(antenatoSuMappa(pos, MAPPA.id)) || null : null;
  MAPPA.gruppoEl = document.createElement('div');
  MAPPA.gruppoEl.className = 'gruppo';
  MAPPA.gruppoEl.hidden = !MAPPA.gruppoPin;
  MAPPA.gruppoEl.innerHTML = `<span class="gruppo-alone"></span><span class="gruppo-lanterna" title="Il gruppo è qui">${ico('lanterna')}</span>`;
  strato.replaceChildren(...MAPPA.pins.map(p => p.el), MAPPA.gruppoEl);
  // misuro i nomi una volta sola, servono per evitare sovrapposizioni
  MAPPA.pins.forEach(p => { p.lw = p.el.querySelector('.pin-nome').offsetWidth || p.v.nome.length * 8; });
  MAPPA.ordinati = MAPPA.pins.slice().sort((a, b) => a.ordine - b.ordine);
  // percorso: sequenza dei segnaposto toccati, senza ripetere due volte di fila lo stesso
  MAPPA.traccia = [];
  if (IMPOST.percorso) {
    seq.forEach(p => {
      const a = antenatoSuMappa(p.id, MAPPA.id);
      if (!a) return;
      const pin = MAPPA.pins.find(x => x.v.id === a.id);
      if (pin && MAPPA.traccia[MAPPA.traccia.length - 1] !== pin) MAPPA.traccia.push(pin);
    });
  }
  MAPPA.sporca = false;
}

function mappaDisegna() {
  MAPPA.raf = 0;
  const { s, tx, ty, w, h } = MAPPA;
  const tela = document.getElementById('mappa-tela');
  const g = tela.getContext('2d');
  const dpr = MAPPA.dpr || 1;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, tela.width, tela.height);
  if (MAPPA.livelli && w) {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    // il livello più piccolo che basta per la grandezza a schermo (i livelli vanno dal più grande al più piccolo)
    const serve = w * s * dpr;
    let liv = MAPPA.livelli[0];
    MAPPA.livelli.forEach(l => { if (l.w >= serve) liv = l; });
    // solo la parte visibile, in coordinate della mappa
    const x0 = Math.max(0, -tx / s), y0 = Math.max(0, -ty / s);
    const x1 = Math.min(w, (MAPPA.W - tx) / s), y1 = Math.min(h, (MAPPA.H - ty) / s);
    if (x1 > x0 && y1 > y0) {
      const k = liv.w / w;
      g.imageSmoothingEnabled = true;
      g.imageSmoothingQuality = 'high';
      g.drawImage(liv.src, x0 * k, y0 * k, (x1 - x0) * k, (y1 - y0) * k, tx + x0 * s, ty + y0 * s, (x1 - x0) * s, (y1 - y0) * s);
    }
    g.strokeStyle = 'rgba(236,230,214,.16)';
    g.lineWidth = 1;
    g.strokeRect(tx - .5, ty - .5, w * s + 1, h * s + 1);
    // nomi delle regioni: scalano con la mappa, come le scritte vere
    (MAPPA.etichette || []).forEach(e => {
      const fs = (e.fs || 46) * s;
      if (fs < 7) return;
      g.save();
      g.translate(tx + e.x * w * s, ty + e.y * h * s);
      if (e.rot) g.rotate(e.rot * Math.PI / 180);
      g.font = `italic 400 ${fs.toFixed(1)}px 'IM Fell English', Georgia, serif`;
      if ('letterSpacing' in g) g.letterSpacing = (fs * .2).toFixed(1) + 'px';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.shadowColor = 'rgba(14,21,28,.95)';
      g.shadowBlur = 9 * dpr;
      g.fillStyle = 'rgba(236,230,214,.52)';
      g.fillText(e.t, 0, 0);
      g.restore();
    });
  }
  const rel = s / MAPPA.sCopri;
  // da lontano i segnaposto si rimpiccioliscono e quelli minori spariscono
  document.getElementById('palco').classList.toggle('lontano', rel < .75);
  // posizioni a schermo
  MAPPA.pins.forEach(p => {
    p.el.hidden = p.imp === 3 && rel < .6 && p.v.id !== MAPPA.sel;
    p.px = tx + p.x * w * s;
    p.py = ty + p.y * h * s;
    p.el.style.transform = `translate(${p.px.toFixed(1)}px,${p.py.toFixed(1)}px)`;
  });
  // nomi: prima i più importanti; un nome che si sovrapporrebbe a uno già messo resta nascosto
  const occupati = [];
  (MAPPA.ordinati || []).forEach(p => {
    const sel = p.v.id === MAPPA.sel;
    // il nome di un luogo già scritto sull'immagine compare solo quando lo tocchi
    let mostra = sel || (!p.stampato && (p.imp === 1 || (p.imp === 2 && rel >= .9) || (p.imp === 3 && rel >= 1.7)));
    if (mostra) {
      const x0 = p.px - p.lw / 2 - 3, y0 = p.py + (p.imp === 3 ? 14 : 19), box = [x0, y0, x0 + p.lw + 6, y0 + 17];
      if (!sel && occupati.some(b => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])) mostra = false;
      else occupati.push(box);
    }
    p.el.classList.toggle('senza-nome', !mostra);
  });
  if (MAPPA.gruppoEl && MAPPA.gruppoPin) {
    MAPPA.gruppoEl.style.transform = `translate(${MAPPA.gruppoPin.px.toFixed(1)}px,${MAPPA.gruppoPin.py.toFixed(1)}px)`;
  }
  // percorso del gruppo: curva morbida e tratteggiata tra i luoghi toccati
  const svg = document.getElementById('tracce');
  const pts = MAPPA.traccia.map(p => [p.px, p.py]);
  const d = pts.length > 1 ? curvaMorbida(pts, false) : '';
  svg.querySelector('.via').setAttribute('d', d);
  svg.querySelector('.via-ombra').setAttribute('d', d);
  svg.querySelector('g').innerHTML = pts.length > 1 ? pts.map(q => `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.2"/>`).join('') : '';
}

// Curva che passa per tutti i punti (Catmull-Rom convertita in Bézier)
function curvaMorbida(p, chiusa) {
  const n = p.length;
  if (n < 2) return '';
  const g = i => chiusa ? p[(i + n) % n] : p[Math.max(0, Math.min(n - 1, i))];
  let d = `M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  const fine = chiusa ? n : n - 1;
  for (let i = 0; i < fine; i++) {
    const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += `C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d + (chiusa ? 'Z' : '');
}

// ---------------------------------------------------------------------
// Gesti: trascinare, pizzicare, rotellina, doppio tocco, inerzia
// ---------------------------------------------------------------------
function mappaGesti(palco) {
  const locale = e => { const r = palco.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  palco.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    try { palco.setPointerCapture(e.pointerId); } catch (x) { /* alcuni browser non lo permettono */ }
    MAPPA.puntatori.set(e.pointerId, { x: e.clientX, y: e.clientY });
    cancelAnimationFrame(MAPPA.anim); MAPPA.anim = 0;
    document.getElementById('menu-mappa').hidden = true;
    if (MAPPA.puntatori.size === 1) {
      const loc = locale(e);
      const pinEl = e.target.closest('.pin');
      MAPPA.gesto = {
        tipo: MAPPA.cartografo && pinEl ? 'sposta' : 'pan', inizio: loc, mosso: false,
        pin: pinEl ? pinEl.dataset.id : null, tx0: MAPPA.tx, ty0: MAPPA.ty,
        storico: [{ x: loc.x, y: loc.y, t: performance.now() }]
      };
    } else if (MAPPA.puntatori.size === 2) {
      const [a, b] = [...MAPPA.puntatori.values()];
      const r = palco.getBoundingClientRect();
      const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
      MAPPA.gesto = { tipo: 'pinch', d0: Math.max(10, Math.hypot(a.x - b.x, a.y - b.y)), s0: MAPPA.s, wx: (mx - MAPPA.tx) / MAPPA.s, wy: (my - MAPPA.ty) / MAPPA.s, mosso: true };
    }
  });
  palco.addEventListener('pointermove', e => {
    if (!MAPPA.puntatori.has(e.pointerId)) return;
    MAPPA.puntatori.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const g = MAPPA.gesto;
    if (!g) return;
    if (g.tipo === 'pinch') {
      if (MAPPA.puntatori.size < 2) return;
      const [a, b] = [...MAPPA.puntatori.values()];
      const r = palco.getBoundingClientRect();
      const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
      MAPPA.s = clamp(g.s0 * Math.hypot(a.x - b.x, a.y - b.y) / g.d0, MAPPA.sMin, MAPPA.sMax);
      MAPPA.tx = mx - g.wx * MAPPA.s;
      MAPPA.ty = my - g.wy * MAPPA.s;
      mappaLimita(); mappaRichiedi();
      return;
    }
    const loc = locale(e);
    if (!g.mosso && Math.hypot(loc.x - g.inizio.x, loc.y - g.inizio.y) > 7) { g.mosso = true; palco.classList.add('trascina'); }
    if (!g.mosso) return;
    if (g.tipo === 'sposta') {
      const p = MAPPA.pins.find(x => x.v.id === g.pin);
      if (p) {
        p.x = clamp((loc.x - MAPPA.tx) / MAPPA.s / MAPPA.w, 0, 1);
        p.y = clamp((loc.y - MAPPA.ty) / MAPPA.s / MAPPA.h, 0, 1);
        p.el.classList.add('trascinato');
        mappaRichiedi();
      }
      return;
    }
    MAPPA.tx = g.tx0 + (loc.x - g.inizio.x);
    MAPPA.ty = g.ty0 + (loc.y - g.inizio.y);
    g.storico.push({ x: loc.x, y: loc.y, t: performance.now() });
    if (g.storico.length > 6) g.storico.shift();
    mappaLimita(); mappaRichiedi();
  });
  const fine = e => {
    if (!MAPPA.puntatori.has(e.pointerId)) return;
    MAPPA.puntatori.delete(e.pointerId);
    palco.classList.remove('trascina');
    const g = MAPPA.gesto;
    if (!g) return;
    if (g.tipo === 'pinch') {
      // se resta un dito, continuo come trascinamento
      if (MAPPA.puntatori.size === 1) {
        const [rest] = [...MAPPA.puntatori.values()];
        const r = palco.getBoundingClientRect();
        const loc = { x: rest.x - r.left, y: rest.y - r.top };
        MAPPA.gesto = { tipo: 'pan', inizio: loc, mosso: true, tx0: MAPPA.tx, ty0: MAPPA.ty, storico: [] };
      } else MAPPA.gesto = null;
      salvaVista();
      return;
    }
    if (MAPPA.puntatori.size) return;
    MAPPA.gesto = null;
    if (e.type === 'pointercancel') return;
    const loc = locale(e);
    if (g.tipo === 'sposta' && g.mosso) {
      const p = MAPPA.pins.find(x => x.v.id === g.pin);
      if (p) {
        p.el.classList.remove('trascinato');
        salva('voci', { id: p.v.id, x: Math.round(p.x * 10000) / 10000, y: Math.round(p.y * 10000) / 10000 });
        avviso('Segnaposto spostato');
        MAPPA.sporca = true;
        mappaCostruisciPin();
        mappaRichiedi();
      }
      return;
    }
    if (!g.mosso) {
      // è un tocco
      if (g.pin) { mappaSeleziona(g.pin, true); return; }
      if (MAPPA.cartografo) { mappaNuovoPunto((loc.x - MAPPA.tx) / MAPPA.s / MAPPA.w, (loc.y - MAPPA.ty) / MAPPA.s / MAPPA.h); return; }
      const ora = performance.now();
      if (MAPPA.ultimoTocco && ora - MAPPA.ultimoTocco.t < 320 && Math.hypot(loc.x - MAPPA.ultimoTocco.x, loc.y - MAPPA.ultimoTocco.y) < 30) {
        MAPPA.ultimoTocco = null;
        mappaZoom(2, loc);
        return;
      }
      MAPPA.ultimoTocco = { t: ora, x: loc.x, y: loc.y };
      if (MAPPA.sel) mappaSeleziona(null);
      return;
    }
    // trascinamento finito: un po' di inerzia se il dito andava veloce
    const st = g.storico;
    if (st.length >= 2) {
      const a = st[0], b = st[st.length - 1], dt = b.t - a.t;
      if (dt > 0 && performance.now() - b.t < 90) { mappaInerzia((b.x - a.x) / dt, (b.y - a.y) / dt); return; }
    }
    salvaVista();
  };
  palco.addEventListener('pointerup', fine);
  palco.addEventListener('pointercancel', fine);
  palco.addEventListener('wheel', e => {
    e.preventDefault();
    cancelAnimationFrame(MAPPA.anim); MAPPA.anim = 0;
    mappaZoom(Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0016)), locale(e), true);
  }, { passive: false });
  // da tastiera i segnaposto sono bottoni: Invio li apre
  palco.addEventListener('click', e => {
    const pin = e.target.closest('.pin');
    if (pin && e.detail === 0) mappaSeleziona(pin.dataset.id, true);
  });
}

function mappaZoom(f, c, immediato) {
  if (!c) c = { x: MAPPA.W / 2, y: MAPPA.H / 2 };
  const s = clamp(MAPPA.s * f, MAPPA.sMin, MAPPA.sMax);
  const wx = (c.x - MAPPA.tx) / MAPPA.s, wy = (c.y - MAPPA.ty) / MAPPA.s;
  if (immediato) {
    MAPPA.s = s; MAPPA.tx = c.x - wx * s; MAPPA.ty = c.y - wy * s;
    mappaLimita(); mappaRichiedi(); salvaVista();
    return;
  }
  mappaAnima(s, c.x - wx * s, c.y - wy * s, 300);
}

function mappaAnima(s1, tx1, ty1, ms, poi) {
  cancelAnimationFrame(MAPPA.anim);
  s1 = clamp(s1, MAPPA.sMin, MAPPA.sMax);
  [tx1, ty1] = mappaLimitiT(s1, tx1, ty1);
  const s0 = MAPPA.s, tx0 = MAPPA.tx, ty0 = MAPPA.ty, t0 = performance.now();
  const ridotto = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const passo = ora => {
    const k = ridotto ? 1 : Math.min(1, (ora - t0) / ms);
    const e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    MAPPA.s = Math.exp(Math.log(s0) + (Math.log(s1) - Math.log(s0)) * e);   // zoom uniforme
    MAPPA.tx = tx0 + (tx1 - tx0) * e;
    MAPPA.ty = ty0 + (ty1 - ty0) * e;
    mappaDisegna();
    if (k < 1) MAPPA.anim = requestAnimationFrame(passo);
    else { MAPPA.anim = 0; salvaVista(); if (poi) poi(); }
  };
  MAPPA.anim = requestAnimationFrame(passo);
}

function mappaInerzia(vx, vy) {
  cancelAnimationFrame(MAPPA.anim);
  let t = performance.now();
  const passo = ora => {
    const dt = Math.min(32, ora - t);
    t = ora;
    MAPPA.tx += vx * dt; MAPPA.ty += vy * dt;
    const att = Math.pow(.92, dt / 16);
    vx *= att; vy *= att;
    mappaLimita(); mappaDisegna();
    if (Math.hypot(vx, vy) > .02) MAPPA.anim = requestAnimationFrame(passo);
    else { MAPPA.anim = 0; salvaVista(); }
  };
  MAPPA.anim = requestAnimationFrame(passo);
}

// Porta un segnaposto al centro (più in alto se la scheda copre la parte bassa)
function mappaVola(id, zoomRel) {
  const p = MAPPA.pins.find(x => x.v.id === id);
  if (!p) return;
  const s = clamp(Math.max(MAPPA.s, MAPPA.sCopri * (zoomRel || 1.5)), MAPPA.sMin, MAPPA.sMax);
  const aperta = document.getElementById('scheda-mappa').classList.contains('aperta');
  const largo = window.innerWidth >= 900;
  const cx = largo && aperta ? (MAPPA.W - 404) / 2 : MAPPA.W / 2;
  const cy = !largo && aperta ? MAPPA.H * .27 : MAPPA.H / 2;
  mappaAnima(s, cx - p.x * MAPPA.w * s, cy - p.y * MAPPA.h * s, 650);
}

function mappaSeleziona(id, vola) {
  MAPPA.sel = id;
  MAPPA.pins.forEach(p => p.el.classList.toggle('sel', p.v.id === id));
  if (MAPPA.ordinati) MAPPA.ordinati.sort((a, b) => (a.v.id === id ? -1 : 0) - (b.v.id === id ? -1 : 0) || a.ordine - b.ordine);
  const scheda = document.getElementById('scheda-mappa');
  const cont = document.getElementById('mappa');
  if (!scheda) return;
  if (!id) {
    scheda.classList.remove('aperta');
    cont.classList.remove('scheda-aperta');
    mappaRichiedi();
    return;
  }
  scheda.innerHTML = mappaSchedaHTML(id);
  scheda.scrollTop = 0;
  scheda.classList.add('aperta');
  cont.classList.add('scheda-aperta');
  if (location.hash.indexOf('#/mappa') === 0) history.replaceState(null, '', '#/mappa/' + encodeURIComponent(MAPPA.id) + '?luogo=' + encodeURIComponent(id));
  if (vola) mappaVola(id); else mappaRichiedi();
}

function mappaSchedaHTML(id) {
  const v = DB.voci[id];
  if (!v) return '';
  const I = indice();
  // chi abita qui, anche nei luoghi interni: la città mostra pure chi sta nelle sue locande
  const abitanti = [id].concat(discendenti(id)).reduce((a, x) => a.concat(I.abitanti[x] || []), []).map(x => DB.voci[x]).filter(x => visibile(x));
  const figli = (I.figli[id] || []).map(x => DB.voci[x]).filter(x => visibile(x));
  const missioni = missioniQui(id);
  // eventi del luogo e dei luoghi che contiene
  const eventi = [id].concat(discendenti(id)).reduce((a, x) => a.concat(I.eventiIn[x] || []), []).sort((a, b) => (b.n || 0) - (a.n || 0));
  const qui = posizioneGruppo();
  const gruppoQui = !!qui && (qui === id || (antenatoSuMappa(qui, MAPPA.id) || {}).id === id);
  const primoParagrafo = String(v.descrizione || '').split(/\n{2,}/)[0];
  let h = `<div class="testa">${sigillo(v)}<div class="corpo"><h2>${esc(v.nome)}</h2>
    <p class="ruolo">${esc(v.ruolo || ICONE_LUOGO[v.icona] || 'Luogo')}${v.segreto ? ', segreto' : ''}</p></div>
    <button class="btn-icona" data-a="mappa-chiudi-scheda" aria-label="Chiudi">${ico('chiudi')}</button></div>`;
  if (gruppoQui) h += `<p style="display:flex;align-items:center;gap:8px;color:var(--lanterna-2);margin:12px 0 0;font-weight:700">${ico('lanterna')}Il gruppo è qui</p>`;
  if (primoParagrafo) h += `<div class="lettura" style="font-size:16px;margin-top:12px">${testoRicco(primoParagrafo)}</div>`;
  const incontrati = abitanti.filter(a => !a.guida || (I.sessioniDi[a.id] || []).length);
  const daIncontrare = abitanti.filter(a => a.guida && !(I.sessioniDi[a.id] || []).length);
  if (incontrati.length) h += `<h3>Chi trovi qui</h3><div class="chips">${incontrati.map(a => chipVoce(a.id)).join('')}</div>`;
  if (daIncontrare.length) h += `<h3>Chi potreste incontrare</h3><div class="chips chips-guida">${daIncontrare.map(a => chipVoce(a.id)).join('')}</div>`;
  if (figli.length) h += `<h3>Luoghi interni</h3><div class="chips">${figli.map(f => chipVoce(f.id)).join('')}</div>`;
  if (missioni.length) h += `<h3>Missioni in corso</h3><div class="chips">${missioni.map(m => chipVoce(m.id)).join('')}</div>`;
  if (eventi.length) {
    h += `<h3>Cosa abbiamo fatto qui</h3>` + eventi.slice(0, 5).map(e =>
      `<div class="ev"><a class="n" href="#/sessione/${encodeURIComponent(e.s)}" title="Sessione ${esc(e.n)}">${esc(e.n)}</a><span>${testoRicco(e.t, 'riga')}</span></div>`).join('');
    if (eventi.length > 5) h += `<p class="fioco piccolo">Altri ${eventi.length - 5} nella scheda.</p>`;
  } else if (!abitanti.length && !missioni.length && !primoParagrafo && !figli.length) {
    h += `<p class="fioco" style="margin:12px 0 0">Ancora niente di registrato qui.</p>`;
  }
  h += `<div class="azioni"><a class="btn btn--primario btn--piccolo" href="#/voce/${encodeURIComponent(id)}">Apri la scheda</a>`;
  if (v.mappaInterna && DB.mappe[v.mappaInterna] && visibile(DB.mappe[v.mappaInterna])) h += `<a class="btn btn--piccolo" href="#/mappa/${encodeURIComponent(v.mappaInterna)}">${ico('entra')}Entra</a>`;
  if (!gruppoQui) h += `<button class="btn btn--piccolo" data-a="siamo-qui" data-id="${esc(id)}">${ico('lanterna')}Il gruppo è qui</button>`;
  h += '</div>';
  if (MAPPA.cartografo) {
    h += `<h3>Cartografo</h3><div class="azioni" style="margin-top:0">`;
    if (!v.mappaInterna || !DB.mappe[v.mappaInterna]) h += `<button class="btn btn--piccolo" data-a="mappa-nuova" data-luogo="${esc(id)}">${ico('immagine')}Crea la mappa interna</button>`;
    h += `<button class="btn btn--piccolo" data-a="modifica" data-tab="voci" data-id="${esc(id)}">${ico('modifica')}Modifica</button>`;
    if (IMPOST.master || !IMPOST.url) h += `<button class="btn btn--piccolo" data-a="pin-segreto" data-id="${esc(id)}">${ico(v.segreto ? 'occhio' : 'nascosto')}${v.segreto ? 'Rivela ai giocatori' : 'Nascondi ai giocatori'}</button>`;
    h += `<button class="btn btn--piccolo btn--pericolo" data-a="pin-togli" data-id="${esc(id)}">Togli dalla mappa</button></div>`;
  }
  return h;
}

function mappaBriciole() {
  const el = document.getElementById('briciole');
  const catena = [];
  let m = DB.mappe[MAPPA.id];
  for (let g = 0; m && g < 8; g++) {
    catena.unshift(m);
    const l = DB.voci[risolvi(m.luogo, 'luogo')];
    const su = l && l.mappa ? DB.mappe[l.mappa] : null;
    if (!su || su.id === m.id || catena.includes(su)) break;
    m = su;
  }
  el.innerHTML = catena.length
    ? catena.slice(-2).map((x, i, a) => `<button data-a="mappa-vai" data-id="${esc(x.id)}">${esc(x.nome || 'Mappa')}</button>${i < a.length - 1 ? '<span class="sep">›</span>' : ''}`).join('')
    : '<button>Mappa</button>';
}

function mappaCerca(q) {
  const box = document.getElementById('risultati');
  const n = norm(q);
  if (!n) { box.hidden = true; return; }
  const risultati = [];
  MAPPA.pins.forEach(p => { if (norm(p.v.nome).includes(n) || (p.v.alias || []).some(a => norm(a).includes(n))) risultati.push({ v: p.v, pin: p.v.id, sotto: ICONE_LUOGO[p.v.icona] || 'Luogo' }); });
  elenco('voci', v => v.tipo !== 'luogo' && (norm(v.nome).includes(n) || (v.alias || []).some(a => norm(a).includes(n)))).forEach(v => {
    const l = risolvi(v.luogo, 'luogo');
    const a = l ? antenatoSuMappa(l, MAPPA.id) : null;
    if (a) risultati.push({ v, pin: a.id, sotto: 'a ' + a.nome });
  });
  box.innerHTML = risultati.length ? risultati.slice(0, 8).map(r => `<button data-a="mappa-trova" data-id="${esc(r.pin)}" class="t-${classeDi(r.v)}">${ico(iconaVoce(r.v))}<span>${esc(r.v.nome)}</span><small>${esc(r.sotto)}</small></button>`).join('')
    : '<p class="fioco piccolo" style="padding:8px 10px;margin:0">Niente su questa mappa.</p>';
  box.hidden = false;
}

// Modulo per una nuova mappa (anche "mappa interna" di un luogo)
function apriNuovaMappa(luogoId) {
  const l = luogoId ? DB.voci[luogoId] : null;
  apriFoglio(`<div class="foglio-testa"><h2 class="t2">${l ? 'Mappa interna di ' + esc(l.nome) : 'Nuova mappa'}</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>
    <form data-a="mappa-crea" data-luogo="${esc(luogoId || '')}">
      <label class="campo"><span>Nome</span><input type="text" name="nome" value="${esc(l ? l.nome : '')}" placeholder="Es. Icewind Dale" required></label>
      <label class="campo"><span>Immagine</span><input type="file" name="file" accept="image/*" required><small>JPG o PNG. La riduco a 4096 pixel di lato e la salvo sul Drive del gruppo.</small></label>
      ${!l ? `<label class="campo"><span>È la mappa interna di un luogo?</span><input type="text" name="luogo" list="dl-luoghi" placeholder="Lascia vuoto per una mappa principale"><datalist id="dl-luoghi">${elenco('voci', v => v.tipo === 'luogo').map(v => `<option value="${esc(v.nome)}">`).join('')}</datalist></label>` : ''}
      <div class="foglio-piede"><button type="button" class="btn" data-a="chiudi">Annulla</button><button class="btn btn--primario" type="submit">${ico('check')}Crea la mappa</button></div>
    </form>`);
}
async function creaMappa(form) {
  const nome = form.querySelector('[name="nome"]').value.trim();
  const file = form.querySelector('[name="file"]').files[0];
  const campoLuogo = form.querySelector('[name="luogo"]');
  const luogoId = form.dataset.luogo || (campoLuogo && campoLuogo.value.trim() ? risolviNome(campoLuogo.value.trim(), 'luogo') : '');
  if (!nome) { avviso('Dai un nome alla mappa'); return; }
  if (!file) { avviso("Scegli l'immagine della mappa"); return; }
  const id = nuovoId('mappe');
  const demo = luogoId && DB.voci[luogoId] && DB.voci[luogoId].demo ? 1 : 0;
  chiudiFoglio();
  try {
    salva('mappe', { id, nome, luogo: luogoId || '', demo }, demo ? { locale: true } : {});
    await caricaImmagineMappa(id, file);
  } catch (e) {
    avviso("Non riesco a usare questa immagine: " + e.message);
    return;
  }
  if (luogoId) salva('voci', { id: luogoId, mappaInterna: id }, demo ? { locale: true } : {});
  else if (!cfg('mappaPrincipale') || !DB.mappe[cfg('mappaPrincipale')] || DB.mappe[cfg('mappaPrincipale')].demo) setCfg('mappaPrincipale', id);
  location.hash = '#/mappa/' + encodeURIComponent(id);
}

// Cartografo: tocco su un punto vuoto -> nuovo segnaposto (luogo nuovo o già nel wiki)
function mappaNuovoPunto(x, y) {
  if (x < 0 || x > 1 || y < 0 || y > 1) return;
  const senzaPin = elenco('voci', v => v.tipo === 'luogo' && !(v.mappa && v.x !== undefined && v.x !== ''));

// ---------------------------------------------------------------------
// Neve: pochi fiocchi su un canvas, con un filo di vento da ovest
// ---------------------------------------------------------------------
function mappaNeve() {
  const c = document.getElementById('neve');
  if (!c) return;
  const attiva = IMPOST.neve && !document.hidden && document.getElementById('vista-mappa').classList.contains('vis') &&
    !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!attiva) {
    cancelAnimationFrame(MAPPA.neveRaf); MAPPA.neveRaf = 0;
    c.hidden = true;
    return;
  }
  c.hidden = false;
  if (MAPPA.neveRaf) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const g = c.getContext('2d');
  const misura = () => { c.width = Math.round(c.clientWidth * dpr); c.height = Math.round(c.clientHeight * dpr); };
  misura();
  const n = Math.round(clamp(c.clientWidth * c.clientHeight / 8500, 30, 150));
  const fiocchi = Array.from({ length: n }, () => ({ x: Math.random(), y: Math.random(), r: .5 + Math.random() * 1.8, v: 14 + Math.random() * 28, f: Math.random() * 6.28, a: .2 + Math.random() * .5 }));
  let t = performance.now();
  const passo = ora => {
    const dt = Math.min(50, ora - t) / 1000;
    t = ora;
    if (c.width !== Math.round(c.clientWidth * dpr)) misura();
    const W = c.width, H = c.height;
    g.clearRect(0, 0, W, H);
    g.fillStyle = '#EEF2F5';
    fiocchi.forEach(f => {
      f.y += f.v * (1 + f.r * .35) * dt * dpr / H;
      f.f += dt * .9;
      f.x += (Math.sin(f.f) * 7 + 9) * dt * dpr / W;
      if (f.y > 1.02) { f.y = -.02; f.x = Math.random(); }
      if (f.x > 1.02) f.x = -.02;
      g.globalAlpha = f.a;
      g.beginPath();
      g.arc(f.x * W, f.y * H, f.r * dpr, 0, 6.2832);
      g.fill();
    });
    MAPPA.neveRaf = requestAnimationFrame(passo);
  };
  MAPPA.neveRaf = requestAnimationFrame(passo);
}

// Estraggo il JSON anche se l'AI ha aggiunto ```json o del testo intorno
function leggiJSON(testo) {
  let t = String(testo || '').trim();
  if (!t) throw new Error('Il riquadro è vuoto: incolla la risposta di AI Studio');
  t = t.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('Non trovo un oggetto JSON nella risposta');
  t = t.slice(a, b + 1);
  try {
    return JSON.parse(t);
  } catch (e) {
    // errori tipici: virgola prima di una parentesi chiusa
    try { return JSON.parse(t.replace(/,\s*([}\]])/g, '$1')); }
    catch (e2) { throw new Error('La risposta non è un JSON valido (' + e2.message + '). Chiedi all\'AI di ripetere solo il JSON.'); }
  }
}

function numeroAtteggiamento(x) {
  if (x === undefined || x === null || x === '') return null;
  const n = Number(x);
  return isNaN(n) ? null : clamp(Math.round(n), -2, 2);
}

// Voci (o missioni) con nome simile, dalla più simile
function trovaSimili(nome, tab, tipo) {
  const n = norm(nome);
  if (!n) return [];
  return elenco(tab, r => tab !== 'voci' || !tipo || r.tipo === tipo || (tipo === 'png' && r.tipo === 'pg'))
    .map(r => {
      const nomi = tab === 'missioni' ? [r.titolo] : [r.nome].concat(r.alias || []);
      let punti = 0;
      nomi.forEach(x => { punti = Math.max(punti, somiglianza(n, norm(x))); });
      return { id: r.id, punti };
    })
    .filter(x => x.punti >= .5)
    .sort((a, b) => b.punti - a.punti);
}
// 1 = uguali. Contenuto uno nell'altro = 0,9. Altrimenti distanza di Levenshtein normalizzata
function somiglianza(a, b) {
  if (!a || !b) return 0;
  if (a === b) return 1;
  if (a.length >= 4 && b.length >= 4 && (a.includes(b) || b.includes(a))) return .9;
  const m = a.length, n = b.length;
  let prec = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cor = [i];
    for (let j = 1; j <= n; j++) cor[j] = Math.min(prec[j] + 1, cor[j - 1] + 1, prec[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prec = cor;
  }
  return 1 - prec[n] / Math.max(m, n);
}

// Dalla risposta dell'AI all'elenco di proposte da controllare
function preparaRevisione(j) {
  const s = j.sessione || {};
  const P = {
    sessione: {
      numero: Number(s.numero) || IMPORT.numero || prossimoNumero(),
      data: /^\d{4}-\d{2}-\d{2}$/.test(s.data || '') ? s.data : IMPORT.data,
      titolo: String(s.titolo || '').trim() || 'Sessione ' + (s.numero || IMPORT.numero),
      riassunto: String(s.riassunto || ''),
      presenti: Array.isArray(s.presenti) ? s.presenti.filter(Boolean) : [],
      luogo: s.luogo_finale || s.luogo || '',
      bottino: String(s.bottino || ''),
      citazioni: (Array.isArray(s.citazioni) ? s.citazioni : []).filter(c => c && c.testo).map(c => ({ chi: String(c.chi || ''), testo: String(c.testo) }))
    },
    eventi: (Array.isArray(j.eventi) ? j.eventi : []).filter(e => e && e.testo).map(e => ({ t: String(e.testo), l: e.luogo || '', ok: true })),
    voci: [], missioni: [], rapporti: []
  };
  (Array.isArray(j.voci) ? j.voci : []).forEach(v => {
    if (!v || !v.nome) return;
    const tipo = TIPI_VOCE[v.tipo] ? v.tipo : 'png';
    const esiste = v.id && DB.voci[v.id] && visibile(DB.voci[v.id]) ? v.id : null;
    const simili = trovaSimili(v.nome, 'voci', tipo);
    let azione = 'crea', bersaglio = '';
    if (esiste) { azione = 'aggiorna'; bersaglio = esiste; }
    else if (simili[0] && simili[0].punti >= .86) { azione = 'aggiorna'; bersaglio = simili[0].id; }
    P.voci.push({ dati: Object.assign({}, v, { tipo, nome: String(v.nome).trim(), alias: Array.isArray(v.alias) ? v.alias.filter(Boolean) : [] }), azione, bersaglio, simili: simili.slice(0, 6) });
  });
  (Array.isArray(j.missioni) ? j.missioni : []).forEach(m => {
    if (!m || !m.titolo) return;
    const esiste = m.id && DB.missioni[m.id] && visibile(DB.missioni[m.id]) ? m.id : null;
    const simili = trovaSimili(m.titolo, 'missioni');
    let azione = 'crea', bersaglio = '';
    if (esiste) { azione = 'aggiorna'; bersaglio = esiste; }
    else if (simili[0] && simili[0].punti >= .86) { azione = 'aggiorna'; bersaglio = simili[0].id; }
    P.missioni.push({ dati: Object.assign({}, m, { titolo: String(m.titolo).trim() }), azione, bersaglio, simili: simili.slice(0, 6) });
  });
  (Array.isArray(j.rapporti) ? j.rapporti : []).forEach(r => {
    if (!r || !r.pg || !r.png) return;
    const delta = clamp(Math.round(Number(r.delta) || 0), -2, 2);
    P.rapporti.push({ pg: r.pg, png: r.png, delta, nota: String(r.nota || ''), ok: true });
  });
  return P;
}

// Cosa cambierebbe in una voce esistente (usato sia per mostrarlo sia per applicarlo)
function differenzeVoce(p) {
  const v = DB.voci[p.bersaglio];
  const d = p.dati;
  const out = [];
  if (!v) return out;
  const alias = [d.nome].concat(d.alias || []).filter(n => n && norm(n) !== norm(v.nome) && !(v.alias || []).some(a => norm(a) === norm(n)));
  if (alias.length) out.push({ campo: alias.length > 1 ? 'Nuovi alias' : 'Nuovo alias', testo: alias.map(esc).join(', ') });
  if (d.ruolo && !v.ruolo) out.push({ campo: 'Ruolo', testo: esc(d.ruolo) });
  if (d.descrizione && !v.descrizione) out.push({ campo: 'Descrizione', testo: esc(d.descrizione) });
  if (STATI_PNG[d.stato] && d.stato !== (v.stato || 'vivo')) out.push({ campo: 'Stato', testo: `${esc(STATI_PNG[v.stato || 'vivo'])} → ${esc(STATI_PNG[d.stato])}` });
  const att = numeroAtteggiamento(d.atteggiamento);
  const vAtt = v.atteggiamento === undefined || v.atteggiamento === '' ? null : Number(v.atteggiamento);
  if (att !== null && att !== vAtt) out.push({ campo: 'Verso il gruppo', testo: `${esc(vAtt === null ? 'non indicato' : ATTEGGIAMENTI[vAtt])} → ${esc(ATTEGGIAMENTI[att])}` });
  if (d.luogo && risolvi(d.luogo, 'luogo') !== risolvi(v.luogo, 'luogo')) out.push({ campo: 'Si trova a', testo: esc(nomeDi(d.luogo)) });
  return out;
}
