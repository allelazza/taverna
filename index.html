        return esito(true, r ? `${r.vecchio} si chiama ${r.nuovo}${r.menzioni ? ', ' + r.menzioni + (r.menzioni === 1 ? ' testo aggiornato' : ' testi aggiornati') : ''}${r.unita ? '; è già nel wiki, la aggiorno' : ''}${r.doppia ? '; era già proposta con questo nome: ora sono una' : ''}` : 'Il nome era già quello');
      }
      const n = rinominaInRevisione(a, b, '');
      return n ? esito(true, `${a} → ${b} in ${n} ${n === 1 ? 'testo' : 'testi'}`) : esito(false, `Non trovo "${a}" tra le voci proposte né nei testi`);
    }
    if ((m = c.match(/^unisci\s+(?:la\s+voce\s+|la\s+missione\s+)?(.+)$/i)) || (m = c.match(/^(.+?)\s+è\s+la\s+stessa\s+(?:voce|missione)\s+di\s+(.+)$/i))) {
      const d = m[2] !== undefined ? [m[1], m[2]] : dividi(m[1].replace(/\s+con\s+(?:l['’]\s*id|l['’]id|id|la\s+voce|la\s+missione)\s+/i, ' con '), 'con', (a, b) => !!trovaProposta(a) && (!!trovaNelWiki(b) || !!trovaProposta(b)));
      if (!d) return esito(false, 'Manca "con": scrivi unisci NOME con l\'id ID');
      const a = virgolette(d[0]), w = trovaNelWiki(d[1]);
      if (!w) {
        // B non è nel wiki ma è un'altra proposta: le due diventano una
        const pa = trovaProposta(a), pb = trovaProposta(virgolette(d[1]));
        if (pa && pb && pa.gruppo === pb.gruppo && pa.i !== pb.i) {
          const giusto = nomeProposta(pb);
          const n = rinominaInRevisione(nomeProposta(pa), giusto, '');
          unisciProposte(pa.gruppo, pa.i, pb.i);
          return esito(true, `${a} e ${giusto} sono la stessa: una proposta sola${n ? ', ' + n + (n === 1 ? ' testo aggiornato' : ' testi aggiornati') : ''}`);
        }
        return esito(false, `Nel wiki non trovo "${virgolette(d[1])}"`);
      }
      const prop = trovaProposta(a, w.gruppo);
      if (!prop) return esito(false, `Tra le ${w.gruppo === 'voci' ? 'voci' : 'missioni'} proposte non trovo "${a}"`);
      const r = stessaVoce(prop.gruppo, prop.i, w.id);
      return esito(!!r, r ? `${r.vecchio} è ${r.giusto} del wiki${r.menzioni ? ', ' + r.menzioni + (r.menzioni === 1 ? ' testo aggiornato' : ' testi aggiornati') : ''}` : 'Non riesco a unirle');
    }
    if ((m = c.match(/^(?:crea|nuova\s+voce|nuova\s+missione)\s+(.+)$/i))) {
      const prop = trovaProposta(virgolette(m[1]));
      if (!prop) return esito(false, `Tra le proposte non trovo "${virgolette(m[1])}"`);
      P[prop.gruppo][prop.i].azione = 'crea';
      return esito(true, `${nomeProposta(prop)} diventa ${prop.gruppo === 'voci' ? 'una voce nuova' : 'una missione nuova'}`);
    }
    if ((m = c.match(/^togli\s+(?:il|la|lo|l['’]|le|i|gli)?\s*(fatt[oi]|event[oi]|gesta|dicerie|diceria|oggett[oi]|rapport[oi]|cos[ae]\s+in\s+sospeso|sospes[oi]|voce|missione)\s+(.+)$/i))) {
      const cosa = m[1].toLowerCase(), resto = virgolette(m[2]);
      if (/^(voce|missione)$/.test(cosa)) {
        const prop = trovaProposta(resto, cosa === 'voce' ? 'voci' : 'missioni');
        if (!prop) return esito(false, `Tra le proposte non trovo "${resto}"`);
        P[prop.gruppo][prop.i].azione = 'salta';
        return esito(true, `${nomeProposta(prop)} non si importa`);
      }
      const gruppo = /^fatt|^event/.test(cosa) ? 'eventi' : cosa === 'gesta' ? 'gesta' : /^dicer/.test(cosa) ? 'dicerie' : /^oggett/.test(cosa) ? 'oggetti' : /^rapport/.test(cosa) ? 'rapporti' : 'sospesi';
      const lista = gruppo === 'sospesi' ? P.sessione.sospesi : P[gruppo];
      let quali = numeri(resto);
      // un oggetto si può togliere anche per nome
      if (!quali.length && gruppo === 'oggetti') { const k = P.oggetti.findIndex(o => norm(o.nome) === norm(resto)); if (k >= 0) quali = [k + 1]; }
      const fuori = quali.filter(n => n < 1 || n > lista.length);
      if (!quali.length || fuori.length) return esito(false, quali.length ? `Non c'è il numero ${fuori.join(', ')} (sono ${lista.length})` : 'Manca il numero');
      quali.forEach(n => { if (gruppo === 'sospesi') sospesiTolti.add(n - 1); else lista[n - 1].ok = false; });
      return esito(true, `Tolt${quali.length > 1 ? 'i' : 'o'}: ${quali.join(', ')}`);
    }
    if ((m = c.match(/^aggiungi\s+(?:il|la|un|una|un['’])?\s*(fatto|gesta)\s*:?\s+(.+)$/i))) {
      const gruppo = /^fatto/i.test(m[1]) ? 'eventi' : 'gesta';
      const t = virgolette(m[2]);
      const luogo = (trovaMenzioni(t).find(x => x.sig === '#') || {}).nome || '';
      P[gruppo].push({ t, l: luogo, ok: true, motivo: '' });
      return esito(true, `${gruppo === 'eventi' ? 'Fatto' : 'Gesta'} ${P[gruppo].length} aggiunt${gruppo === 'eventi' ? 'o' : 'a'}`);
    }
    if ((m = c.match(/^sostituisci\s+"(.+?)"\s+con\s+"(.*)"$/i))) {
      const [a, b] = [m[1], m[2]];
      const n = cambiaRevisione(x => x.split(a).join(b), null);
      return n ? esito(true, `Sostituito in ${n} ${n === 1 ? 'testo' : 'testi'}`) : esito(false, `"${a}" non c'è nei testi`);
    }
    if ((m = c.match(/^stato\s+(?:di|del|della|dello)?\s*(missione\s+)?(.+?)\s*:?\s+(viv[oa]|mort[oa]|scompars[oa]|attiva|compiuta|completata|fallita|abbandonata)$/i))) {
      const st = m[3].toLowerCase();
      const missione = !!m[1] || /^(attiva|compiuta|completata|fallita|abbandonata)$/.test(st);
      const prop = trovaProposta(virgolette(m[2]), missione ? 'missioni' : 'voci');
      if (!prop) return esito(false, `Tra le proposte non trovo "${virgolette(m[2])}"`);
      P[prop.gruppo][prop.i].dati.stato = missione ? (st === 'compiuta' ? 'completata' : st) : st.replace(/a$/, 'o');
      return esito(true, `${nomeProposta(prop)}: ${(missione ? STATI_MISSIONE[P[prop.gruppo][prop.i].dati.stato] : STATI_PNG[P[prop.gruppo][prop.i].dati.stato]).toLowerCase()}`);
    }
    if ((m = c.match(/^luogo\s+finale\s*:?\s+(.+)$/i))) {
      const x = virgolette(m[1]);
      const w = trovaNelWiki(x);
      P.sessione.luogo = w ? w.id : x;
      return esito(true, 'La serata finisce a ' + (w ? nomeDi(w.id) : x));
    }
    esito(false, 'Non capisco questa correzione');
  });
  if (sospesiTolti.size) P.sessione.sospesi = P.sessione.sospesi.filter((x, k) => !sospesiTolti.has(k));
  return esiti;
}

// Il wiki per l'AI: nomi, alias, id, missioni e luoghi già nel diario, in un testo che un'altra AI legge bene
// (per esempio il progetto Claude del controllo delle sessioni). Mai le voci segrete: come nel prompt dell'import.
// In fondo c'è il formato delle correzioni, così il file basta da solo.
function wikiPerAI() {
  const I = indice();
  const sessioni = I.sessioni;
  const numeri = id => (I.sessioniDi[id] || []).map(s => DB.sessioni[s] && DB.sessioni[s].numero).filter(Boolean).sort((a, b) => a - b);
  const riga = v => {
    const n = numeri(v.id);
    return `- ${v.id} | ${v.nome}` + ((v.alias || []).length ? ' | detto anche: ' + v.alias.join(', ') : '') + (v.ruolo ? ' | ' + v.ruolo : '') +
      (v.luogo && nomeDi(v.luogo) ? ' | a ' + nomeDi(v.luogo) : '') + (v.stato && v.stato !== 'vivo' && STATI_PNG[v.stato] ? ' | ' + STATI_PNG[v.stato].toLowerCase() : '') +
      (n.length ? ' | nelle sessioni ' + n.join(', ') : v.guida ? ' | dalla guida, non ancora incontrato' : '');
  };
  const voci = elenco('voci', v => !v.segreto);
  const perTipo = (tipo, titolo) => {
    const l = voci.filter(v => v.tipo === tipo).sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'it'));
    return l.length ? [titolo, ...l.map(riga), ''] : [];
  };
  const missioni = elenco('missioni', m => !m.segreto).sort((a, b) => String(a.titolo).localeCompare(String(b.titolo), 'it'));
  const numSes = id => id && DB.sessioni[id] ? DB.sessioni[id].numero : '';
  return [
    `WIKI DI TAVERNA, campagna "${cfg('campagna', 'la nostra campagna')}", esportato il ${new Date().toLocaleDateString('it-IT')}`,
    'Ogni riga: id | nome | altri nomi | chi è | dove si trova | sessioni in cui compare. Usa gli id così come sono.',
    '',
    'SESSIONI NEL DIARIO',
    ...(sessioni.length ? sessioni.map(s => `- sessione ${s.numero}${s.data ? ' (' + s.data + ')' : ''}: ${s.titolo || ''}`) : ['- nessuna']),
    '',
    'PERSONAGGI GIOCANTI',
    ...voci.filter(v => v.tipo === 'pg').map(p => `- ${p.id} | ${p.nome}${p.giocatore ? ' | giocato da ' + p.giocatore : ''}${p.classe ? ' | ' + p.classe : ''}`),
    '',
    ...perTipo('png', 'PNG'),
    ...perTipo('luogo', 'LUOGHI'),
    ...perTipo('fazione', 'FAZIONI'),
    ...perTipo('oggetto', 'OGGETTI'),
    'MISSIONI',
    ...(missioni.length ? missioni.map(m => `- ${m.id} | ${m.titolo} | ${STATI_MISSIONE[m.stato || 'attiva'].toLowerCase()}` + (m.committente && nomeDi(m.committente) ? ' | affidata da ' + nomeDi(m.committente) : '') +
      (m.luogo && nomeDi(m.luogo) ? ' | a ' + nomeDi(m.luogo) : '') + (numSes(m.apertaIn) ? ' | dalla sessione ' + numSes(m.apertaIn) : '') + (numSes(m.chiusaIn) ? ', chiusa nella ' + numSes(m.chiusaIn) : '')) : ['- nessuna']),
    '',
    'COME SCRIVERE LE CORREZIONI PER L\'APP',
    FORMATO_CORREZIONI
  ].join('\n');
}
// Il file dell'esportazione (per caricarlo nel progetto): stesso testo, scaricato
function scaricaTesto(testo, nome) {
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([testo], { type: 'text/plain;charset=utf-8' }));
  link.download = nome;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 3000);
}
// La scelta di "È la stessa voce di…": il wiki in un foglio, con la ricerca; in cima le voci simili
function apriStessaVoce(gruppo, i) {
  const p = IMPORT.proposte[gruppo][i];
  if (!p) return;
  const missioni = gruppo === 'missioni';
  const nome = missioni ? p.dati.titolo : p.dati.nome;
  const simili = p.simili.map(x => x.id);
  const ord = r => simili.includes(r.id) ? 0 : !missioni && r.tipo === p.dati.tipo ? 1 : 2;
  const righe = (missioni ? elenco('missioni') : elenco('voci')).sort((a, b) => ord(a) - ord(b) || String(a.nome || a.titolo).localeCompare(String(b.nome || b.titolo), 'it'));
  apriFoglio(`<div class="foglio-testa"><h2 class="t2">«${esc(nome)}» è la stessa ${missioni ? 'missione' : 'voce'} di…</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>
    <p class="fioco piccolo" style="margin-top:0">${missioni ? 'La missione del diario tiene il suo titolo: lo stato e la nota di stasera vanno lì.' : 'Il nome sentito dall\'AI diventa un alias della voce che scegli, e le menzioni nei testi passano al nome giusto.'}</p>
    <div class="cerca">${ico('cerca')}<input type="search" data-a="rev-stessa-cerca" placeholder="Cerca nel wiki" autocomplete="off" aria-label="Cerca nel wiki"></div>
    <ul class="lista scelta-wiki">${righe.map(r => `<li data-cerca="${esc(norm([r.nome || r.titolo, r.ruolo || ''].concat(r.alias || []).join(' ')))}"><button type="button" class="riga" data-a="rev-stessa" data-gruppo="${gruppo}" data-i="${i}" data-id="${esc(r.id)}">${missioni ? `<span class="sigillo t-missione">${ico('missioni')}</span>` : sigillo(r)}<span class="corpo"><span class="tit">${esc(r.nome || r.titolo)}</span><span class="sub">${esc([simili.includes(r.id) ? 'nome simile' : '', (r.alias || []).length ? 'detto anche ' + r.alias.join(', ') : '', r.ruolo || (missioni ? STATI_MISSIONE[r.stato || 'attiva'] : '')].filter(Boolean).join(' · '))}</span></span></button></li>`).join('')}</ul>`);
}

// ---------------------------------------------------------------------
// LA SERATA: il taccuino condiviso da tutto il tavolo.
// Chi apre la serata fa partire il cronometro per tutti; ognuno segna dal suo telefono.
// Ogni segnalibro è una riga sua nella tabella config ("seg-..."), così nessuno sovrascrive
// gli altri e non nascono conflitti. Il segnalibro tiene l'ora esatta (quando): il minuto si conta
// dallo zero della registrazione, e il tasto "La registrazione parte adesso" sposta lo zero
// riallineando da solo tutti i segnalibri, anche quelli già presi.
// I segnalibri "segreto" del Master hanno segreto=1: ai giocatori non arrivano proprio e nel
// prompt non finiscono mai; dopo l'import restano legati alla sessione, li vede solo il Master.
// ---------------------------------------------------------------------
const TIPI_SEGNALIBRO = {
  nota: { nome: 'Nota', ico: 'segna' },
  // le imprese del gruppo che fanno parlare la valle: finiscono nelle gesta della sessione (#/gesta)
  gesta: { nome: 'Gesta', ico: 'gesta' },
  png: { nome: 'PNG', ico: 'png' },
  luogo: { nome: 'Luogo', ico: 'segnaposto' },
  missione: { nome: 'Missione', ico: 'missioni' },
  bottino: { nome: 'Bottino', ico: 'oggetto' },
  citazione: { nome: 'Citazione', ico: 'diario' },
  dubbio: { nome: 'Dubbio', ico: 'info' },
  segreto: { nome: 'Segreto', ico: 'nascosto', master: true }
};
function serata() {
  const s = cfg('serata', null);
  return s && typeof s === 'object' && s.inizio ? s : null;
}
// segnalibri della serata aperta non ancora finiti in una sessione, dal più vecchio
// (i segreti li vede solo il Master, vedi visibile). Senza una serata aperta non ce ne sono:
// quelli rimasti senza sessione sono le note segrete di una serata già importata da un giocatore.
function segnalibriSerata() {
  const ser = serata();
  if (!ser) return [];
  const da = (Number(ser.inizio) || 0) - 6 * 3600000;
  return elenco('config', r => r.id.indexOf('seg-') === 0 && r.valore && typeof r.valore === 'object' && !r.valore.sessione && (Number(r.valore.quando) || 0) >= da)
    .map(r => Object.assign({ id: r.id }, r.valore)).sort((a, b) => (Number(a.quando) || 0) - (Number(b.quando) || 0));
}
// note segrete del Master prese durante la serata di una sessione. Se l'import l'ha fatto un giocatore,
// i segnalibri segreti non li aveva e non ha potuto legarli: li riconosco dall'ora, dentro la serata della sessione
function noteMasterDi(sid) {
  const s = DB.sessioni[sid] || {};
  const ser = s.serata && typeof s.serata === 'object' ? s.serata : null;
  const dentro = v => ser && (Number(v.quando) || 0) >= (Number(ser.inizio) || 0) - 60000 && (Number(v.quando) || 0) <= (Number(ser.fine) || (Number(ser.inizio) || 0) + 16 * 3600000);
  return elenco('config', r => r.id.indexOf('seg-') === 0 && r.segreto && r.valore && (r.valore.sessione === sid || (!r.valore.sessione && dentro(r.valore))))
    .map(r => Object.assign({ id: r.id }, r.valore)).sort((a, b) => (Number(a.quando) || 0) - (Number(b.quando) || 0));
}
// il nome con cui firmo i segnalibri e le disponibilità: il mio personaggio, oppure il nome nelle impostazioni
function chiSono() {
  if (IMPOST.pg && DB.voci[IMPOST.pg] && visibile(DB.voci[IMPOST.pg])) return DB.voci[IMPOST.pg].nome;
  return IMPOST.io || (IMPOST.master ? 'Master' : '');
}

// Tutte le azioni del taccuino passano di qui (pulsanti tac-* in 9-avvio.js)
async function azioneSerata(azione, el) {
  const ser = serata();
  switch (azione) {
    case 'inizia':
      // oraInizio: l'ora del gruppo quando si comincia, per sapere poi se l'orologio ha già contato i giorni
      setCfg('serata', { inizio: Date.now(), registrazione: Date.now(), data: oggiISO(), chi: chiSono(), oraInizio: oreCampagna() });
      // il percorso sulla mappa riparte da dove si trova il gruppo
      azzeraPercorso();
      avviso('Serata iniziata: il cronometro parte per tutti');
      break;
    case 'registra':
      if (!ser) return;
      setCfg('serata', Object.assign({}, ser, { registrazione: Date.now() }));
      avviso('Da adesso i minuti si contano da qui, anche per i segnalibri già presi');
      break;
    case 'termina': if (ser) setCfg('serata', Object.assign({}, ser, { fine: Date.now() })); break;
    case 'riprendi': if (ser) { const nuovo = Object.assign({}, ser); delete nuovo.fine; setCfg('serata', nuovo); } break;
    case 'segna': {
      // dal modulo (tipo "nota") o da un tasto del tipo: il testo scritto nel campo, se c'è, va con il segnalibro
      const campo = document.querySelector('form[data-a="tac-segna"] [name="testo"]');
      const testo = campo ? campo.value.trim() : '';
      const tipo = TIPI_SEGNALIBRO[el && el.dataset.tipo] ? el.dataset.tipo : 'nota';
      if (!ser) return;
      if (tipo === 'nota' && !testo) { avviso('Scrivi cosa segnare, oppure tocca uno dei tipi'); return; }
      salva('config', { id: 'seg-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), valore: { quando: Date.now(), tipo, testo, chi: chiSono() }, segreto: tipo === 'segreto' ? 1 : 0 });
      if (campo) campo.value = '';
      avviso((TIPI_SEGNALIBRO[tipo].nome) + ' segnato al minuto ' + durata(Date.now() - (Number(ser.registrazione) || Number(ser.inizio))));
      break;
    }
    case 'togli': if (el && el.dataset.id) elimina('config', el.dataset.id); break;
    case 'svuota':
      if (!await chiedi('Chiudere la serata senza importarla?', 'Tolgo il cronometro e tutti i segnalibri, per tutto il tavolo.', 'Chiudi la serata', true)) return;
      segnalibriSerata().forEach(n => elimina('config', n.id));
      if (ser) elimina('config', 'serata');
      break;
  }
  render();
}

// Il taccuino della versione 1.3 stava solo su un telefono (TACCUINO): lo porto nella serata condivisa
function migraTaccuino() {
  if (!TACCUINO || !TACCUINO.inizio) return;
  if (!serata()) {
    setCfg('serata', { inizio: TACCUINO.inizio, registrazione: TACCUINO.inizio, data: new Date(TACCUINO.inizio).toISOString().slice(0, 10), fine: TACCUINO.fine || undefined, chi: chiSono() });
    (TACCUINO.note || []).forEach((n, i) => salva('config', { id: 'seg-v13-' + TACCUINO.inizio.toString(36) + '-' + i, valore: { quando: TACCUINO.inizio + (Number(n.t) || 0), tipo: 'nota', testo: n.testo || '', chi: chiSono() } }));
  }
  TACCUINO = { inizio: null, fine: null, note: [] };
  salvaLocale('taccuino');
}

// ---------------------------------------------------------------------
// PACCHETTI: mappe, luoghi e personaggi pronti (per esempio Icewind Dale)
//
// Il file è un JSON { formato: 'taverna-pacchetto', id, nome, descrizione,
//   config: { chiave: valore }, mappe: [...con immagine come data URL],
//   voci: [...], commercio: [...] }.
// Le immagini vanno sul Drive del gruppo e il resto nel foglio: basta che lo
// importi una persona. Reimportarlo non crea doppioni: una voce che esiste
// già (stesso id o stesso nome) viene solo completata nei campi vuoti.
// ---------------------------------------------------------------------
let PACCHETTO = null;

async function leggiPacchetto(file) {
  let p;
  try {
    p = JSON.parse(await file.text());
  } catch (e) {
    avviso('Il file non è leggibile: serve il file .json del pacchetto');
    return;
  }
  if (!p || p.formato !== 'taverna-pacchetto' || !(Array.isArray(p.voci) || Array.isArray(p.catalogo))) {
    avviso(p && p.db ? 'Questo è un backup: usa "Ripristina un backup"' : 'Questo file non è un pacchetto di Taverna');
    return;
  }
  PACCHETTO = p;
  const voci = p.voci || [], mappe = p.mappe || [], comm = p.commercio || [];
  const conta = t => voci.filter(v => v.tipo === t).length;
  const gia = mappe.some(m => DB.mappe[m.id] && !DB.mappe[m.id].eliminato) || voci.some(v => DB.voci[v.id] && !DB.voci[v.id].eliminato);
  const haDemo = TABELLE.some(t => Object.values(DB[t]).some(r => r.demo));
  const pgs = voci.filter(v => v.tipo === 'pg');
  const righe = [
    [mappe.length, mappe.length === 1 ? 'mappa' : 'mappe'],
    [conta('luogo'), 'luoghi'],
    [conta('png'), 'PNG da incontrare'],
    [conta('fazione'), conta('fazione') === 1 ? 'fazione' : 'fazioni'],
    [pgs.length, 'personaggi del gruppo'],
    [voci.filter(v => v.immagine).length, 'ritratti e stemmi'],
    [comm.filter(c => c.tipo === 'tratta').length, 'tratte per il commercio'],
    [p.config && p.config.tabellaImpulsi ? 1 : 0, 'tabella degli impulsi'],
    [Array.isArray(p.catalogo) ? p.catalogo.length : 0, 'oggetti nel catalogo']
  ].filter(r => r[0]);
  apriFoglio(`<div class="foglio-testa"><h2 class="t2">${esc(p.nome || 'Pacchetto')}</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>
    <form data-a="pacchetto-importa">
      ${p.descrizione ? `<p class="fioco" style="margin-top:0">${esc(p.descrizione)}</p>` : ''}
      <ul class="pacchetto-conti">${righe.map(([n, l]) => `<li><strong>${n}</strong><span>${esc(l)}</span></li>`).join('')}</ul>
      ${gia ? `<p class="nota-guida">${ico('info')}L'avete già importato: completo solo quello che manca e rimando le mappe che non sono ancora sul Drive.</p>` : ''}
      ${!IMPOST.url ? `<p class="nota-guida">${ico('info')}Non sei collegato al foglio: le mappe resterebbero solo su questo dispositivo. Meglio collegarsi prima, dalle impostazioni.</p>` : ''}
      ${haDemo ? `<label class="interruttore"><span>Togli i dati di esempio</span><input type="checkbox" name="demo" checked></label>` : ''}
      ${pgs.length && !(IMPOST.pg && DB.voci[IMPOST.pg] && !DB.voci[IMPOST.pg].demo) ? `<label class="campo"><span>Il tuo personaggio</span><select name="pg"><option value="">Lo scelgo dopo</option>${pgs.map(v => `<option value="${esc(v.id)}">${esc(v.nome)}${v.giocatore ? ', ' + esc(v.giocatore) : ''}</option>`).join('')}</select></label>` : ''}
      <div class="foglio-piede"><button type="button" class="btn" data-a="chiudi">Annulla</button><button class="btn btn--primario" type="submit">${ico('importa')}Importa</button></div>
    </form>`);
}

async function importaPacchetto(form) {
  const p = PACCHETTO;
  if (!p) return;
  const togliDemo = form.querySelector('[name="demo"]') && form.querySelector('[name="demo"]').checked;
  const pgScelto = form.querySelector('[name="pg"]') ? form.querySelector('[name="pg"]').value : '';
  const mappe = p.mappe || [];
  // foglio di avanzamento: le mappe possono metterci un minuto ad arrivare sul Drive
  apriFoglio(`<div class="foglio-testa"><h2 class="t2">Importo ${esc(p.nome || 'il pacchetto')}</h2></div>
    <p id="pac-stato" class="fioco" style="margin-top:0">Preparo i dati…</p>
    <div class="barra"><span id="pac-barra" style="width:2%"></span></div>
    <p class="fioco piccolo">Non chiudere l'app finché non ho finito.</p>`);
  const stato = (testo, frazione) => {
    const t = document.getElementById('pac-stato'), b = document.getElementById('pac-barra');
    if (t) t.textContent = testo;
    if (b) b.style.width = Math.round(2 + frazione * 98) + '%';
  };
  if (togliDemo) rimuoviDemo();

  // 1) a quale record dell'archivio corrisponde ogni id del pacchetto:
  //    lo stesso id, oppure una voce vostra (non di esempio) con lo stesso nome e lo stesso tipo
  const ids = {};
  (p.voci || []).forEach(v => {
    if (DB.voci[v.id] && !DB.voci[v.id].demo) { ids[v.id] = v.id; return; }
    const es = risolviNome(v.nome, v.tipo);
    ids[v.id] = es && DB.voci[es] && !DB.voci[es].demo && !DB.voci[es].eliminato && DB.voci[es].tipo === v.tipo ? es : v.id;
  });
  const rif = x => (x && ids[x]) || x || '';
  const vuoto = x => x === undefined || x === null || x === '' || (Array.isArray(x) && !x.length) || (typeof x === 'object' && !Array.isArray(x) && !Object.keys(x).length);

  // 2) voci: nuove intere, esistenti solo nei campi vuoti (quello che avete scritto voi resta com'è)
  let nuove = 0, completate = 0;
  (p.voci || []).forEach(v => {
    const id = ids[v.id];
    const rec = Object.assign({}, v, { id, pacchetto: p.id });
    ['luogo', 'mappa', 'mappaInterna'].forEach(k => { if (rec[k]) rec[k] = rif(rec[k]); });
    if (rec.tipo === 'pg' && rec.chiaveClasse && typeof descrizioneClasse === 'function') rec.classe = descrizioneClasse(rec);
    const es = DB.voci[id];
    // una voce che avete cancellato resta cancellata (prima il pacchetto la faceva ricomparire)
    if (es && es.eliminato) return;
    if (!es) { salva('voci', Object.assign(rec, { eliminato: 0 })); nuove++; return; }
    const patch = { id };
    Object.keys(rec).forEach(k => {
      // la posizione si prende tutta insieme, e "da incontrare" non si mette su chi conoscete già
      if (['id', 'tipo', 'nome', 'guida', 'pacchetto', 'mappa', 'x', 'y'].includes(k)) return;
      if (vuoto(es[k]) && !vuoto(rec[k])) patch[k] = rec[k];
    });
    if (rec.mappa && (!es.mappa || es.x === undefined || es.x === '' || !DB.mappe[es.mappa] || DB.mappe[es.mappa].eliminato)) {
      // la posizione viene dal pacchetto: il luogo è già disegnato sulla mappa (vedi pin--stampato)
      patch.mappa = rec.mappa; patch.x = rec.x; patch.y = rec.y; patch.pacchetto = p.id;
    }
    if (Object.keys(patch).length > 1) { salva('voci', patch); completate++; }
  });

  // 3) commercio (tratte): solo quelle che non ci sono già
  (p.commercio || []).forEach(c => {
    if (DB.commercio[c.id]) return;   // c'è già, oppure l'avete cancellata: in tutti e due i casi non la tocco
    const rec = Object.assign({}, c, { pacchetto: p.id, eliminato: 0 });
    ['da', 'a', 'luogo'].forEach(k => { if (rec[k]) rec[k] = rif(rec[k]); });
    salva('commercio', rec);
  });

  // 4) impostazioni del gruppo: solo se mancano (la mappa principale anche se era quella di esempio)
  Object.entries(p.config || {}).forEach(([k, val]) => {
    if (k === 'mappaPrincipale') {
      const ora = cfg('mappaPrincipale');
      if (!ora || !DB.mappe[ora] || DB.mappe[ora].demo || DB.mappe[ora].eliminato) setCfg(k, val);
      return;
    }
    if (vuoto(cfg(k, ''))) setCfg(k, val);
  });
  if (pgScelto && DB.voci[rif(pgScelto)]) { IMPOST.pg = rif(pgScelto); salvaLocale('impost'); }

  // 4b) catalogo degli oggetti: righe config 'catalogo-1', 'catalogo-2'... da meno di 40.000 caratteri
  //     ciascuna (una cella del foglio ne tiene 50.000). Reimportarlo riscrive le stesse righe e
  //     cancella quelle avanzate: niente doppioni, e gli oggetti del bottino tengono il loro id.
  let nCatalogo = 0;
  if (Array.isArray(p.catalogo)) {
    const lotti = [[]];
    let peso = 0;
    p.catalogo.filter(o => o && o.id && o.nome).forEach(o => {
      const n = JSON.stringify(o).length + 1;
      if (peso + n > 38000 && lotti[lotti.length - 1].length) { lotti.push([]); peso = 0; }
      lotti[lotti.length - 1].push(o); peso += n; nCatalogo++;
    });
    lotti.forEach((oggetti, i) => salva('config', { id: 'catalogo-' + (i + 1), valore: { pacchetto: p.id || '', oggetti }, eliminato: 0 }));
    Object.values(DB.config).filter(r => /^catalogo-\d+$/.test(r.id) && Number(r.id.slice(9)) > lotti.length && !r.eliminato).forEach(r => elimina('config', r.id));
  }

  // 5) mappe: il record subito, l'immagine solo se non è già sul Drive
  let caricate = 0, soloQui = 0;
  for (let i = 0; i < mappe.length; i++) {
    const m = mappe[i];
    stato(`Mappa ${i + 1} di ${mappe.length}: ${m.nome}`, i / mappe.length);
    const es = DB.mappe[m.id];
    const rec = { id: m.id, nome: m.nome, luogo: rif(m.luogo), ordine: m.ordine || 0, pacchetto: p.id };
    ['cx', 'cy', 'nomiStampati'].forEach(k => { if (m[k] !== undefined) rec[k] = m[k]; });
    if (es && es.eliminato) continue;   // mappa cancellata da voi: resta cancellata
    if (!es) salva('mappe', Object.assign(rec, { eliminato: 0 }));
    const ora = DB.mappe[m.id];
    if (ora.fileId || !m.immagine) continue;
    // l'immagine c'è già su questo dispositivo e non siamo collegati: non serve rifarla
    if (!(IMPOST.url && IMPOST.chiave) && (URL_MAPPE['locale:' + m.id] || await idb('get', 'locale:' + m.id).catch(() => null))) { soloQui++; continue; }
    try {
      const blob = await (await fetch(m.immagine)).blob();
      const ok = await caricaImmagineMappa(m.id, blob, { w: m.w, h: m.h });
      if (ok) caricate++; else soloQui++;
    } catch (e) {
      console.warn('Mappa del pacchetto non caricata', m.id, e);
      soloQui++;
    }
  }
  stato('Fatto', 1);
  salvaLocaleSubito();
  PACCHETTO = null;
  IDX = null;
  MAPPA.sporca = true; MAPPA.caricata = false; MAPPA.primaVolta = true;
  sincronizza();
  chiudiFoglio();
  const parti = [];
  if (nuove) parti.push(nuove + (nuove === 1 ? ' voce nuova' : ' voci nuove'));
  if (completate) parti.push(completate + (completate === 1 ? ' completata' : ' completate'));
  if (caricate) parti.push(caricate + (caricate === 1 ? ' mappa sul Drive' : ' mappe sul Drive'));
  if (soloQui) parti.push(soloQui + (soloQui === 1 ? ' mappa solo qui' : ' mappe solo qui'));
  if (nCatalogo) parti.push(nCatalogo + ' oggetti nel catalogo');
  avviso('Pacchetto importato' + (parti.length ? ': ' + parti.join(', ') : ''));
  // un pacchetto con solo il catalogo non ha niente da far vedere sulla mappa
  location.hash = mappe.length || (p.voci || []).length ? '#/mappa' : '#/tavolo?sez=bottino';
  render();
}

// =====================================================================
// 6. DATI E MAPPA DI ESEMPIO
// ---------------------------------------------------------------------
// Servono per provare l'app prima di avere dati veri. Restano solo su
// questo dispositivo (campo demo=1) e si tolgono dalle impostazioni.
// La mappa è disegnata qui, in SVG, in stile "osso inciso": una valle
// gelata schematica con tre laghi, il ghiacciaio e la catena a sud.
// Quando caricherete la vostra mappa, questa sparisce.
// =====================================================================

// Geografia della mappa di esempio (2400 x 1680). Ogni lago è una forma
// "polare": per ogni angolo so quanto è lontana la riva dal centro, così
// posso mettere i villaggi esattamente sulla riva.
const GEO_DEMO = (() => {
  let seme = 20261118;
  const rnd = () => { seme = (seme + 0x6D2B79F5) | 0; let t = Math.imul(seme ^ (seme >>> 15), 1 | seme); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const lago = (cx, cy, rx, ry, n, amp, fase) => {
    const k = [];
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2;
      k.push(1 + amp * (Math.sin(a * 2 + fase) * .45 + Math.sin(a * 5 + fase * 1.7) * .3 + Math.sin(a * 11 + fase * .3) * .1) + (rnd() - .5) * amp * .3);
    }
    // raggio alla riva per un angolo qualsiasi (interpolando tra i punti)
    const raggio = a => {
      const t = ((a / (Math.PI * 2)) % 1 + 1) % 1 * n;
      const i = Math.floor(t), f = t - i;
      return k[i % n] * (1 - f) + k[(i + 1) % n] * f;
    };
    const punti = k.map((kk, i) => { const a = i / n * Math.PI * 2; return [cx + Math.cos(a) * rx * kk, cy + Math.sin(a) * ry * kk]; });
    const riva = (gradi, fuori) => { const a = gradi * Math.PI / 180; const r = raggio(a); return [cx + Math.cos(a) * (rx * r + fuori), cy + Math.sin(a) * (ry * r + fuori)]; };
    return { cx, cy, rx, ry, punti, riva };
  };
  const laghi = {
    maer: lago(760, 630, 330, 225, 30, .15, 1.3),
    dinn: lago(1570, 610, 215, 160, 26, .17, 2.1),
    red: lago(1505, 1015, 138, 96, 22, .2, .4)
  };
  const L = laghi;
  const pos = {
    brynShander: [1150, 850],
    targos: L.maer.riva(38, 22),
    termalaine: L.maer.riva(-18, 22),
    lonelywood: L.maer.riva(-98, 22),
    bremen: L.maer.riva(172, 22),
    caerDineval: L.dinn.riva(196, 20),
    caerKonig: L.dinn.riva(-78, 20),
    easthaven: L.dinn.riva(42, 20),
    goodMead: L.red.riva(-112, 18),
    dougansHole: L.red.riva(78, 18),
    kelvin: [1215, 395]
  };
  return { rnd, laghi, pos, W: 2400, H: 1680 };
})();

function mappaDemoSVG() {
  const { W, H, laghi, pos } = GEO_DEMO;
  let seme = 77;
  const rnd = () => { seme = (seme + 0x6D2B79F5) | 0; let t = Math.imul(seme ^ (seme >>> 15), 1 | seme); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const f = n => n.toFixed(1);
  const AV = '#ECE6D6', TERRA = '#1A2633', ACQUA = '#0F1821';
  // punto dentro un poligono (per non mettere alberi nei laghi)
  const dentro = (p, poly) => {
    let c = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i], b = poly[j];
      if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
    }
    return c;
  };
  // costa del mare a nord-ovest
  const costa = [[1380, -40], [1270, 60], [1130, 128], [975, 150], [830, 132], [705, 168], [590, 245], [470, 292], [350, 322], [245, 392], [150, 440], [60, 462], [-40, 492]]
    .map(([x, y], i, a) => (i === 0 || i === a.length - 1) ? [x, y] : [x + (rnd() - .5) * 24, y + (rnd() - .5) * 20]);
  const marePoly = costa.concat([[-40, -40]]);
  const dMare = curvaMorbida(costa, false) + ' L-40,-40 Z';
  const dCosta = curvaMorbida(costa, false);
  // ghiacciaio a est
  const ghiaccio = [[2440, 70], [2150, 104], [2068, 226], [2018, 380], [2058, 528], [1994, 702], [2036, 884], [1986, 1050], [2066, 1224], [2440, 1262]];
  const dGhiaccio = curvaMorbida(ghiaccio, false) + ' Z';
  const laghiPoly = Object.values(laghi).map(l => l.punti);
  const inAcqua = p => dentro(p, marePoly) || laghiPoly.some(pl => dentro(p, pl));

  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
  <defs>
    <radialGradient id="fondo" cx="47%" cy="47%" r="78%"><stop offset="0" stop-color="#2A3B4D"/><stop offset=".55" stop-color="#1D2A38"/><stop offset="1" stop-color="#121A23"/></radialGradient>
    <filter id="grana" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="4" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .93  0 0 0 0 .91  0 0 0 0 .86  .9 0 0 0 -.38"/></filter>
    <filter id="cumuli" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".0026" numOctaves="4" seed="11"/><feColorMatrix values="0 0 0 0 .86  0 0 0 0 .91  0 0 0 0 .96  1.1 0 0 0 -.52"/></filter>
    <clipPath id="c-mare"><path d="${dMare}"/></clipPath>
    ${Object.entries(laghi).map(([k, l]) => `<clipPath id="c-${k}"><path d="${curvaMorbida(l.punti, true)}"/></clipPath>`).join('')}
  </defs>
  <rect width="${W}" height="${H}" fill="url(#fondo)"/>
  <rect width="${W}" height="${H}" filter="url(#cumuli)"/>`;

  // MARE: linee d'acqua parallele alla costa (trucco: tratto largo chiaro + tratto un po' meno largo scuro)
  s += `<path d="${dMare}" fill="${ACQUA}"/><g clip-path="url(#c-mare)">`;
  [[170, .09], [112, .14], [66, .22], [30, .34]].forEach(([w, o]) => {
    s += `<path d="${dCosta}" fill="none" stroke="${AV}" stroke-opacity="${o}" stroke-width="${w}"/><path d="${dCosta}" fill="none" stroke="${ACQUA}" stroke-width="${w - 2.6}"/>`;
  });
  // banchi di ghiaccio alla deriva
  for (let i = 0, fatti = 0; i < 400 && fatti < 46; i++) {
    const p = [rnd() * 1350, rnd() * 470];
    if (!dentro(p, marePoly)) continue;
    // abbastanza lontano dalla costa
    if (costa.some(c => Math.hypot(c[0] - p[0], c[1] - p[1]) < 70)) continue;
    const r = 9 + rnd() * 26, n = 5 + Math.floor(rnd() * 3), pts = [];
    for (let k = 0; k < n; k++) { const a = k / n * 6.283 + rnd() * .5; pts.push([p[0] + Math.cos(a) * r * (.6 + rnd() * .5), p[1] + Math.sin(a) * r * (.5 + rnd() * .4)]); }
    s += `<path d="M${pts.map(q => f(q[0]) + ',' + f(q[1])).join('L')}Z" fill="#1C2935" stroke="${AV}" stroke-opacity=".55" stroke-width="1.3" stroke-linejoin="round"/>`;
    fatti++;
  }
  s += `</g><path d="${dCosta}" fill="none" stroke="${AV}" stroke-width="2.4" stroke-linejoin="round" opacity=".9"/>`;

  // GHIACCIAIO
  s += `<path d="${dGhiaccio}" fill="#243547" stroke="${AV}" stroke-width="2" stroke-opacity=".8"/>
    <path d="${curvaMorbida(ghiaccio.map(p => [p[0] + 22, p[1]]), false)}" fill="none" stroke="${AV}" stroke-opacity=".28" stroke-width="1.2"/>`;
  for (let i = 0, fatti = 0; i < 500 && fatti < 70; i++) {
    const p = [2060 + rnd() * 340, 150 + rnd() * 1080];
    if (!dentro(p, ghiaccio.concat([[2440, 70]]))) continue;
    let d = `M${f(p[0])},${f(p[1])}`, x = p[0], y = p[1];
    for (let k = 0; k < 3; k++) { x += (rnd() - .5) * 26; y += 10 + rnd() * 18; d += `L${f(x)},${f(y)}`; }
    s += `<path d="${d}" fill="none" stroke="${AV}" stroke-opacity=".32" stroke-width="1.2" stroke-linecap="round"/>`;
    fatti++;
  }

  // LAGHI con linee di riva concentriche
  Object.entries(laghi).forEach(([k, l]) => {
    const d = curvaMorbida(l.punti, true);
    s += `<path d="${d}" fill="${ACQUA}"/><g clip-path="url(#c-${k})">`;
    [[120, .1], [78, .16], [44, .24], [18, .36]].forEach(([w, o]) => {
      s += `<path d="${d}" fill="none" stroke="${AV}" stroke-opacity="${o}" stroke-width="${w}"/><path d="${d}" fill="none" stroke="${ACQUA}" stroke-width="${w - 2.6}"/>`;
    });
    // increspature
    for (let i = 0; i < 16; i++) {
      const x = l.cx + (rnd() - .5) * l.rx * 1.1, y = l.cy + (rnd() - .5) * l.ry * 1.1, w = 14 + rnd() * 26;
      s += `<path d="M${f(x)},${f(y)} q${f(w / 4)},-4 ${f(w / 2)},0 t${f(w / 2)},0" fill="none" stroke="${AV}" stroke-opacity=".2" stroke-width="1.2" stroke-linecap="round"/>`;
    }
    s += `</g><path d="${d}" fill="none" stroke="${AV}" stroke-width="2.3" opacity=".9"/>`;
  });

  // SENTIERI tra le Dieci-Città (tratteggio a puntini)
  const P = pos;
  const sentiero = (a, b, curva) => {
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
    const c = [mx - dy / l * curva, my + dx / l * curva];
    return `<path d="M${f(a[0])},${f(a[1])} Q${f(c[0])},${f(c[1])} ${f(b[0])},${f(b[1])}" fill="none" stroke="${AV}" stroke-opacity=".5" stroke-width="3.2" stroke-linecap="round" stroke-dasharray=".1 12"/>`;
  };
  s += sentiero(P.brynShander, P.targos, 20) + sentiero(P.brynShander, P.termalaine, -40) + sentiero(P.brynShander, P.caerDineval, 30) +
    sentiero(P.brynShander, P.easthaven, 80) + sentiero(P.brynShander, P.goodMead, -20) + sentiero(P.goodMead, P.dougansHole, -40) +
    sentiero(P.targos, P.bremen, -90) + sentiero(P.termalaine, P.lonelywood, -60) + sentiero(P.caerDineval, P.caerKonig, -40) +
    sentiero(P.brynShander, [1170, 1330], 30);

  // TUNDRA: ciuffi d'erba incisi qua e là
  for (let i = 0, fatti = 0; i < 2600 && fatti < 520; i++) {
    const p = [40 + rnd() * 2000, 120 + rnd() * 1250];
    if (inAcqua(p) || dentro(p, ghiaccio.concat([[2440, 70]]))) continue;
    const x = p[0], y = p[1];
    s += `<path d="M${f(x)},${f(y)}l-2.5,-6 M${f(x + 3)},${f(y)}l.5,-8 M${f(x + 6)},${f(y)}l2.5,-5" fill="none" stroke="${AV}" stroke-opacity=".17" stroke-width="1.1" stroke-linecap="round"/>`;
    fatti++;
  }

  // BOSCO intorno a Lonelywood
  const abeti = [];
  for (let i = 0; i < 900 && abeti.length < 70; i++) {
    const a = rnd() * 6.283, r = Math.sqrt(rnd());
    const p = [P.lonelywood[0] - 10 + Math.cos(a) * 250 * r, P.lonelywood[1] - 70 + Math.sin(a) * 85 * r];
    if (inAcqua(p) || Math.hypot(p[0] - P.lonelywood[0], p[1] - P.lonelywood[1]) < 34) continue;
    abeti.push(p);
  }
  abeti.sort((a, b) => a[1] - b[1]).forEach(([x, y]) => {
    const h = 24 + rnd() * 16, w = h * .62;
    s += `<path d="M${f(x)},${f(y - h)} L${f(x + w / 2)},${f(y - h * .25)} L${f(x - w / 2)},${f(y - h * .25)} Z M${f(x)},${f(y - h * .62)} L${f(x + w * .62)},${f(y)} L${f(x - w * .62)},${f(y)} Z" fill="${TERRA}" stroke="${AV}" stroke-opacity=".75" stroke-width="1.3" stroke-linejoin="round"/>`;
  });

  // MONTAGNE: faccia illuminata a sinistra, tratteggio d'ombra a destra
  const monte = (x, y, w, h, opac) => {
    const px = x + w * (.42 + rnd() * .16), py = y - h;
    const mx = px + w * (.04 + rnd() * .08);
    let g = `<path d="M${f(x)},${f(y + 1)} L${f(px)},${f(py)} L${f(x + w)},${f(y + 1)} Z" fill="${TERRA}"/>`;
    for (let t = .14; t < .96; t += .085 + rnd() * .03) {
      const sx = px + (x + w - px) * t, sy = py + (y - py) * t;
      const ex = sx + (mx - px) * (1 - t), ey = y;
      g += `<path d="M${f(sx)},${f(sy)} L${f(ex)},${f(ey - 2)}" stroke="${AV}" stroke-opacity="${.38 * opac}" stroke-width="1.1"/>`;
    }
    g += `<path d="M${f(x)},${f(y)} L${f(px)},${f(py)} L${f(x + w)},${f(y)}" fill="none" stroke="${AV}" stroke-opacity="${.92 * opac}" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>`;
    g += `<path d="M${f(px)},${f(py)} Q${f(px + w * .03)},${f(py + h * .5)} ${f(mx)},${f(y)}" fill="none" stroke="${AV}" stroke-opacity="${.5 * opac}" stroke-width="1.3"/>`;
    // neve in cima
    const nx = px - w * .11, ny = py + h * .2;
    g += `<path d="M${f(nx)},${f(ny)} l${f(w * .05)},${f(-h * .05)} l${f(w * .05)},${f(h * .06)} l${f(w * .05)},${f(-h * .05)} l${f(w * .04)},${f(h * .04)}" fill="none" stroke="${AV}" stroke-opacity="${.7 * opac}" stroke-width="1.2" stroke-linejoin="round"/>`;
    return g;
  };
  const monti = [];
  [[1455, .7, 120, 95], [1545, .85, 150, 125], [1650, 1, 185, 160], [1760, 1, 215, 190]].forEach(([y0, op, wm, hm]) => {
    for (let x = -80 + rnd() * 60; x < W + 40; x += wm * (.55 + rnd() * .35)) monti.push([x, y0 + (rnd() - .5) * 40, wm * (.75 + rnd() * .5), hm * (.7 + rnd() * .5), op]);
  });
  for (let i = 0; i < 16; i++) monti.push([rnd() * W, 1360 + rnd() * 70, 60 + rnd() * 50, 45 + rnd() * 35, .65]);
  monti.sort((a, b) => a[1] - b[1]).forEach(m => { s += monte(m[0], m[1], m[2], m[3], m[4]); });
  // il monte solitario tra i laghi
  s += monte(P.kelvin[0] - 118, P.kelvin[1] + 72, 236, 214, 1);

  // cornice a doppio filetto
  s += `<rect x="16" y="16" width="${W - 32}" height="${H - 32}" fill="none" stroke="${AV}" stroke-opacity=".55" stroke-width="2.2"/>
    <rect x="28" y="28" width="${W - 56}" height="${H - 56}" fill="none" stroke="${AV}" stroke-opacity=".28" stroke-width="1"/>
    <rect width="${W}" height="${H}" filter="url(#grana)"/>`;
  return s + '</svg>';
}

// Disegna la mappa SVG su un canvas e la tiene in cache (WebP) per le aperture successive
async function immagineDemo() {
  try { const b = await idb('get', 'demo:v1'); if (b) return URL.createObjectURL(b); } catch (e) { /* niente cache */ }
  const svgUrl = URL.createObjectURL(new Blob([mappaDemoSVG()], { type: 'image/svg+xml' }));
  try {
    const img = new Image();
    img.src = svgUrl;
    await img.decode();
    const c = document.createElement('canvas');
    c.width = GEO_DEMO.W; c.height = GEO_DEMO.H;
    c.getContext('2d').drawImage(img, 0, 0);
    let blob = await new Promise(r => c.toBlob(r, 'image/webp', .9));
    if (!blob) blob = await new Promise(r => c.toBlob(r, 'image/png'));
    URL.revokeObjectURL(svgUrl);
    try { await idb('put', 'demo:v1', blob); } catch (e) { /* niente cache */ }
    return URL.createObjectURL(blob);
  } catch (e) {
    return svgUrl;   // se il canvas non collabora, uso direttamente l'SVG
  }
}

function competenza(liv) { return liv >= 17 ? 6 : liv >= 13 ? 5 : liv >= 9 ? 4 : liv >= 5 ? 3 : 2; }

// Le classi del personaggio: una, oppure due con la multiclasse (chiaveClasse2, chiaveSotto2, livello2).
// "livello" resta il livello nella prima classe, così le schede di prima non cambiano;
// il livello del personaggio, quello che decide la competenza, è la somma dei due.
// La seconda classe conta solo se la prima è tra quelle pronte, è diversa e ha almeno un livello.
function classiDi(pg) {
  const out = [];
  const cl = REGOLE.classi[pg.chiaveClasse];
  if (!cl) return out;
  out.push({ n: 1, chiave: pg.chiaveClasse, cl, sc: cl.sottoclassi[pg.chiaveSotto], liv: clamp(Number(pg.livello) || 1, 1, 20) });
  const cl2 = REGOLE.classi[pg.chiaveClasse2];
  if (cl2 && pg.chiaveClasse2 !== pg.chiaveClasse && Number(pg.livello2) >= 1) {
    out.push({ n: 2, chiave: pg.chiaveClasse2, cl: cl2, sc: cl2.sottoclassi[pg.chiaveSotto2], liv: clamp(Number(pg.livello2), 1, 19) });
  }
  return out;
}
// La razza del catalogo: quella scelta in Modifica, oppure quella scritta a mano se ha lo stesso nome.
// Il pacchetto scriveva "Warforged" e "Tartaruga" quando nel catalogo non c'erano ancora: così le loro
// schede mostrano i tratti senza dover rifare niente.
function chiaveRazzaDi(pg) {
  if (REGOLE.razze[pg.chiaveRazza]) return pg.chiaveRazza;
  const scritta = norm(pg.razza);
  if (!scritta) return '';
  return Object.keys(REGOLE.razze).find(k => k === scritta || norm(REGOLE.razze[k].nome).indexOf(scritta) === 0) || '';
}
function livelloTotale(pg) {
  const classi = classiDi(pg);
  if (!classi.length) return clamp(Number(pg.livello) || 1, 1, 20);
  return clamp(classi.reduce((t, c) => t + c.liv, 0), 1, 20);
}

// "Mezzorco, Stregone, Magia Selvaggia" (oppure il testo libero scritto nella voce).
// Con due classi: "Mezzorco, Stregone, Magia Selvaggia + Warlock, Hexblade". I livelli non ci sono apposta:
// questo testo finisce anche nel foglio (campo classe) e non deve invecchiare a ogni livello.
function descrizioneClasse(pg) {
  const razza = chiaveRazzaDi(pg) ? REGOLE.razze[chiaveRazzaDi(pg)].nome : (pg.razza || '');
  const classi = classiDi(pg);
  const classe = classi.length ? classi.map(c => c.cl.nome + (c.sc ? ', ' + c.sc.nome : '')).join(' + ') : (pg.classe || '');
  return [razza, classe].filter(Boolean).join(', ');
}

// Valori che dipendono dal livello e dalle caratteristiche, usati nei testi tra graffe.
// La competenza va con il livello del personaggio; il resto (dado di ispirazione, punti stregoneria,
// slot del patto...) con il livello in quella classe.
function valoriScheda(pg) {
  const liv = livelloTotale(pg);
  const car = pg.car || {};
  const comp = competenza(liv);
  const v = {
    livello: liv, competenza: comp, metaCompetenza: Math.floor(comp / 2),
    modCarisma: Math.max(1, Number(car.car) || 0),
    cdCarisma: 8 + comp + (Number(car.car) || 0),
    caSenzaArmatura: car.des !== undefined && car.cos !== undefined ? ' = ' + (10 + (Number(car.des) || 0) + (Number(car.cos) || 0)) : '',
    chefCommensali: 4 + comp
  };
  classiDi(pg).forEach(c => {
    if (c.cl.valori) Object.assign(v, c.cl.valori(c.liv, pg));
    if (c.sc && c.sc.valori) Object.assign(v, c.sc.valori(c.liv, pg));
  });
  // Adepto della metamagia: due opzioni in più, anche per chi non è stregone
  if ((pg.talenti || []).includes('metamagia')) v.nMetamagie = (v.nMetamagie || 0) + 2;
  return v;
}
function riempi(testo, v) { return String(testo || '').replace(/\{(\w+)\}/g, (t, k) => v[k] !== undefined ? v[k] : t); }

// Capacità del personaggio: quelle che ha già e quelle del livello successivo, classe per classe.
// Ogni capacità di classe guarda il livello nella sua classe (n = 1 o 2); razza, talenti e
// capacità aggiunte (n = 0) valgono sempre. Le opzionali di Tasha entrano solo se accese sulla scheda.
function capacitaDi(pg) {
  const classi = classiDi(pg);
  const razza = REGOLE.razze[chiaveRazzaDi(pg)];
  const accese = pg.opzionali || [];
  const tutte = [];
  classi.forEach(c => {
    c.cl.capacita.forEach(x => tutte.push(Object.assign({ fonte: c.cl.nome, n: c.n }, x)));
    if (c.sc) c.sc.capacita.forEach(x => tutte.push(Object.assign({ fonte: c.sc.nome, libro: c.sc.libro, n: c.n }, x)));
    REGOLE.opzionali.forEach(o => {
      if (o.classe === c.chiave && accese.includes(o.id)) tutte.push(Object.assign({ fonte: 'Opzionale da ' + c.cl.nome.toLowerCase(), n: c.n }, o));
    });
  });
  if (razza) razza.capacita.forEach(x => tutte.push(Object.assign({ fonte: razza.nome, libro: razza.libro, liv: 1, n: 0, razza: true }, x)));
  (pg.talenti || []).forEach(k => {
    const t = REGOLE.talenti[k];
    if (t) t.capacita.forEach(x => tutte.push(Object.assign({ fonte: 'Talento', libro: t.libro, pag: t.pag, nomeEn: t.nomeEn, liv: 1, n: 0 }, x)));
  });
  // le capacità aggiunte hanno un id fisso (c.id): togliendone una, i pallini delle altre non si spostano.
  // Quelle create prima della 1.4 non ce l'hanno e usano ancora la posizione.
  (pg.extra || []).forEach((c, i) => tutte.push(Object.assign({ fonte: 'Aggiunta da voi', liv: 1, n: 0, extra: i, risorsa: c.usi ? (c.id ? 'extra-' + c.id : 'extra-' + i) : '' }, c)));

  // Totem del barbaro (pg.totem = { 3: 'orso', 6: 'aquila' }): con l'animale scelto per quel livello
  // resta solo la sua carta; finché non è scelto si vede la carta con i tre animali insieme.
  const totem = pg.totem && typeof pg.totem === 'object' ? pg.totem : {};
  const livClasse = n => { const c = classi.find(k => k.n === n); return c ? c.liv : 0; };
  const daMostrare = tutte.filter(x => x.totem === undefined || (totem[x.liv] ? x.totem === totem[x.liv] : x.totem === ''));
  return {
    attuali: daMostrare.filter(x => x.n === 0 || x.liv <= livClasse(x.n)),
    prossime: daMostrare.filter(x => x.n === 1 && x.liv === livClasse(1) + 1),
    prossime2: daMostrare.filter(x => x.n === 2 && x.liv === livClasse(2) + 1)
  };
}

// Risorse con il loro massimo e il tipo di riposo che le ricarica.
// I Dadi Vita sono un gruppo per classe, perché hanno dadi diversi (dado serve al riposo lungo).
function risorseDi(pg) {
  const classi = classiDi(pg);
  const razza = REGOLE.razze[chiaveRazzaDi(pg)];
  const v = valoriScheda(pg);
  const out = [];
  const aggiungi = (r, n) => {
    // due fonti con lo stesso contatore (con le classi di oggi non succede): il secondo prende un altro id
    out.push(out.some(x => x.id === r.id) ? Object.assign({}, r, { id: r.id + '-' + n }) : r);
  };
  classi.forEach(c => aggiungi({ id: c.n === 1 ? 'dadi-vita' : 'dadi-vita-2', nome: classi.length > 1 ? 'Dadi Vita da ' + c.cl.nome.toLowerCase() : 'Dadi Vita', max: c.liv, dado: c.cl.dado, riposo: 'lungo-meta', nota: 'd' + c.cl.dado + ', li spendi nei riposi brevi' }, c.n));
  classi.forEach(c => [c.cl, c.sc].forEach(f => { if (f && f.risorse) f.risorse(c.liv, pg).forEach(r => aggiungi(r, c.n)); }));
  if (razza && razza.risorse) razza.risorse(v.livello, pg).forEach(r => aggiungi(r, 0));
  (pg.talenti || []).forEach(k => { const t = REGOLE.talenti[k]; if (t && t.risorse) t.risorse(v).forEach(r => aggiungi(r, 0)); });
  (pg.extra || []).forEach((c, i) => { if (c.usi) out.push({ id: c.id ? 'extra-' + c.id : 'extra-' + i, nome: c.nome, max: Number(c.usi), riposo: c.riposo || 'lungo' }); });
  out.forEach(r => { r.nota = riempi(r.nota, v); r.usati = clamp(Number((pg.risorse || {})[r.id]) || 0, 0, r.max); });
  return out;
}

// Nomi dei valori che cambiano salendo di livello, per l'elenco "Al prossimo livello"
const NOMI_VALORI = {
  competenza: 'Bonus di competenza', dadoIspirazione: 'Dado di ispirazione', dadoCanto: 'Canto di riposo',
  dannoIra: "Danni dell'ira", critico: 'Critico brutale', nMetamagie: 'Opzioni di metamagia',
  pfFascino: "Punti ferita del Manto dell'ispirazione", dadiSussurri: 'Lame psichiche',
  valoreCreazione: 'Valore massimo degli oggetti creati (mo)',
  livelloPatto: 'Livello degli slot del patto', nSuppliche: 'Suppliche occulte'
};

function vistaScheda(id) {
  const pg = DB.voci[id];
  if (!visibile(pg) || pg.tipo !== 'pg') return nonTrovato('Questa scheda non esiste più.');
  const classi = classiDi(pg);
  const liv = livelloTotale(pg);
  const multi = classi.length > 1;
  const v = valoriScheda(pg);
  const testa = `<header class="intestazione">${sigillo(pg, 'sigillo--grande')}<div class="corpo">
    <p class="sopra">${pg.giocatore ? 'Giocato da ' + esc(pg.giocatore) : 'Della compagnia'}</p>
    <h1 class="t1">${esc(pg.nome)}</h1><p class="sotto">${esc(descrizioneClasse(pg) || 'Classe non indicata')}</p></div></header>
    <div class="azioni">${bottoneBeyond(pg.link)}
    <button class="btn btn--piccolo" data-a="modifica" data-tab="voci" data-id="${esc(id)}">${ico('modifica')}Modifica</button>
    <a class="btn btn--testo btn--piccolo" href="#/voce/${encodeURIComponent(id)}">Rapporti e cronologia</a></div>`;
  if (!classi.length) {
    const nomiClassi = Object.values(REGOLE.classi).map(c => c.nome).join(', ');
    const nomiRazze = Object.values(REGOLE.razze).map(r => r.nome).join(', ');
    return testa + `<section class="sezione"><div class="lettura fioco"><p>Scegli la classe (e se c'è la sottoclasse) con "Modifica": la scheda mostrerà le capacità del livello, i contatori e cosa si sblocca dopo.</p><p>Classi pronte: ${esc(nomiClassi)}. Razze pronte: ${esc(nomiRazze)}. Per tutto il resto puoi aggiungere capacità a mano.</p></div></section>` + sezioneExtra(pg, id, v) + sezioneNotePrivate(pg);
  }
  let h = testa;
  // Livello: si cambia al volo quando si sale. Con due classi c'è una riga per classe (data-c dice quale)
  h += `<div class="livello${multi ? ' livello--multi' : ''}">` + classi.map(c => `<div class="liv-riga">
      <button class="btn-icona" data-a="liv" data-id="${esc(id)}" data-c="${c.n}" data-d="-1" aria-label="Scendi di livello${multi ? ' da ' + esc(c.cl.nome.toLowerCase()) : ''}" ${c.liv <= 1 ? 'disabled' : ''}>${ico('meno')}</button>
      <div class="liv-num"><span>${multi ? esc(c.cl.nome) : 'Livello'}</span><strong>${c.liv}</strong></div>
      <button class="btn-icona" data-a="liv" data-id="${esc(id)}" data-c="${c.n}" data-d="1" aria-label="Sali di livello${multi ? ' da ' + esc(c.cl.nome.toLowerCase()) : ''}" ${liv >= 20 ? 'disabled' : ''}>${ico('piu')}</button></div>`).join('') +
    `<div class="liv-dati">${multi ? `<div class="liv-info"><span>Livello</span><strong>${liv}</strong></div>` : ''}
    <div class="liv-info"><span>Competenza</span><strong>+${competenza(liv)}</strong></div>
    <div class="liv-info"><span>Dado vita</span><strong>${classi.map(c => 'd' + c.cl.dado).join(' + ')}</strong></div></div></div>`;

  // Risorse con i rombi da toccare
  const ris = risorseDi(pg);
  if (ris.length) {
    h += `<section class="sezione"><h2>Risorse</h2><div class="risorse">` + ris.map(r => {
      const rimasti = r.max - r.usati;
      const pip = r.max > 12 ? `<span class="pip-num">${rimasti} su ${r.max}</span>` : Array.from({ length: r.max }, (_, i) =>
        `<button class="pip ${i < rimasti ? 'on' : ''}" data-a="ris" data-id="${esc(id)}" data-r="${esc(r.id)}" data-on="${i < rimasti ? 1 : 0}" aria-label="${esc(r.nome)}: ${i < rimasti ? 'usa' : 'recupera'}"></button>`).join('');
      const quando = r.riposo === 'breve' ? 'riposo breve o lungo' : r.riposo === 'lungo-meta' ? 'metà con un riposo lungo' : 'riposo lungo';
      return `<div class="risorsa"><div class="r-nome">${esc(r.nome)}</div><div class="pips">${pip}</div>
        <div class="r-nota">${rimasti} su ${r.max}${r.nota ? ', ' + esc(r.nota) : ''}<br>Si ricarica: ${quando}</div>
        ${r.max > 12 ? `<div class="azioni" style="margin-top:6px"><button class="btn btn--piccolo" data-a="ris" data-id="${esc(id)}" data-r="${esc(r.id)}" data-on="1">Usa</button><button class="btn btn--piccolo" data-a="ris" data-id="${esc(id)}" data-r="${esc(r.id)}" data-on="0">Recupera</button></div>` : ''}</div>`;
    }).join('') + `</div><div class="azioni"><button class="btn" data-a="riposo" data-id="${esc(id)}" data-tipo="breve">${ico('orologio')}Riposo breve</button><button class="btn" data-a="riposo" data-id="${esc(id)}" data-tipo="lungo">${ico('lanterna')}Riposo lungo</button></div></section>`;
  }

  // Le capacità, divise per quando si usano
  const { attuali, prossime, prossime2 } = capacitaDi(pg);
  const gruppi = {};
  attuali.forEach(c => (gruppi[c.azione] = gruppi[c.azione] || []).push(c));
  h += `<section class="sezione"><h2>Nel tuo turno</h2>`;
  ORDINE_AZIONI.forEach(a => {
    if (!gruppi[a]) return;
    // le capacità con lo stesso nome a livelli diversi (aumento delle caratteristiche) le mostro una volta
    const visti = new Set();
    const lista = gruppi[a].filter(c => { const k = c.nome + c.fonte; if (visti.has(k)) return false; visti.add(k); return true; });
    h += `<h3 class="gruppo-azione az-${a}">${esc(AZIONI[a])}</h3>` + lista.map(c => cartaCapacita(c, v, id)).join('');
  });
  h += '</section>';

  // Totem del barbaro: un animale al 3° e uno al 6° livello, anche diversi (Manuale pag. 50)
  const totemico = classi.find(c => c.sc && c.sc === REGOLE.classi.barbaro.sottoclassi.totemico);
  if (totemico && totemico.liv >= 3) {
    const scelte = pg.totem && typeof pg.totem === 'object' ? pg.totem : {};
    const ANIMALI = { orso: 'Orso', aquila: 'Aquila', lupo: 'Lupo' };
    h += `<section class="sezione"><h2>Totem</h2>
      <p class="fioco piccolo" style="margin-top:0">Scegli l'animale per ogni livello: tra le capacità resta solo la sua carta. Si può cambiare animale tra il 3° e il 6°. Manuale pag. 50.</p>` +
      [3, 6].filter(l => l <= totemico.liv).map(l => `<div class="totem-riga"><span>${l === 3 ? 'Spirito totemico' : 'Aspetto della bestia'}, ${l}° livello</span>
        <div class="tipi-seg" role="group" aria-label="Animale del ${l}° livello">${Object.entries(ANIMALI).map(([k, n]) => `<button class="chip chip--tasto ${scelte[l] === k ? 'on' : ''}" data-a="totem" data-id="${esc(id)}" data-liv="${l}" data-t="${k}" aria-pressed="${scelte[l] === k}">${n}</button>`).join('')}</div></div>`).join('') + '</section>';
  }

  // Metamagia: si scelgono le opzioni conosciute. Le due di Tasha compaiono solo se accese tra le opzionali;
  // il talento Adepto della metamagia porta due opzioni anche a chi non è stregone.
  const stregone = classi.find(c => c.chiave === 'stregone');
  const adepto = (pg.talenti || []).includes('metamagia');
  if ((stregone && stregone.liv >= 3) || adepto) {
    const tashaMeta = (pg.opzionali || []).includes('tasha-metamagie');
    const opzioni = REGOLE.metamagia.filter(o => !o.tasha || tashaMeta);
    const scelte = (pg.metamagie || []).filter(k => opzioni.some(o => o.id === k));
    h += `<section class="sezione"><h2>Metamagia <span class="conta">${scelte.length} su ${v.nMetamagie || 0}</span></h2>
      <p class="fioco piccolo" style="margin-top:0">Tocca un'opzione per segnarla tra quelle che conosci. Manuale pag. 110${tashaMeta ? '; le due nuove sono in Tasha pag. 66' : ''}.${adepto ? ' Due opzioni arrivano dal talento Adepto della metamagia.' : ''}</p><div class="meta">` +
      opzioni.map(o => `<button class="opz ${scelte.includes(o.id) ? 'on' : ''}" data-a="meta" data-id="${esc(id)}" data-o="${o.id}" aria-pressed="${scelte.includes(o.id)}">
        <span class="opz-testa"><strong>${esc(o.nome)}</strong><span class="costo">${esc(o.costo)}${o.tasha ? ', Tasha' : ''}</span></span><span class="opz-testo">${esc(riempi(o.testo, v))}</span></button>`).join('') + '</div></section>';
  }
  if (stregone && stregone.liv >= 2) {
    h += `<section class="sezione"><h2>Creare slot con i punti</h2><table class="tabella"><thead><tr><th>Slot</th><th>1°</th><th>2°</th><th>3°</th><th>4°</th><th>5°</th></tr></thead>
      <tbody><tr><th>Punti</th><td>2</td><td>3</td><td>5</td><td>6</td><td>7</td></tr></tbody></table>
      <p class="fioco piccolo">Al contrario: uno slot diventa tanti punti quanto il suo livello. Entrambe le cose costano un'azione bonus.${classi.some(c => c.chiave === 'warlock') ? ' Anche gli slot del patto si possono trasformare in punti, e tornano con il riposo breve.' : ''}</p></section>`;
  }

  // Magia selvaggia: dadi pronti per l'impulso
  if (stregone && stregone.sc === REGOLE.classi.stregone.sottoclassi.selvaggia) {
    const tab = cfg('tabellaImpulsi', '');
    h += `<section class="sezione"><h2>Magia selvaggia</h2>
      <div class="azioni" style="margin-top:0"><button class="btn btn--primario" data-a="dado-impulso" data-id="${esc(id)}">Tira il d20 dell'impulso</button>
      <button class="btn" data-a="dado-tabella" data-id="${esc(id)}">Tira sulla tabella (d100)</button></div>
      <form class="riga-dado" data-a="dado-manuale"><span>Tirato al tavolo:</span>
        <select name="dado" aria-label="Dado"><option value="20">d20</option><option value="100">d100</option></select>
        <input type="number" name="n" min="1" max="100" inputmode="numeric" placeholder="Numero" aria-label="Numero uscito" required>
        <button class="btn btn--piccolo" type="submit">Mostra</button></form>
      <div id="esito-dado" class="esito-dado" hidden></div>
      <p class="fioco piccolo">${tab ? 'Con il d100 compare l\'effetto della tabella degli impulsi.' : 'La tabella è a pagina 112 del Manuale: inseritela una volta (o importate il pacchetto) e il risultato compare scritto qui.'}
      ${tab ? '<button class="btn btn--testo btn--piccolo" data-a="impulsi-elenco">Vedi tutta la tabella</button>' : ''}
      <button class="btn btn--testo btn--piccolo" data-a="tabella-impulsi">${tab ? 'Modifica la tabella' : 'Inserisci la tabella'}</button></p></section>`;
  }

  // Capacità opzionali di Tasha: si accendono qui una per una, dopo averle concordate con il Master.
  // Accese, compaiono tra le capacità dal loro livello (e nell'anteprima del livello dopo).
  const disponibili = REGOLE.opzionali.filter(o => classi.some(c => c.chiave === o.classe));
  if (disponibili.length) {
    const accese = (pg.opzionali || []).filter(k => disponibili.some(o => o.id === k));
    h += `<section class="sezione"><h2>Opzionali di Tasha <span class="conta">${accese.length} ${accese.length === 1 ? 'accesa' : 'accese'}</span></h2>
      <p class="fioco piccolo" style="margin-top:0">Il manuale le lascia al Master: accendete solo quelle concordate. Su D&amp;D Beyond vanno accese anche lì, nelle impostazioni del personaggio.</p><div class="meta">` +
      disponibili.map(o => {
        const on = accese.includes(o.id);
        const cl = REGOLE.classi[o.classe];
        return `<button class="opz ${on ? 'on' : ''}" data-a="opz-tasha" data-id="${esc(id)}" data-o="${esc(o.id)}" aria-pressed="${on}">
          <span class="opz-testa"><strong>${esc(o.nome)}</strong><span class="costo">${esc(cl.nome)} ${o.liv}°</span></span>
          <span class="opz-testo">${esc(riempi(o.testo, v))} <span class="fioco">Tasha pag. ${o.pag}.</span></span></button>`;
      }).join('') + '</div></section>';
  }

  // Talenti: prendono il posto di un aumento delle caratteristiche, se il Master li usa.
  // Quelli di razza (Furia orchesca) si offrono solo alla razza giusta.
  const presi = (pg.talenti || []).filter(k => REGOLE.talenti[k]);
  const liberi = Object.entries(REGOLE.talenti).filter(([k, t]) => !presi.includes(k) && (!t.razza || t.razza === chiaveRazzaDi(pg)));
  h += `<section class="sezione"><h2>Talenti <span class="conta">${presi.length}</span></h2>
    <p class="fioco piccolo" style="margin-top:0">Un talento prende il posto di un aumento delle caratteristiche (4° e 8° livello), se il Master li usa: le sue capacità e i suoi contatori compaiono qui sopra.</p>` +
    (presi.length ? `<ul class="elenco-talenti">${presi.map(k => {
      const t = REGOLE.talenti[k];
      return `<li><span><strong>${esc(t.nome)}</strong><span class="fioco piccolo">${esc(t.libro)} pag. ${t.pag} · <i lang="en">${esc(t.nomeEn)}</i></span></span>
        <button class="btn btn--testo btn--piccolo" data-a="talento-togli" data-id="${esc(id)}" data-t="${esc(k)}">Togli</button></li>`;
    }).join('')}</ul>` : '') +
    (liberi.length ? `<label class="campo"><span>Aggiungi un talento</span><select data-a="talento-scegli" data-id="${esc(id)}"><option value="">Scegli…</option>${liberi.map(([k, t]) => `<option value="${esc(k)}">${esc(t.nome)} (${esc(t.libro)} pag. ${t.pag})</option>`).join('')}</select></label>` : '') + '</section>';

  // Cosa arriva al prossimo livello, classe per classe
  if (liv < 20) {
    classi.forEach(c => {
      const dopo = Object.assign({}, pg, { [c.n === 1 ? 'livello' : 'livello2']: c.liv + 1 });
      const ris2 = risorseDi(dopo);
      const v2 = valoriScheda(dopo);
      const cambi = ris2.map(r2 => { const r1 = ris.find(r => r.id === r2.id); return r1 && r1.max !== r2.max ? `${r2.nome}: ${r1.max} → ${r2.max}` : ''; }).filter(Boolean);
      Object.keys(NOMI_VALORI).forEach(k => { if (v[k] !== undefined && v2[k] !== undefined && v2[k] !== v[k]) cambi.push(`${NOMI_VALORI[k]}: ${v[k]} → ${v2[k]}`); });
      const lista = c.n === 1 ? prossime : prossime2;
      h += `<section class="sezione"><h2>${multi ? `Al ${c.liv + 1}° livello da ${esc(c.cl.nome.toLowerCase())}` : `Al ${liv + 1}° livello`}</h2>`;
      if (!lista.length && !cambi.length) h += '<p class="vuoto">Niente di nuovo dalla classe: di solito arrivano punti ferita e incantesimi, che restano su D&amp;D Beyond.</p>';
      if (cambi.length) h += `<ul class="cambi">${cambi.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
      h += lista.map(x => cartaCapacita(x, v2, id, true)).join('');
      if (!c.sc && c.liv + 1 >= (c.cl.livSotto || 3)) h += `<p class="fioco">${c.liv + 1 === (c.cl.livSotto || 3) ? `Al ${c.cl.livSotto || 3}° livello si sceglie` : 'Manca'} la sottoclasse: impostala con "Modifica".</p>`;
      h += '</section>';
    });
  }
  h += sezioneExtra(pg, id, v) + sezioneNotePrivate(pg);
  return h;
}

// Una carta capacità. In fondo: da dove arriva (libro e pagina dei PDF del gruppo) e il nome inglese,
// che serve per ritrovarla su D&D Beyond. Senza libro è il Manuale del Giocatore.
function cartaCapacita(c, v, pgId, futura) {
  const libro = c.libro === undefined ? 'Manuale' : c.libro;
  const fonte = esc(c.fonte) + (c.pag ? `, ${esc(libro || 'Manuale')} pag. ${c.pag}` : libro && libro !== 'Manuale' ? ', ' + esc(libro) : '');
  return `<article class="capacita az-${c.azione}${futura ? ' futura' : ''}">
    <div class="cap-testa"><h4>${esc(c.nome)}</h4>${c.costo ? `<span class="costo">${esc(c.costo)}</span>` : ''}</div>
    <p>${testoRicco(riempi(c.testo, v), 'riga')}</p>
    <div class="cap-piede"><span>${fonte}${c.nomeEn ? ` · <i lang="en">${esc(c.nomeEn)}</i>` : ''}</span>
    ${c.extra !== undefined ? `<button class="btn btn--testo btn--piccolo" data-a="cap-togli" data-id="${esc(pgId)}" data-i="${c.extra}">Togli</button>` : ''}</div></article>`;
}

function sezioneExtra(pg, id, v) {
  const extra = pg.extra || [];
  return `<section class="sezione"><h2>Capacità aggiunte <span class="conta">${extra.length}</span></h2>
    <p class="fioco piccolo" style="margin-top:0">Tratti della razza che non sono nel Manuale, oggetti speciali, regole della casa concesse dal Master.</p>
    <div class="azioni" style="margin-top:0"><button class="btn btn--piccolo" data-a="cap-nuova" data-id="${esc(id)}">${ico('piu')}Aggiungi una capacità</button></div></section>`;
}

// Tabella degli impulsi scritta dal gruppo (righe tipo "01-02 testo"): resta nel vostro foglio, non nell'app

// Risultato di un tiro della magia selvaggia, tirato dall'app o al tavolo: d20 per l'impulso, d100 per la tabella
let ULTIMO_IMPULSO = 0;
function mostraTiroImpulso(n, d100) {
  const box = document.getElementById('esito-dado');
  if (!box) return;
  if (d100) ULTIMO_IMPULSO = n;
  const riga = d100 ? rigaImpulso(n) : '';
  box.innerHTML = `<span class="n">${n}</span><div>${d100
    ? `<strong>Tabella degli impulsi</strong><br>${riga ? esc(riga) : 'Controlla il risultato ' + n + ' a pagina 112 del Manuale.'}`
    : n === 1 ? `<strong>Impulso di magia selvaggia!</strong><br>Tira sulla tabella. <button class="btn btn--primario btn--piccolo" data-a="dado-tabella" style="margin-top:8px">Tira il d100</button>`
      : '<strong>Niente impulso</strong><br>La magia resta sotto controllo, per stavolta.'}</div>`;
  box.hidden = false;
}

// Tutta la tabella in un foglio, con evidenziato l'ultimo risultato uscito
function apriElencoImpulsi() {
  const righe = String(cfg('tabellaImpulsi', '')).split('\n').map(r => r.trim().match(/^(\d{1,3})(?:\s*[-–]\s*(\d{1,3}))?[\s.:)]+(.+)$/)).filter(Boolean);
  const dentro = m => { const a = Number(m[1]) || 100, b = m[2] ? (Number(m[2]) || 100) : a; return ULTIMO_IMPULSO >= Math.min(a, b) && ULTIMO_IMPULSO <= Math.max(a, b); };
  apriFoglio(`<div class="foglio-testa"><h2 class="t2">Impulsi di magia selvaggia</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>
    <p class="fioco" style="margin-top:0">d100, Manuale del Giocatore pagina 112.${ULTIMO_IMPULSO ? ' Evidenziato l\'ultimo risultato: ' + ULTIMO_IMPULSO + '.' : ''}</p>
    <ol class="elenco-impulsi">${righe.map(m => `<li class="${dentro(m) ? 'uscito' : ''}"><b>${esc(m[1])}${m[2] ? '–' + esc(m[2]) : ''}</b><span>${esc(m[3])}</span></li>`).join('')}</ol>`);
  const uscito = document.querySelector('.elenco-impulsi .uscito');
  if (uscito) uscito.scrollIntoView({ block: 'center' });
}

function rigaImpulso(n) {
  const righe = String(cfg('tabellaImpulsi', '')).split('\n');
  for (const r of righe) {
    const m = r.trim().match(/^(\d{1,3})(?:\s*[-–]\s*(\d{1,3}))?[\s.:)]+(.+)$/);
    if (!m) continue;
    const a = Number(m[1]) === 0 ? 100 : Number(m[1]), b = m[2] ? (Number(m[2]) === 0 ? 100 : Number(m[2])) : a;
    if (n >= Math.min(a, b) && n <= Math.max(a, b)) return m[3].trim();
  }
  return '';
}

// =====================================================================
// 8. COMPAGNIA COMMERCIALE (prima versione, regole da rivedere col Master)
// ---------------------------------------------------------------------
// Tutto sta nella tabella "commercio" del foglio, un record per riga con
// il campo "tipo":
//   mezzo      slitte e carri (capacità in carichi, cani, stato)
//   merce      cosa si vende e il prezzo base per carico
//   tratta     da un luogo a un altro, giorni e pericolo (1-5)
//   contratto  una città che chiede una merce, quanti carichi, a che prezzo
//   oggetto    equipaggiamento per i conducenti, diviso per categoria
//   evento     una riga della tabella degli eventi (intervallo del tiro + effetti)
//   spedizione un viaggio: chi, cosa, dove, il tiro e l'esito
//   movimento  entrate e uscite della cassa
// I conducenti sono PNG del wiki con in più: conducente=1, abilita (0-3),
// paga (mo a viaggio) ed equip { arma, protezione, attrezzatura }.
//
// Come si risolve una spedizione:
//   tiro = d100 + modificatore
//   modificatore = abilità del conducente x5 + bonus dell'equipaggiamento
//                  + scorta (+10) - pericolo della tratta x5 + meteo (neve -5, bufera -15)
//                  - 10 se il mezzo è danneggiato
//   Il totale sceglie la riga della tabella eventi. Un 1 naturale è sempre
//   la prima riga, un 100 naturale sempre l'ultima.
//   Se l'evento è "attenuato" da una categoria (per esempio l'assalto
//   dall'arma) e il conducente ha un oggetto di quella categoria, la perdita
//   e il ritardo si dimezzano, la morte diventa una ferita e un mezzo perso
//   diventa danneggiato.
// I numeri della formula si cambiano dalla sezione Regole.
//
// Dalla 1.5 ci sono anche i numeri di Rime of the Frostmaiden (pag. 19-20): prezzo di slitte,
// cani e becchi d'ascia, quanto tira un cane, legna e olio di balena. Il "carico" resta un'unità
// dell'app: per passare dalle libbre del manuale ai carichi conto 100 libbre a carico.
// =====================================================================
const CATEGORIE_EQUIP = { arma: 'Arma', protezione: 'Protezione', attrezzatura: 'Attrezzatura' };
// Rime pag. 20: slitta vuota 20 mo e 300 libbre con posto per un conducente; cane 50 mo, tira 360 libbre;
// becco d'ascia 50 mo, porta quanto un mulo (420 libbre, Manuale pag. 157). Il conducente con
// l'equipaggiamento lo conto circa 200 libbre: è una stima dell'app, non del manuale.
const NUMERI_RIME = { slitta: 20, pesoSlitta: 300, cane: 50, tiroCane: 360, becco: 50, caricoBecco: 420, libbre: 100, conducente: 200 };
// Quanti carichi tira una muta: 360 libbre a cane, meno la slitta e il conducente
function carichiCani(cani) {
  const n = Number(cani) || 0;
  if (n <= 0) return 0;
  return Math.max(0, Math.floor((n * NUMERI_RIME.tiroCane - NUMERI_RIME.pesoSlitta - NUMERI_RIME.conducente) / NUMERI_RIME.libbre));
}
const METEO = { sereno: 'Cielo sereno', neve: 'Neve', bufera: 'Bufera' };
const REGOLE_COMMERCIO_BASE = { abilita: 5, scorta: 10, pericolo: 5, neve: -5, bufera: -15, danneggiato: -10, costoScorta: 5 };

function regoleCommercio() {
  const salvate = cfg('regoleCommercio', null);
  return Object.assign({}, REGOLE_COMMERCIO_BASE, salvate && typeof salvate === 'object' ? salvate : {});
}
function comm(tipo, filtro) { return elenco('commercio', r => r.tipo === tipo && (!filtro || filtro(r))); }
function saldoCassa() { return comm('movimento').reduce((s, m) => s + (Number(m.importo) || 0), 0); }
function mo(n) {
  const v = Math.round((Number(n) || 0) * 10) / 10;
  return v.toLocaleString('it-IT', { maximumFractionDigits: 1 }) + ' mo';
}
function nomeTratta(tr) { return tr ? nomeDi(tr.da) + ' → ' + nomeDi(tr.a) : 'Tratta sconosciuta'; }

function opzioniComm(tipo) {
  const o = { '': 'Scegli' };
  comm(tipo).sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'it')).forEach(r => { o[r.id] = r.nome; });

}

// Il modificatore del tiro, voce per voce (serve anche per spiegarlo a schermo)
function modificatoreSpedizione(sp) {
  const R = regoleCommercio();
  const righe = [];
  const cond = DB.voci[sp.conducente];
  const tr = DB.commercio[sp.tratta];
  const mz = DB.commercio[sp.mezzo];
  if (cond) {
    const a = Number(cond.abilita) || 0;
    if (a) righe.push(['Esperienza di ' + cond.nome, a * R.abilita]);
    Object.keys(CATEGORIE_EQUIP).forEach(cat => {
      const o = DB.commercio[(cond.equip || {})[cat]];
      if (o && visibile(o) && Number(o.bonus)) righe.push([o.nome, Number(o.bonus)]);
    });
  }
  if (Number(sp.scorta)) righe.push(['Scorta armata', R.scorta]);
  if (tr && Number(tr.pericolo)) righe.push(['Pericolo della tratta', -Number(tr.pericolo) * R.pericolo]);
  if (sp.meteo === 'neve') righe.push([METEO.neve, R.neve]);
  if (sp.meteo === 'bufera') righe.push([METEO.bufera, R.bufera]);
  if (mz && mz.stato === 'danneggiato') righe.push(['Mezzo danneggiato', R.danneggiato]);
  return { righe, totale: righe.reduce((s, r) => s + r[1], 0) };
}

function eventoPer(totale, dado) {
  const ev = comm('evento').sort((a, b) => (Number(a.min) || 0) - (Number(b.min) || 0));
  if (!ev.length) return null;
  if (dado === 1) return ev[0];
  if (dado === 100) return ev[ev.length - 1];
  return ev.find(e => totale >= Number(e.min) && totale <= Number(e.max)) || (totale < Number(ev[0].min) ? ev[0] : ev[ev.length - 1]);
}

// Calcola cosa succede con un certo tiro, senza salvare niente
function calcolaEsito(sp, dado) {
  const R = regoleCommercio();
  const m = modificatoreSpedizione(sp);
  const totale = dado + m.totale;
  const ev = eventoPer(totale, dado);
  if (!ev) return null;
  const cond = DB.voci[sp.conducente];
  const tr = DB.commercio[sp.tratta];
  const merce = DB.commercio[sp.merce];
  const contr = DB.commercio[sp.contratto];
  let perdita = Number(ev.perdita) || 0, ritardo = Number(ev.giorni) || 0;
  let aCond = ev.conducente || '', aMezzo = ev.mezzo || '';
  const note = [];
  const oggetto = ev.mitiga && cond ? DB.commercio[(cond.equip || {})[ev.mitiga]] : null;
  if (oggetto && visibile(oggetto)) {
    perdita = Math.floor(perdita / 2);
    if (ritardo > 0) ritardo = Math.floor(ritardo / 2);
    aCond = aCond === 'morto' ? 'ferito' : '';
    aMezzo = aMezzo === 'perso' ? 'danneggiato' : '';
    note.push(oggetto.nome + " attenua l'evento");
  }
  const qta = Number(sp.quantita) || 0;
  const arrivati = Math.floor(qta * (100 - clamp(perdita, 0, 100)) / 100);
  const base = contr && Number(contr.prezzo) ? Number(contr.prezzo) : (merce ? Number(merce.prezzo) || 0 : 0);
  const prezzoUnit = base * (100 + (Number(ev.prezzo) || 0)) / 100;
  const lordo = Math.round(arrivati * prezzoUnit * 10) / 10;
  const costi = (cond ? Number(cond.paga) || 0 : 0) + (Number(sp.scorta) ? R.costoScorta : 0);
  return {
    dado, mod: m.totale, totale, evento: ev, perdita, giorni: Math.max(1, (tr ? Number(tr.giorni) || 1 : 1) + ritardo),
    arrivati, qta, prezzoUnit, lordo, costi, netto: Math.round((lordo - costi) * 10) / 10, conducente: aCond, mezzo: aMezzo, note
  };
}

// Applica le conseguenze di un esito già registrato: cassa, contratto, conducente, mezzo
function applicaEffetti(sp) {
  const e = sp.esito;
  // una spedizione entra in cassa una volta sola: un doppio tocco su "Registra" o su "Rivela"
  // prima creava due movimenti (e raddoppiava anche i carichi consegnati)
  if (!e || sp.effetti || Object.values(DB.commercio).some(c => c.tipo === 'movimento' && c.spedizione === sp.id && !c.eliminato)) return;
  salva('commercio', { id: sp.id, effetti: 1 });
  const tr = DB.commercio[sp.tratta];
  const cond = DB.voci[sp.conducente];
  const percorso = nomeTratta(tr);
  salva('commercio', { tipo: 'movimento', testo: `${percorso}: ${e.nome}`, importo: e.netto, data: oggiISO(), spedizione: sp.id });
  const contr = DB.commercio[sp.contratto];
  if (contr && e.arrivati) {
    const consegnati = (Number(contr.consegnati) || 0) + e.arrivati;
    salva('commercio', { id: contr.id, consegnati, stato: consegnati >= (Number(contr.quantita) || 0) && Number(contr.quantita) ? 'chiuso' : contr.stato || 'aperto' });
  }
  if (cond && e.conducente) {
    const riga = { s: ultimaSessioneId() || '', t: (e.conducente === 'morto' ? 'Muore' : 'Resta ferito') + ' sulla tratta ' + percorso + ' (' + e.nome.toLowerCase() + ').' };
    salva('voci', Object.assign({ id: cond.id, storia: (cond.storia || []).concat([riga]) }, e.conducente === 'morto' ? { stato: 'morto' } : {}));
  }
  const mz = DB.commercio[sp.mezzo];
  if (mz && e.mezzo) salva('commercio', { id: mz.id, stato: e.mezzo });
}

function registraEsito(spId, dado, segreto) {
  const sp = DB.commercio[spId];
  if (!sp) return;
  // già registrata e già entrata in cassa: il secondo tocco non fa niente (un esito ancora segreto si può rifare)
  if (sp.risolta && (sp.effetti || !sp.segreto)) { chiudiFoglio(); avviso('Questa spedizione è già registrata'); return; }
  const e = calcolaEsito(sp, dado);
  if (!e) { avviso('Manca la tabella degli eventi: preparala nella sezione Regole'); return; }
  const esito = { nome: e.evento.nome, testo: e.evento.testo || '', arrivati: e.arrivati, qta: e.qta, giorni: e.giorni, lordo: e.lordo, costi: e.costi, netto: e.netto, conducente: e.conducente, mezzo: e.mezzo, note: e.note, perdita: e.perdita };
  const rec = salva('commercio', { id: sp.id, stato: e.arrivati > 0 ? 'arrivata' : 'persa', dado, mod: e.mod, totale: e.totale, evento: e.evento.id, esito, risolta: new Date().toISOString(), segreto: segreto ? 1 : 0 });
  // un esito segreto non tocca ancora cassa, conducente e mezzo: lo fa quando il Master lo rivela
  if (!segreto) applicaEffetti(rec);
  chiudiFoglio();
  avviso(segreto ? 'Esito salvato in segreto: rivelalo quando vuoi' : 'Spedizione registrata: ' + mo(e.netto));
  render();
}

    if (Number(e.giorni) < 0) x.push(`${e.giorni} ${Number(e.giorni) === -1 ? 'giorno' : 'giorni'}`);
    if (Number(e.prezzo)) x.push(`prezzo +${e.prezzo}%`);
    if (e.conducente === 'morto') x.push('il conducente muore');
    if (e.conducente === 'ferito') x.push('il conducente torna ferito');
    if (e.mezzo === 'perso') x.push('il mezzo va perso');

  };
  const eventi = comm('evento').sort((a, b) => (Number(a.min) || 0) - (Number(b.min) || 0));

  const attenuati = cat => eventi.filter(e => e.mitiga === cat).map(e => esc(e.nome)).join(', ');
  apriFoglio(`<div class="foglio-testa"><h2 class="t2">Come si gioca</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>
    <section class="legenda-sez"><h3 class="t3">Il giro di una spedizione</h3><ol class="passi-legenda">
      <li><strong>Preparate</strong> mezzo (slitta, carro o barca), conducente e merce. Se c'è un contratto, la merce va lì.</li>
      <li><strong>Partite</strong> scegliendo tratta, meteo ed eventuale scorta: vedete subito il modificatore.</li>
      <li><strong>Risolvete</strong> quando il Master lo dice: tira l'app, oppure scrivete il d100 tirato al tavolo. Il Master può tirare in segreto.</li>
      <li><strong>Registrate</strong> l'esito: carichi arrivati, ricavo, paga e scorta. Il guadagno netto entra nella cassa.</li></ol></section>
