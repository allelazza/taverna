// DB: una "tabella" per foglio del Google Sheet, ogni record indicizzato per id
let DB = vuotoDB();
// OUTBOX: modifiche non ancora inviate al foglio. Chiave "tabella|id", valore = solo i campi cambiati
let OUTBOX = {};
// BASI: per ogni campo in coda, il valore che c'era prima della mia modifica (stessa chiave di OUTBOX).
// Serve a capire se nel frattempo qualcun altro ha cambiato lo stesso campo sul foglio.
// BASI[k]._inviato: l'ultima spedizione rimasta senza risposta (firma e campi), vedi sincronizza.
let BASI = {};
// CONFLITTI: campi cambiati sia da me sia da un altro telefono, da far scegliere a chi usa l'app
let CONFLITTI = [];
// Impostazioni di questo dispositivo (non sincronizzate)
let IMPOST = { url: '', chiave: '', chiaveMaster: '', io: '', pg: '', neve: true, percorso: true, ultimoSync: 0, master: false };
// Taccuino della sessione in corso (segnalibri con l'orario), solo su questo dispositivo
let TACCUINO = { inizio: null, fine: null, note: [] };
// Indice ricostruito al volo (nomi, menzioni, chi sta dove...). null = da ricalcolare
let IDX = null;
const SYNC = { inCorso: false, ancora: false, timer: 0, stato: 'locale', errore: '', ultimo: 0 };

function vuotoDB() { const d = {}; TABELLE.forEach(t => { d[t] = {}; }); return d; }

// ---------------------------------------------------------------------
// SALVATAGGIO LOCALE
// ---------------------------------------------------------------------
function caricaLocale() {
  try {
    const d = JSON.parse(localStorage.getItem('taverna.db') || 'null');
    if (d) TABELLE.forEach(t => { DB[t] = d[t] || {}; });
    // ripulisco anche quello che è già nel browser: celle rovinate arrivate con le versioni precedenti
    TABELLE.forEach(t => Object.values(DB[t]).forEach(normalizza));
    OUTBOX = JSON.parse(localStorage.getItem('taverna.outbox') || '{}');
    BASI = JSON.parse(localStorage.getItem('taverna.basi') || '{}');
    CONFLITTI = JSON.parse(localStorage.getItem('taverna.conflitti') || '[]');
    Object.assign(IMPOST, JSON.parse(localStorage.getItem('taverna.impost') || '{}'));
    Object.assign(TACCUINO, JSON.parse(localStorage.getItem('taverna.taccuino') || '{}'));
    // l'archivio salvato può essere più vecchio dell'ultima sincronizzazione (memoria piena):
    // riparto dal suo segno, e se manca del tutto riscarico tutto dal foglio
    if (!d) IMPOST.ultimoSync = 0;
    else if (d._sync !== undefined) IMPOST.ultimoSync = Math.min(Number(IMPOST.ultimoSync) || 0, Number(d._sync) || 0);
    // un record nuovo che non è entrato nell'archivio è comunque nella coda: lo rimetto in vista
    Object.keys(OUTBOX).forEach(k => {
      const t = k.split('|')[0], id = k.slice(t.length + 1);
      if (DB[t] && !DB[t][id]) DB[t][id] = normalizza(Object.assign({}, OUTBOX[k]));
    });
  } catch (e) {
    console.warn('Dati locali illeggibili', e);
  }
}

/**
 * Scrive i dati nel browser. La coda (OUTBOX) va scritta per prima: è piccola e contiene
 * le modifiche non ancora arrivate al foglio. Se lo spazio finisce sull'archivio,
 * almeno la coda resta e al prossimo avvio parte comunque (prima andava persa).
 */
let AVVISO_MEMORIA = 0;
function salvaLocale(cosa) {
  const scrivi = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
  let ok = true;
  if (!cosa || cosa === 'db') {
    const collegato = !!(IMPOST.url && IMPOST.chiave);
    const coda = () => scrivi('taverna.outbox', JSON.stringify(OUTBOX)) && scrivi('taverna.basi', JSON.stringify(BASI)) && scrivi('taverna.conflitti', JSON.stringify(CONFLITTI));
    // l'archivio porta con sé il segno dell'ultima sincronizzazione: se un salvataggio non riesce,
    // al prossimo avvio riparto da quello dell'archivio salvato e non perdo le righe arrivate nel frattempo
    const archivio = () => scrivi('taverna.db', JSON.stringify(Object.assign({ _sync: Number(IMPOST.ultimoSync) || 0 }, DB)));
    let codaOk = coda();
    if (!codaOk) {
      // la coda viene prima di tutto. Libero lo spazio che si può riavere: la bozza dell'import si rifà,
      // e l'archivio, se c'è il foglio, si riscarica intero al prossimo giro (senza foglio invece è l'unica copia: non lo tocco)
      localStorage.removeItem('taverna.bozzaImport');
      codaOk = coda();
      if (!codaOk && collegato) { localStorage.removeItem('taverna.db'); codaOk = coda(); }
    }
    ok = codaOk;
    if (!archivio()) {
      localStorage.removeItem('taverna.bozzaImport');
      if (!archivio()) ok = false;
    }
  }
  if (!cosa || cosa === 'impost') ok = scrivi('taverna.impost', JSON.stringify(IMPOST)) && ok;
  if (!cosa || cosa === 'taccuino') ok = scrivi('taverna.taccuino', JSON.stringify(TACCUINO)) && ok;
  if (!ok && Date.now() - AVVISO_MEMORIA > 60000) {
    AVVISO_MEMORIA = Date.now();
    avviso('La memoria del browser è quasi piena: sincronizza, poi esporta un backup dalle impostazioni');
  }
  return ok;
}
// Salvataggio raggruppato: dieci salva() di fila (import, pacchetto, ripristino) scrivono l'archivio una volta sola.
// Prima ogni salva() riscriveva tutto: su Android un import bloccava lo schermo per secondi.
let TIMER_SALVA = 0;
function salvaLocaleDopo() { clearTimeout(TIMER_SALVA); TIMER_SALVA = setTimeout(() => { TIMER_SALVA = 0; salvaLocale('db'); }, 250); }
function salvaLocaleSubito() { if (TIMER_SALVA) { clearTimeout(TIMER_SALVA); TIMER_SALVA = 0; } return salvaLocale(); }

// Confronto di due valori che non dipende dall'ordine delle chiavi degli oggetti
function canonico(v) {
  if (Array.isArray(v)) return '[' + v.map(canonico).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canonico(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? '' : v);
}
function uguali(a, b) { return canonico(a === undefined ? '' : a) === canonico(b === undefined ? '' : b); }
// Quanti caratteri occupa un valore nella cella del foglio
function lunghezzaCella(v) { return typeof v === 'string' ? v.length : v && typeof v === 'object' ? JSON.stringify(v).length : String(v === undefined ? '' : v).length; }

/**
 * Crea o aggiorna un record e lo mette in coda per il foglio del gruppo.
 * In coda finiscono SOLO i campi cambiati: se due persone modificano
 * campi diversi della stessa voce, nessuna delle due perde la sua modifica.
 * Per ogni campo in coda ricordo anche il valore di partenza (BASI): quando
 * arriva il foglio capisco se lo stesso campo è stato cambiato anche da altri.
 * opz.locale = true  -> non sincronizzare (usato dai dati di esempio)
 * opz.zitto = true   -> nessun avviso se un campo è troppo lungo (lo gestisce chi chiama)
 */
function salva(tab, rec, opz) {
  opz = opz || {};
  if (!rec.id) rec.id = nuovoId(tab);
  const nuovo = !DB[tab][rec.id];
  const prima = DB[tab][rec.id] || {};
  const cambi = {};
  const lunghi = [];
  for (const k in rec) {
    if (k === 'id') continue;
    const v = rec[k] === undefined ? '' : rec[k];
    if (uguali(prima[k], v)) continue;
    // un campo che non ci sta nella cella non parte e non cambia nemmeno qui: resteremmo diversi dagli altri telefoni
    if (lunghezzaCella(v) > LIMITE_CAMPO) { lunghi.push(k); continue; }
    cambi[k] = v;
  }
  if (lunghi.length && !opz.zitto) avviso(`Troppo lungo per il foglio (${lunghi.join(', ')}): il massimo è ${LIMITE_CAMPO.toLocaleString('it-IT')} caratteri. Accorcialo.`);
  if (!nuovo && !Object.keys(cambi).length) return prima;
  const dopo = Object.assign({}, prima, cambi, { id: rec.id });
  dopo.agg = new Date().toISOString();
  dopo.autore = IMPOST.io || '';
  DB[tab][rec.id] = dopo;
  // I dati di esempio restano su questo dispositivo: non finiscono mai nel foglio del gruppo
  if (!dopo.demo && !opz.locale) {
    const k = tab + '|' + rec.id;
    const b = BASI[k] = BASI[k] || {};
    Object.keys(cambi).forEach(c => { if (!(c in b)) b[c] = prima[c] === undefined ? '' : prima[c]; });
    OUTBOX[k] = Object.assign({}, OUTBOX[k] || {}, cambi, { id: rec.id, agg: dopo.agg, autore: dopo.autore });
    programmaSync();
  }
  IDX = null;
  salvaLocaleDopo();
  return dopo;
}

// Eliminazione "morbida": il record resta con eliminato=1 così la cancellazione arriva anche agli altri
function elimina(tab, id) {
  if (DB[tab][id]) salva(tab, { id, eliminato: 1 });
}

function nuovoId(tab) {
  const p = { sessioni: 'ses', voci: 'voc', missioni: 'mis', rapporti: 'rap', mappe: 'map', config: 'cfg', commercio: 'com' }[tab] || 'x';
  return p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

// Un record è visibile se non è eliminato e, se segreto, solo al Master (o in modalità solo locale)
function visibile(r) {
  return !!r && !r.eliminato && (!r.segreto || IMPOST.master || !IMPOST.url);
}
function elenco(tab, filtro) {
  return Object.values(DB[tab]).filter(r => visibile(r) && (!filtro || filtro(r)));
}
function cfg(k, def) {
  const r = DB.config[k];
  return r && !r.eliminato && r.valore !== undefined && r.valore !== '' ? r.valore : def;
}
// demo = true solo per i dati di esempio (restano su questo dispositivo)
function setCfg(k, v, demo) { salva('config', { id: k, valore: v, demo: demo ? 1 : 0 }, demo ? { locale: true } : {}); }

// I valori che arrivano dal foglio sono testo: riporto a numero i campi numerici,
// e a elenco o oggetto i campi che devono esserlo (una cella rovinata non deve far cadere le viste)
function normalizza(r) {
  CAMPI_NUMERICI.forEach(k => {
    if (r[k] !== undefined && r[k] !== '' && typeof r[k] !== 'number') {
      const n = Number(r[k]);
      if (!isNaN(n)) r[k] = n;
    }
  });
  const leggi = v => { try { return JSON.parse(v); } catch (e) { return undefined; } };
  CAMPI_ELENCO.forEach(k => {
    if (r[k] === undefined || r[k] === '' || Array.isArray(r[k])) return;
    const j = typeof r[k] === 'string' ? leggi(r[k]) : undefined;
    // gli alias scritti a mano nel foglio ("Sven, il conducente") diventano un elenco; il resto, se illeggibile, si svuota
    r[k] = Array.isArray(j) ? j : k === 'alias' && typeof r[k] === 'string' ? r[k].split(',').map(s => s.trim()).filter(Boolean) : [];
  });
  CAMPI_OGGETTO.forEach(k => {
    if (r[k] === undefined || r[k] === '' || (r[k] && typeof r[k] === 'object' && !Array.isArray(r[k]))) return;
    const j = typeof r[k] === 'string' ? leggi(r[k]) : undefined;
    r[k] = j && typeof j === 'object' && !Array.isArray(j) ? j : {};
  });
  CAMPI_TESTO.forEach(k => { if (r[k] !== null && typeof r[k] === 'object') r[k] = JSON.stringify(r[k]); });
  return r;
}

// ---------------------------------------------------------------------
// IMMAGINI IN INDEXEDDB (mappe e loro cache)
// azione: 'get' | 'put' | 'del'
// ---------------------------------------------------------------------
function idb(azione, chiave, valore) {
  return new Promise((ok, ko) => {
    const req = indexedDB.open('taverna', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('immagini');
    req.onerror = () => ko(req.error);
    req.onsuccess = () => {
      const db = req.result;
      const tx = db.transaction('immagini', azione === 'get' ? 'readonly' : 'readwrite');
      const st = tx.objectStore('immagini');
      const r = azione === 'get' ? st.get(chiave) : azione === 'put' ? st.put(valore, chiave) : st.delete(chiave);
      r.onsuccess = () => ok(r.result);
      r.onerror = () => ko(r.error);
      tx.oncomplete = () => db.close();
    };
  });
}

// ---------------------------------------------------------------------
// SINCRONIZZAZIONE CON IL FOGLIO DEL GRUPPO (Apps Script)
// ---------------------------------------------------------------------
function programmaSync(ritardo) {
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(sincronizza, ritardo || 2500);
  aggiornaStatoSync();
}

/**
 * Chiamata alla web app. Uso POST con Content-Type text/plain perché
 * Apps Script non gestisce la richiesta preliminare CORS (OPTIONS).
 */
async function chiamaServer(dati, timeoutMs) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs || 30000);
  try {
    const corpo = Object.assign({ chiave: IMPOST.chiave, chiaveMaster: IMPOST.chiaveMaster }, dati);
    const r = await fetch(IMPOST.url, {
      method: 'POST', body: JSON.stringify(corpo), redirect: 'follow', signal: ctrl.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    });
    const testo = await r.text();
    let j;
    try { j = JSON.parse(testo); } catch (e) { throw new Error("Il server non ha risposto con dati validi: controlla l'URL della web app"); }
    if (!j.ok) throw new Error(j.errore || 'Errore del server');
    return j;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Il server non risponde (tempo scaduto)');
    if (e instanceof TypeError) throw new Error('Impossibile raggiungere il server: controlla la connessione e l\'URL');
    throw e;
  } finally {
    clearTimeout(t);
  }
}

/**
 * Sincronizzazione in due tempi:
 *  1) ricevo tutto quello che è cambiato sul foglio dall'ultima volta, con un minuto di margine
 *     (gli orologi dei server Google possono essere sfasati: riapplicare una riga già vista non fa danni)
 *  2) confronto con la mia coda e invio solo i campi cambiati
 * Prima si inviava e poi si riceveva: un telefono rimasto offline per giorni sovrascriveva
 * in silenzio modifiche più recenti. Adesso, se lo stesso campo è cambiato anche sul foglio:
 *  - elenchi (storia, alias, favori...) e oggetti (risorse, fiocchi...) si uniscono da soli;
 *  - i contatori (rapporti, carichi consegnati) sommano le due variazioni;
 *  - per testi e valori semplici tengo quello del foglio e chiedo all'utente (CONFLITTI).
 * Se un record arriva dal foglio ma io ho ancora una modifica in coda, riapplico la mia sopra.
 */
async function sincronizza(manuale) {
  manuale = manuale === true;
  if (!IMPOST.url || !IMPOST.chiave) {
    SYNC.stato = 'locale'; aggiornaStatoSync();
    if (manuale) avviso('Collega prima il foglio del gruppo nelle impostazioni');
    return;
  }
  if (!navigator.onLine) { SYNC.stato = 'offline'; aggiornaStatoSync(); if (manuale) avviso('Sei offline: invierò le modifiche appena torna la rete'); return; }
  if (SYNC.inCorso) { SYNC.ancora = true; return; }
  SYNC.inCorso = true; SYNC.stato = 'sync'; SYNC.errore = ''; aggiornaStatoSync();
  try {
    // 1) ricevo
    const r = await chiamaServer({ azione: 'pull', dal: Math.max(0, (Number(IMPOST.ultimoSync) || 0) - 60000) });
    let arrivate = 0, conflitti = 0;
    TABELLE.forEach(tab => (r.dati[tab] || []).forEach(riga => {
      normalizza(riga);
      const k = tab + '|' + riga.id;
      if (OUTBOX[k]) conflitti += confrontaConCoda(tab, k, riga);
      const nuovo = OUTBOX[k] ? Object.assign({}, riga, OUTBOX[k]) : riga;
      // le mie stesse modifiche tornano indietro dal foglio: se non cambia niente non ridisegno
      if (!stessoRecord(DB[tab][riga.id], nuovo)) arrivate++;
      DB[tab][riga.id] = nuovo;
    }));
    const eraMaster = IMPOST.master;
    IMPOST.master = !!r.master;
    IMPOST.versioneScript = Number(r.versione) || 1;
    IMPOST.ultimoSync = r.ora;
    if (conflitti) avviso(conflitti === 1 ? 'Un campo è stato cambiato anche da un altro telefono: tocca il pallino in alto per scegliere' : conflitti + ' campi cambiati anche da altri telefoni: tocca il pallino in alto per scegliere');

    // 2) invio la coda. Con uno script vecchio (senza la tabella commercio) quelle modifiche restano in coda, così non si perdono
    const inviate = Object.assign({}, OUTBOX);
    const vecchio = (IMPOST.versioneScript || 1) < VERSIONE_SCRIPT;
    const chiavi = Object.keys(inviate).filter(k => !(vecchio && k.indexOf('commercio|') === 0));
    if (chiavi.length) {
      // se la risposta si perde (rete che cade a metà, telefono bloccato subito dopo un tocco) non so se il
      // foglio ha scritto: mi segno cosa ho mandato e con quale firma (agg). Al prossimo giro, se il foglio
      // porta la mia firma, lo riconosco come mio e non lo conto due volte (vedi confrontaConCoda)
      chiavi.forEach(k => { if (BASI[k]) BASI[k]._inviato = { agg: inviate[k].agg, campi: inviate[k] }; });
      try { localStorage.setItem('taverna.basi', JSON.stringify(BASI)); } catch (e) { /* lo salva il giro dopo */ }
      const risp = await chiamaServer({ azione: 'push', modifiche: chiavi.map(k => ({ tab: k.split('|')[0], patch: inviate[k] })) });
      // tolgo dalla coda solo quello che ho inviato e che nel frattempo non è stato modificato di nuovo;
      // se è stato modificato, il valore appena inviato diventa la nuova base di quei campi
      // Code.gs 3 risponde con "scartati": i campi troppo lunghi (rifiutati, non più tagliati) e le
      // modifiche di tabelle che lo script non conosce ancora (riprova: restano in coda per il prossimo giro)
      const scartati = risp.scartati || [];
      const daRiprovare = new Set(scartati.filter(x => x.riprova).map(x => x.tab + '|' + x.id));
      chiavi.forEach(k => {
        if (BASI[k]) delete BASI[k]._inviato;
        if (daRiprovare.has(k)) return;
        if (OUTBOX[k] === inviate[k]) { delete OUTBOX[k]; delete BASI[k]; return; }
        if (BASI[k]) Object.keys(inviate[k]).forEach(f => { if (f in BASI[k]) BASI[k][f] = inviate[k][f]; });
      });
      const lunghi = scartati.filter(x => !x.riprova);
      if (lunghi.length) avviso('Il foglio non ha accettato ' + lunghi.map(x => titoloRecord(x.tab, DB[x.tab] && DB[x.tab][x.id] || { id: x.id }) + ' → ' + x.campo + (x.motivo ? ' (' + x.motivo + ')' : '')).join(', ') + ': il valore resta solo su questo telefono');
      if (daRiprovare.size) SYNC.errore = 'Lo script del foglio non conosce ancora alcune tabelle: incolla il nuovo Code.gs e pubblica una nuova versione';
    }
    salvaLocaleSubito();
    SYNC.stato = Object.keys(OUTBOX).length ? 'coda' : 'ok';
    if (IMPOST.versioneScript < VERSIONE_SCRIPT) SYNC.errore = "Lo script del foglio è vecchio: incolla il nuovo Code.gs e pubblica una nuova versione";
    if (SYNC.errore) SYNC.stato = 'errore';
    SYNC.ultimo = Date.now();
    if (arrivate || eraMaster !== IMPOST.master) { IDX = null; ridisegna(); }
  } catch (e) {
    SYNC.stato = 'errore';
    SYNC.errore = e.message;
    if (manuale) avviso(e.message);
  } finally {
    SYNC.inCorso = false;
    aggiornaStatoSync();
    if (SYNC.ancora) { SYNC.ancora = false; programmaSync(400); }
  }
}

/**
 * Confronto a tre vie per un record che ho in coda e che è appena arrivato dal foglio:
 * base = valore prima della mia modifica, loro = foglio, mio = coda.
 * Restituisce quanti conflitti ha lasciato da risolvere all'utente.
 */
function confrontaConCoda(tab, k, riga) {
  const patch = OUTBOX[k], basi = BASI[k] || {};
  // la mia ultima spedizione di questo record era rimasta senza risposta: se il foglio porta la mia firma,
  // l'aveva scritta. Quei valori sono già del foglio e diventano la base: così un +1 non diventa +2
  if (basi._inviato) {
    if (riga.agg && riga.agg === basi._inviato.agg) Object.keys(basi._inviato.campi).forEach(f => { if (f in basi) basi[f] = basi._inviato.campi[f]; });
    delete basi._inviato;
  }
  let n = 0;
  Object.keys(patch).forEach(f => {
    if (f === 'id' || f === 'agg' || f === 'autore' || !(f in basi)) return;
    const base = basi[f], loro = riga[f] === undefined ? '' : riga[f], mio = patch[f];
    // sul foglio non l'ha toccato nessuno: resta la mia
    if (uguali(loro, base)) return;
    // abbiamo scritto la stessa cosa: va bene così, tranne per i contatori. Lì due «1» partiti da 0 sono
    // un +1 dal telefono e un +1 dal PC: fanno 2 (la mia eco senza risposta l'ho già riconosciuta sopra)
    if (uguali(loro, mio) && CONTATORI.indexOf(tab + '|' + f) < 0) return;
    const unito = unisciValori(tab, f, base, loro, mio);
    if (unito !== undefined) { patch[f] = unito; basi[f] = loro; return; }
    // testo o valore semplice cambiato da entrambi: per ora vale quello del foglio, la scelta passa all'utente
    CONFLITTI.push({ tab, id: riga.id, campo: f, mio, loro, nome: titoloRecord(tab, riga), autore: riga.autore || '', quando: Date.now() });
    delete patch[f]; delete basi[f];
    n++;
  });
  // se nella patch sono rimasti solo id e firma, la tolgo dalla coda
  if (!Object.keys(patch).some(f => f !== 'id' && f !== 'agg' && f !== 'autore')) { delete OUTBOX[k]; delete BASI[k]; }
  return n;
}

// I campi che contano qualcosa: le variazioni di due dispositivi si sommano (vedi unisciValori)
// commercio|usate (1.7): le cariche usate degli oggetti del bottino, scorta per scorta, come le risorse delle schede
const CONTATORI = ['rapporti|valore', 'commercio|consegnati', 'voci|risorse', 'commercio|usate'];
// Unione automatica di due modifiche allo stesso campo. undefined = non so unire, decide l'utente.
function unisciValori(tab, f, base, loro, mio) {
  // elenchi: tengo le righe del foglio, tolgo quelle che ho tolto io, aggiungo quelle che ho aggiunto io
  if (Array.isArray(loro) && Array.isArray(mio)) {
    const b = new Set((Array.isArray(base) ? base : []).map(canonico));
    const m = new Set(mio.map(canonico));
    const out = loro.filter(x => !(b.has(canonico(x)) && !m.has(canonico(x))));
    const presenti = new Set(out.map(canonico));
    mio.forEach(x => { const c = canonico(x); if (!b.has(c) && !presenti.has(c)) { out.push(x); presenti.add(c); } });
    return out;
  }
  // le note private sono un pacchetto cifrato: non si possono unire qui, decide l'utente (vedi apriConflitti)
  if (tab === 'voci' && f === 'privato') return undefined;
  // risorse delle schede (punti stregoneria, ira, slot...) e cariche usate degli oggetti del bottino: per ogni
  // contatore sommo le due variazioni, come per i rapporti. Un punto usato sul telefono e uno sul PC fanno due
  // punti usati, non uno; un riposo (o l'alba) da una parte e un uso dall'altra lasciano l'uso dopo il riposo.
  // Il massimo lo rimettono la scheda e il bottino quando mostrano i rombi.
  if (((tab === 'voci' && f === 'risorse') || (tab === 'commercio' && f === 'usate')) && loro && mio && typeof loro === 'object' && typeof mio === 'object') {
    const b = base && typeof base === 'object' ? base : {};
    const out = Object.assign({}, loro);
    Object.keys(mio).forEach(c => { if (!uguali(mio[c], b[c])) out[c] = Math.max(0, (Number(loro[c]) || 0) + (Number(mio[c]) || 0) - (Number(b[c]) || 0)); });
    return out;
  }
  // oggetti (risorse, fiocchi, caratteristiche...): chiave per chiave vince chi l'ha cambiata
  if (loro && mio && typeof loro === 'object' && typeof mio === 'object' && !Array.isArray(loro) && !Array.isArray(mio)) {
    const b = base && typeof base === 'object' ? base : {};
    const out = Object.assign({}, loro);
    Object.keys(mio).forEach(c => { if (!uguali(mio[c], b[c])) out[c] = mio[c]; });
    Object.keys(b).forEach(c => { if (!(c in mio) && uguali(loro[c], b[c])) delete out[c]; });
    return out;
  }
  // contatori: alla loro variazione sommo la mia
  if ((tab === 'rapporti' && f === 'valore') || (tab === 'commercio' && f === 'consegnati')) {
    const v = (Number(loro) || 0) + (Number(mio) || 0) - (Number(base) || 0);
    return tab === 'rapporti' ? clamp(v, -3, 3) : Math.max(0, v);
  }
  return undefined;
}

function titoloRecord(tab, r) {
  if (!r) return '';
  if (r.nome) return r.nome;
  if (r.titolo) return r.titolo;
  if (tab === 'sessioni') return 'Sessione ' + (r.numero || '');
  if (tab === 'rapporti') return nomeDi(r.pg) + ' e ' + nomeDi(r.png);
  return r.id;
}

// Confronto due versioni di un record ignorando _ts (vuoto e assente valgono uguale)
function stessoRecord(a, b) {
  if (!a || !b) return false;
  const chiavi = new Set(Object.keys(a).concat(Object.keys(b)));
  for (const k of chiavi) {
    if (k === '_ts') continue;
    const va = a[k] === undefined ? '' : a[k], vb = b[k] === undefined ? '' : b[k];
    if (va === vb) continue;
    if (!uguali(va, vb)) return false;
  }
  return true;
}

// Pallino nella barra in alto: grigio = solo locale, verde = in pari, ambra = modifiche in coda o conflitti, rosso = errore
function aggiornaStatoSync() {
  const b = document.querySelector('.stato-sync');
  if (!b) return;
  const coda = Object.keys(OUTBOX).length;
  let s = SYNC.stato;
  if (s === 'ok' && coda) s = 'coda';
  if (CONFLITTI.length && s !== 'sync') s = 'coda';
  b.dataset.s = s;
  const testi = {
    locale: 'Solo su questo dispositivo: collega il foglio del gruppo nelle impostazioni',
    ok: 'In pari con il foglio del gruppo',
    coda: CONFLITTI.length ? (CONFLITTI.length === 1 ? 'Un conflitto da risolvere: tocca qui' : CONFLITTI.length + ' conflitti da risolvere: tocca qui') : coda + (coda === 1 ? ' modifica da inviare' : ' modifiche da inviare'),
    sync: 'Sincronizzazione in corso',
    offline: 'Offline: le modifiche partono quando torna la rete',
    errore: 'Errore di sincronizzazione: ' + SYNC.errore
  };
  b.title = testi[s] || '';
  b.setAttribute('aria-label', b.title);
}

// Elenco dei conflitti: per ogni campo scelgo quale versione tenere (o, per i testi, le unisco)
function apriConflitti() {
  if (!CONFLITTI.length) { sincronizza(true); return; }
  const breve = v => { const t = typeof v === 'object' ? JSON.stringify(v) : String(v === undefined ? '' : v); return t.length > 400 ? t.slice(0, 400) + '…' : t; };
  // le note private sono cifrate: invece del testo dico quando è stata salvata ogni versione
  const leggibile = (c, v) => c.tab === 'voci' && c.campo === 'privato' && typeof descriviNote === 'function' ? descriviNote(v) : breve(v);
  apriFoglio(`<div class="foglio-testa"><h2 class="t2">Modifiche in conflitto</h2><button class="btn-icona" data-a="chiudi" aria-label="Chiudi">${ico('chiudi')}</button></div>
    <p class="fioco piccolo">Lo stesso campo è stato cambiato qui e su un altro telefono mentre non eravate in pari. Per ora vale quello del foglio: scegli cosa tenere.</p>
    ${CONFLITTI.map((c, i) => `<article class="riquadro conflitto">
      <h3 class="t3">${esc(c.nome)} · ${esc(etichettaCampo(c.tab, c.campo, DB[c.tab] && DB[c.tab][c.id]))}</h3>
      <p class="piccolo"><strong>Sul foglio${c.autore ? ' (' + esc(c.autore) + ')' : ''}:</strong> ${esc(leggibile(c, c.loro)) || '<em>vuoto</em>'}</p>
      <p class="piccolo"><strong>La tua:</strong> ${esc(leggibile(c, c.mio)) || '<em>vuoto</em>'}</p>
      <div class="azioni">
        <button class="btn btn--piccolo" data-a="conflitto" data-i="${i}" data-scelta="loro">Tieni quella del foglio</button>
        <button class="btn btn--piccolo btn--primario" data-a="conflitto" data-i="${i}" data-scelta="mio">Tieni la mia</button>
        ${(typeof c.mio === 'string' && typeof c.loro === 'string') || (c.campo === 'privato' && typeof NOTE_APERTE !== 'undefined' && NOTE_APERTE[c.id]) ? `<button class="btn btn--piccolo" data-a="conflitto" data-i="${i}" data-scelta="unisci">Unisci i due testi</button>` : ''}
      </div></article>`).join('')}`);
}
// nome leggibile di un campo ("descrizione" → "Descrizione", "ruolo" → "Ruolo o mestiere"), preso dall'editor
function etichettaCampo(tab, campo, rec) {
  const schema = typeof schemaDi === 'function' ? (schemaDi(tab, rec && rec.tipo) || []) : [];
  const c = schema.find(x => x.k === campo && (!x.per || !rec || x.per.includes(rec.tipo))) || schema.find(x => x.k === campo);
  return c ? c.l : campo;
}
function risolviConflitto(i, scelta) {
  const c = CONFLITTI[i];
  if (!c) return;
  CONFLITTI.splice(i, 1);
  if (scelta === 'mio') salva(c.tab, { id: c.id, [c.campo]: c.mio });
  // note private: per unirle serve la chiave, cioè le note aperte su questo dispositivo (8-tavolo.js)
  if (scelta === 'unisci' && c.campo === 'privato') { unisciNotePrivate(c.id, c.mio, c.loro).then(() => render()); }
  else if (scelta === 'unisci') salva(c.tab, { id: c.id, [c.campo]: c.loro + '\n\n' + c.mio });
  salvaLocaleSubito();
  aggiornaStatoSync();
  if (CONFLITTI.length) apriConflitti(); else { chiudiFoglio(); render(); }
}

// ---------------------------------------------------------------------
// TESTO: escape, normalizzazione, menzioni @[Nome] e #[Luogo]
// ---------------------------------------------------------------------
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// minuscolo, senza accenti né punteggiatura: "Caer-Dineval" e "caer dineval" diventano uguali
function norm(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
}

// Menzioni: @[Nome con spazi], #[Luogo con spazi], oppure @Parola e #Parola singole.
// Gruppi: 1 = simbolo (@ o #), 2 = nome tra parentesi, 3 = parola singola.
// "mail@sito" o "C#" non sono menzioni: lo controlla trovaMenzioni guardando il carattere prima.
// (Prima lo faceva un lookbehind nell'espressione, che gli iPhone con iOS precedente al 16.4
// non conoscono: lì l'app restava bianca.)
const RE_MENZIONE = /([@#])(?:\[([^\]\n]{1,80})\]|([A-Za-zÀ-ÖØ-öø-ÿ][\wÀ-ÖØ-öø-ÿ'’-]*))/g;
const RE_PRIMA_DI_MENZIONE = /[\wÀ-ÿ]/;
// Tutte le menzioni di un testo: { pos, len, sig, nome }
function trovaMenzioni(s) {
  const out = [];
  s = String(s || '');
  const re = new RegExp(RE_MENZIONE.source, 'g');
  let m;
  while ((m = re.exec(s))) {
    if (m.index > 0 && RE_PRIMA_DI_MENZIONE.test(s[m.index - 1])) continue;
    out.push({ pos: m.index, len: m[0].length, sig: m[1], nome: m[2] || m[3] });
  }
  return out;
}

// Trova l'id di una voce (o missione) a partire da un nome o alias
function risolviNome(nome, preferisciTipo) {
  const ids = indice().perNome.get(norm(nome));
  if (!ids || !ids.length) return null;
  if (preferisciTipo) {
    const t = ids.find(id => DB.voci[id] && DB.voci[id].tipo === preferisciTipo);
    if (t) return t;
  }
  return ids[0];
}
// Un riferimento può essere un id o un nome (le voci importate a volte citano luoghi non ancora creati)
function risolvi(rif, preferisciTipo) {
  if (!rif) return null;
  if (DB.voci[rif] && visibile(DB.voci[rif])) return rif;
  if (DB.missioni[rif] && visibile(DB.missioni[rif])) return rif;
  return risolviNome(rif, preferisciTipo);
}
function nomeDi(rif) {
  const id = risolvi(rif);
  if (id && DB.voci[id]) return DB.voci[id].nome;
  if (id && DB.missioni[id]) return DB.missioni[id].titolo;
  // un id che non si risolve è una voce segreta (ai giocatori ne arriva solo il segnaposto) o cancellata:
  // niente id grezzo a schermo, che direbbe ai giocatori che lì c'è qualcosa
  if (/^(voc|mis|ses|rap|map|cfg|com|idr)-[a-z0-9-]+$/i.test(String(rif || ''))) return '';
  return rif || '';
}
// Voci segrete citate in un testo (con @[Nome] o #[Nome]): serve al Master per non svelarle per sbaglio
function segretiCitati(testi) {
  const out = [];
  testi.forEach(t => menzioniIn(String(t || '')).forEach(id => { const v = DB.voci[id]; if (v && v.segreto && !out.includes(v.nome)) out.push(v.nome); }));
  return out;
}
function classeDi(v) {
  if (!v) return 'persona';
  if (v.titolo !== undefined && !v.tipo) return 'missione';
  return (TIPI_VOCE[v.tipo] || TIPI_VOCE.png).classe;
}
function iconaVoce(v) {
  if (!v) return 'punto';
  if (v.tipo === 'luogo') return ICONE_LUOGO[v.icona] ? v.icona : 'citta';
  return (TIPI_VOCE[v.tipo] || TIPI_VOCE.png).icona;
}
// Link a una voce come "chip" (lista di persone, luoghi...)
function chipVoce(rif, testoAlternativo) {
  const id = risolvi(rif);
  const v = id ? (DB.voci[id] || DB.missioni[id]) : null;
  if (!v) return rif ? `<span class="chip">${esc(testoAlternativo || rif)}</span>` : '';
  const missione = !!DB.missioni[id];
  const cl = missione ? 'missione' : classeDi(v);
  return `<a class="chip chip--${cl}" href="#/${missione ? 'missione' : 'voce'}/${encodeURIComponent(id)}">${ico(missione ? 'missioni' : iconaVoce(v))}${esc(missione ? v.titolo : v.nome)}</a>`;
}

/**
 * Trasforma il testo scritto dal gruppo in HTML: paragrafi, **grassetto**,
 * *corsivo* e menzioni cliccabili. Una menzione a una voce che non esiste
 * ancora diventa un link tratteggiato che apre il modulo per crearla.
 * modo = 'riga' -> tutto su una riga, senza paragrafi
 */
function testoRicco(s, modo) {
  if (!s) return '';
  s = String(s);
  let out = '';
  let ultimo = 0;
  trovaMenzioni(s).forEach(({ pos, len, sig, nome }) => {
    out += esc(s.slice(ultimo, pos));
    const id = risolviNome(nome, sig === '#' ? 'luogo' : null);
    if (id && DB.missioni[id]) {
      out += `<a class="m m--missione" href="#/missione/${encodeURIComponent(id)}">${esc(nome)}</a>`;
    } else if (id) {
      out += `<a class="m m--${classeDi(DB.voci[id])}" href="#/voce/${encodeURIComponent(id)}">${esc(nome)}</a>`;
    } else {
      out += `<a class="m m--ignota" href="#/nuova-voce/${encodeURIComponent(nome)}/${sig === '#' ? 'luogo' : 'png'}" title="Non è ancora nel wiki: tocca per aggiungerla">${esc(nome)}</a>`;
    }
    ultimo = pos + len;
  });
  out += esc(s.slice(ultimo));
  out = out.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  if (modo === 'riga') return out.replace(/\n+/g, ' ');
  return out.split(/\n{2,}/).map(p => '<p>' + p.trim().replace(/\n/g, '<br>') + '</p>').join('');
}
// Testo senza simboli di menzione, per gli estratti
function testoPiatto(s) {
  s = String(s || '');
  let out = '', ultimo = 0;
  trovaMenzioni(s).forEach(m => { out += s.slice(ultimo, m.pos) + m.nome; ultimo = m.pos + m.len; });
  return (out + s.slice(ultimo)).replace(/\*+/g, '');
}
// Elenco degli id citati in un testo
function menzioniIn(s) {
  const ids = [];
  if (!s) return ids;
  trovaMenzioni(s).forEach(m => {
    const id = risolviNome(m.nome, m.sig === '#' ? 'luogo' : null);
    if (id && !ids.includes(id)) ids.push(id);
  });
  return ids;
}

// ---------------------------------------------------------------------
// INDICE: chi è citato dove, chi sta in quale luogo, cosa è successo dove.
// Si ricostruisce solo quando i dati cambiano (IDX = null).
// ---------------------------------------------------------------------
function indice() {
  if (IDX) return IDX;
  const I = { perNome: new Map(), sessioniDi: {}, eventiIn: {}, abitanti: {}, figli: {}, missioniDi: {}, ultimaVolta: {}, sessioni: [] };
  const aggiungiNome = (n, id) => {
    const k = norm(n);
    if (!k) return;
    if (!I.perNome.has(k)) I.perNome.set(k, []);
    const a = I.perNome.get(k);
    if (!a.includes(id)) a.push(id);
  };
  elenco('voci').forEach(v => { aggiungiNome(v.nome, v.id); (v.alias || []).forEach(a => aggiungiNome(a, v.id)); });
  elenco('missioni').forEach(m => aggiungiNome(m.titolo, m.id));
  IDX = I; // da qui in poi risolvi() può già usare i nomi

  // chi si trova in ogni luogo e quali luoghi stanno dentro altri luoghi
  elenco('voci').forEach(v => {
    const l = risolvi(v.luogo, 'luogo');
    if (!l || l === v.id) return;
    if (v.tipo === 'luogo') (I.figli[l] = I.figli[l] || []).push(v.id);
    else (I.abitanti[l] = I.abitanti[l] || []).push(v.id);
  });
  // missioni collegate a una persona (committente) o a un luogo
  elenco('missioni').forEach(m => {
    [risolvi(m.committente), risolvi(m.luogo, 'luogo')].forEach(id => {
      if (id) { const a = I.missioniDi[id] = I.missioniDi[id] || []; if (!a.includes(m.id)) a.push(m.id); }
    });
  });
  // sessioni in ordine e "apparizioni": ogni voce sa in quali sessioni compare
  I.sessioni = elenco('sessioni').sort((a, b) => (a.numero || 0) - (b.numero || 0));
  I.sessioni.forEach(s => {
    const segna = id => {
      if (!id) return;
      const a = I.sessioniDi[id] = I.sessioniDi[id] || [];
      if (!a.includes(s.id)) a.push(s.id);
      I.ultimaVolta[id] = Math.max(I.ultimaVolta[id] || 0, s.numero || 0);
    };
    menzioniIn(s.riassunto).forEach(segna);
    (s.eventi || []).forEach(e => {
      const ids = menzioniIn(e.t);
      const l = risolvi(e.l, 'luogo');
      ids.forEach(segna);
      segna(l);
      // "cosa abbiamo fatto qui": l'evento appartiene al suo luogo e ai luoghi citati nel testo
      const luoghi = new Set(ids.filter(id => DB.voci[id] && DB.voci[id].tipo === 'luogo'));
      if (l) luoghi.add(l);
      luoghi.forEach(id => (I.eventiIn[id] = I.eventiIn[id] || []).push({ s: s.id, n: s.numero, t: e.t }));
    });
    (s.citazioni || []).forEach(c => menzioniIn(c.testo).forEach(segna));
    segna(risolvi(s.luogo, 'luogo'));
    (s.presenti || []).forEach(p => segna(risolvi(p)));
  });
  // le righe di storia scritte nelle voci contano come apparizioni
  elenco('voci').forEach(v => (v.storia || []).forEach(h => {
    const s = DB.sessioni[h.s];
    if (!s || !visibile(s)) return;
    const a = I.sessioniDi[v.id] = I.sessioniDi[v.id] || [];
    if (!a.includes(s.id)) a.push(s.id);
    I.ultimaVolta[v.id] = Math.max(I.ultimaVolta[v.id] || 0, s.numero || 0);
  }));
  return I;
}

// Sequenza dei luoghi toccati dal gruppo, sessione dopo sessione (per il percorso sulla mappa)
function percorsoGruppo() {
  const seq = [];
  indice().sessioni.forEach(s => {
    (s.eventi || []).forEach(e => { const l = risolvi(e.l, 'luogo'); if (l) seq.push({ id: l, n: s.numero }); });
    const lf = risolvi(s.luogo, 'luogo');
    if (lf) seq.push({ id: lf, n: s.numero });
  });
  return seq;
}
// Il percorso della sessione in corso, o dell'ultima giocata: è quello che si vede sulla mappa e riparte
// da capo a ogni serata. Le tappe le scrivono "Viaggio fatto" e "Il gruppo è qui" nella riga config
// 'percorso' = { dal, tappe }. La riga vale per la serata aperta (se è nata dopo il suo inizio), oppure,
// senza serata, se è più recente del giorno in cui è stata giocata l'ultima sessione del diario.
// Altrimenti il percorso sono i luoghi toccati nell'ultima sessione.
function rigaPercorso() {
  const p = cfg('percorso', null);
  if (!p || typeof p !== 'object' || !Array.isArray(p.tappe) || !Number(p.dal)) return null;
  const ser = cfg('serata', null);
  if (ser && ser.inizio) return Number(p.dal) >= Number(ser.inizio) - 6 * 3600000 ? p : null;
  const ultima = indice().sessioni.slice(-1)[0];
  const giocata = ultima && ultima.data ? new Date(ultima.data + 'T00:00:00').getTime() : 0;
  return Number(p.dal) >= giocata ? p : null;
}
function percorsoSessione() {
  const p = rigaPercorso();
  if (p) return p.tappe.filter(id => DB.voci[id] && visibile(DB.voci[id]));
  const ultima = indice().sessioni.slice(-1)[0];
  const seq = [];
  if (ultima) {
    (ultima.eventi || []).forEach(e => { const l = risolvi(e.l, 'luogo'); if (l) seq.push(l); });
    const lf = risolvi(ultima.luogo, 'luogo');
    if (lf) seq.push(lf);
  }
  return seq;
}
// Aggiunge tappe al percorso della sessione. Se la riga è di un'altra sessione riparto da queste tappe,
// così il percorso non si porta dietro le serate vecchie. Tengo al massimo 60 tappe.
function aggiungiTappe(tappe) {
  const p = rigaPercorso();
  const tutte = (p ? p.tappe : []).concat(tappe.filter(Boolean));
  const pulite = tutte.filter((id, i) => i === 0 || id !== tutte[i - 1]);
  setCfg('percorso', { dal: p ? Number(p.dal) : Date.now(), tappe: pulite.slice(-60) });
}
function azzeraPercorso() { const qui = posizioneGruppo(); setCfg('percorso', { dal: Date.now(), tappe: qui ? [qui] : [] }); }
// Dove si trova il gruppo adesso: impostato a mano, oppure l'ultimo luogo del percorso
function posizioneGruppo() {
  const p = risolvi(cfg('posizione'), 'luogo');
  if (p) return p;
  const seq = percorsoGruppo();
  return seq.length ? seq[seq.length - 1].id : null;
}
function prossimoNumero() {
  return elenco('sessioni').reduce((m, s) => Math.max(m, Number(s.numero) || 0), 0) + 1;
}
// la sessione (non cancellata) con quel numero, se c'è: l'import non ne crea una seconda
function sessioneConNumero(n) {
  const s = elenco('sessioni', x => Number(x.numero) === Number(n))[0];
  return s ? s.id : '';
}

// FORMATI
// ---------------------------------------------------------------------
function dataBella(iso, corta) {
  if (!iso) return '';
  const d = new Date(String(iso).length <= 10 ? iso + 'T12:00:00' : iso);
  if (isNaN(d)) return esc(iso);
  return d.toLocaleDateString('it-IT', corta ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'long', year: 'numeric' });
}
function oggiISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function iniziali(nome) {
  const p = String(nome || '?').replace(/[^A-Za-zÀ-ÿ\s'-]/g, '').trim().split(/[\s-]+/).filter(Boolean);
  if (!p.length) return '?';
  return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
}
function durata(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(n => String(n).padStart(2, '0')).join(':');
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

// Sigillo: l'avatar tondo di una voce (ritratto, oppure iniziali nel colore del tipo)
function sigillo(v, classe) {
  if (!v) return '';
  const cl = classeDi(v);
  const morto = v.stato === 'morto' ? ' sigillo--morto' : '';
  const dentro = v.immagine ? `<img src="${esc(v.immagine)}" alt="">` : (v.tipo === 'luogo' || v.tipo === 'oggetto' || v.tipo === 'fazione' ? ico(iconaVoce(v)) : esc(iniziali(v.nome)));
  return `<span class="sigillo t-${cl}${morto} ${classe || ''}">${dentro}</span>`;
}
// Riquadro di una città: fiocchi di neve (accoglienza, servizi, comfort), sacrificio ad Auril e rivali.
// Vuoto se il luogo non ha nessuna di queste informazioni. Lo usano la scheda del luogo e quella sulla mappa.
function infoLuogoHTML(v) {
  const f = v && v.fiocchi && typeof v.fiocchi === 'object' ? v.fiocchi : {};
  const conFiocchi = Object.keys(FIOCCHI).filter(k => Number(f[k]));
  const sac = v && SACRIFICI[v.sacrificio];
  if (!conFiocchi.length && !sac && !(v && v.rivali)) return '';
  let h = '<div class="info-luogo">';
  if (conFiocchi.length) {
    h += '<div class="fiocchi-riga">' + Object.keys(FIOCCHI).map(k => {
      const n = clamp(Number(f[k]) || 0, 0, 3);
      return `<div class="fiocchi-voce"><span>${FIOCCHI[k].nome}</span>
        <span class="fiocchi" aria-label="${n} su 3">${[1, 2, 3].map(i => ico('fiocco', i <= n ? '' : 'spento')).join('')}</span>
        <em>${n ? esc(FIOCCHI[k].breve[n]) : 'Non si sa'}</em></div>`;
    }).join('') + '</div>';
  }
  if (sac) h += `<p><strong>Sacrificio ad Auril: ${esc(sac.nome.toLowerCase())}.</strong> ${esc(sac.testo)}</p>`;
  if (v.rivali) h += `<p><strong>Rivali:</strong> ${testoRicco(v.rivali, 'riga')}</p>`;
  return h + '</div>';
}

// Pulsante per la scheda di D&D Beyond. Su Android provo ad aprirla nell'app (pacchetto com.fandom.playercompanion):
// se l'app non accetta il link, Chrome apre il sito come prima (S.browser_fallback_url).
function bottoneBeyond(url) {
  // solo indirizzi web veri: un link "javascript:" eseguirebbe codice nell'app (e potrebbe leggere le chiavi)
  if (!url || !/^https?:\/\//i.test(String(url).trim())) return '';
  url = String(url).trim();
  const m = url.match(/^https?:\/\/([^/]*dndbeyond\.com)(\/[^#]*)?/i);
  if (m && /Android/i.test(navigator.userAgent)) {
    const intento = `intent://${m[1]}${m[2] || '/'}#Intent;scheme=https;package=com.fandom.playercompanion;S.browser_fallback_url=${encodeURIComponent(url)};end`;
    return `<a class="btn btn--piccolo" href="${esc(intento)}">${ico('esterno')}D&amp;D Beyond</a>`;
  }
  return `<a class="btn btn--piccolo" href="${esc(url)}" target="_blank" rel="noopener">${ico('esterno')}D&amp;D Beyond</a>`;
}

// Scala a rombi: atteggiamento (-2..2) o rapporto (-3..3)
function scala(valore, max) {
  valore = Number(valore) || 0;
  let h = `<span class="scala ${valore < 0 ? 'scala-neg' : 'scala-pos'}" aria-label="${valore}">`;
  for (let i = -max; i <= max; i++) {
    const on = (valore < 0 && i >= valore && i < 0) || (valore > 0 && i <= valore && i > 0);
    h += `<i class="${on ? 'on' : ''}${i === 0 ? ' zero' : ''}"></i>`;
  }
  return h + '</span>';
}

let timerAvviso = 0;
function avviso(testo) {
  const t = document.querySelector('.toast');
  t.textContent = testo;
  t.classList.add('vis');
  clearTimeout(timerAvviso);

let FOGLIO_APERTO_AL = 0;
function apriFoglio(html) {
  FOGLIO_APERTO_AL = Date.now();
  const f = document.querySelector('.foglio');
  f.innerHTML = '<div class="maniglia"></div>' + html;
  f.scrollTop = 0;
  f.classList.add('aperto');
  document.querySelector('.velo').classList.add('aperto');
  const primo = f.querySelector('input:not([type=hidden]):not([type=checkbox]):not([type=radio]), textarea');
  if (primo && window.matchMedia('(min-width: 900px)').matches) setTimeout(() => primo.focus(), 250);
}
function chiudiFoglio() {
  document.querySelector('.foglio').classList.remove('aperto');
  document.querySelector('.velo').classList.remove('aperto');
  document.getElementById('suggerimenti').hidden = true;
  if (DA_RIDISEGNARE) { DA_RIDISEGNARE = false; setTimeout(render, 320); }
}
function foglioAperto() { return document.querySelector('.foglio').classList.contains('aperto'); }

// Domanda di conferma con il foglio (al posto del confirm del browser)
function chiedi(titolo, testo, etichettaOk, pericolo) {
  return new Promise(ok => {
    apriFoglio(`<div class="foglio-testa"><h2 class="t2">${esc(titolo)}</h2></div>
      <p class="lettura fioco">${esc(testo)}</p>
      <div class="azioni" style="justify-content:flex-end">
        <button class="btn" data-risposta="no">Annulla</button>
        <button class="btn ${pericolo ? 'btn--pericolo' : 'btn--primario'}" data-risposta="si">${esc(etichettaOk)}</button>
      </div>`);
    const f = document.querySelector('.foglio');
    const gestore = e => {
      const b = e.target.closest('[data-risposta]');
      const velo = e.target.closest('.velo') && Date.now() - FOGLIO_APERTO_AL > 450;
      if (!b && !velo) return;
      document.removeEventListener('click', gestore, true);
      e.stopPropagation();
      chiudiFoglio();
      ok(b ? b.dataset.risposta === 'si' : false);
    };
    document.addEventListener('click', gestore, true);
    f.querySelector('[data-risposta="si"]').focus();
  });
}

// Come chiedi, ma con più scelte: opzioni = [{ k, l, primario }]. Risolve con la k scelta, oppure '' se si chiude.
// senzaAnnulla = true: niente "Annulla" e il tocco fuori dal foglio non chiude (serve quando chiudere farebbe perdere dati)
function scegli(titolo, testo, opzioni, senzaAnnulla) {
  return new Promise(ok => {
    apriFoglio(`<div class="foglio-testa"><h2 class="t2">${esc(titolo)}</h2></div>
      <p class="lettura fioco">${esc(testo)}</p>
      <div class="azioni azioni--colonna">
        ${opzioni.map(o => `<button class="btn ${o.primario ? 'btn--primario' : ''}" data-scelta-k="${esc(o.k)}">${esc(o.l)}</button>`).join('')}
        ${senzaAnnulla ? '' : '<button class="btn btn--testo" data-scelta-k="">Annulla</button>'}
      </div>`);
    const gestore = e => {
      const b = e.target.closest('[data-scelta-k]');
      const velo = !senzaAnnulla && e.target.closest('.velo') && Date.now() - FOGLIO_APERTO_AL > 450;
      if (!b && !velo) return;
      document.removeEventListener('click', gestore, true);
      e.stopPropagation();
      chiudiFoglio();
      ok(b ? b.dataset.sceltaK : '');
    };
    document.addEventListener('click', gestore, true);
  });
}

async function copiaTesto(testo) {
  try {
    await navigator.clipboard.writeText(testo);
    return true;
  } catch (e) {
    // ripiego per i browser che non danno accesso agli appunti
    const ta = document.createElement('textarea');
    ta.value = testo; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (x) { ok = false; }
    ta.remove();
    return ok;
  }
}

// Ridimensiona un'immagine scelta dall'utente. quadrato = ritaglio centrale (ritratti)
async function ridimensionaImmagine(file, lato, quadrato, qualita) {
  let bmp, urlTemp = null;
  try {
    bmp = await createImageBitmap(file);
  } catch (e) {
    // alcuni telefoni non leggono certi file con createImageBitmap: provo con un'immagine normale
    urlTemp = URL.createObjectURL(file);
    const img = new Image();
    img.src = urlTemp;
    try { await img.decode(); } catch (e2) { URL.revokeObjectURL(urlTemp); throw new Error('il formato non è supportato, usa un JPG o un PNG'); }
    bmp = img;
  }
  const larg = bmp.naturalWidth || bmp.width, alt = bmp.naturalHeight || bmp.height;
  let sx = 0, sy = 0, sw = larg, sh = alt;
  if (quadrato) { const m = Math.min(sw, sh); sx = (sw - m) / 2; sy = (sh - m) / 2; sw = sh = m; }
  const k = Math.min(1, lato / Math.max(sw, sh));
  const c = document.createElement('canvas');
  c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  const g = c.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(bmp, sx, sy, sw, sh, 0, 0, c.width, c.height);
  if (urlTemp) URL.revokeObjectURL(urlTemp);
  if (bmp.close) bmp.close();
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', qualita || .86));
  if (!blob) throw new Error("l'immagine è troppo grande per questo dispositivo");
  return { blob, w: c.width, h: c.height, canvas: c };
}
function blobInBase64(blob) {
  return new Promise((ok, ko) => {
    const fr = new FileReader();
    fr.onload = () => ok(String(fr.result).split(',')[1]);
    fr.onerror = () => ko(fr.error);
    fr.readAsDataURL(blob);
  });
}

// =====================================================================
// 2. VISTE — ogni schermata è una funzione che restituisce HTML.
//    render() legge l'indirizzo (#/vista/parametro) e sceglie la vista.
// =====================================================================
let DA_RIDISEGNARE = false;   // dati arrivati mentre l'utente scriveva: ridisegno appena chiude
let ROTTA_PRECEDENTE = '';
let TIMER_VISTA = 0;

// "#/voce/voc-123?x=1" -> { vista:'voce', a:'voc-123', b:undefined, q:URLSearchParams }
function rotta() {
  const h = location.hash.replace(/^#\/?/, '');
  const [percorso, query] = h.split('?');
  const parti = percorso.split('/').map(p => { try { return decodeURIComponent(p); } catch (e) { return p; } });
  return { vista: parti[0] || 'home', a: parti[1], b: parti[2], q: new URLSearchParams(query || '') };
}
function sezioneDi(vista) {
  return { home: 'home', tavolo: 'home', diario: 'diario', sessione: 'diario', importa: 'diario', gesta: 'diario', mappa: 'mappa', missioni: 'missioni', missione: 'missioni', wiki: 'wiki', voce: 'wiki', scheda: 'wiki', commercio: 'commercio' }[vista] || '';
}

function render() {
  const r = rotta();
  const inMappa = r.vista === 'mappa';
  document.getElementById('vista-mappa').classList.toggle('vis', inMappa);
  document.getElementById('vista').hidden = inMappa;
  document.body.classList.toggle('in-mappa', inMappa);
  const sez = sezioneDi(r.vista);
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('attivo', a.dataset.sez === sez));
  document.querySelector('.barra-top .indietro').hidden = !['sessione', 'voce', 'missione', 'importa', 'impostazioni', 'scheda', 'tavolo', 'gesta'].includes(r.vista);
  // in alto a destra il sigillo del mio personaggio porta alla sua scheda
  const mio = IMPOST.pg && DB.voci[IMPOST.pg] && visibile(DB.voci[IMPOST.pg]) ? DB.voci[IMPOST.pg] : null;
  const linkScheda = document.getElementById('link-scheda');
  linkScheda.hidden = !mio;
  if (mio) { linkScheda.href = '#/scheda/' + encodeURIComponent(mio.id); linkScheda.innerHTML = sigillo(mio, 'sigillo--mini'); linkScheda.setAttribute('aria-label', 'Scheda di ' + mio.nome); }
  document.querySelector('.barra-top .marchio').textContent = cfg('campagna', 'Taverna');
  document.title = cfg('campagna', 'Taverna');
  clearInterval(TIMER_VISTA);
  if (inMappa) { mappaApri(r.a || null, r.q.get('luogo')); return; }
  if (MAPPA.montata) mappaNeve();   // fuori dalla mappa la neve si ferma

  let html;
  switch (r.vista) {
    case 'diario': html = vistaDiario(); break;
    case 'sessione': html = vistaSessione(r.a); break;
    case 'gesta': html = vistaGesta(); break;
    case 'missioni': html = vistaMissioni(r.q.get('stato') === 'concluse' ? 'concluse' : 'attive'); break;
    case 'missione': html = vistaMissione(r.a); break;
    case 'wiki': html = vistaWiki(r.q.get('tipo') || '', r.q.get('q') || ''); break;
    case 'voce': html = vistaVoce(r.a); break;
    case 'importa': html = vistaImporta(); break;
    case 'impostazioni': html = vistaImpostazioni(); break;
    case 'scheda': html = vistaScheda(r.a); break;
    case 'commercio': html = vistaCommercio(r.q.get('sez') || 'spedizioni'); break;
    case 'tavolo': html = vistaTavolo(r.q.get('sez') || 'valle'); break;
    case 'nuova-voce':
      // ci si arriva da un link a una menzione sconosciuta aperto da fuori (di solito lo gestisce il clic)
      history.replaceState(null, '', '#/wiki');
      html = vistaWiki('', '');
      setTimeout(() => apriEditor('voci', null, { nome: r.a || '', tipo: TIPI_VOCE[r.b] ? r.b : 'png' }), 50);
      break;
    default: html = vistaHome();
  }
  document.getElementById('vista').innerHTML = html;
  if (location.hash !== ROTTA_PRECEDENTE) { window.scrollTo(0, 0); ROTTA_PRECEDENTE = location.hash; }
  dopoRender(r);
}

// Chiamata quando arrivano dati nuovi dal foglio: non interrompo chi sta scrivendo
function ridisegna() {
  if (MAPPA.montata) MAPPA.sporca = true;
  const att = document.activeElement;
  const staScrivendo = att && att.closest && att.closest('#vista') && /INPUT|TEXTAREA|SELECT/.test(att.tagName);
  if (foglioAperto() || staScrivendo) { DA_RIDISEGNARE = true; return; }
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

// Lavori da fare dopo aver messo l'HTML nella pagina (immagini, cronometro, filtri)
function dopoRender(r) {
  if (r.vista === 'home') {
    const mm = document.getElementById('miniMappa');
    if (mm) riempiMiniMappa(mm);
    const ser = serata();
    if (ser && !ser.fine) {
      TIMER_VISTA = setInterval(() => {
        const c = document.querySelector('.cronometro');
        if (c) c.textContent = durata(Date.now() - (Number(ser.registrazione) || Number(ser.inizio)));
      }, 1000);
    }
  }
  if (r.vista === 'wiki' && r.q.get('q')) filtraWiki(r.q.get('q'));
  // nella revisione dell'import le righe da scrivere (fatti, gesta, frasi di stasera) sono alte quanto il testo
  if (r.vista === 'importa') document.querySelectorAll('#vista textarea.breve').forEach(altezzaTesto);
  if (r.vista === 'tavolo') {
    const sez = r.q.get('sez') || 'valle';
    // durante il combattimento i turni devono arrivare in fretta: sincronizzo spesso, solo con questa vista aperta
    if (sez === 'turni' && iniziativa().attiva) TIMER_VISTA = setInterval(() => { if (!document.hidden && !SYNC.inCorso) sincronizza(); }, 12000);
    // i minuti in acqua gelida avanzano da soli
    if (sez === 'valle' && document.querySelector('[data-acqua]')) TIMER_VISTA = setInterval(() => {
      document.querySelectorAll('[data-acqua]').forEach(el => {
        const min = Math.floor((Date.now() - Number(el.dataset.acqua)) / 60000), regge = Number(el.dataset.regge) || 0;
        el.textContent = 'In acqua da ' + min + ' min' + (regge ? ' su ' + regge : '');
        el.className = regge && min >= regge ? 'cera' : 'lanterna';
      });
    }, 10000);
  }
}

function altezzaTesto(t) { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }
function nonTrovato(testo) {
  return `<div class="benvenuto"><h1 class="t2">Qui non c'è niente</h1><p class="lettura fioco">${esc(testo)}</p><div class="azioni"><a class="btn" href="#/home">Torna alla taverna</a></div></div>`;
}

// ---------------------------------------------------------------------
// HOME ("Taverna"): ultima sessione, dove siamo, taccuino, missioni, incontri
// ---------------------------------------------------------------------
function vistaHome() {
  const I = indice();
  const sessioni = I.sessioni;
  const voci = elenco('voci');
  if (!sessioni.length && !voci.length) {
    return `<section class="benvenuto">
      <h1 class="t1">La cronaca è ancora vuota</h1>
      <div class="lettura fioco"><p>Qui finiranno le sessioni, i PNG che incontrate, i luoghi e le missioni accettate. Tutto il gruppo vede le stesse cose, anche dal telefono.</p></div>
      <div class="azioni-col">
        <a class="btn btn--primario" href="#/impostazioni">${ico('link')}Collega il foglio del gruppo</a>
        <button class="btn" data-a="demo-carica">${ico('lanterna')}Prova con i dati di esempio</button>
        <a class="btn btn--testo" href="#/importa">Importa la prima sessione</a>
      </div>
    </section>`;
  }
  let h = '';
  const ser = serata();
  const inCorso = ser && !ser.fine;
  if (inCorso) h += bloccoTaccuino() + bloccoAlTavolo();

  // Nelle puntate precedenti: l'ultima sessione, in grande. Con il riassunto breve dell'AI
  // (da leggere a voce alta a inizio serata) mostro quello e le cose in sospeso.
  const ultima = sessioni[sessioni.length - 1];
  if (ultima) {
    const breve = (ultima.inBreve || '').trim();
    const lungo = !breve && (ultima.riassunto || '').length > 650;
    const sospesi = (ultima.sospesi || []).filter(Boolean);
    h += `<section class="puntate">
      <p class="occhiello">Nelle puntate precedenti</p>
      <h1 class="t1"><a href="#/sessione/${encodeURIComponent(ultima.id)}">${esc(ultima.titolo || 'Sessione ' + ultima.numero)}</a></h1>
      <p class="meta">Sessione ${esc(ultima.numero)}${ultima.data ? ', giocata il ' + dataBella(ultima.data) : ''}</p>
      <div class="lettura${lungo ? ' lungo' : ''}">${testoRicco(breve || ultima.riassunto) || '<p class="fioco">Nessun riassunto per questa sessione.</p>'}</div>
      ${sospesi.length ? `<div class="sospesi"><h3 class="t3">Rimasto in sospeso</h3><ul>${sospesi.map(x => `<li>${testoRicco(x, 'riga')}</li>`).join('')}</ul></div>` : ''}
      <a class="leggi" href="#/sessione/${encodeURIComponent(ultima.id)}">Leggi tutta la sessione</a>
    </section>`;
  } else {
    h += `<section class="puntate"><h1 class="t1">${esc(cfg('campagna', 'La campagna'))}</h1>
      <div class="lettura fioco"><p>Il diario non ha ancora sessioni.</p></div>
      <div class="azioni"><a class="btn btn--primario" href="#/importa">${ico('importa')}Importa una sessione</a></div></section>`;
  }

  // Dove si trova il gruppo, con un ritaglio della mappa
  const pos = posizioneGruppo();
  if (pos && DB.voci[pos]) {
    h += `<a class="dove" href="#/mappa?luogo=${encodeURIComponent(pos)}">
      <div class="dove-mappa"><div class="dove-img" id="miniMappa" data-luogo="${esc(pos)}"></div><span class="dove-segno"></span></div>
      <div class="dove-testo"><span class="fioco">Il gruppo è a</span><strong class="t2">${esc(DB.voci[pos].nome)}</strong><span class="fioco piccolo">Apri la mappa</span></div>
    </a>`;
  }
  if (!inCorso) h += bloccoTaccuino() + bloccoAlTavolo();

  // Missioni accettate
  const attive = elenco('missioni', m => (m.stato || 'attiva') === 'attiva')
    .sort((a, b) => ((DB.sessioni[b.apertaIn] || {}).numero || 0) - ((DB.sessioni[a.apertaIn] || {}).numero || 0));
  h += `<section class="sezione"><h2>Missioni accettate <span class="conta">${attive.length}</span><a class="dx" href="#/missioni">Tutte</a></h2>
    ${attive.length ? attive.slice(0, 4).map(rigaMissione).join('') : '<p class="vuoto">Nessuna missione in corso.</p>'}</section>`;

  // Favori in sospeso del mio personaggio
  if (IMPOST.pg && DB.voci[IMPOST.pg]) {
    const favori = [];
    elenco('rapporti', r => r.pg === IMPOST.pg && DB.voci[r.png] && visibile(DB.voci[r.png])).forEach(r => (r.favori || []).forEach(f => {
      if (!f.ok && f.tipo !== 'nota') favori.push({ r, f });
    }));
    if (favori.length) {
      h += `<section class="sezione"><h2>Favori in sospeso <span class="conta">${favori.length}</span></h2><ul class="lista">` +
        favori.map(({ r, f }) => {
          const png = DB.voci[r.png];
          return `<li><a class="riga" href="#/voce/${encodeURIComponent(r.png)}">${sigillo(png, 'sigillo--piccolo')}<div class="corpo"><div class="tit">${esc(png ? png.nome : '')}</div><div class="sub">${esc(TIPI_FAVORE[f.tipo] || '')}: ${testoRicco(f.t, 'riga')}</div></div></a></li>`;
        }).join('') + '</ul></section>';
    }
  }

  // Incontri recenti: chi è comparso nelle ultime due sessioni
  const recenti = [];
  sessioni.slice(-2).reverse().forEach(s => {
    const ids = [].concat(menzioniIn(s.riassunto), ...(s.eventi || []).map(e => menzioniIn(e.t)));
    ids.forEach(id => { const v = DB.voci[id]; if (v && (v.tipo === 'png' || v.tipo === 'fazione') && !recenti.includes(id)) recenti.push(id); });
  });
  elenco('voci', v => v.tipo === 'png' && (v.storia || []).some(x => sessioni.slice(-2).some(s => s.id === x.s))).forEach(v => { if (!recenti.includes(v.id)) recenti.push(v.id); });
  if (recenti.length) {
    h += `<section class="sezione"><h2>Incontri recenti</h2><ul class="lista">` + recenti.slice(0, 6).map(id => {
      const v = DB.voci[id];
      return `<li><a class="riga" href="#/voce/${encodeURIComponent(id)}">${sigillo(v)}<div class="corpo"><div class="tit tronca">${esc(v.nome)}</div><div class="sub tronca">${esc(v.ruolo || TIPI_VOCE[v.tipo].nome)}</div></div>${v.atteggiamento !== undefined && v.atteggiamento !== '' ? scala(v.atteggiamento, 2) : ''}</a></li>`;
    }).join('') + '</ul></section>';
  }

  // La compagnia
  const pgs = elenco('voci', v => v.tipo === 'pg');
  if (pgs.length) {
    h += `<section class="sezione"><h2>La compagnia</h2><div class="compagnia">` + pgs.map(p =>
      `<a href="#/voce/${encodeURIComponent(p.id)}">${sigillo(p)}<span>${esc(p.nome)}</span></a>`).join('') + '</div></section>';
  }
  return h;
}

// Taccuino della serata (condiviso, vedi "LA SERATA" in 5-importa.js): cronometro, tasti dei tipi
// di segnalibro e l'elenco di quelli presi da tutto il tavolo
function bloccoTaccuino() {
  const ser = serata();
  const note = segnalibriSerata();
  const inCorso = ser && !ser.fine;
  if (!ser && !note.length) {
    return `<section class="taccuino"><h2 class="t3">Si gioca stasera?</h2>
      <p class="fioco piccolo" style="margin:6px 0 0">Avvia la serata quando parte la registrazione: il cronometro parte per tutto il tavolo, ognuno può segnare dal suo telefono e i segnalibri finiscono nel prompt dell'import.</p>
      <div class="azioni"><button class="btn btn--primario" data-a="tac-inizia">${ico('orologio')}Inizia la serata</button></div></section>`;
  }
  const zero = ser ? (Number(ser.registrazione) || Number(ser.inizio)) : 0;
  const io = chiSono();
  const lista = note.length ? '<ol class="segnalibri">' + note.slice().reverse().map(n => {
    const t = TIPI_SEGNALIBRO[n.tipo] || TIPI_SEGNALIBRO.nota;
    const mio = !n.chi || n.chi === io || IMPOST.master;
    return `<li class="seg-${esc(n.tipo || 'nota')}"><time>${durata(minutoSegnalibro(n, ser))}</time>
      <span class="seg-tipo">${ico(t.ico)}${esc(t.nome)}</span><span class="seg-testo">${esc(n.testo || '')}${n.chi ? ` <span class="fioco piccolo">${esc(n.chi)}</span>` : ''}</span>
      ${mio ? `<button class="btn-icona btn-icona--mini" data-a="tac-togli" data-id="${esc(n.id)}" aria-label="Togli il segnalibro">${ico('chiudi')}</button>` : ''}</li>`;
  }).join('') + '</ol>' : '';
  if (inCorso) {
    const tasti = Object.keys(TIPI_SEGNALIBRO).filter(k => k !== 'nota' && (!TIPI_SEGNALIBRO[k].master || IMPOST.master));
    const ora = d => new Date(d).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    return `<section class="taccuino">
      <div class="testa"><div><span class="fioco piccolo">Serata in corso${ser.chi ? ', aperta da ' + esc(ser.chi) : ''}</span><div class="cronometro">${durata(Date.now() - zero)}</div></div>
      <button class="btn btn--piccolo" data-a="tac-termina">Termina</button></div>
      <p class="fioco piccolo" style="margin:4px 0 10px">Minuti contati dalle ${ora(zero)}. <button class="btn btn--testo btn--piccolo" data-a="tac-registra">La registrazione parte adesso</button></p>
      <form data-a="tac-segna"><input type="text" name="testo" placeholder="Cosa è successo? Es. il capo villaggio ci offre un lavoro" autocomplete="off" aria-label="Segnalibro"><button class="btn btn--primario" type="submit">${ico('segna')}Segna</button></form>
      <div class="tipi-seg" role="group" aria-label="Segna con un tocco">${tasti.map(k => `<button class="chip chip--tasto" data-a="tac-tipo" data-tipo="${k}">${ico(TIPI_SEGNALIBRO[k].ico)}${esc(TIPI_SEGNALIBRO[k].nome)}</button>`).join('')}</div>
      <p class="fioco piccolo" style="margin:8px 0 0">Un tocco su un tipo segna il minuto subito; se hai scritto qualcosa nel campo, va insieme.</p>
      ${lista}</section>`;
  }
  return `<section class="taccuino"><div class="testa"><h2 class="t3">Segnalibri pronti per l'import</h2><span class="fioco piccolo">${note.length}</span></div>
    ${ser && ser.data ? `<p class="fioco piccolo" style="margin:4px 0 0">Serata del ${dataBella(ser.data)}.</p>` : ''}
    ${lista}
    <div class="azioni"><a class="btn btn--primario btn--piccolo" href="#/importa">${ico('importa')}Importa la sessione</a>
    ${ser ? '<button class="btn btn--piccolo" data-a="tac-riprendi">Riprendi</button>' : ''}<button class="btn btn--piccolo" data-a="tac-svuota">Chiudi senza importare</button></div></section>`;
}

// Riga di una missione (home e quest log)
function rigaMissione(m) {
  const stato = m.stato || 'attiva';
  const comm = m.committente ? nomeDi(m.committente) : '';
  const luogo = m.luogo ? nomeDi(m.luogo) : '';
  const s = DB.sessioni[m.apertaIn];
  let sub = comm ? 'Affidata da ' + esc(comm) : '';
  if (luogo) sub += (sub ? ' a ' : 'A ') + esc(luogo);
  if (s && visibile(s)) sub += (sub ? ', ' : '') + 'sessione ' + esc(s.numero);
