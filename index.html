    <section class="legenda-sez"><h3 class="t3">Le città: i fiocchi di neve</h3><p class="fioco" style="margin:6px 0 0">Ogni città delle Dieci-Città ha da uno a tre fiocchi per tre cose. Più fiocchi, meglio è.</p><ul class="legenda">${fiocchi}</ul></section>
    <section class="legenda-sez"><h3 class="t3">I sacrifici ad Auril</h3><p class="fioco" style="margin:6px 0 0">Da poco più di un anno, nelle notti di luna nuova, ogni città offre qualcosa alla Fanciulla dei Ghiacci sperando che torni l'estate.</p><ul class="legenda">${sacrifici}</ul></section>`);
}

function mappaSchedaHTML(id) {
  const v = DB.voci[id];
  if (!v) return '';
  const I = indice();
  // chi abita qui, anche nei luoghi interni: la città mostra pure chi sta nelle sue locande
  const abitanti = [id].concat(discendenti(id)).reduce((a, x) => a.concat(I.abitanti[x] || []), []).map(x => DB.voci[x]).filter(x => visibile(x));
  const figli = (I.figli[id] || []).map(x => DB.voci[x]).filter(x => visibile(x));
  const missioni = missioniQui(id);
  // eventi del luogo e dei luoghi che contiene
  const eventi = [id].concat(discendenti(id)).reduce((a, x) => a.concat(I.eventiIn[x] || []), []).sort((a, b) => (b.n || 0) - (a.n || 0));
  const qui = posizioneGruppo();
  const gruppoQui = !!qui && (qui === id || (antenatoSuMappa(qui, MAPPA.id) || {}).id === id);
  const primoParagrafo = String(v.descrizione || '').split(/\n{2,}/)[0];
  let h = `<div class="testa">${sigillo(v)}<div class="corpo"><h2>${esc(v.nome)}</h2>
    <p class="ruolo">${esc(v.ruolo || ICONE_LUOGO[v.icona] || 'Luogo')}${v.segreto ? ', segreto' : ''}</p></div>
    <button class="btn-icona" data-a="mappa-chiudi-scheda" aria-label="Chiudi">${ico('chiudi')}</button></div>`;
  if (gruppoQui) h += `<p style="display:flex;align-items:center;gap:8px;color:var(--lanterna-2);margin:12px 0 0;font-weight:700">${ico('lanterna')}Il gruppo è qui</p>`;
  if (primoParagrafo) h += `<div class="lettura" style="font-size:16px;margin-top:12px">${testoRicco(primoParagrafo)}</div>`;
  h += infoLuogoHTML(v);
  const incontrati = abitanti.filter(a => !a.guida || (I.sessioniDi[a.id] || []).length);
  const daIncontrare = abitanti.filter(a => a.guida && !(I.sessioniDi[a.id] || []).length);
  if (incontrati.length) h += `<h3>Chi trovi qui</h3><div class="chips">${incontrati.map(a => chipVoce(a.id)).join('')}</div>`;
  if (daIncontrare.length) h += `<h3>Chi potreste incontrare</h3><div class="chips chips-guida">${daIncontrare.map(a => chipVoce(a.id)).join('')}</div>`;
  if (figli.length) h += `<h3>Luoghi interni</h3><div class="chips">${figli.map(f => chipVoce(f.id)).join('')}</div>`;
  if (missioni.length) h += `<h3>Missioni in corso</h3><div class="chips">${missioni.map(m => chipVoce(m.id)).join('')}</div>`;
  if (eventi.length) {
    h += `<h3>Cosa abbiamo fatto qui</h3>` + eventi.slice(0, 5).map(e =>
      `<div class="ev"><a class="n" href="#/sessione/${encodeURIComponent(e.s)}" title="Sessione ${esc(e.n)}">${esc(e.n)}</a><span>${testoRicco(e.t, 'riga')}</span></div>`).join('');
    if (eventi.length > 5) h += `<p class="fioco piccolo">Altri ${eventi.length - 5} nella scheda.</p>`;
  } else if (!abitanti.length && !missioni.length && !primoParagrafo && !figli.length) {
    h += `<p class="fioco" style="margin:12px 0 0">Ancora niente di registrato qui.</p>`;
  }
  h += `<div class="azioni"><a class="btn btn--primario btn--piccolo" href="#/voce/${encodeURIComponent(id)}">Apri la scheda</a>`;
  if (v.mappaInterna && DB.mappe[v.mappaInterna] && visibile(DB.mappe[v.mappaInterna])) h += `<a class="btn btn--piccolo" href="#/mappa/${encodeURIComponent(v.mappaInterna)}">${ico('entra')}Entra</a>`;
  if (!gruppoQui) h += `<button class="btn btn--piccolo" data-a="siamo-qui" data-id="${esc(id)}">${ico('lanterna')}Il gruppo è qui</button>`;
  // il Master rivela un segnaposto segreto con un tocco, senza passare dalla modalità cartografo
  if (v.segreto && IMPOST.master) h += `<button class="btn btn--piccolo" data-a="rivela" data-id="${esc(id)}">${ico('occhio')}Rivela</button>`;
  h += '</div>';
  if (MAPPA.cartografo === true) {
    h += `<h3>Cartografo</h3><div class="azioni" style="margin-top:0">`;
    if (!v.mappaInterna || !DB.mappe[v.mappaInterna]) h += `<button class="btn btn--piccolo" data-a="mappa-nuova" data-luogo="${esc(id)}">${ico('immagine')}Crea la mappa interna</button>`;
    h += `<button class="btn btn--piccolo" data-a="modifica" data-tab="voci" data-id="${esc(id)}">${ico('modifica')}Modifica</button>`;
    if (IMPOST.master || !IMPOST.url) h += `<button class="btn btn--piccolo" data-a="pin-segreto" data-id="${esc(id)}">${ico(v.segreto ? 'occhio' : 'nascosto')}${v.segreto ? 'Rivela ai giocatori' : 'Nascondi ai giocatori'}</button>`;
    h += `<button class="btn btn--piccolo btn--pericolo" data-a="pin-togli" data-id="${esc(id)}">Togli dalla mappa</button></div>`;
  }
  return h;
}

// ---------------------------------------------------------------------
function mappaBriciole() {
  const el = document.getElementById('briciole');
  const catena = [];
  let m = DB.mappe[MAPPA.id];
  for (let g = 0; m && g < 8; g++) {
    catena.unshift(m);
    const l = DB.voci[risolvi(m.luogo, 'luogo')];
    const su = l && l.mappa ? DB.mappe[l.mappa] : null;
    if (!su || su.id === m.id || catena.includes(su)) break;
    m = su;
  }
  el.innerHTML = catena.length
    ? catena.slice(-2).map((x, i, a) => `<button data-a="mappa-vai" data-id="${esc(x.id)}">${esc(x.nome || 'Mappa')}</button>${i < a.length - 1 ? '<span class="sep">›</span>' : ''}`).join('')
    : '<button>Mappa</button>';
}

function mappaCerca(q) {
  const box = document.getElementById('risultati');
  const n = norm(q);
  if (!n) { box.hidden = true; return; }
  const risultati = [];
  MAPPA.pins.forEach(p => { if (norm(p.v.nome).includes(n) || (p.v.alias || []).some(a => norm(a).includes(n))) risultati.push({ v: p.v, pin: p.v.id, sotto: ICONE_LUOGO[p.v.icona] || 'Luogo' }); });
  elenco('voci', v => v.tipo !== 'luogo' && (norm(v.nome).includes(n) || (v.alias || []).some(a => norm(a).includes(n)))).forEach(v => {
    const l = risolvi(v.luogo, 'luogo');
    const a = l ? antenatoSuMappa(l, MAPPA.id) : null;
    if (a) risultati.push({ v, pin: a.id, sotto: 'a ' + a.nome });
  });
  box.innerHTML = risultati.length ? risultati.slice(0, 8).map(r => `<button data-a="mappa-trova" data-id="${esc(r.pin)}" class="t-${classeDi(r.v)}">${ico(iconaVoce(r.v))}<span>${esc(r.v.nome)}</span><small>${esc(r.sotto)}</small></button>`).join('')
    : '<p class="fioco piccolo" style="padding:8px 10px;margin:0">Niente su questa mappa.</p>';
  box.hidden = false;
}

function mappaMenu() {
  const menu = document.getElementById('menu-mappa');
  if (!menu.hidden) { menu.hidden = true; return; }
  const ordina = (a, b) => (Number(a.ordine) || 0) - (Number(b.ordine) || 0) || String(a.nome).localeCompare(String(b.nome), 'it');
  const principali = elenco('mappe', m => !m.luogo).sort(ordina), interne = elenco('mappe', m => m.luogo).sort(ordina);
  const voce = m => `<button class="voce-menu ${m.id === MAPPA.id ? 'on' : ''}" data-a="mappa-vai" data-id="${esc(m.id)}">${ico(m.id === MAPPA.id ? 'check' : 'mappa')}<span>${esc(m.nome || 'Mappa')}</span></button>`;
  // con il pacchetto le mappe sono una dozzina: il menu scorre (vedi .menu-mappa nello stile) e le città stanno in un gruppo a parte
  menu.innerHTML = `${MAPPA.id ? `<button class="voce-menu voce-menu--forte" data-a="carto-uno">${ico('segnaposto')}<span>Aggiungi un luogo su questa mappa</span></button><hr>` : ''}
    <div class="titoletto">Mappe</div>${principali.map(voce).join('')}
    ${interne.length ? `<div class="titoletto">Città e luoghi <span class="conta">${interne.length}</span></div>${interne.map(voce).join('')}` : ''}
    <button class="voce-menu" data-a="mappa-nuova">${ico('piu')}<span>Aggiungi una mappa</span></button>
    <hr>
    <button class="voce-menu ${MAPPA.cartografo === true ? 'on' : ''}" data-a="carto">${ico('segnaposto')}<span>Modalità cartografo (sposta e aggiungi)</span></button>
    ${MAPPA.id ? `<label class="voce-menu">${ico('immagine')}<span>Cambia l'immagine di questa mappa</span><input type="file" accept="image/*" data-a="mappa-immagine" hidden></label>
    <button class="voce-menu" data-a="mappa-rinomina">${ico('modifica')}<span>Rinomina questa mappa</span></button>` : ''}
    <hr>
    <button class="voce-menu ${IMPOST.neve ? 'on' : ''}" data-a="mappa-neve">${ico('neve')}<span>Neve</span></button>

async function creaMappa(form) {
  const nome = form.querySelector('[name="nome"]').value.trim();
  const file = form.querySelector('[name="file"]').files[0];
  const campoLuogo = form.querySelector('[name="luogo"]');

  const id = nuovoId('mappe');
  const demo = luogoId && DB.voci[luogoId] && DB.voci[luogoId].demo ? 1 : 0;
  chiudiFoglio();
  try {
    salva('mappe', { id, nome, luogo: luogoId || '', demo }, demo ? { locale: true } : {});
    await caricaImmagineMappa(id, file);
  } catch (e) {
    avviso("Non riesco a usare questa immagine: " + e.message);

function salvaNuovoPunto(form) {
  const nome = form.querySelector('[name="nome"]').value.trim();
  if (!nome) { avviso('Scrivi il nome del luogo'); return; }
  const icona = form.querySelector('[name="icona"]').value;
  const seg = form.querySelector('[name="segreto"]');
  const x = Number(form.dataset.x), y = Number(form.dataset.y);
  const m = DB.mappe[MAPPA.id];
  const esistente = risolviNome(nome, 'luogo');
  const opz = m && m.demo ? { locale: true } : {};
  let id;
  if (esistente && DB.voci[esistente] && DB.voci[esistente].tipo === 'luogo') {
    id = esistente;
    salva('voci', { id, mappa: MAPPA.id, x, y, icona }, opz);
  } else {
    const rec = salva('voci', { tipo: 'luogo', nome, icona, mappa: MAPPA.id, x, y, luogo: m && m.luogo ? m.luogo : '', segreto: seg && seg.checked ? 1 : 0, demo: m && m.demo ? 1 : 0 }, opz);
    id = rec.id;

  chiudiFoglio();
  if (MAPPA.cartografo === 'uno') impostaCartografo(false);
  MAPPA.sporca = true;
  mappaCostruisciPin();
  mappaSeleziona(id, false);

// Neve: pochi fiocchi su un canvas, con un filo di vento da ovest
// ---------------------------------------------------------------------
function mappaNeve() {
  const c = document.getElementById('neve');
  if (!c) return;
  const attiva = IMPOST.neve && !document.hidden && document.getElementById('vista-mappa').classList.contains('vis') &&
    !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!attiva) {
    cancelAnimationFrame(MAPPA.neveRaf); MAPPA.neveRaf = 0;
    c.hidden = true;
    return;
  }
  c.hidden = false;
  if (MAPPA.neveRaf) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const g = c.getContext('2d');
  const misura = () => { c.width = Math.round(c.clientWidth * dpr); c.height = Math.round(c.clientHeight * dpr); };
  misura();
  const n = Math.round(clamp(c.clientWidth * c.clientHeight / 8500, 30, 150));
  const fiocchi = Array.from({ length: n }, () => ({ x: Math.random(), y: Math.random(), r: .5 + Math.random() * 1.8, v: 14 + Math.random() * 28, f: Math.random() * 6.28, a: .2 + Math.random() * .5 }));
  let t = performance.now();
  const passo = ora => {
    const dt = Math.min(50, ora - t) / 1000;
    t = ora;
    if (c.width !== Math.round(c.clientWidth * dpr)) misura();
    const W = c.width, H = c.height;
    g.clearRect(0, 0, W, H);
    g.fillStyle = '#EEF2F5';
    fiocchi.forEach(f => {
      f.y += f.v * (1 + f.r * .35) * dt * dpr / H;
      f.f += dt * .9;
      f.x += (Math.sin(f.f) * 7 + 9) * dt * dpr / W;
      if (f.y > 1.02) { f.y = -.02; f.x = Math.random(); }
      if (f.x > 1.02) f.x = -.02;
      g.globalAlpha = f.a;
      g.beginPath();
      g.arc(f.x * W, f.y * H, f.r * dpr, 0, 6.2832);
      g.fill();
    });
    MAPPA.neveRaf = requestAnimationFrame(passo);
  };
  MAPPA.neveRaf = requestAnimationFrame(passo);
}

// Schema per l'output strutturato di AI Studio (si incolla una volta sola, vedi la guida).
// Solo tipi semplici, enum di testo e descrizioni brevi: AI Studio rifiuta gli schemi troppo lunghi.
function schemaAI() {
  const T = d => ({ type: 'string', description: d });
  const N = d => ({ type: 'integer', description: d });
  const E = (valori, d) => ({ type: 'string', enum: valori, description: d });
  const L = (items, d) => ({ type: 'array', items, description: d });
  const O = (props, req, d) => Object.assign({ type: 'object', properties: props, required: req }, d ? { description: d } : {});
  return O({
    sessione: O({
      numero: N('numero della sessione, come nel prompt'),
      data: T('data della sessione AAAA-MM-GG, come nel prompt'),
      titolo: T('titolo breve ed evocativo'),
      riassunto: T('cronaca di 200-350 parole al passato, con @[Nome] e #[Luogo]'),
      in_breve: T('la serata in 3-5 frasi da leggere a voce alta prima della prossima sessione'),
      in_sospeso: L(T('una cosa rimasta in sospeso'), 'debiti, promesse, appuntamenti, missioni a metà'),
      presenti: L(T('id di un personaggio giocante')),
      luogo_finale: T('id o nome del luogo dove il gruppo finisce la serata'),
      giorni_passati: N('giorni passati nel gioco durante la serata'),
      bottino: T('oggetti e monete ottenuti, in breve'),
      citazioni: L(O({ chi: T('chi parla'), testo: T('la frase'), minuto: T('minuto della registrazione') }, ['chi', 'testo']), 'al massimo 5')
    }, ['numero', 'data', 'titolo', 'riassunto', 'in_breve', 'presenti']),
    eventi: L(O({ testo: T('fatto chiave con @[menzioni]'), luogo: T('id o nome del luogo'), minuto: T('minuto della registrazione') }, ['testo'])),
    voci: L(O({
      id: T('id già noto, vuoto se nuova'), tipo: E(['png', 'luogo', 'fazione', 'oggetto']), nome: T('nome'),
      alias: L(T('altro nome sentito')), ruolo: T("chi è o cos'è"), descrizione: T('solo per le voci nuove'),
      luogo: T('dove si trova'), icona: E(Object.keys(ICONE_LUOGO), 'solo per i luoghi nuovi'),
      stato: E(['vivo', 'morto', 'scomparso'], 'solo se è nuovo o cambia'), atteggiamento: N('da -2 ostile a 2 alleato, solo se emerge'),
      storia: T('cosa ha fatto stasera, una frase'), fiducia: E(['alta', 'bassa'], 'bassa se nome o fatto poco chiari')

    missioni: L(O({
      id: T('id già noto, vuoto se nuova'), titolo: T('titolo breve'), descrizione: T('cosa va fatto'),
      committente: T("chi l'ha affidata"), luogo: T('dove'), ricompensa: T('ricompensa promessa'),
      stato: E(['attiva', 'completata', 'fallita', 'abbandonata']), nota: T('cosa è cambiato stasera'), fiducia: E(['alta', 'bassa'])
    }, ['titolo', 'stato'])),
    rapporti: L(O({ pg: T('id del personaggio giocante'), png: T('id o nome del PNG'), delta: N('da -2 a +2'), nota: T('perché') }, ['pg', 'png', 'delta'])),
    oggetti: L(O({ nome: T('oggetto ottenuto'), quantita: N('quanti'), valore_mo: N('valore in mo, 0 se non detto'), peso_lb: N('peso in libbre, 0 se non detto'), chi: T('chi lo tiene, vuoto se del gruppo'), magico: { type: 'boolean' } }, ['nome'])),
    monete: N("monete d'oro guadagnate dal gruppo stasera, 0 se niente"),

// Minuto della registrazione di un segnalibro (in millisecondi dall'avvio della registrazione)
function minutoSegnalibro(n, ser) {
  if (n.t !== undefined && n.quando === undefined) return Number(n.t) || 0;   // segnalibri delle versioni vecchie
  const zero = ser ? (Number(ser.registrazione) || Number(ser.inizio) || 0) : 0;
  return Math.max(0, (Number(n.quando) || 0) - zero);
}

function promptImport() {
  const pgs = elenco('voci', v => v.tipo === 'pg');
  // Le voci segrete del Master restano fuori: l'AI potrebbe citarle nel riassunto, che vedono tutti.
  // Fanno eccezione quelle che il Master segna "previste stasera": compaiono solo come aiuto per scrivere bene i nomi.
  const voci = elenco('voci', v => v.tipo !== 'pg' && !v.segreto);
  const previste = IMPOST.master ? elenco('voci', v => v.segreto && v.previsto) : [];
  const missioni = elenco('missioni', m => (m.stato || 'attiva') === 'attiva' && !m.segreto);
  const ultime = indice().sessioni.slice(-2);
  const I = indice();
  const master = cfg('master', '');
  // segnalibri della serata (mai quelli segreti), e se l'audio è diviso in pezzi solo quelli del pezzo
  const ser = serata();
  const pezzi = clamp(Number(IMPORT.pezzi) || 1, 1, 8), pezzo = clamp(Number(IMPORT.pezzo) || 1, 1, pezzi);
  const lungo = (Number(IMPORT.minutiPezzo) || 60) * 60000;
  const da = (pezzo - 1) * lungo, a = pezzi > 1 ? pezzo * lungo : Infinity;
  const seg = !IMPORT.segnalibri ? [] : segnalibriSerata().filter(n => n.tipo !== 'segreto')
    .map(n => Object.assign({}, n, { m: minutoSegnalibro(n, ser) })).filter(n => n.m >= da && n.m < a)
    .map(n => `- ${durata(n.m - da)} · ${(TIPI_SEGNALIBRO[n.tipo] || TIPI_SEGNALIBRO.nota).nome}${n.chi ? ' · ' + n.chi : ''}${n.testo ? ': ' + n.testo : ''}`);
  const sch = JSON.parse(JSON.stringify(SCHELETRO));
  sch.sessione.numero = IMPORT.numero;
  sch.sessione.data = IMPORT.data;
  const rigaVoce = v => `- id "${v.id}" | ${(TIPI_VOCE[v.tipo] || TIPI_VOCE.png).nome} | ${v.nome}` +
    ((v.alias || []).length ? ' | detto anche: ' + v.alias.join(', ') : '') +
    (v.ruolo ? ' | ' + v.ruolo : '') + (v.luogo ? ' | a ' + nomeDi(v.luogo) : '') +
    (v.guida && v.tipo !== 'luogo' && !(I.sessioniDi[v.id] || []).length ? ' | dalla guida, non ancora incontrato' : '');
  // con istruzioni salvate di una versione vecchia rimando tutte le regole: almeno quelle sono aggiornate
  const fisse = istruzioniSalvate() >= VERSIONE_SCHEMA_AI;
  return [
    fisse ? 'Segui le istruzioni di sistema e lo schema già impostati.' : istruzioniAI(),
    '',
    `SESSIONE ${IMPORT.numero}, giocata il ${IMPORT.data}. Campagna "${cfg('campagna', 'la nostra campagna')}"${master ? ', Master: ' + master : ''}. Ti allego la registrazione audio (o la trascrizione).`,
    pezzi > 1 ? `Il file allegato è il PEZZO ${pezzo} DI ${pezzi} della serata: va dal minuto ${Math.round(da / 60000)} al minuto ${Math.round(Math.min(a, 24 * 3600000) / 60000)}. Racconta solo questo pezzo (gli altri li fanno altre chat); i minuti dei segnalibri qui sotto sono già contati dall'inizio del pezzo.${pezzo > 1 ? ' Nel riassunto non ripetere quello che è successo prima.' : ''}` : '',
    '',
    'PERSONAGGI GIOCANTI (usa questi id in "presenti" e "rapporti"):',
    pgs.length ? pgs.map(p => `- id "${p.id}" | ${p.nome}${p.giocatore ? ' (giocato da ' + p.giocatore + ')' : ''}${p.classe ? ' | ' + p.classe : ''}`).join('\n')
      : "- nessuno registrato: al posto dell'id scrivi il nome del personaggio",
    '',
    'VOCI GIÀ NOTE:',
    voci.length ? voci.map(rigaVoce).join('\n') : '- nessuna',
    previste.length ? '\nNOMI CHE POTREBBERO COMPARIRE STASERA (solo per scriverli giusti: se li senti usa questo id, se non compaiono ignorali e non citarli):\n' + previste.map(rigaVoce).join('\n') : '',
    '',
    'MISSIONI IN CORSO:',
    missioni.length ? missioni.map(m => `- id "${m.id}" | ${m.titolo}${m.committente ? ' | affidata da ' + nomeDi(m.committente) : ''}`).join('\n') : '- nessuna',
    ultime.length ? '\nLE ULTIME SESSIONI, PER CONTESTO:\n' + ultime.map(s => `- Sessione ${s.numero}, "${s.titolo}": ${testoPiatto(s.inBreve || s.riassunto).replace(/\s+/g, ' ').slice(0, 600)}`).join('\n') : '',
    seg.length ? '\nSEGNALIBRI PRESI AL TAVOLO (minuto della registrazione · tipo · chi: nota):\n' + seg.join('\n') : '',
    '',
    fisse ? 'Rispondi con il JSON dello schema.' : 'FORMATO DELLA RISPOSTA (stessi nomi dei campi; gli elenchi possono avere più elementi o essere vuoti):\n' + JSON.stringify(sch, null, 2)
  ].filter((r, i, t) => r !== '' || t[i - 1] !== '').join('\n');
}

// Estraggo il JSON anche se l'AI ha aggiunto ```json o del testo intorno. Nel riquadro possono esserci
// più risposte una dopo l'altra (audio diviso in pezzi): restituisco l'elenco degli oggetti trovati.
function leggiRisposte(testo) {
  const t = String(testo || '').replace(/```(?:json)?/gi, '').trim();
  if (!t) throw new Error('Il riquadro è vuoto: incolla la risposta di AI Studio');
  // cerco gli oggetti di primo livello contando le graffe fuori dalle stringhe
  const blocchi = [];
  let prof = 0, inizio = -1, inStringa = false, escape = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (inStringa) { if (escape) escape = false; else if (c === '\\') escape = true; else if (c === '"') inStringa = false; continue; }
    if (c === '"') { if (prof > 0) inStringa = true; continue; }
    if (c === '{') { if (prof === 0) inizio = i; prof++; }
    else if (c === '}' && prof > 0) { prof--; if (prof === 0) { blocchi.push(t.slice(inizio, i + 1)); inizio = -1; } }
  }
  if (inizio >= 0) blocchi.push(t.slice(inizio));   // l'ultimo non si chiude: risposta tagliata
  if (!blocchi.length) throw new Error('Non trovo un oggetto JSON nella risposta');
  return blocchi.map((b, i) => {
    const quale = blocchi.length > 1 ? `La risposta ${i + 1}` : 'La risposta';
    try { return JSON.parse(b); } catch (e) { /* riprovo sotto */ }
    // errori tipici: virgola prima di una parentesi chiusa
    try { return JSON.parse(b.replace(/,\s*([}\]])/g, '$1')); }
    catch (e2) {
      if (!/\}\s*$/.test(b)) throw new Error(`${quale} è tagliata a metà: l'AI si è fermata prima della fine. Chiedile di ripetere il JSON, oppure dividi l'audio in pezzi da un'ora (vedi "Audio diviso in pezzi").`);
      throw new Error(`${quale} non è un JSON valido (${e2.message}). Chiedi all'AI di ripetere solo il JSON.`);
    }
  });
}
function leggiJSON(testo) { return leggiRisposte(testo)[0]; }

// Più risposte (una per pezzo di audio) diventano una sola: testi uno dopo l'altro, elenchi in fila,
// voci e missioni con lo stesso id o nome unite (la storia si somma, lo stato vale quello dell'ultimo pezzo)
function unisciRisposte(lista) {
  if (lista.length === 1) return lista[0];
  const fuori = { sessione: {}, eventi: [], voci: [], missioni: [], rapporti: [], oggetti: [], monete: 0, dicerie: [], gesta: [], fine: lista.every(j => j && j.fine === true) };
  const unisciTesto = (a, b, sep) => [a, b].filter(x => x && String(x).trim()).join(sep);
  lista.forEach((j, i) => {
    const s = j.sessione || {}, f = fuori.sessione;
    if (i === 0) Object.assign(f, s);
    else {
      f.riassunto = unisciTesto(f.riassunto, s.riassunto, '\n\n');
      f.in_breve = unisciTesto(f.in_breve, s.in_breve, ' ');
      f.bottino = unisciTesto(f.bottino, s.bottino, '; ');
      if (s.luogo_finale) f.luogo_finale = s.luogo_finale;
      f.giorni_passati = (Number(f.giorni_passati) || 0) + (Number(s.giorni_passati) || 0);
      ['presenti', 'in_sospeso', 'citazioni'].forEach(k => { f[k] = (Array.isArray(f[k]) ? f[k] : []).concat(Array.isArray(s[k]) ? s[k] : []); });
      f.presenti = f.presenti.filter((x, k) => f.presenti.indexOf(x) === k);
    }
    ['eventi', 'rapporti', 'oggetti', 'dicerie', 'gesta'].forEach(k => { if (Array.isArray(j[k])) fuori[k] = fuori[k].concat(j[k]); });
    fuori.monete += Number(j.monete) || 0;
    // voci e missioni: la stessa entità in due pezzi diventa una proposta sola
    [['voci', 'nome'], ['missioni', 'titolo']].forEach(([k, campo]) => (Array.isArray(j[k]) ? j[k] : []).forEach(x => {
      if (!x || !x[campo]) return;
      const gia = fuori[k].find(y => (x.id && y.id === x.id) || norm(y[campo]) === norm(x[campo]));
      if (!gia) { fuori[k].push(Object.assign({}, x)); return; }
      ['storia', 'nota'].forEach(c => { if (x[c]) gia[c] = unisciTesto(gia[c], x[c], ' '); });
      ['ruolo', 'descrizione', 'luogo', 'icona', 'committente', 'ricompensa'].forEach(c => { if (!gia[c] && x[c]) gia[c] = x[c]; });
      ['stato', 'atteggiamento'].forEach(c => { if (x[c] !== undefined && x[c] !== '') gia[c] = x[c]; });
      if (x.fiducia === 'bassa') gia.fiducia = 'bassa';
      gia.alias = (gia.alias || []).concat(x.alias || []).filter((n, q, t) => t.indexOf(n) === q);
    }));
  });
  return fuori;
}

function numeroAtteggiamento(x) {
  if (x === undefined || x === null || x === '') return null;
  const n = Number(x);
  return isNaN(n) ? null : clamp(Math.round(n), -2, 2);
}

// Voci (o missioni) con nome simile, dalla più simile
function trovaSimili(nome, tab, tipo) {
  const n = norm(nome);
  if (!n) return [];
  return elenco(tab, r => tab !== 'voci' || !tipo || r.tipo === tipo || (tipo === 'png' && r.tipo === 'pg'))
    .map(r => {
      const nomi = tab === 'missioni' ? [r.titolo] : [r.nome].concat(r.alias || []);
      let punti = 0;
      nomi.forEach(x => { punti = Math.max(punti, somiglianza(n, norm(x))); });
      return { id: r.id, punti };
    })
    .filter(x => x.punti >= .5)
    .sort((a, b) => b.punti - a.punti);
}
// 1 = uguali. Contenuto uno nell'altro = 0,9. Altrimenti distanza di Levenshtein normalizzata
function somiglianza(a, b) {
  if (!a || !b) return 0;
  if (a === b) return 1;
  if (a.length >= 4 && b.length >= 4 && (a.includes(b) || b.includes(a))) return .9;
  const m = a.length, n = b.length;
  let prec = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cor = [i];
    for (let j = 1; j <= n; j++) cor[j] = Math.min(prec[j] + 1, cor[j - 1] + 1, prec[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prec = cor;
  }
  return 1 - prec[n] / Math.max(m, n);
}

// Dalla risposta dell'AI all'elenco di proposte da controllare.
// Ogni proposta ha "dubbio": il motivo per cui va guardata (vuoto = sicura). In revisione le sicure
// restano chiuse e già accettate, così si leggono solo le 5-10 righe che contano.
function preparaRevisione(j) {
  const s = j.sessione || {};
  const testo = x => String(x === undefined || x === null ? '' : x).trim();
  const P = {
    sessione: {
      numero: Number(s.numero) || IMPORT.numero || prossimoNumero(),
      data: /^\d{4}-\d{2}-\d{2}$/.test(s.data || '') ? s.data : IMPORT.data,
      titolo: testo(s.titolo) || 'Sessione ' + (s.numero || IMPORT.numero),
      riassunto: testo(s.riassunto),
      inBreve: testo(s.in_breve),
      sospesi: (Array.isArray(s.in_sospeso) ? s.in_sospeso : []).map(testo).filter(Boolean),
      presenti: Array.isArray(s.presenti) ? s.presenti.filter(Boolean) : [],
      luogo: s.luogo_finale || s.luogo || '',
      giorni: Math.max(0, Math.round(Number(s.giorni_passati) || 0)),
      bottino: testo(s.bottino),
      citazioni: (Array.isArray(s.citazioni) ? s.citazioni : []).filter(c => c && c.testo).map(c => ({ chi: testo(c.chi), testo: testo(c.testo) }))
    },
    // "da_controllare" e "motivo" non li chiede all'AI nessuno: servono ai file preparati a mano (per esempio le
    // sessioni giocate prima dell'app), per dire in revisione cosa guardare e perché
    daControllare: (Array.isArray(s.da_controllare) ? s.da_controllare : []).map(testo).filter(Boolean),
    eventi: (Array.isArray(j.eventi) ? j.eventi : []).filter(e => e && e.testo).map(e => ({ t: testo(e.testo), l: e.luogo || '', ok: true, motivo: testo(e.motivo) })),
    voci: [], missioni: [], rapporti: [], oggetti: [], dicerie: [],
    // gesta: una frase con il luogo dentro come menzione, così nel diario si legge e si collega da sola
    gesta: (Array.isArray(j.gesta) ? j.gesta : []).filter(g => g && testo(typeof g === 'string' ? g : g.testo)).map(g => ({ t: testo(typeof g === 'string' ? g : g.testo), l: typeof g === 'string' ? '' : testo(g.luogo), ok: true, motivo: typeof g === 'string' ? '' : testo(g.motivo) })),
    monete: Math.round(Number(j.monete) || 0)
  };
  // la stessa sessione importata due volte farebbe doppioni ovunque (sessione, bottino, monete, rapporti):
  // se il numero c'è già lo dico subito e non salvo (vedi applicaImport)
  P.sessione.esistente = sessioneConNumero(P.sessione.numero);
  // giorni passati: se durante la serata l'orologio del gruppo è andato avanti, i giorni li ha già
  // contati lui (il calendario somma anche quelli): propongo 0 e dico quanti ne proponeva l'AI
  const ser = serata();
  if (ser && ser.oraInizio !== undefined && ser.oraInizio !== '' && Math.abs(oreCampagna() - Number(ser.oraInizio)) > 0.01) {
    const daAI = P.sessione.giorni;
    P.sessione.giorni = 0;
    P.sessione.notaGiorni = `Durante la serata l'orologio del gruppo è andato avanti (${testoDurata(oreCampagna() - Number(ser.oraInizio))}) e i giorni li conta già lui: per questo qui c'è 0${daAI ? `; l'AI ne proponeva ${daAI}` : ''}.`;
  }
  (Array.isArray(j.voci) ? j.voci : []).forEach(v => {
    if (!v || !v.nome) return;
    const tipo = TIPI_VOCE[v.tipo] && v.tipo !== 'pg' ? v.tipo : 'png';
    const esiste = v.id && DB.voci[v.id] && visibile(DB.voci[v.id]) ? v.id : null;
    const simili = trovaSimili(v.nome, 'voci', tipo);
    let azione = 'crea', bersaglio = '', dubbio = '';
    if (esiste) { azione = 'aggiorna'; bersaglio = esiste; }
    else if (simili[0] && simili[0].punti >= .86) { azione = 'aggiorna'; bersaglio = simili[0].id; }
    else if (simili[0]) dubbio = 'Nome simile a ' + DB.voci[simili[0].id].nome + ' (' + Math.round(simili[0].punti * 100) + '%)';
    const vecchio = bersaglio ? DB.voci[bersaglio] : null;
    if (!dubbio && (v.stato === 'morto' || v.stato === 'scomparso') && (!vecchio || (vecchio.stato || 'vivo') !== v.stato)) dubbio = v.stato === 'morto' ? 'Risulta morto' : 'Risulta scomparso';
    if (!dubbio && azione === 'aggiorna' && !esiste && simili[0] && simili[0].punti < 1) dubbio = 'Unito per somiglianza a ' + vecchio.nome;
    if (!dubbio && v.fiducia === 'bassa') dubbio = "L'AI non ne è sicura";
    if (testo(v.motivo)) dubbio = testo(v.motivo) + (dubbio ? ' · ' + dubbio : '');
    P.voci.push({ dati: Object.assign({}, v, { tipo, nome: testo(v.nome), alias: Array.isArray(v.alias) ? v.alias.filter(Boolean) : [] }), azione, bersaglio, simili: simili.slice(0, 6), dubbio });
  });
  (Array.isArray(j.missioni) ? j.missioni : []).forEach(m => {
    if (!m || !m.titolo) return;
    const esiste = m.id && DB.missioni[m.id] && visibile(DB.missioni[m.id]) ? m.id : null;
    const simili = trovaSimili(m.titolo, 'missioni');
    let azione = 'crea', bersaglio = '', dubbio = '';
    if (esiste) { azione = 'aggiorna'; bersaglio = esiste; }
    else if (simili[0] && simili[0].punti >= .86) { azione = 'aggiorna'; bersaglio = simili[0].id; }
    else if (simili[0]) dubbio = 'Titolo simile a ' + DB.missioni[simili[0].id].titolo;
    const stato = STATI_MISSIONE[m.stato] ? m.stato : 'attiva';
    if (!dubbio && stato !== 'attiva') dubbio = 'Risulta ' + STATI_MISSIONE[stato].toLowerCase();
    if (!dubbio && m.fiducia === 'bassa') dubbio = "L'AI non ne è sicura";
    if (testo(m.motivo)) dubbio = testo(m.motivo) + (dubbio ? ' · ' + dubbio : '');
    P.missioni.push({ dati: Object.assign({}, m, { titolo: testo(m.titolo) }), azione, bersaglio, simili: simili.slice(0, 6), dubbio });
  });
  (Array.isArray(j.rapporti) ? j.rapporti : []).forEach(r => {
    if (!r || !r.pg || !r.png) return;
    const delta = clamp(Math.round(Number(r.delta) || 0), -2, 2);
    // i rapporti cambiano i numeri di tutti: li faccio sempre guardare
    P.rapporti.push({ pg: r.pg, png: r.png, delta, nota: testo(r.nota), ok: true, dubbio: 'Rapporto', motivo: testo(r.motivo) });
  });
  (Array.isArray(j.oggetti) ? j.oggetti : []).forEach(o => {
    if (!o || !testo(o.nome)) return;
    P.oggetti.push({ nome: testo(o.nome), quantita: Math.max(1, Math.round(Number(o.quantita) || 1)), valore: Math.max(0, Number(o.valore_mo) || 0), peso: Math.max(0, Number(o.peso_lb) || 0), chi: testo(o.chi), magico: o.magico === true || o.magico === 'true', ok: true, motivo: testo(o.motivo) });
  });
  (Array.isArray(j.dicerie) ? j.dicerie : []).forEach(d => {
    if (!d || !testo(d.testo)) return;
    P.dicerie.push({ testo: testo(d.testo), chi: testo(d.chi), dove: testo(d.dove), ok: true, motivo: testo(d.motivo) });
  });
  return P;
}

// Cosa cambierebbe in una voce esistente (usato sia per mostrarlo sia per applicarlo)
function differenzeVoce(p) {
  const v = DB.voci[p.bersaglio];
  const d = p.dati;
  const out = [];
  if (!v) return out;
  const alias = [d.nome].concat(d.alias || []).filter(n => n && norm(n) !== norm(v.nome) && !(v.alias || []).some(a => norm(a) === norm(n)));
  if (alias.length) out.push({ campo: alias.length > 1 ? 'Nuovi alias' : 'Nuovo alias', testo: alias.map(esc).join(', ') });
  if (d.ruolo && !v.ruolo) out.push({ campo: 'Ruolo', testo: esc(d.ruolo) });
  if (d.descrizione && !v.descrizione) out.push({ campo: 'Descrizione', testo: esc(d.descrizione) });
  if (STATI_PNG[d.stato] && d.stato !== (v.stato || 'vivo')) out.push({ campo: 'Stato', testo: `${esc(STATI_PNG[v.stato || 'vivo'])} → ${esc(STATI_PNG[d.stato])}` });
  const att = numeroAtteggiamento(d.atteggiamento);
  const vAtt = v.atteggiamento === undefined || v.atteggiamento === '' ? null : Number(v.atteggiamento);
  if (att !== null && att !== vAtt) out.push({ campo: 'Verso il gruppo', testo: `${esc(vAtt === null ? 'non indicato' : ATTEGGIAMENTI[vAtt])} → ${esc(ATTEGGIAMENTI[att])}` });
  if (d.luogo && risolvi(d.luogo, 'luogo') !== risolvi(v.luogo, 'luogo')) out.push({ campo: 'Si trova a', testo: esc(nomeDi(d.luogo)) });
  return out;
}

function vistaImporta() {
  const ser = serata();
  if (IMPORT.numero == null) IMPORT.numero = prossimoNumero();
  // la data è quella di inizio serata: si importa spesso il giorno dopo, o dopo mezzanotte
  if (!IMPORT.data) IMPORT.data = ser && ser.data ? ser.data : oggiISO();
  const nSeg = segnalibriSerata().filter(n => n.tipo !== 'segreto').length;
  const fisse = istruzioniSalvate() >= VERSIONE_SCHEMA_AI;
  const vecchie = !fisse && istruzioniSalvate() > 0;
  const pezzi = clamp(Number(IMPORT.pezzi) || 1, 1, 8);
  return `<h1 class="t1">Importa una sessione</h1>
  <div class="lettura fioco" style="margin-top:10px"><p>Dalla registrazione al diario in tre passaggi. Il lavoro pesante lo fa Google AI Studio: tu controlli e salvi.</p></div>
  ${vecchie ? `<div class="avviso-import"><strong>Schema e istruzioni sono cambiati</strong> (con la 1.6 ci sono le gesta del gruppo). Ricopiali in AI Studio dal riquadro qui sotto, poi riaccendi "già in AI Studio". Fino ad allora il prompt contiene di nuovo tutte le regole.</div>` : ''}
  <details class="prima-volta"${fisse ? '' : ' open'}><summary>${ico('info')}Prima volta in AI Studio? Preparalo una volta sola</summary>
    <ol class="passi-legenda">
      <li><strong>Schema:</strong> nel pannello a destra attiva <em>Structured output</em>, tocca <em>Edit</em> e incolla lo schema. Da lì l'AI risponde sempre con un JSON valido.</li>
      <li><strong>Istruzioni:</strong> incolla le regole fisse nelle <em>System instructions</em> e salvale (o salva la chat come modello da copiare ogni volta).</li>
      <li>Poi spunta qui sotto "già pronte": il prompt di ogni sessione diventa molto più corto.</li>
    </ol>
    <div class="azioni"><button class="btn btn--piccolo" data-a="imp-schema">${ico('copia')}Copia lo schema</button><button class="btn btn--piccolo" data-a="imp-istruzioni">${ico('copia')}Copia le istruzioni</button></div>
    <label class="interruttore" style="margin-top:12px"><span>Istruzioni e schema di questa versione sono già in AI Studio</span><input type="checkbox" data-a="imp-fisse" ${fisse ? 'checked' : ''}></label>
    <p class="fioco piccolo">La guida passo passo è GUIDA-AI-STUDIO.md, nello zip di Taverna accanto a GUIDA.md. Per trascrivere sul PC invece di mandare l'audio c'è GUIDA-WHISPER.md.</p>
  </details>
  <ol class="passi" style="margin-top:28px">
    <li><h2>Prepara il prompt</h2>
      <div class="riga-campi"><label class="campo"><span>Sessione numero</span><input type="number" data-a="imp-numero" value="${esc(IMPORT.numero)}" min="1" inputmode="numeric"></label>
      <label class="campo"><span>Giocata il</span><input type="date" data-a="imp-data" value="${esc(IMPORT.data)}"></label></div>
      ${nSeg ? `<label class="interruttore" style="margin-bottom:8px"><span>Includi i ${nSeg} segnalibri della serata</span><input type="checkbox" data-a="imp-seg" ${IMPORT.segnalibri ? 'checked' : ''}></label>` : ''}
      <div class="riga-campi"><label class="campo"><span>Audio diviso in pezzi</span><select data-a="imp-pezzi">${[1, 2, 3, 4].map(n => `<option value="${n}" ${pezzi === n ? 'selected' : ''}>${n === 1 ? 'No, un file solo' : n + ' pezzi'}</option>`).join('')}</select></label>
      ${pezzi > 1 ? `<label class="campo"><span>Prompt per il pezzo</span><select data-a="imp-pezzo">${Array.from({ length: pezzi }, (_, i) => `<option value="${i + 1}" ${Number(IMPORT.pezzo) === i + 1 ? 'selected' : ''}>${i + 1} di ${pezzi}</option>`).join('')}</select></label>` : ''}</div>
      ${pezzi > 1 ? `<p class="fioco piccolo" style="margin-top:0">Pezzi da ${esc(IMPORT.minutiPezzo)} minuti: una chat di AI Studio per pezzo, ognuna con il suo prompt. Le risposte le incolli tutte nel riquadro qui sotto, una dopo l'altra.</p>` : ''}
      <div class="azioni"><button class="btn btn--primario" data-a="imp-copia">${ico('copia')}Copia il prompt${pezzi > 1 ? ' del pezzo ' + esc(IMPORT.pezzo) : ''}</button>
      <a class="btn" href="https://aistudio.google.com/" target="_blank" rel="noopener">${ico('esterno')}Apri AI Studio</a></div>
      <p class="fioco piccolo" style="margin-top:12px">In AI Studio apri una nuova chat (o una copia della tua chat modello), aggiungi il file audio dal Drive, incolla il prompt e invia. Il prompt contiene già personaggi, luoghi e missioni che conosciamo, così l'AI non crea doppioni.</p>
    </li>
    <li><h2>Incolla la risposta</h2>
      <textarea data-a="imp-risposta" placeholder="Incolla qui il JSON restituito da AI Studio. Con l'audio diviso in pezzi, incolla le risposte una sotto l'altra." spellcheck="false" style="font-size:14px;min-height:140px">${esc(IMPORT.risposta)}</textarea>
      <div class="azioni"><button class="btn" data-a="imp-incolla">${ico('importa')}${IMPORT.risposta ? 'Aggiungi dagli appunti' : 'Incolla dagli appunti'}</button>
        <label class="btn">${ico('importa')}Apri un file<input type="file" data-a="imp-file" accept=".json,.txt,application/json,text/plain" hidden></label>
        <button class="btn btn--primario" data-a="imp-leggi">Leggi la risposta</button></div>
      <p class="fioco piccolo" style="margin-top:0">"Apri un file" serve per una risposta salvata in un file (per esempio le sessioni giocate prima dell'app, preparate a mano).</p>
      ${IMPORT.errore ? `<p class="errore" id="errore-import">${esc(IMPORT.errore)}</p>` : ''}
    </li>
    <li id="passo-revisione"><h2>Controlla e salva</h2>
      ${IMPORT.proposte ? revisioneHTML() : '<p class="fioco">Qui compariranno le proposte da confermare: prima quelle da controllare, poi (chiuse) quelle sicure.</p>'}
    </li>
  </ol>`;
}

function revisioneHTML() {
  const P = IMPORT.proposte;
  const s = P.sessione;
  let h = IMPORT.avvisi.length ? `<div class="avviso-import">${IMPORT.avvisi.map(a => `<p>${ico('info')}${esc(a)}</p>`).join('')}</div>` : '';
  const giaQui = s.esistente && DB.sessioni[s.esistente];
  if (giaQui) h += `<div class="avviso-import doppione"><p><strong>La sessione ${esc(s.numero)} è già nel diario</strong>${giaQui.titolo ? ' (' + esc(giaQui.titolo) + ')' : ''}. Salvarla di nuovo creerebbe doppioni: sessione, bottino, monete e rapporti contati due volte.</p>
    <p>Se vuoi rifarla, apri quella sessione e premi <em>Annulla l'import</em> (oppure correggila a mano), poi torna qui.</p>
    <div class="azioni"><a class="btn btn--piccolo" href="#/sessione/${encodeURIComponent(s.esistente)}">${ico('diario')}Apri la sessione ${esc(s.numero)}</a></div></div>`;
  if (P.daControllare.length) h += `<div class="avviso-import"><p><strong>Da controllare in questa sessione</strong></p><ul>${P.daControllare.map(x => `<li>${testoRicco(x, 'riga')}</li>`).join('')}</ul></div>`;
  // il motivo per cui una riga va guardata (file preparati a mano), sotto la riga
  const motivo = x => x && x.motivo ? `<br><span class="motivo-dubbio">${ico('info')}${esc(x.motivo)}</span>` : '';
  // fatti e gesta (1.7): righe numerate e modificabili. I numeri servono alle correzioni ("togli la gesta 2");
  // la spunta tiene o lascia fuori la riga; il primo #[Luogo] scritto nella riga la lega a quel luogo
  const righeRev = (gruppo, cosa) => `<ol class="righe-rev">${P[gruppo].map((x, i) => `<li class="${x.ok ? '' : 'fuori'}">
      <input type="checkbox" data-a="rev-ok" data-gruppo="${gruppo}" data-i="${i}" ${x.ok ? 'checked' : ''} aria-label="Tieni ${cosa} ${i + 1}">
      <div class="corpo"><span class="n-rev">${i + 1}</span><textarea class="breve" data-a="rev-testo" data-gruppo="${gruppo}" data-i="${i}" data-menzioni rows="2" aria-label="Testo del${cosa === 'la gesta' ? 'la gesta' : ' fatto'} ${i + 1}">${esc(x.t)}</textarea>
      ${x.l && nomeDi(x.l) ? `<span class="fioco piccolo luogo-rev">a ${esc(nomeDi(x.l))}</span>` : ''}${motivo(x)}</div></li>`).join('')}</ol>`;
  // le correzioni (1.7): da un'altra AI o scritte a mano, si applicano tutte insieme alla revisione aperta
  const esiti = IMPORT.esitoCorrezioni || [];
  h += `<details class="correzioni"${IMPORT.correzioni || esiti.length ? ' open' : ''}><summary>${ico('modifica')}Correzioni corte, da un'altra AI o a mano</summary>
    <p class="fioco piccolo">Una per riga, per esempio <code>rinomina Gilda in Gilda Brinamoro</code>, <code>unisci Brakk con l'id voc-…</code>, <code>togli la gesta 2</code>. Per farle scrivere a un'altra AI (il progetto del controllo delle sessioni), dalle il wiki: <strong>Esporta il wiki per l'AI</strong> lo copia con tutti gli id, e in fondo ha l'elenco delle correzioni che l'app capisce.</p>
    <div class="azioni azioni--strette"><button class="btn btn--piccolo" data-a="imp-wiki-copia">${ico('copia')}Esporta il wiki per l'AI</button><button class="btn btn--testo btn--piccolo" data-a="imp-wiki-scarica">${ico('esporta')}Scarica come file</button></div>
    <textarea data-a="rev-correzioni" spellcheck="false" placeholder="rinomina … in …&#10;unisci … con l'id …&#10;togli la gesta …">${esc(IMPORT.correzioni || '')}</textarea>
    <div class="azioni azioni--strette"><button class="btn btn--piccolo" data-a="rev-correzioni-incolla">${ico('importa')}Incolla dagli appunti</button><button class="btn btn--primario btn--piccolo" data-a="rev-correzioni-applica">${ico('check')}Applica le correzioni</button></div>
    ${esiti.length ? `<ul class="esito-correzioni">${esiti.map(e => `<li class="${e.ok ? 'ok' : 'no'}">${ico(e.ok ? 'check' : 'info')}<span><strong>${esc(e.riga)}</strong><br>${esc(e.testo)}</span></li>`).join('')}</ul>` : ''}
    <details class="formato-correzioni"><summary>Tutte le correzioni che l'app capisce</summary><pre>${esc(FORMATO_CORREZIONI)}</pre></details></details>`;
  h += `<article class="prop" style="--tc:var(--lanterna)">
    <div class="testa"><span class="num-grande" style="width:46px;height:46px;font-size:21px;box-shadow:none">${esc(s.numero)}</span>
      <div class="corpo"><strong>Sessione ${esc(s.numero)}</strong><small>${dataBella(s.data)}${s.luogo ? ', il gruppo finisce a ' + esc(nomeDi(s.luogo)) : ''}</small></div></div>
    <label class="campo"><span>Titolo</span><input type="text" data-a="rev-sessione" data-k="titolo" value="${esc(s.titolo)}"></label>
    <label class="campo"><span>Riassunto</span><textarea data-a="rev-sessione" data-k="riassunto" data-menzioni class="alto">${esc(s.riassunto)}</textarea></label>
    <label class="campo"><span>In breve, da leggere prima della prossima sessione</span><textarea data-a="rev-sessione" data-k="inBreve" data-menzioni>${esc(s.inBreve)}</textarea></label>
    <label class="campo"><span>Cose in sospeso (una per riga)</span><textarea data-a="rev-sospesi" data-menzioni>${esc(s.sospesi.join('\n'))}</textarea></label>
    <label class="campo"><span>Giorni passati nel gioco</span><input type="number" data-a="rev-sessione" data-k="giorni" value="${esc(s.giorni)}" min="0" inputmode="numeric">${s.notaGiorni ? `<small>${esc(s.notaGiorni)}</small>` : ''}</label>`;
  h += `<div class="campo"><span class="etichetta">Fatti principali</span>${righeRev('eventi', 'il fatto')}
    <button class="btn btn--testo btn--piccolo" data-a="rev-aggiungi" data-gruppo="eventi">${ico('piu')}Aggiungi un fatto</button></div>`;
  const extra = [];
  if (s.citazioni.length) extra.push(s.citazioni.length + (s.citazioni.length === 1 ? ' frase memorabile' : ' frasi memorabili'));
  if (s.presenti.length) extra.push('presenti: ' + s.presenti.map(p => esc(nomeDi(p))).join(', '));
  if (s.bottino) extra.push('bottino: ' + esc(s.bottino));
  if (extra.length) h += `<p class="nota" style="margin:0">${extra.join('; ')}</p>`;
  h += '</article>';

  // una proposta di voce: azione scelta e cosa cambierebbe
  const cartaVoce = (p, i) => {
    const d = p.dati;
    const cl = (TIPI_VOCE[d.tipo] || TIPI_VOCE.png).classe;
    const opz = [`<option value="crea" ${p.azione === 'crea' ? 'selected' : ''}>Crea una nuova voce</option>`];
    const bersagli = p.simili.map(x => x.id);
    if (p.bersaglio && !bersagli.includes(p.bersaglio)) bersagli.unshift(p.bersaglio);
    bersagli.forEach(id => {
      const v = DB.voci[id];
      const sim = p.simili.find(x => x.id === id);
      if (v) opz.push(`<option value="u:${esc(id)}" ${p.azione === 'aggiorna' && p.bersaglio === id ? 'selected' : ''}>Aggiorna ${esc(v.nome)}${v.segreto ? ' (segreta)' : ''}${sim && sim.punti < 1 && id !== d.id ? ' (simile al ' + Math.round(sim.punti * 100) + '%)' : ''}</option>`);
    });
    opz.push(`<option value="salta" ${p.azione === 'salta' ? 'selected' : ''}>Non importare</option>`);
    let dettagli = '';
    if (p.azione === 'crea') {
      const parti = [(TIPI_VOCE[d.tipo] || TIPI_VOCE.png).nome + ' nuovo'];
      if (d.luogo) parti.push('a ' + esc(nomeDi(d.luogo)));
      const att = numeroAtteggiamento(d.atteggiamento);
      if (att !== null) parti.push(esc(ATTEGGIAMENTI[att]).toLowerCase());
      if (STATI_PNG[d.stato] && d.stato !== 'vivo') parti.push(esc(STATI_PNG[d.stato]).toLowerCase());
      dettagli = `<li>${parti.join(', ')}</li>${d.descrizione ? `<li>${esc(d.descrizione)}</li>` : ''}`;
    } else if (p.azione === 'aggiorna') {
      dettagli = differenzeVoce(p).map(x => `<li><b>${x.campo}:</b> ${x.testo}</li>`).join('') || '<li>Solo una nuova riga nella cronologia</li>';
    }
    // il nome si corregge qui (le menzioni lo seguono, vedi rinominaProposta); la frase di stasera anche
    return `<article class="prop t-${cl}${p.azione === 'salta' ? ' saltata' : ''}" id="rev-voci-${i}">
      <div class="testa">${sigillo({ tipo: d.tipo, nome: d.nome, icona: d.icona })}<div class="corpo"><input type="text" class="nome-rev" value="${esc(d.nome)}" data-a="rev-nome" data-gruppo="voci" data-i="${i}" aria-label="Nome di ${esc(d.nome)}"><small>${esc(d.ruolo || (TIPI_VOCE[d.tipo] || TIPI_VOCE.png).nome)}</small></div></div>
      ${p.dubbio ? `<p class="motivo-dubbio">${ico('info')}${esc(p.dubbio)}</p>` : ''}
      <textarea class="breve" data-a="rev-dato" data-gruppo="voci" data-i="${i}" data-k="storia" data-menzioni rows="2" placeholder="Cosa ha fatto stasera" aria-label="Cosa ha fatto stasera">${esc(d.storia || '')}</textarea>
      <div class="scelta-rev"><select data-a="rev-azione" data-gruppo="voci" data-i="${i}" aria-label="Cosa fare con ${esc(d.nome)}">${opz.join('')}</select>
      <button class="btn btn--testo btn--piccolo" data-a="rev-stessa-apri" data-gruppo="voci" data-i="${i}">È la stessa voce di…</button></div>
      ${dettagli && p.azione !== 'salta' ? `<ul class="diff">${dettagli}</ul>` : ''}</article>`;
  };
  const cartaMissione = (p, i) => {
    const d = p.dati;
    const stato = STATI_MISSIONE[d.stato] ? d.stato : 'attiva';
    const opz = [`<option value="crea" ${p.azione === 'crea' ? 'selected' : ''}>Nuova missione</option>`];
    const bersagli = p.simili.map(x => x.id);
    if (p.bersaglio && !bersagli.includes(p.bersaglio)) bersagli.unshift(p.bersaglio);
    bersagli.forEach(id => { const m = DB.missioni[id]; if (m) opz.push(`<option value="u:${esc(id)}" ${p.azione === 'aggiorna' && p.bersaglio === id ? 'selected' : ''}>Aggiorna ${esc(m.titolo)}</option>`); });
    opz.push(`<option value="salta" ${p.azione === 'salta' ? 'selected' : ''}>Non importare</option>`);
    const ex = p.azione === 'aggiorna' ? DB.missioni[p.bersaglio] : null;
    const det = [];
    if (ex && (ex.stato || 'attiva') !== stato) det.push(`<li><b>Stato:</b> ${esc(STATI_MISSIONE[ex.stato || 'attiva'])} → ${esc(STATI_MISSIONE[stato])}</li>`);
    if (!ex) {
      const parti = [stato === 'attiva' ? 'Accettata in questa sessione' : 'Accettata e ' + STATI_MISSIONE[stato].toLowerCase() + ' in questa sessione'];
      if (d.committente) parti.push('affidata da ' + esc(nomeDi(d.committente)));
      if (d.luogo) parti.push('a ' + esc(nomeDi(d.luogo)));
      det.push(`<li>${parti.join(', ')}</li>`);
      if (d.ricompensa) det.push(`<li><b>Ricompensa:</b> ${esc(d.ricompensa)}</li>`);
    }
    return `<article class="prop t-missione${p.azione === 'salta' ? ' saltata' : ''}" id="rev-missioni-${i}">
      <div class="testa"><span class="sigillo t-missione">${ico('missioni')}</span><div class="corpo"><input type="text" class="nome-rev" value="${esc(d.titolo)}" data-a="rev-nome" data-gruppo="missioni" data-i="${i}" aria-label="Titolo della missione"><small>${esc(STATI_MISSIONE[stato])}</small></div></div>
      ${p.dubbio ? `<p class="motivo-dubbio">${ico('info')}${esc(p.dubbio)}</p>` : ''}
      <textarea class="breve" data-a="rev-dato" data-gruppo="missioni" data-i="${i}" data-k="nota" data-menzioni rows="2" placeholder="Cosa è cambiato stasera" aria-label="Cosa è cambiato stasera">${esc(d.nota || '')}</textarea>
      <div class="scelta-rev"><select data-a="rev-azione" data-gruppo="missioni" data-i="${i}" aria-label="Cosa fare con ${esc(d.titolo)}">${opz.join('')}</select>
      <button class="btn btn--testo btn--piccolo" data-a="rev-stessa-apri" data-gruppo="missioni" data-i="${i}">È la stessa missione di…</button></div>
      ${det.length && p.azione !== 'salta' ? `<ul class="diff">${det.join('')}</ul>` : ''}</article>`;
  };
  const cartaRapporto = (r, i) => `<article class="prop t-persona"><label class="spunta" style="align-items:flex-start"><input type="checkbox" data-a="rev-ok" data-gruppo="rapporti" data-i="${i}" ${r.ok ? 'checked' : ''}>
      <span><span class="n-rev">${i + 1}</span><strong>${esc(nomeDi(r.pg))} e ${esc(nomeDi(r.png))}</strong> <span style="color:${r.delta < 0 ? 'var(--cera)' : 'var(--c-luogo)'};font-weight:700">${r.delta > 0 ? '+' + r.delta : r.delta}</span>${r.nota ? `<br><span class="fioco piccolo">${esc(r.nota)}</span>` : ''}${motivo(r)}</span></label></article>`;

  // prima quello che va guardato, poi (chiuso) quello che è sicuro ed è già accettato
  const dubbi = [], sicure = [];
  P.voci.forEach((p, i) => (p.dubbio ? dubbi : sicure).push(cartaVoce(p, i)));
  P.missioni.forEach((p, i) => (p.dubbio ? dubbi : sicure).push(cartaMissione(p, i)));
  P.rapporti.forEach((r, i) => dubbi.push(cartaRapporto(r, i)));
  if (dubbi.length) h += `<h3 class="t3" style="margin:24px 0 10px">Da controllare <span class="fioco piccolo">${dubbi.length}</span></h3>` + dubbi.join('');
  if (sicure.length) {
    h += `<h3 class="t3" style="margin:24px 0 10px">Sicure, già accettate <span class="fioco piccolo">${sicure.length}</span></h3>`;
    h += IMPORT.tutte || !dubbi.length ? sicure.join('') + (dubbi.length ? `<button class="btn btn--testo btn--piccolo" data-a="rev-tutte">Richiudi le proposte sicure</button>` : '')
      : `<p class="fioco piccolo" style="margin-top:0">Voci nuove senza nomi simili e aggiornamenti che aggiungono solo una riga di cronologia.</p><button class="btn btn--piccolo" data-a="rev-tutte">${ico('occhio')}Mostrale</button>`;
  }

  // bottino e dicerie: si spuntano, diventano righe del bottino comune e delle voci di taverna
  if (P.oggetti.length || P.monete) {
    h += `<h3 class="t3" style="margin:24px 0 10px">Bottino del gruppo</h3>`;
    if (P.monete) h += `<label class="campo"><span>Monete d'oro guadagnate insieme</span><input type="number" data-a="rev-monete" value="${esc(P.monete)}" inputmode="numeric"></label>`;
    h += P.oggetti.map((o, i) => `<label class="spunta prop-riga"><input type="checkbox" data-a="rev-ok" data-gruppo="oggetti" data-i="${i}" ${o.ok ? 'checked' : ''}>
      <span><span class="n-rev">${i + 1}</span><strong>${o.quantita > 1 ? o.quantita + ' × ' : ''}${esc(o.nome)}</strong>${o.magico ? ' <span class="chip chip--mini">magico</span>' : ''}<br><span class="fioco piccolo">${[o.valore ? mo(o.valore) : '', o.peso ? o.peso + ' lb' : '', o.chi ? 'lo tiene ' + esc(nomeDi(o.chi)) : 'del gruppo'].filter(Boolean).join(', ')}</span>${motivo(o)}</span></label>`).join('');
  }
  if (P.dicerie.length) {
    h += `<h3 class="t3" style="margin:24px 0 10px">Voci di taverna <span class="fioco piccolo">${P.dicerie.length}</span></h3>` + P.dicerie.map((d, i) =>
      `<label class="spunta prop-riga"><input type="checkbox" data-a="rev-ok" data-gruppo="dicerie" data-i="${i}" ${d.ok ? 'checked' : ''}><span><span class="n-rev">${i + 1}</span>${testoRicco(d.testo, 'riga')}<br><span class="fioco piccolo">${[d.chi ? 'da ' + esc(nomeDi(d.chi)) : '', d.dove ? 'a ' + esc(nomeDi(d.dove)) : ''].filter(Boolean).join(', ') || 'chi la racconta non si sa'}</span>${motivo(d)}</span></label>`).join('');
  }
  h += `<h3 class="t3" style="margin:24px 0 10px">${ico('gesta', 'i-gesta')} Gesta del gruppo <span class="fioco piccolo">${P.gesta.length}</span></h3>${righeRev('gesta', 'la gesta')}
    <button class="btn btn--testo btn--piccolo" data-a="rev-aggiungi" data-gruppo="gesta">${ico('piu')}Aggiungi una gesta</button>`;
  h += `<div class="piede-fisso"><button class="btn" data-a="imp-annulla">Ricomincia</button>${giaQui ? `<a class="btn btn--primario" href="#/sessione/${encodeURIComponent(s.esistente)}">${ico('diario')}Apri la sessione ${esc(s.numero)}</a>` : `<button class="btn btn--primario" data-a="imp-salva">${ico('check')}Salva nel diario</button>`}</div>`;
  return h;
}

function leggiRisposta() {
  IMPORT.errore = '';
  IMPORT.avvisi = [];
  IMPORT.tutte = false;
  try {
    const lista = leggiRisposte(IMPORT.risposta);
    // "fine": true chiude ogni risposta completa: se manca, l'AI potrebbe essersi fermata prima
    const senzaFine = lista.map((j, i) => j && j.fine === true ? 0 : i + 1).filter(Boolean);
    if (senzaFine.length) IMPORT.avvisi.push((lista.length > 1 ? 'Nelle risposte ' + senzaFine.join(', ') : 'Nella risposta') + ' manca "fine": true. Se il riassunto si interrompe a metà, chiedi all\'AI di ripetere il JSON intero.');
    if (lista.length > 1) IMPORT.avvisi.push('Ho unito ' + lista.length + ' risposte, una per pezzo di audio.');
    IMPORT.proposte = preparaRevisione(unisciRisposte(lista));
    IMPORT.correzioni = ''; IMPORT.esitoCorrezioni = [];
    salvaBozzaRevisione();
  } catch (e) {
    IMPORT.errore = e.message;
    IMPORT.proposte = null;
  }
  render();
  const dest = document.getElementById(IMPORT.errore ? 'errore-import' : 'passo-revisione');
  if (dest) dest.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function applicaImport() {
  const P = IMPORT.proposte;
  if (!P) return;
  if (sessioneConNumero(P.sessione.numero)) { avviso('La sessione ' + P.sessione.numero + " è già nel diario: annulla il suo import prima di rifarla"); render(); return; }
  const sid = nuovoId('sessioni');
  // v: 2 = formato a differenze (vedi annullaImport)
  const annulla = { v: 2, creati: [], valori: [], righe: [], alias: [], rapporti: [], ripristina: [] };
  const nuoviNomi = new Map();   // nomi delle voci di questo import -> id (anche quelle appena create)
  const rif = (x, tipo) => {
    if (!x) return '';
    const k = norm(x);
    if (nuoviNomi.has(k)) return nuoviNomi.get(k);
    return risolvi(x, tipo) || String(x);
  };
  // modifico ricordando solo le differenze, per poter annullare:
  //  - storia e favori: le righe hanno la sessione (s) e si tolgono per sessione
  //  - alias: tengo i nomi aggiunti
  //  - valori semplici (stato, luogo, ruolo...): il valore di prima e quello messo dall'import
  const modifica = (tab, id, campi) => {
    const prima = DB[tab][id] || {};
    const val = {}, dopo = {};
    Object.keys(campi).forEach(k => {
      if (k === 'storia' || k === 'favori') { annulla.righe.push({ tab, id, campo: k }); return; }
      if (k === 'alias') { annulla.alias.push({ tab, id, nomi: campi.alias.filter(n => !(prima.alias || []).includes(n)) }); return; }
      if (tab === 'rapporti' && k === 'valore') return;   // la variazione la segno a parte
      val[k] = prima[k] === undefined ? '' : prima[k];
      dopo[k] = campi[k];
    });
    if (Object.keys(val).length) annulla.valori.push({ tab, id, prima: val, dopo });
    salva(tab, Object.assign({ id }, campi));
  };
  const crea = (tab, rec) => {
    const r = salva(tab, rec);
    annulla.creati.push({ tab, id: r.id });
    return r;
  };

  // 1. decido subito gli id, così una voce nuova può citarne un'altra nuova (un PNG in un luogo nuovo)
  P.voci.forEach(p => {
    if (p.azione === 'salta') return;
    p._id = p.azione === 'crea' ? nuovoId('voci') : p.bersaglio;
    [p.dati.nome].concat(p.dati.alias || []).forEach(n => { if (n) nuoviNomi.set(norm(n), p._id); });
  });
  P.missioni.forEach(p => {
    if (p.azione === 'salta') return;
    p._id = p.azione === 'crea' ? nuovoId('missioni') : p.bersaglio;
    nuoviNomi.set(norm(p.dati.titolo), p._id);
  });

  // 2. voci
  P.voci.forEach(p => {
    if (p.azione === 'salta') return;
    const d = p.dati;
    const riga = d.storia ? [{ s: sid, t: String(d.storia) }] : [];
    const att = numeroAtteggiamento(d.atteggiamento);
    if (p.azione === 'crea') {
      const rec = { id: p._id, tipo: d.tipo, nome: d.nome, alias: d.alias || [], ruolo: String(d.ruolo || ''), descrizione: String(d.descrizione || ''), luogo: rif(d.luogo, 'luogo'), storia: riga };
      if (rec.luogo === p._id) rec.luogo = '';
      if (STATI_PNG[d.stato]) rec.stato = d.stato;
      if (att !== null) rec.atteggiamento = att;
      if (d.tipo === 'luogo') rec.icona = ICONE_LUOGO[d.icona] ? d.icona : 'punto';
      crea('voci', rec);
    } else {
      const v = DB.voci[p._id];
      if (!v) return;
      const campi = {};
      const alias = (v.alias || []).slice();
      [d.nome].concat(d.alias || []).forEach(n => { if (n && norm(n) !== norm(v.nome) && !alias.some(a => norm(a) === norm(n))) alias.push(n); });
      if (alias.length !== (v.alias || []).length) campi.alias = alias;
      if (d.ruolo && !v.ruolo) campi.ruolo = String(d.ruolo);
      if (d.descrizione && !v.descrizione) campi.descrizione = String(d.descrizione);
      if (STATI_PNG[d.stato] && d.stato !== (v.stato || 'vivo')) campi.stato = d.stato;
      const vAtt = v.atteggiamento === undefined || v.atteggiamento === '' ? null : Number(v.atteggiamento);
      if (att !== null && att !== vAtt) campi.atteggiamento = att;
      if (d.luogo) { const l = rif(d.luogo, 'luogo'); if (l !== p._id && l !== risolvi(v.luogo, 'luogo') && l !== v.luogo) campi.luogo = l; }
      if (riga.length) campi.storia = (v.storia || []).concat(riga);
      if (Object.keys(campi).length) modifica('voci', p._id, campi);
    }
  });

  // 3. missioni
  P.missioni.forEach(p => {
    if (p.azione === 'salta') return;
    const d = p.dati;
    const stato = STATI_MISSIONE[d.stato] ? d.stato : 'attiva';
    const riga = d.nota ? [{ s: sid, t: String(d.nota) }] : [];
    if (p.azione === 'crea') {
      crea('missioni', { id: p._id, titolo: d.titolo, descrizione: String(d.descrizione || ''), stato, committente: rif(d.committente), luogo: rif(d.luogo, 'luogo'), ricompensa: String(d.ricompensa || ''), apertaIn: sid, chiusaIn: stato !== 'attiva' ? sid : '', storia: riga });
    } else {
      const m = DB.missioni[p._id];
      if (!m) return;
      const campi = {};
      if (stato !== (m.stato || 'attiva')) { campi.stato = stato; campi.chiusaIn = stato === 'attiva' ? '' : sid; }
      if (d.ricompensa && !m.ricompensa) campi.ricompensa = String(d.ricompensa);
      if (d.descrizione && !m.descrizione) campi.descrizione = String(d.descrizione);
      if (riga.length) campi.storia = (m.storia || []).concat(riga);
      if (Object.keys(campi).length) modifica('missioni', p._id, campi);
    }
  });

  // 4. rapporti tra compagni e PNG
  P.rapporti.forEach(r => {
    if (!r.ok) return;
    const pg = risolvi(r.pg);
    const png = rif(r.png);
    if (!pg || !DB.voci[pg] || DB.voci[pg].tipo !== 'pg' || !DB.voci[png]) return;
    const rid = pg + '__' + png;
    const ex = DB.rapporti[rid] && !DB.rapporti[rid].eliminato ? DB.rapporti[rid] : null;
    const fav = r.nota ? [{ tipo: 'nota', t: r.nota, s: sid, ok: 0 }] : [];
    if (ex) {
      const nuovo = clamp((Number(ex.valore) || 0) + r.delta, -3, 3);
      annulla.rapporti.push({ id: rid, delta: nuovo - (Number(ex.valore) || 0) });
      modifica('rapporti', rid, { valore: nuovo, favori: (ex.favori || []).concat(fav) });
    }
    else crea('rapporti', { id: rid, pg, png, valore: clamp(r.delta, -3, 3), favori: fav, eliminato: 0 });
  });

  // 5. bottino comune (righe del commercio di tipo "bottino" e "moneta", vedi 8-tavolo.js) e voci di taverna
  P.oggetti.filter(o => o.ok).forEach(o => {
    const chi = o.chi ? risolvi(o.chi) : '';
    // se il nome è proprio quello di un oggetto del catalogo, lo lego al catalogo e ne prendo la descrizione.
    // Dalla 1.7 il catalogo tira anche le cariche che vanno tirate e, se l'oggetto richiede sintonia e qualcuno
    // lo porta, lo mette in sintonia con lui (se ha meno di tre oggetti e ha i requisiti: completaDaCatalogo)
    const cat = oggettoCatalogo(o.nome);
    const rec = { id: nuovoId('commercio'), tipo: 'bottino', nome: o.nome, quantita: o.quantita, valore: o.valore, peso: o.peso,
      portatore: chi && DB.voci[chi] && DB.voci[chi].tipo === 'pg' ? chi : '', richiede: cat ? (cat.sintonia ? 1 : 0) : (o.magico ? 1 : 0), sessione: sid,
      catalogo: cat ? cat.id : '', note: cat ? testoCatalogo(cat) : '' };
    completaDaCatalogo(rec, true);
    crea('commercio', rec);
  });
  if (Number(P.monete)) crea('commercio', { id: nuovoId('commercio'), tipo: 'moneta', importo: Number(P.monete), testo: 'Sessione ' + P.sessione.numero, data: P.sessione.data, sessione: sid });
  P.dicerie.filter(d => d.ok).forEach(d => {
    crea('config', { id: 'dic-' + nuovoId('config').slice(4), valore: { testo: d.testo, chi: rif(d.chi) || d.chi, dove: rif(d.dove, 'luogo') || d.dove, vera: '', sessione: sid } });
  });

  // 6. la sessione e la posizione del gruppo
  const s = P.sessione;
  const lf = rif(s.luogo, 'luogo');
  if (lf && DB.voci[lf]) {
    annulla.valori.push({ tab: 'config', id: 'posizione', prima: { valore: cfg('posizione', '') }, dopo: { valore: lf } });
    setCfg('posizione', lf);
  }
  // 7. i segnalibri della serata finiscono nella sessione; quelli segreti del Master restano a parte,
  //    legati alla sessione, e li vede solo lui. La serata si chiude per tutti.
  const ser = serata();
  const tutti = segnalibriSerata();
  const segn = IMPORT.segnalibri ? tutti.filter(n => n.tipo !== 'segreto').map(n => ({ t: minutoSegnalibro(n, ser), tipo: n.tipo || 'nota', testo: n.testo || '', chi: n.chi || '' })) : [];
  tutti.forEach(n => {
    if (n.tipo === 'segreto') { modifica('config', n.id, { valore: Object.assign({}, DB.config[n.id].valore, { sessione: sid }) }); return; }
    if (!IMPORT.segnalibri) return;
    elimina('config', n.id);
    annulla.ripristina.push({ tab: 'config', id: n.id });
  });
  if (ser) { elimina('config', 'serata'); annulla.ripristina.push({ tab: 'config', id: 'serata' }); }
  salva('sessioni', {
    id: sid, numero: s.numero, titolo: s.titolo, data: s.data, riassunto: s.riassunto,
    inBreve: s.inBreve, sospesi: s.sospesi, giorni: Math.max(0, Math.round(Number(s.giorni) || 0)),
    serata: ser ? { inizio: Number(ser.inizio) || 0, fine: Number(ser.fine) || Date.now() } : '',
    eventi: P.eventi.filter(e => e.ok && String(e.t || '').trim()).map(e => ({ t: e.t.trim(), l: rif(e.l, 'luogo') })),
    citazioni: s.citazioni, bottino: s.bottino,
    gesta: P.gesta.filter(g => g.ok && String(g.t || '').trim()).map(g => {
      // il luogo dentro la frase come menzione, se l'AI non l'ha già citato
      const l = rif(g.l, 'luogo');
      return l && DB.voci[l] && !menzioniIn(g.t).includes(l) ? g.t + ' (#[' + DB.voci[l].nome + '])' : g.t;
    }),
    presenti: s.presenti.map(x => risolvi(x)).filter(id => id && DB.voci[id] && DB.voci[id].tipo === 'pg'),
    luogo: lf, segnalibri: segn, _annulla: annulla
  });
  IMPORT = nuovoImport();
  clearTimeout(TIMER_BOZZA);
  try { localStorage.removeItem('taverna.bozzaImport'); localStorage.removeItem('taverna.bozzaRevisione'); } catch (e) { /* niente */ }
  MAPPA.sporca = true;
  location.hash = '#/sessione/' + encodeURIComponent(sid);
  avviso('Sessione ' + s.numero + ' salvata nel diario');
}

async function annullaImport(sid) {
  const s = DB.sessioni[sid];
  if (!s || !s._annulla || typeof s._annulla !== 'object') return;
  const a = s._annulla;
  const nuovo = a.v === 2;
  const ok = await chiedi("Annullare l'import?", nuovo
    ? `Tolgo la sessione ${s.numero}, le voci e le missioni che ha creato e le righe che ha aggiunto alle cronologie. I campi cambiati dopo l'import, a mano o da altri import, restano come sono.`
    : `Tolgo la sessione ${s.numero} e rimetto com'erano le voci, le missioni e i rapporti toccati dall'import. Le modifiche fatte a mano dopo l'import su quegli stessi campi andranno perse.`, "Annulla l'import", true);
  if (!ok) return;
  (a.creati || []).forEach(c => elimina(c.tab, c.id));
  if (nuovo) {
    // i segnalibri e la serata tornano come prima dell'import, così si può rifare
    (a.ripristina || []).forEach(r => { if (DB[r.tab][r.id]) salva(r.tab, { id: r.id, eliminato: 0 }); });
    // righe di cronologia e favori: tolgo solo quelle di questa sessione (le sessioni dopo restano)
    (a.righe || []).forEach(r => {
      const rec = DB[r.tab][r.id];
      if (rec && Array.isArray(rec[r.campo])) salva(r.tab, { id: r.id, [r.campo]: rec[r.campo].filter(x => !x || x.s !== sid) });
    });
    (a.alias || []).forEach(r => {
      const rec = DB[r.tab][r.id];
      if (rec && Array.isArray(rec.alias)) salva(r.tab, { id: r.id, alias: rec.alias.filter(n => !r.nomi.includes(n)) });
    });
    // rapporti: tolgo la variazione di questo import, non rimetto il numero di allora
    (a.rapporti || []).forEach(r => {
      const rec = DB.rapporti[r.id];
      if (rec && !rec.eliminato) salva('rapporti', { id: r.id, valore: clamp((Number(rec.valore) || 0) - r.delta, -3, 3) });
    });
    // valori semplici: li rimetto solo se nessuno li ha cambiati dopo l'import
    (a.valori || []).slice().reverse().forEach(m => {
      const rec = m.tab === 'config' ? DB.config[m.id] : DB[m.tab][m.id];
      if (!rec) return;
      const campi = { id: m.id };
      Object.keys(m.prima).forEach(k => { if (uguali(rec[k], m.dopo[k])) campi[k] = m.prima[k]; });
      if (Object.keys(campi).length > 1) salva(m.tab, campi);
    });
  } else {
    // formato vecchio (prima della 1.4): rimetto i valori di prima. Se un record è stato toccato due volte, vince il più vecchio
    (a.modificati || []).slice().reverse().forEach(m => salva(m.tab, Object.assign({ id: m.id }, m.prima)));
  }
  elimina('sessioni', sid);
  salvaLocaleSubito();
  MAPPA.sporca = true;
  location.hash = '#/diario';
  avviso('Import annullato');
}

// ---------------------------------------------------------------------
// CORREGGERE LA REVISIONE APERTA (1.7)
// La revisione si corregge tutta dentro l'app, senza rifare il JSON: testi, fatti e gesta si scrivono a mano,
// una voce proposta si rinomina o si lega a una voce del wiki ("È la stessa voce di…"), e un elenco di
// correzioni corte (scritte a mano o da un'altra AI, per esempio il progetto Claude del controllo) si applica
// in un colpo. Rinominare sposta anche le menzioni (@[Vecchio] → @[Nuovo]) e i riferimenti scritti per nome
// (dove si trova, chi l'ha affidata, chi lo tiene...). La revisione corretta resta nella memoria del telefono
// (taverna.bozzaRevisione) finché non si salva o si ricomincia: un'app chiusa per sbaglio non perde il lavoro.
// ---------------------------------------------------------------------
let TIMER_BOZZA = 0;
function firmaTesto(s) {
  s = String(s || '');
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return s.length + ':' + (h >>> 0).toString(36);
}
function salvaBozzaRevisione() {
  clearTimeout(TIMER_BOZZA);
  TIMER_BOZZA = setTimeout(() => {
    try {
      if (IMPORT.proposte) localStorage.setItem('taverna.bozzaRevisione', JSON.stringify({ firma: firmaTesto(IMPORT.risposta), numero: IMPORT.numero, data: IMPORT.data, proposte: IMPORT.proposte, correzioni: IMPORT.correzioni || '', esito: IMPORT.esitoCorrezioni || [] }));
      else localStorage.removeItem('taverna.bozzaRevisione');
    } catch (e) { /* memoria piena: la revisione resta solo aperta */ }
  }, 300);
}
// all'avvio: la revisione salvata torna solo se la risposta nel riquadro è ancora la stessa
function riprendiBozzaRevisione() {
  try {
    const r = JSON.parse(localStorage.getItem('taverna.bozzaRevisione') || 'null');
    if (!r || !r.proposte || r.firma !== firmaTesto(IMPORT.risposta)) return;
    Object.assign(IMPORT, { proposte: r.proposte, numero: r.numero, data: r.data, correzioni: r.correzioni || '', esitoCorrezioni: r.esito || [] });
  } catch (e) { /* bozza rovinata: si rilegge la risposta */ }
}

// Passa tutti i testi della revisione aperta (fTesto) e tutti i riferimenti scritti per nome o per id (fRif).
// La usano la rinomina, "È la stessa voce di…" e "sostituisci". Restituisce quanti campi sono cambiati.
function cambiaRevisione(fTesto, fRif) {
  const P = IMPORT.proposte;
  let n = 0;
  const t = (o, k) => { if (!fTesto || !o || typeof o[k] !== 'string' || !o[k]) return; const x = fTesto(o[k]); if (x !== o[k]) { o[k] = x; n++; } };
  const r = (o, k) => { if (!fRif || !o || !o[k] || typeof o[k] !== 'string') return; const x = fRif(o[k]); if (x !== o[k]) { o[k] = x; n++; } };
  const s = P.sessione;
  ['titolo', 'riassunto', 'inBreve', 'bottino'].forEach(k => t(s, k));
  s.sospesi = s.sospesi.map(x => { if (!fTesto || typeof x !== 'string') return x; const y = fTesto(x); if (y !== x) n++; return y; });
  s.citazioni.forEach(c => t(c, 'testo'));
  r(s, 'luogo');
  P.eventi.forEach(e => { t(e, 't'); r(e, 'l'); });
  P.gesta.forEach(g => { t(g, 't'); r(g, 'l'); });
  P.dicerie.forEach(d => { t(d, 'testo'); r(d, 'chi'); r(d, 'dove'); });
  P.voci.forEach(p => { ['storia', 'descrizione', 'ruolo'].forEach(k => t(p.dati, k)); r(p.dati, 'luogo'); });
  P.missioni.forEach(p => { ['nota', 'descrizione', 'ricompensa'].forEach(k => t(p.dati, k)); r(p.dati, 'committente'); r(p.dati, 'luogo'); });
  P.rapporti.forEach(x => { t(x, 'nota'); r(x, 'png'); });
  P.oggetti.forEach(o => r(o, 'chi'));
  return n;
}
// Le menzioni di un nome (@[Vecchio], @Vecchio, #[Vecchio]) diventano menzioni del nome nuovo, con lo stesso simbolo
function rinominaMenzioni(testo, vecchio, nuovo) {
  const nv = norm(vecchio);
  const trovate = trovaMenzioni(testo).filter(m => norm(m.nome) === nv);
  let out = String(testo);
  trovate.reverse().forEach(m => { out = out.slice(0, m.pos) + m.sig + '[' + nuovo + ']' + out.slice(m.pos + m.len); });
  return out;
}
// Un nome cambia in tutta la revisione: menzioni nei testi e riferimenti. id: la voce del wiki a cui ora
// puntano i riferimenti (vuoto per una voce nuova: allora si scrive il nome, e al salvataggio si risolve).
function rinominaInRevisione(vecchio, nuovo, id) {
  const nv = norm(vecchio);
  if (!nv) return 0;
  return cambiaRevisione(x => rinominaMenzioni(x, vecchio, nuovo), x => norm(x) === nv ? (id || nuovo) : x);
}
// Rinomina una voce (o una missione) proposta. Se il nome nuovo è proprio quello di una voce del wiki, la
// proposta diventa un aggiornamento di quella voce, come succede leggendo la risposta.
// Il nome sbagliato non resta: per tenerlo come alias c'è "È la stessa voce di…" (stessaVoce).
function rinominaProposta(gruppo, i, nuovo) {
  const p = IMPORT.proposte[gruppo][i];
  const campo = gruppo === 'voci' ? 'nome' : 'titolo';
  nuovo = String(nuovo || '').trim().replace(/^[@#]\[?|\]$/g, '');
  if (!p || !nuovo || nuovo === p.dati[campo]) return null;
  const vecchio = p.dati[campo];
  p.dati[campo] = nuovo;
  if (gruppo === 'voci') p.dati.alias = (p.dati.alias || []).filter(a => norm(a) !== norm(nuovo));
  const n = rinominaInRevisione(vecchio, nuovo, p.azione === 'aggiorna' ? p.bersaglio : '');
  p.simili = trovaSimili(nuovo, gruppo, gruppo === 'voci' ? p.dati.tipo : undefined).slice(0, 6);
  // un'altra proposta con lo stesso nome (l'AI ha sentito due volte la stessa persona, scritta in due modi):
  // le unisco, così al salvataggio non nascono due voci uguali
  const j = IMPORT.proposte[gruppo].findIndex((x, k) => k !== i && norm(x.dati[campo]) === norm(nuovo));
  if (j >= 0) { unisciProposte(gruppo, i, j); return { vecchio, nuovo, menzioni: n, unita: '', doppia: true }; }
  const uguale = p.simili.find(x => x.punti === 1);
  let unita = '';
  if (p.azione === 'crea' && uguale) {
    p.azione = 'aggiorna'; p.bersaglio = uguale.id;
    unita = gruppo === 'voci' ? DB.voci[uguale.id].nome : DB.missioni[uguale.id].titolo;
    p.dubbio = 'Stesso nome di ' + unita + ' del wiki: la aggiorno';
  }
  return { vecchio, nuovo, menzioni: n, unita };
}
// Due proposte della stessa voce (o missione): quella in posizione i confluisce in quella in posizione j e sparisce.
// Le frasi di stasera si sommano, gli alias si uniscono, i campi vuoti di j prendono quelli di i.
function unisciProposte(gruppo, i, j) {
  const lista = IMPORT.proposte[gruppo], a = lista[i], b = lista[j];
  const campo = gruppo === 'voci' ? 'storia' : 'nota';
  b.dati[campo] = [b.dati[campo], a.dati[campo]].filter(x => x && String(x).trim()).join(' ');
  if (gruppo === 'voci') b.dati.alias = (b.dati.alias || []).concat(a.dati.alias || []).filter((n, k, t) => n && norm(n) !== norm(b.dati.nome) && t.findIndex(x => norm(x) === norm(n)) === k);
  Object.keys(a.dati).forEach(k => { if ((b.dati[k] === undefined || b.dati[k] === '') && a.dati[k] !== '' && a.dati[k] !== undefined) b.dati[k] = a.dati[k]; });
  if (a.dubbio && !b.dubbio) b.dubbio = a.dubbio;
  lista.splice(i, 1);
}
// "È la stessa voce di…": la proposta aggiorna la voce (o la missione) scelta del wiki. Il nome sentito
// dall'AI resta nella proposta e al salvataggio diventa un alias; le menzioni passano al nome giusto.
function stessaVoce(gruppo, i, id) {
  const p = IMPORT.proposte[gruppo][i];
  const w = gruppo === 'voci' ? DB.voci[id] : DB.missioni[id];
  if (!p || !w || !visibile(w)) return null;
  p.azione = 'aggiorna'; p.bersaglio = id;
  if (!p.simili.some(x => x.id === id)) p.simili.unshift({ id, punti: 1 });
  const vecchio = gruppo === 'voci' ? p.dati.nome : p.dati.titolo;
  const giusto = gruppo === 'voci' ? w.nome : w.titolo;
  const n = gruppo === 'voci' ? rinominaInRevisione(vecchio, giusto, id) : cambiaRevisione(null, x => norm(x) === norm(vecchio) ? id : x);
  return { vecchio, giusto, menzioni: n };
}
// La proposta con questo nome (o alias, o id dell'AI) tra le voci e le missioni: { gruppo, i } o null
function trovaProposta(nome, soloGruppo) {
  const P = IMPORT.proposte, n = norm(nome);
  if (!n) return null;
  for (const gruppo of soloGruppo ? [soloGruppo] : ['voci', 'missioni']) {
    const i = P[gruppo].findIndex(p => gruppo === 'voci'
      ? norm(p.dati.nome) === n || (p.dati.alias || []).some(a => norm(a) === n) || (p.dati.id && p.dati.id === nome)
      : norm(p.dati.titolo) === n || (p.dati.id && p.dati.id === nome));
    if (i >= 0) return { gruppo, i };
  }
  return null;
}
// Una voce o missione del wiki da un id o da un nome
function trovaNelWiki(x) {
  x = String(x || '').trim().replace(/^["'“«]|["'”»]$/g, '');
  if (DB.voci[x] && visibile(DB.voci[x])) return { gruppo: 'voci', id: x };
  if (DB.missioni[x] && visibile(DB.missioni[x])) return { gruppo: 'missioni', id: x };
  const id = risolviNome(x);
  if (id && DB.voci[id]) return { gruppo: 'voci', id };
  if (id && DB.missioni[id]) return { gruppo: 'missioni', id };
  return null;
}

// Il formato delle correzioni, da mostrare nell'app e da mettere in fondo al wiki esportato per l'AI
const FORMATO_CORREZIONI = [
  'Una correzione per riga. Dopo " — " (o " | ") si può scrivere il motivo e la pagina: l\'app li mostra e basta.',
  '- rinomina VECCHIO in NUOVO: il nome di una voce o di una missione proposta, con le sue menzioni',
  '- unisci NOME con l\'id ID: la voce proposta è quella del wiki con quell\'id (il nome sbagliato diventa un alias). Va bene anche "unisci NOME con NOME DEL WIKI"',
  '- crea NOME: la voce proposta è davvero nuova, anche se somiglia a una del wiki',
  '- togli la voce NOME, togli la missione TITOLO: non si importano',
  '- togli il fatto N, togli la gesta N, togli la diceria N, togli l\'oggetto N, togli il rapporto N, togli la cosa in sospeso N (N conta da 1, nell\'ordine del JSON; più numeri: "togli le gesta 2 e 3")',
  '- aggiungi il fatto TESTO, aggiungi la gesta TESTO (con @[Nome] e #[Luogo])',
  '- sostituisci "TESTO" con "TESTO": in tutti i testi della sessione',
  '- stato di NOME: morto | vivo | scomparso; stato della missione TITOLO: attiva | compiuta | fallita | abbandonata',
  '- luogo finale NOME o ID: dove finisce la serata',
  'I nomi con " in " o " con " dentro vanno tra virgolette: rinomina "Uomo in nero" in Brakk.'
].join('\n');

// Applica un elenco di correzioni alla revisione aperta. Restituisce una riga di esito per correzione:
// { riga, ok, testo }. Le correzioni che non capisce le dice e le salta, le altre le fa tutte.
function applicaCorrezioni(testo) {
  const P = IMPORT.proposte;
  const esiti = [];
  const sospesiTolti = new Set();
  const virgolette = s => String(s || '').trim().replace(/^["“«]\s*|\s*["”»]$/g, '').trim();
  // "A in B" (o "A con B"): con le virgolette è chiaro; altrimenti provo ogni " in " e tengo il taglio
  // la cui parte sinistra è il nome di una proposta (o, in mancanza, il primo)
  const dividi = (s, sep, buono) => {
    const q = s.match(new RegExp('^["“«](.+?)["”»]\\s+' + sep + '\\s+(.+)$', 'i'));
    if (q) return [q[1], virgolette(q[2])];
    const re = new RegExp('\\s+' + sep + '\\s+', 'gi');
    const tagli = [];
    let m;
    while ((m = re.exec(s))) tagli.push([s.slice(0, m.index), s.slice(m.index + m[0].length)]);
    return tagli.find(([a, b]) => buono(virgolette(a), virgolette(b))) || tagli[0] || null;
  };
  const numeri = s => (String(s).match(/\d+/g) || []).map(Number);
  const nomeProposta = x => x.gruppo === 'voci' ? P.voci[x.i].dati.nome : P.missioni[x.i].dati.titolo;
  String(testo || '').split('\n').forEach(grezza => {
    let riga = grezza.trim();
    if (!riga || /^(#|\/\/)/.test(riga)) return;
    riga = riga.replace(/^(\d+[.)]|[-*•])\s+/, '');
    const motivo = (riga.match(/\s+(?:—|–|--|\||\/\/)\s+(.*)$/) || [])[1] || '';
    let c = motivo ? riga.slice(0, riga.length - motivo.length).replace(/\s+(?:—|–|--|\||\/\/)\s*$/, '') : riga;
    c = c.replace(/[.;]+$/, '').replace(/[“”«»]/g, '"').trim();
    const esito = (ok, t) => esiti.push({ riga: c, ok, testo: t + (motivo ? ' (' + motivo + ')' : ''), grezza });
    let m;
    if ((m = c.match(/^rinomina\s+(?:la\s+voce\s+|la\s+missione\s+|il\s+luogo\s+|il\s+png\s+)?(.+)$/i))) {
      const d = dividi(m[1], 'in', a => !!trovaProposta(a));
      if (!d) return esito(false, 'Manca "in": scrivi rinomina VECCHIO in NUOVO');
      const [a, b] = [virgolette(d[0]), virgolette(d[1])];
      const prop = trovaProposta(a);
      if (prop) {
        const r = rinominaProposta(prop.gruppo, prop.i, b);
