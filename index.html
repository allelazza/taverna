// Salvo l'indirizzo della web app, provo il collegamento e scarico i dati del gruppo
async function collega(f) {
  const esito = document.getElementById('esito-collegamento');
  IMPOST.url = f.querySelector('[name="url"]').value.trim();
  IMPOST.chiave = f.querySelector('[name="chiave"]').value.trim();
  IMPOST.chiaveMaster = f.querySelector('[name="chiaveMaster"]').value.trim();
  IMPOST.ultimoSync = 0;  // al primo giro ricevo tutto
  IMPOST.master = false;
  salvaLocale('impost');
  esito.className = 'fioco piccolo';
  if (!IMPOST.url) {
    SYNC.stato = 'locale'; aggiornaStatoSync();
    esito.textContent = 'Collegamento rimosso: i dati restano su questo dispositivo.';
    return;
  }
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(IMPOST.url)) {
    esito.textContent = "L'URL deve essere quello della web app: inizia con https://script.google.com/macros/s/ e finisce con /exec.";
    esito.className = 'errore';
    return;
  }
  if (!IMPOST.chiave) { esito.textContent = 'Manca la chiave del gruppo.'; esito.className = 'errore'; return; }
  esito.textContent = 'Provo il collegamento…';
  try {
    const r = await chiamaServer({ azione: 'ping' });
    IMPOST.master = !!r.master;
    IMPOST.versioneScript = Number(r.versione) || 1;
    salvaLocale('impost');
    esito.textContent = r.master ? 'Collegato come Master. Scarico i dati del gruppo…' : 'Collegato. Scarico i dati del gruppo…';
    esito.className = 'successo piccolo';
    await sincronizza(true);
    esito.textContent = SYNC.stato === 'errore' ? SYNC.errore : (IMPOST.master ? 'Collegato come Master: tutto in pari.' : 'Collegato al foglio del gruppo: tutto in pari.');
  } catch (err) {
    esito.textContent = err.message;
    esito.className = 'errore';
  }
}

function costruisciShell() {
  document.querySelector('.nav').innerHTML = [
    ['home', '#/home', 'taverna', 'Taverna'], ['diario', '#/diario', 'diario', 'Diario'], ['mappa', '#/mappa', 'mappa', 'Mappa'],
    ['missioni', '#/missioni', 'missioni', 'Missioni'], ['commercio', '#/commercio', 'slitta', 'Commercio'], ['wiki', '#/wiki', 'wiki', 'Wiki']
  ].map(([s, h, i, l]) => `<a href="${h}" data-sez="${s}">${ico(i)}<span>${l}</span></a>`).join('');
  document.querySelector('.barra-top .indietro').innerHTML = ico('indietro');
  document.querySelector('.stato-sync').innerHTML = ico('sync');
  document.getElementById('link-impostazioni').innerHTML = ico('impostazioni');
}

function avvia() {
  caricaLocale();
  try { const bozza = localStorage.getItem('taverna.bozzaImport'); if (bozza) IMPORT.risposta = bozza; } catch (e) { /* niente */ }
  riprendiBozzaRevisione();   // la revisione corretta a metà, se la risposta è ancora quella (1.7)
  costruisciShell();
  window.addEventListener('hashchange', () => {
    if (foglioAperto()) { document.querySelector('.foglio').classList.remove('aperto'); document.querySelector('.velo').classList.remove('aperto'); }
    render();
  });
  if (!location.hash || location.hash === '#') history.replaceState(null, '', '#/home');
  render();
  aggiornaStatoSync();
  // il taccuino della 1.3 (solo locale) passa nella serata condivisa dopo il primo giro col foglio,
  // così se un altro telefono ha già aperto la serata non la sovrascrivo
  sincronizza().finally(() => { if (TACCUINO && TACCUINO.inizio) { migraTaccuino(); render(); } });
  setInterval(() => { if (!document.hidden) sincronizza(); }, 90000);
  // quando l'app va in secondo piano scrivo subito quello che è in attesa: Android può chiuderla senza avvisare
  document.addEventListener('visibilitychange', () => { if (document.hidden) salvaLocaleSubito(); else sincronizza(); mappaNeve(); });
  window.addEventListener('pagehide', () => salvaLocaleSubito());
  window.addEventListener('online', () => sincronizza());
  window.addEventListener('offline', () => { SYNC.stato = 'offline'; aggiornaStatoSync(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { /* senza service worker funziona lo stesso, solo non offline */ });
}
avvia();

</script>
