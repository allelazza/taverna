<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17212B">
<meta name="description" content="Cronaca condivisa della campagna: sessioni, personaggi, luoghi, missioni e mappa.">
<title>Taverna</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icona-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>
/* =====================================================================
   TAVERNA — stile
   Concetto: "lanterna nella notte polare". Il mondo è ardesia fredda e
   osso inciso; ciò che fa il gruppo (azioni, posizione, missioni attive)
   ha la luce calda della lanterna.
   ===================================================================== */
:root {
  --notte: #17212B;
  --ardesia: #1F2A36;
  --ardesia-2: #283543;
  --ardesia-3: #324252;
  --brina: #8C9FAE;      /* testo secondario */
  --brina-2: #4B5E6E;    /* bordi */
  --avorio: #ECE6D6;     /* testo principale, come osso inciso */
  --avorio-2: #BFB8A7;
  --lanterna: #E8A33D;   /* azioni e "noi" */
  --lanterna-2: #F4C980;
  --lanterna-ombra: rgba(232, 163, 61, .2);
  --cera: #D0583F;       /* pericolo, morte, fallimento */
  --c-persona: #A9CDE6;
  --c-luogo: #79CDB5;
  --c-fazione: #B9A8E2;
  --c-oggetto: #D9B77A;
  --c-missione: #E8A33D;
  --f-titolo: 'IM Fell English', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --f-carta: 'IM Fell English SC', 'IM Fell English', Georgia, serif;
  --f-testo: 'Alegreya Sans', 'Segoe UI', Roboto, system-ui, sans-serif;
  --nav-h: 64px;
  --top-h: 56px;
  --rail: 0px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--notte);
  color: var(--avorio);
  font: 16px/1.5 var(--f-testo);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
body.in-mappa { overflow: hidden; }
a { color: inherit; }
img { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--lanterna); outline-offset: 2px; border-radius: 6px; }

/* Icone: tratto unico, disegnate a mano in 24x24 */
.i { width: 1.25em; height: 1.25em; flex: none; }
.i path { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Tipografia ---------- */
h1, h2, h3 { font-family: var(--f-titolo); font-weight: 400; margin: 0; letter-spacing: .005em; }
.t1 { font-size: 34px; line-height: 1.08; }
.t2 { font-size: 26px; line-height: 1.15; }
.t3 { font-size: 20px; line-height: 1.22; }
.lettura { font-size: 17.5px; line-height: 1.64; max-width: 66ch; }
.lettura p { margin: 0 0 .85em; }
.lettura p:last-child { margin-bottom: 0; }
.fioco { color: var(--brina); }
.piccolo { font-size: 14px; }
.corsivo { font-family: var(--f-titolo); font-style: italic; }
.sezione { margin: 36px 0 0; }
.sezione > h2 { font-size: 22px; margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px; }
.sezione > h2 .conta { font: 500 14px var(--f-testo); color: var(--brina); }
.sezione > h2 a.dx { margin-left: auto; font: 500 15px var(--f-testo); color: var(--lanterna-2); text-decoration: none; }
.vuoto { color: var(--brina); font-size: 15px; padding: 6px 0; }

/* ---------- Struttura ---------- */
.barra-top {
  position: sticky; top: 0; z-index: 40;
  height: calc(var(--top-h) + var(--safe-t)); padding-top: var(--safe-t) !important; margin-left: var(--rail);
  display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px;
  background: rgba(23, 33, 43, .9);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(236, 230, 214, .06);
}
.barra-top .marchio {
  flex: 1; min-width: 0; font: 400 22px/1 var(--f-titolo);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--avorio); text-decoration: none;
}
.barra-top .indietro { margin-left: -8px; }
.stato-sync { position: relative; }
.stato-sync::after {
  content: ""; position: absolute; right: 9px; top: 9px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--brina-2); box-shadow: 0 0 0 2px var(--notte);
}
.stato-sync[data-s="ok"]::after { background: var(--c-luogo); }
.stato-sync[data-s="coda"]::after { background: var(--lanterna); }
.stato-sync[data-s="errore"]::after { background: var(--cera); }
.stato-sync[data-s="sync"] .i { animation: gira 1s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }

#vista {
  margin-left: var(--rail);
  padding: 22px 18px calc(var(--nav-h) + var(--safe-b) + 36px);
}
#vista > * { max-width: 760px; margin-left: auto; margin-right: auto; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  display: grid; grid-template-columns: repeat(6, 1fr);
  background: rgba(19, 27, 35, .95);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid rgba(236, 230, 214, .07);
}
.nav a {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--brina); text-decoration: none; font-size: 12px; font-weight: 500; white-space: nowrap;
}
.nav a .i { width: 25px; height: 25px; }
.nav a.attivo { color: var(--lanterna); }
.nav a.attivo::before {
  content: ""; position: absolute; top: -1px; left: 30%; right: 30%; height: 2px; border-radius: 0 0 2px 2px;
  background: var(--lanterna); box-shadow: 0 0 14px var(--lanterna);
}

@media (min-width: 900px) {
  :root { --rail: 96px; }
  .nav {
    top: 0; right: auto; width: var(--rail); height: auto; padding: calc(var(--top-h) + 8px) 0 0;
    grid-template-columns: 1fr; grid-auto-rows: 78px; align-content: start;
    border-top: 0; border-right: 1px solid rgba(236, 230, 214, .07);
  }
  .nav a.attivo::before { top: 18%; bottom: 18%; left: -1px; right: auto; width: 2px; height: auto; border-radius: 0 2px 2px 0; }
  .nav::before {
    content: ""; position: absolute; top: 14px; left: 0; right: 0; margin: auto; width: 34px; height: 34px;
    background: radial-gradient(circle at 50% 60%, var(--lanterna) 0 28%, transparent 30%), radial-gradient(circle, rgba(232,163,61,.25), transparent 70%);
  }
  #vista { padding: 34px 32px 60px; }
  .t1 { font-size: 42px; }
}

/* ---------- Bottoni e campi ---------- */
.btn {
  appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 18px; border-radius: 12px;
  border: 1px solid var(--brina-2); background: transparent; color: var(--avorio);
  font: 700 15.5px/1.1 var(--f-testo); text-decoration: none; cursor: pointer; white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn .i { width: 20px; height: 20px; }
.btn--primario { background: var(--lanterna); border-color: var(--lanterna); color: #22170A; }
.btn--primario:hover { background: var(--lanterna-2); }
.btn--pericolo { border-color: rgba(208, 88, 63, .55); color: #F2A898; }
.btn--testo { border-color: transparent; padding: 0 10px; color: var(--lanterna-2); }
.btn--piccolo { min-height: 36px; padding: 0 12px; font-size: 14.5px; border-radius: 10px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-icona {
  appearance: none; width: 42px; height: 42px; flex: none; display: grid; place-items: center;
  border-radius: 50%; border: 0; background: transparent; color: var(--avorio); cursor: pointer; text-decoration: none;
}
.btn-icona .i { width: 23px; height: 23px; }
.btn-icona:hover { background: rgba(236, 230, 214, .06); }
.azioni { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 0; }
.azioni-col { display: flex; flex-direction: column; gap: 10px; max-width: 360px; margin-top: 26px; }

.campo { display: block; margin: 0 0 18px; }
.campo > span, .etichetta { display: block; font-size: 14.5px; color: var(--brina); margin: 0 0 7px; }
.campo small { display: block; color: var(--brina); font-size: 13.5px; margin-top: 6px; }
input[type=text], input[type=url], input[type=password], input[type=number], input[type=date], input[type=search], select, textarea {
  width: 100%; font: 16px/1.4 var(--f-testo); color: var(--avorio);
  background: var(--ardesia-2); border: 1px solid var(--brina-2); border-radius: 12px; padding: 11px 13px; outline: none;
}
textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
textarea.alto { min-height: 220px; }
input:focus, select:focus, textarea:focus { border-color: var(--lanterna); box-shadow: 0 0 0 3px var(--lanterna-ombra); }
input::placeholder, textarea::placeholder { color: #6E8090; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--brina) 50%), linear-gradient(135deg, var(--brina) 50%, transparent 50%); background-position: calc(100% - 20px) 52%, calc(100% - 14px) 52%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }

/* Pillole di scelta (tipo voce, atteggiamento, presenti) */
.pillole { display: flex; flex-wrap: wrap; gap: 8px; }
.pillole label { position: relative; }
.pillole input { position: absolute; opacity: 0; pointer-events: none; }
.pillole span {
  display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--brina-2); color: var(--avorio-2); font-size: 15px; cursor: pointer;
}
.pillole input:checked + span { border-color: var(--lanterna); color: var(--avorio); background: var(--lanterna-ombra); }
.pillole input:focus-visible + span { outline: 2px solid var(--lanterna); outline-offset: 2px; }
.interruttore { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid rgba(236,230,214,.07); cursor: pointer; }
.interruttore input { width: 46px; height: 28px; appearance: none; border-radius: 999px; background: var(--brina-2); position: relative; cursor: pointer; flex: none; transition: background .2s; }
.interruttore input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--avorio); transition: transform .2s; }
.interruttore input:checked { background: var(--lanterna); }
.interruttore input:checked::after { transform: translateX(18px); }

/* ---------- Menzioni, chip, sigilli ---------- */
.m {
  color: inherit; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px;
  text-decoration-color: var(--tc, var(--brina));
}
.m--persona { --tc: var(--c-persona); }
.m--luogo { --tc: var(--c-luogo); }
.m--fazione { --tc: var(--c-fazione); }
.m--oggetto { --tc: var(--c-oggetto); }
.m--missione { --tc: var(--c-missione); }
.m--ignota { --tc: var(--brina-2); text-decoration-style: dashed; color: var(--avorio-2); }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 31px; padding: 0 12px 0 9px; border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--tc, var(--brina)) 42%, transparent);
  background: color-mix(in srgb, var(--tc, var(--brina)) 9%, transparent);
  color: var(--avorio); font-size: 14.5px; text-decoration: none; white-space: nowrap; max-width: 100%;
}
.chip .i { width: 16px; height: 16px; color: var(--tc, var(--brina)); }
.chip--persona, .t-persona { --tc: var(--c-persona); }
.chip--luogo, .t-luogo { --tc: var(--c-luogo); }
.chip--fazione, .t-fazione { --tc: var(--c-fazione); }
.chip--oggetto, .t-oggetto { --tc: var(--c-oggetto); }
.chip--missione, .t-missione { --tc: var(--c-missione); }

.sigillo {
  --d: 46px; --tc: var(--c-persona);
  width: var(--d); height: var(--d); flex: none; border-radius: 50%; position: relative; overflow: hidden;
  display: grid; place-items: center; font: 400 calc(var(--d) * .4)/1 var(--f-titolo); color: var(--avorio);
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--tc) 32%, var(--ardesia-2)), var(--ardesia) 78%);
  border: 1.5px solid color-mix(in srgb, var(--tc) 72%, transparent);
  box-shadow: inset 0 0 0 3px rgba(23, 33, 43, .55);
  text-decoration: none;
}
.sigillo img { width: 100%; height: 100%; object-fit: cover; }
.sigillo .i { width: 52%; height: 52%; color: var(--tc); }
.sigillo--morto { filter: grayscale(1) brightness(.7); }
.sigillo--grande { --d: 84px; }
.sigillo--piccolo { --d: 32px; }

/* ---------- Liste ---------- */
.lista { list-style: none; margin: 0; padding: 0; }
.riga {
  display: flex; align-items: center; gap: 14px; padding: 12px 2px;
  border-bottom: 1px solid rgba(236, 230, 214, .07); text-decoration: none; color: inherit;
}
.riga:last-child { border-bottom: 0; }
a.riga:hover { background: rgba(236, 230, 214, .025); }
.riga .corpo { flex: 1; min-width: 0; }
.riga .tit { font-size: 17px; font-weight: 500; line-height: 1.3; }
.riga .sub { font-size: 14.5px; color: var(--brina); line-height: 1.35; margin-top: 2px; }
.riga .dx { font-size: 13.5px; color: var(--brina); text-align: right; flex: none; }
.riga .tronca { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Home ---------- */
.puntate { padding: 4px 0 0; }
.puntate .occhiello { font: italic 400 19px/1.2 var(--f-titolo); color: var(--lanterna-2); margin: 0 0 10px; }
.puntate h1 a { text-decoration: none; }
.puntate .meta { color: var(--brina); font-size: 15px; margin: 10px 0 16px; }
.puntate .lettura { position: relative; max-height: 16.5em; overflow: hidden; }
.puntate .lettura.lungo::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4.5em; background: linear-gradient(transparent, var(--notte)); }
.leggi { display: inline-flex; margin-top: 12px; color: var(--lanterna-2); font-weight: 700; text-decoration: none; }

.dove { display: flex; align-items: stretch; gap: 0; margin-top: 30px; text-decoration: none; border-radius: 16px; overflow: hidden; border: 1px solid rgba(236,230,214,.1); background: var(--ardesia); }
.dove-mappa { container-type: inline-size; position: relative; width: 46%; min-height: 128px; flex: none; background: #121A22; }
.dove-img { position: absolute; inset: 0; background-repeat: no-repeat; opacity: 0; transition: opacity .5s; }
.dove-img.pronta { opacity: 1; }
.dove-segno { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--lanterna); box-shadow: 0 0 0 4px rgba(232,163,61,.3), 0 0 18px var(--lanterna); }
.dove-testo { padding: 16px 18px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.dove-testo strong { font-weight: 400; }
.dove-testo .fioco { font-size: 14.5px; }

.taccuino { margin-top: 26px; padding: 16px 18px; border-radius: 16px; background: linear-gradient(135deg, rgba(232,163,61,.12), rgba(232,163,61,.03)); border: 1px solid rgba(232,163,61,.3); }
.taccuino .testa { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cronometro { font: 400 28px/1 var(--f-titolo); color: var(--lanterna-2); font-variant-numeric: tabular-nums; }
.taccuino form { display: flex; gap: 8px; margin-top: 14px; }
.taccuino form input { flex: 1; }
.taccuino ol { list-style: none; margin: 12px 0 0; padding: 0; font-size: 15px; }
.taccuino li { display: flex; gap: 10px; padding: 5px 0; border-top: 1px solid rgba(236,230,214,.07); }
.taccuino li time { color: var(--lanterna-2); font-variant-numeric: tabular-nums; flex: none; }

.compagnia { display: flex; gap: 16px; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: none; }
.compagnia a { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; font-size: 14px; color: var(--avorio-2); min-width: 64px; }

.benvenuto { padding-top: 6vh; }
.benvenuto .lettura { margin-top: 14px; }

/* ---------- Diario: cronaca a medaglioni ---------- */
.testa-vista { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
.testa-vista .azioni { margin: 0; }
.cronaca { list-style: none; margin: 0; padding: 0; position: relative; }
.cronaca::before { content: ""; position: absolute; left: 23px; top: 10px; bottom: 30px; width: 1.5px; background: linear-gradient(var(--brina-2), rgba(75, 94, 110, .15)); }
.cronaca > li { position: relative; padding: 0 0 28px 66px; }
.cronaca .num {
  position: absolute; left: 0; top: -2px; width: 48px; height: 48px; border-radius: 50%;
  display: grid; place-items: center; background: var(--notte); border: 1.5px solid var(--brina-2);
  font: 400 23px/1 var(--f-titolo); color: var(--avorio); text-decoration: none;
}
.cronaca > li:first-child .num { border-color: var(--lanterna); color: var(--lanterna-2); box-shadow: 0 0 0 5px var(--lanterna-ombra); }
.cronaca h2 { font-size: 23px; line-height: 1.2; }
.cronaca h2 a { text-decoration: none; }
.cronaca .data { color: var(--brina); font-size: 14.5px; margin: 3px 0 8px; }
.cronaca .estratto { color: var(--avorio-2); font-size: 16px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: 0 0 10px; }

/* ---------- Pagina sessione / voce ---------- */
.intestazione { display: flex; gap: 18px; align-items: flex-start; }
.intestazione .corpo { flex: 1; min-width: 0; }
.intestazione .sopra { font: italic 400 18px/1.2 var(--f-titolo); color: var(--brina); margin: 0 0 6px; }
.intestazione .sotto { color: var(--brina); margin-top: 8px; font-size: 15.5px; }
.num-grande { width: 74px; height: 74px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--lanterna); color: var(--lanterna-2); font: 400 34px/1 var(--f-titolo); box-shadow: 0 0 0 6px var(--lanterna-ombra); }
.eventi { list-style: none; margin: 0; padding: 0; counter-reset: ev; }
.eventi li { position: relative; padding: 0 0 14px 34px; counter-increment: ev; line-height: 1.5; }
.eventi li::before { content: counter(ev); position: absolute; left: 0; top: 0; width: 23px; height: 23px; border-radius: 50%; border: 1px solid var(--brina-2); display: grid; place-items: center; font: 400 14px/1 var(--f-titolo); color: var(--brina); }
.eventi .dove-ev { display: block; font-size: 14px; color: var(--brina); margin-top: 2px; }
.citazione { margin: 0 0 18px; padding: 0 0 0 20px; border-left: 2px solid var(--c-oggetto); }
.citazione p { margin: 0; font: italic 400 21px/1.4 var(--f-titolo); color: var(--avorio); }
.citazione footer { margin-top: 6px; color: var(--brina); font-size: 14.5px; }
.storia { list-style: none; margin: 0; padding: 0; }
.storia li { display: flex; gap: 14px; padding: 9px 0; border-bottom: 1px solid rgba(236,230,214,.06); line-height: 1.45; }
.storia li a.n { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--brina-2); display: grid; place-items: center; font: 400 16px/1 var(--f-titolo); color: var(--avorio-2); text-decoration: none; }
.storia .t { flex: 1; padding-top: 6px; }
.scala { display: flex; align-items: center; gap: 4px; }
.scala i { width: 13px; height: 13px; transform: rotate(45deg); border: 1px solid var(--brina-2); border-radius: 2px; display: block; }
.scala i.on { background: var(--tc, var(--lanterna)); border-color: var(--tc, var(--lanterna)); }
.scala i.zero { border-color: var(--brina); }
.scala-neg { --tc: var(--cera); }
.scala-pos { --tc: var(--c-luogo); }
.rapporto { padding: 12px 0; border-bottom: 1px solid rgba(236,230,214,.07); }
.rapporto .alto { display: flex; align-items: center; gap: 12px; }
.rapporto .nome { flex: 1; min-width: 0; }
.rapporto .valore { font-size: 14px; color: var(--brina); display: flex; align-items: center; gap: 10px; margin-top: 3px; }
.ultima { flex: none; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 15px; border: 1px solid var(--brina-2); display: grid; place-items: center; font: 400 15px/1 var(--f-titolo); color: var(--avorio-2); }
.favori { list-style: none; margin: 8px 0 0 44px; padding: 0; font-size: 15px; color: var(--avorio-2); }
.favori li { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
.favori li.saldato { color: var(--brina); text-decoration: line-through; text-decoration-color: rgba(140,159,174,.5); }
.favori .tipo { font-size: 13px; color: var(--lanterna-2); flex: none; }

/* ---------- Missioni ---------- */
.segmenti { display: inline-flex; padding: 4px; border-radius: 14px; background: var(--ardesia); border: 1px solid rgba(236,230,214,.07); margin-bottom: 18px; }
.segmenti a { padding: 9px 16px; border-radius: 10px; text-decoration: none; color: var(--brina); font-weight: 700; font-size: 15px; }
.segmenti a.attivo { background: var(--ardesia-3); color: var(--avorio); }
.missione-riga { display: flex; gap: 14px; align-items: flex-start; padding: 16px 2px; border-bottom: 1px solid rgba(236,230,214,.07); text-decoration: none; color: inherit; }
.missione-riga .corpo { flex: 1; min-width: 0; }
.missione-riga h3 { font-size: 21px; line-height: 1.2; }
.missione-riga .sub { color: var(--brina); font-size: 15px; margin-top: 5px; }
.missione-riga .premio { color: var(--c-oggetto); font-size: 15px; margin-top: 4px; }
.segno-attiva { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; color: var(--lanterna); border: 1.5px solid var(--lanterna); box-shadow: 0 0 0 4px var(--lanterna-ombra); margin-top: 2px; }
.segno-attiva .i { width: 19px; height: 19px; }
.timbro {
  --tc: var(--c-luogo);
  flex: none; margin-top: 4px; padding: 5px 10px; border: 2px solid var(--tc); border-radius: 8px;
  outline: 1px solid var(--tc); outline-offset: 2px;
  font: italic 400 17px/1 var(--f-titolo); color: var(--tc); transform: rotate(-7deg); opacity: .9;
}
.timbro--fallita { --tc: var(--cera); }
.timbro--abbandonata { --tc: var(--brina); }

/* ---------- Wiki ---------- */
.cerca { position: relative; margin-bottom: 14px; }
.cerca .i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--brina); }
.cerca input { padding-left: 42px; }
.filtri { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; scrollbar-width: none; }
.filtri a { flex: none; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--brina-2); color: var(--avorio-2); text-decoration: none; font-size: 15px; }
.filtri a.attivo { border-color: var(--lanterna); color: var(--avorio); background: var(--lanterna-ombra); }

/* ---------- Import ---------- */
.passi { list-style: none; margin: 0; padding: 0; counter-reset: passo; }
.passi > li { position: relative; padding: 0 0 30px 52px; counter-increment: passo; }
.passi > li::before { content: counter(passo); position: absolute; left: 0; top: -4px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--lanterna); color: var(--lanterna-2); font: 400 19px/1 var(--f-titolo); }
.passi > li::after { content: ""; position: absolute; left: 17.5px; top: 40px; bottom: 6px; width: 1px; background: var(--brina-2); }
.passi > li:last-child::after { display: none; }
.passi h2 { font-size: 22px; margin: 0 0 8px; }
.riga-campi { display: flex; gap: 12px; }
.riga-campi .campo { flex: 1; }
.prop { padding: 14px 16px; border-radius: 14px; background: var(--ardesia); border: 1px solid rgba(236,230,214,.07); border-left: 3px solid var(--tc, var(--brina)); margin: 0 0 12px; }
.prop.saltata { opacity: .5; }
.prop .testa { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.prop .testa .corpo { flex: 1; min-width: 0; }
.prop .testa strong { display: block; font-size: 17px; font-weight: 700; }
.prop .testa small { color: var(--brina); font-size: 14px; }
.prop .nota { color: var(--avorio-2); font-size: 15px; margin: 0 0 10px; }
.prop ul.diff { list-style: none; margin: 10px 0 0; padding: 0; font-size: 14.5px; color: var(--avorio-2); }
.prop ul.diff li { padding: 3px 0; }
.prop ul.diff b { color: var(--brina); font-weight: 500; }
.prop .spunta { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.prop .spunta input { width: 22px; height: 22px; accent-color: var(--lanterna); flex: none; }
.piede-fisso { position: sticky; bottom: calc(var(--nav-h) + var(--safe-b) + 10px); display: flex; gap: 10px; justify-content: flex-end; padding: 12px; margin-top: 10px; border-radius: 16px; background: rgba(31,42,54,.94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(236,230,214,.1); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.errore { color: #F2A898; background: rgba(208,88,63,.1); border: 1px solid rgba(208,88,63,.35); border-radius: 12px; padding: 10px 14px; font-size: 15px; margin-top: 10px; }
.successo { color: #A8E3D2; }
details.aiuto { border-top: 1px solid rgba(236,230,214,.08); padding: 12px 0; }
details.aiuto summary { cursor: pointer; font-weight: 700; color: var(--avorio); list-style: none; display: flex; justify-content: space-between; }
details.aiuto summary::after { content: "+"; color: var(--brina); font-size: 20px; line-height: 1; }
details.aiuto[open] summary::after { content: "–"; }
details.aiuto .lettura { font-size: 16px; margin-top: 10px; color: var(--avorio-2); }

/* ---------- Foglio (pannello modale) ---------- */
.velo { position: fixed; inset: 0; z-index: 70; background: rgba(8, 12, 16, .6); opacity: 0; pointer-events: none; transition: opacity .2s; }
.velo.aperto { opacity: 1; pointer-events: auto; }
.foglio {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 71; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--ardesia); border-radius: 22px 22px 0 0; padding: 8px 20px calc(22px + var(--safe-b));
  transform: translateY(105%); transition: transform .3s cubic-bezier(.2, .8, .2, 1);
  box-shadow: 0 -12px 40px rgba(0, 0, 0, .45); border-top: 1px solid rgba(236,230,214,.08);
}
.foglio.aperto { transform: none; }
.foglio .maniglia { width: 42px; height: 4px; border-radius: 4px; background: var(--brina-2); margin: 4px auto 12px; }
.foglio-testa { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.foglio-piede { position: sticky; bottom: calc(-22px - var(--safe-b)); display: flex; gap: 10px; justify-content: flex-end; padding: 14px 0 calc(4px + var(--safe-b)); margin: 8px -20px 0; padding-left: 20px; padding-right: 20px; background: var(--ardesia); border-top: 1px solid rgba(236,230,214,.07); }
@media (min-width: 900px) {
  .foglio { left: 50%; right: auto; bottom: auto; top: 50%; width: min(640px, 92vw); max-height: 88vh; border-radius: 20px; transform: translate(-50%, -47%); opacity: 0; pointer-events: none; transition: transform .25s, opacity .2s; padding-bottom: 22px; }
  .foglio.aperto { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
  .foglio .maniglia { display: none; }
  .foglio-piede { bottom: -22px; padding-bottom: 4px; }
}
.anteprima-ritratto { display: flex; align-items: center; gap: 14px; }

#suggerimenti { position: fixed; z-index: 90; max-height: 260px; overflow-y: auto; background: var(--ardesia-3); border: 1px solid rgba(236,230,214,.14); border-radius: 14px; box-shadow: 0 12px 36px rgba(0,0,0,.5); padding: 6px; }
#suggerimenti button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; background: none; color: var(--avorio); font: 15.5px var(--f-testo); text-align: left; border-radius: 9px; cursor: pointer; }
#suggerimenti button:hover, #suggerimenti button:focus { background: rgba(236,230,214,.07); }
#suggerimenti button .i { color: var(--tc); }
#suggerimenti small { margin-left: auto; color: var(--brina); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }

.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--safe-b) + 18px); z-index: 95; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; background: var(--avorio); color: var(--notte); padding: 11px 18px; border-radius: 12px; font-weight: 700; font-size: 15px; max-width: 90vw; box-shadow: 0 10px 30px rgba(0,0,0,.4); transition: opacity .2s, transform .25s; }
.toast.vis { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 900px) { .toast { bottom: 28px; left: calc(50% + var(--rail) / 2); } }

/* =====================================================================
   MAPPA
   ===================================================================== */
#vista-mappa { position: fixed; left: var(--rail); right: 0; top: calc(var(--top-h) + var(--safe-t)); bottom: calc(var(--nav-h) + var(--safe-b)); display: none; background: #0E151C; overflow: hidden; }
#vista-mappa.vis { display: block; }
@media (min-width: 900px) { #vista-mappa { bottom: 0; } }
.palco { position: absolute; inset: 0; z-index: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.palco.trascina { cursor: grabbing; }
.palco.cartografo { cursor: crosshair; }
canvas.tela { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.strato { position: absolute; inset: 0; pointer-events: none; }
svg.tracce { width: 100%; height: 100%; overflow: visible; }
.strato-pin > * { pointer-events: auto; }
.vignetta { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(130% 95% at 50% 45%, transparent 58%, rgba(7, 11, 15, .6) 100%); }
canvas.neve { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

.pin { position: absolute; left: 0; top: 0; width: 0; height: 0; padding: 0; border: 0; background: none; color: var(--avorio); cursor: pointer; z-index: 2; }
.pin:focus-visible { outline: none; }
.pin:focus-visible .pin-med { outline: 2px solid var(--lanterna); outline-offset: 3px; }
.pin-med {
  position: absolute; left: -17px; top: -17px; width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center; color: var(--avorio);
  background: rgba(16, 24, 32, .92); border: 1.5px solid var(--avorio);
  box-shadow: 0 3px 10px rgba(0, 0, 0, .6), inset 0 0 0 2px rgba(16, 24, 32, .9);
  transition: transform .18s, border-color .18s, box-shadow .18s;
}
.pin-med .i { width: 19px; height: 19px; }
.pin-med .i path { stroke-width: 1.8; }
.pin--minore .pin-med { left: -13px; top: -13px; width: 26px; height: 26px; }
.pin--minore .pin-med .i { width: 15px; height: 15px; }
.pin--noto .pin-med { background: rgba(16, 24, 32, .62); border-style: dashed; color: var(--avorio-2); }
.pin--segreto .pin-med { border-color: var(--c-fazione); color: var(--c-fazione); opacity: .75; }
.pin-nome {
  position: absolute; top: 20px; left: 0; transform: translateX(-50%); pointer-events: none;
  font: 400 15px/1.05 var(--f-carta); letter-spacing: .03em; white-space: nowrap; color: var(--avorio);
  text-shadow: 0 0 2px #0D141B, 0 0 5px #0D141B, 0 0 9px #0D141B, 0 1px 2px #0D141B;
  transition: opacity .2s;
}
.pin--minore .pin-nome { top: 15px; font-size: 13.5px; }
.pin.senza-nome .pin-nome { opacity: 0; }
.pin.sel { z-index: 4; }
/* Mappe del manuale: città e locande sono già disegnate e scritte, il segnaposto diventa un anello
   color lanterna attorno al punto stampato. Toccato, torna il medaglione con il simbolo. */
.pin--stampato:not(.sel):not(.trascinato) .pin-med { left: -12px; top: -12px; width: 24px; height: 24px; background: rgba(232, 163, 61, .14); border: 2px solid var(--lanterna); box-shadow: 0 0 0 2px rgba(16, 24, 32, .5), 0 0 14px rgba(232, 163, 61, .45); }
.pin--stampato.pin--minore:not(.sel):not(.trascinato) .pin-med { left: -9px; top: -9px; width: 18px; height: 18px; }
.pin--stampato.pin--noto:not(.sel):not(.trascinato) .pin-med { border-style: dashed; background: rgba(16, 24, 32, .18); }
.pin--stampato:not(.sel):not(.trascinato) .pin-med .i { display: none; }
.pin--stampato .pin-med::before { content: ""; position: absolute; inset: -11px; border-radius: 50%; }
.pin--stampato .badge { left: -22px; top: -22px; }
.lontano .pin:not(.sel) .pin-med { transform: scale(.72); }
.lontano .pin:not(.sel) .badge { display: none; }
.pin.sel .pin-med { border-color: var(--lanterna); color: var(--lanterna-2); transform: scale(1.18); box-shadow: 0 0 0 6px rgba(232, 163, 61, .25), 0 4px 18px rgba(0, 0, 0, .7); }
.pin.sel .pin-nome { opacity: 1; color: var(--lanterna-2); }
.pin .badge { position: absolute; left: -29px; top: -24px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--lanterna); color: #22170A; font: 700 11.5px/18px var(--f-testo); text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.5); pointer-events: none; }
.pin--minore .badge { left: -24px; top: -20px; }
.pin.trascinato .pin-med { transform: scale(1.3); border-color: var(--lanterna); }
.gruppo { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 3; pointer-events: none; }
.gruppo-alone { position: absolute; left: -28px; top: -28px; width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--lanterna); animation: respiro 2.6s ease-out infinite; }
.gruppo-lanterna { position: absolute; left: 12px; top: -48px; width: 30px; height: 30px; border-radius: 50% 50% 50% 5px; background: var(--lanterna); color: #22170A; display: grid; place-items: center; box-shadow: 0 4px 16px rgba(232, 163, 61, .5); }
.gruppo-lanterna .i { width: 18px; height: 18px; }
.gruppo-lanterna .i path { stroke-width: 2; }
@keyframes respiro { 0% { transform: scale(.55); opacity: .95; } 100% { transform: scale(1.55); opacity: 0; } }
.tracce path.via { fill: none; stroke: var(--lanterna); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: .1 8; opacity: .9; }
.tracce path.via-ombra { fill: none; stroke: rgba(8, 12, 16, .55); stroke-width: 6; stroke-linecap: round; stroke-dasharray: .1 8; }
.tracce circle { fill: var(--lanterna); stroke: #22170A; stroke-width: 1.5; }

.mappa-ui { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.mappa-ui > * { pointer-events: auto; }
.vetro { background: rgba(19, 28, 37, .84); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(236, 230, 214, .11); border-radius: 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, .35); }
.mappa-testa { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; gap: 8px; align-items: flex-start; pointer-events: none; }
.mappa-testa > * { pointer-events: auto; }
.briciole { display: flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 6px 0 12px; font: 400 18px/1 var(--f-titolo); max-width: 62%; overflow: hidden; }
.briciole button { appearance: none; background: none; border: 0; color: var(--avorio-2); font: inherit; padding: 6px 4px; cursor: pointer; white-space: nowrap; }
.briciole button:last-child { color: var(--avorio); }
.briciole .sep { color: var(--brina-2); }
.mappa-cerca { flex: 1; position: relative; min-width: 0; }
.mappa-cerca input { height: 44px; padding: 0 14px 0 40px; border-radius: 14px; background: rgba(19, 28, 37, .84); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(236, 230, 214, .11); }
.mappa-cerca .i { position: absolute; left: 12px; top: 12px; color: var(--brina); width: 20px; height: 20px; }
.risultati { position: absolute; left: 0; right: 0; top: 50px; padding: 6px; max-height: 50vh; overflow-y: auto; }
.risultati button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; border: 0; background: none; color: var(--avorio); font: 15.5px var(--f-testo); text-align: left; border-radius: 10px; cursor: pointer; }
.risultati button:hover { background: rgba(236,230,214,.07); }
.risultati button .i { color: var(--tc); }
.risultati small { color: var(--brina); margin-left: auto; font-size: 13px; }
.mappa-lato { position: absolute; right: 10px; bottom: 14px; display: flex; flex-direction: column; gap: 8px; transition: opacity .2s; }
.mappa-lato .btn-icona { width: 46px; height: 46px; background: rgba(19, 28, 37, .86); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(236, 230, 214, .12); box-shadow: 0 4px 16px rgba(0,0,0,.35); }
.mappa-lato .btn-icona.on { color: var(--lanterna); border-color: rgba(232,163,61,.5); }
.mappa-lato .gruppo-btn { color: var(--lanterna); }
.bussola { position: absolute; left: 12px; bottom: 14px; width: 70px; height: 70px; pointer-events: none; opacity: .9; transition: opacity .2s; }
.bussola path, .bussola circle { fill: none; stroke: var(--avorio); stroke-width: 1.2; }
.bussola .pieno { fill: var(--avorio); stroke: none; }
.bussola .lanterna { fill: var(--lanterna); stroke: none; }
.bussola text { fill: var(--avorio); font: 400 15px var(--f-carta); text-anchor: middle; stroke: none; }
.mappa.scheda-aperta .mappa-lato, .mappa.scheda-aperta .bussola { opacity: 0; pointer-events: none; }
.banner-carto { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); width: min(560px, calc(100% - 20px)); display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; font-size: 15px; border-color: rgba(232,163,61,.45); }
.banner-carto p { margin: 0; flex: 1; color: var(--avorio-2); }
.mappa-vuota { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
.mappa-vuota > div { max-width: 420px; }
.mappa-vuota p { color: var(--brina); }

.scheda-mappa {
  position: absolute; left: 8px; right: 8px; bottom: 8px; max-height: 64%; overflow-y: auto; overscroll-behavior: contain;
  padding: 16px 18px 18px; border-radius: 18px; transform: translateY(calc(100% + 24px)); transition: transform .32s cubic-bezier(.2, .8, .2, 1);
}
.scheda-mappa.aperta { transform: none; }
.scheda-mappa .testa { display: flex; gap: 14px; align-items: flex-start; }
.scheda-mappa .testa .corpo { flex: 1; min-width: 0; }
.scheda-mappa h2 { font-size: 26px; line-height: 1.1; }
.scheda-mappa .ruolo { color: var(--brina); font-size: 15px; margin-top: 4px; }
.scheda-mappa h3 { font: 700 14.5px var(--f-testo); color: var(--brina); margin: 18px 0 8px; }
.scheda-mappa .ev { font-size: 15.5px; line-height: 1.45; padding: 6px 0; border-top: 1px solid rgba(236,230,214,.07); display: flex; gap: 10px; }
.scheda-mappa .ev a.n { flex: none; color: var(--lanterna-2); font: 400 15px var(--f-titolo); text-decoration: none; min-width: 30px; }
.scheda-mappa .azioni { margin-top: 14px; }
@media (min-width: 900px) {
  .scheda-mappa { left: auto; right: 14px; top: 68px; bottom: 14px; width: 390px; max-height: none; transform: translateX(calc(100% + 30px)); }
  .mappa.scheda-aperta .mappa-lato { right: 418px; opacity: 1; pointer-events: auto; }
  .mappa.scheda-aperta .bussola { opacity: .9; }
}
.menu-mappa { position: absolute; right: 10px; top: 62px; width: min(320px, calc(100% - 20px)); padding: 8px; }
.menu-mappa .voce-menu { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 10px; border: 0; background: none; color: var(--avorio); font: 15.5px var(--f-testo); text-align: left; border-radius: 10px; cursor: pointer; }
.menu-mappa .voce-menu:hover { background: rgba(236,230,214,.07); }
.menu-mappa .voce-menu.on .i { color: var(--lanterna); }
.menu-mappa hr { border: 0; border-top: 1px solid rgba(236,230,214,.08); margin: 6px 4px; }
.menu-mappa .titoletto { font-size: 13.5px; color: var(--brina); padding: 8px 10px 4px; }

/* =====================================================================
   SCHEDE DEI PERSONAGGI
   ===================================================================== */
.sigillo--mini { --d: 30px; font-size: 13px; }
.mio-pg { padding: 0; }
.livello { display: flex; align-items: center; gap: 6px; margin-top: 22px; padding: 12px 16px 12px 8px; border-radius: 16px; background: var(--ardesia); border: 1px solid rgba(236,230,214,.08); }
.liv-num { display: flex; flex-direction: column; align-items: center; min-width: 60px; }
.liv-num span, .liv-info span { font-size: 13px; color: var(--brina); }
.liv-num strong { font: 400 42px/1 var(--f-titolo); color: var(--lanterna-2); }
.liv-dati { margin-left: auto; display: flex; gap: 18px; }
.liv-info { display: flex; flex-direction: column; text-align: right; }
.liv-info strong { font: 400 25px/1.1 var(--f-titolo); }
.risorse { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
.risorsa { padding: 12px 14px; border-radius: 14px; background: var(--ardesia); border: 1px solid rgba(236,230,214,.08); }
.r-nome { font: 400 19px/1.2 var(--f-titolo); }
.pips { display: flex; flex-wrap: wrap; gap: 11px; margin: 12px 4px 10px; }
.pip { width: 24px; height: 24px; transform: rotate(45deg); border-radius: 5px; border: 1.5px solid var(--brina-2); background: transparent; cursor: pointer; padding: 0; transition: background .15s, box-shadow .15s; }
.pip.on { background: var(--lanterna); border-color: var(--lanterna); box-shadow: 0 0 10px rgba(232,163,61,.35); }
.pip-num { font: 400 26px var(--f-titolo); color: var(--lanterna-2); }
.r-nota { font-size: 13.5px; color: var(--brina); line-height: 1.4; }

// ---------------------------------------------------------------------
// STATO DELL'APP
// ---------------------------------------------------------------------
// DB: una "tabella" per foglio del Google Sheet, ogni record indicizzato per id
let DB = vuotoDB();
// OUTBOX: modifiche non ancora inviate al foglio. Chiave "tabella|id", valore = solo i campi cambiati
let OUTBOX = {};
// Impostazioni di questo dispositivo (non sincronizzate)
let IMPOST = { url: '', chiave: '', chiaveMaster: '', io: '', pg: '', neve: true, percorso: true, ultimoSync: 0, master: false };
// Taccuino della sessione in corso (segnalibri con l'orario), solo su questo dispositivo
let TACCUINO = { inizio: null, fine: null, note: [] };
// Indice ricostruito al volo (nomi, menzioni, chi sta dove...). null = da ricalcolare
let IDX = null;
const SYNC = { inCorso: false, ancora: false, timer: 0, stato: 'locale', errore: '', ultimo: 0 };

function vuotoDB() { const d = {}; TABELLE.forEach(t => { d[t] = {}; }); return d; }

// ---------------------------------------------------------------------
// SALVATAGGIO LOCALE
// ---------------------------------------------------------------------
function caricaLocale() {
  try {
    const d = JSON.parse(localStorage.getItem('taverna.db') || 'null');
    if (d) TABELLE.forEach(t => { DB[t] = d[t] || {}; });
    OUTBOX = JSON.parse(localStorage.getItem('taverna.outbox') || '{}');
    Object.assign(IMPOST, JSON.parse(localStorage.getItem('taverna.impost') || '{}'));
    Object.assign(TACCUINO, JSON.parse(localStorage.getItem('taverna.taccuino') || '{}'));
  } catch (e) {
    console.warn('Dati locali illeggibili', e);
  }
}

function salvaLocale(cosa) {
  try {
    if (!cosa || cosa === 'db') {
      localStorage.setItem('taverna.db', JSON.stringify(DB));
      localStorage.setItem('taverna.outbox', JSON.stringify(OUTBOX));
    }
    if (!cosa || cosa === 'impost') localStorage.setItem('taverna.impost', JSON.stringify(IMPOST));
    if (!cosa || cosa === 'taccuino') localStorage.setItem('taverna.taccuino', JSON.stringify(TACCUINO));
  } catch (e) {
    avviso('La memoria del browser è piena: esporta un backup dalle impostazioni');
  }
}

/**
 * Crea o aggiorna un record e lo mette in coda per il foglio del gruppo.
 * In coda finiscono SOLO i campi cambiati: se due persone modificano
 * campi diversi della stessa voce, nessuna delle due perde la sua modifica.
 * opz.locale = true  -> non sincronizzare (usato dai dati di esempio)
 */
function salva(tab, rec, opz) {
  opz = opz || {};
  if (!rec.id) rec.id = nuovoId(tab);
  const nuovo = !DB[tab][rec.id];
  const prima = DB[tab][rec.id] || {};
  const patch = { id: rec.id };
  let cambiato = nuovo;
  for (const k in rec) {
    if (k === 'id') continue;
    const v = rec[k] === undefined ? '' : rec[k];
    if (JSON.stringify(prima[k] === undefined ? '' : prima[k]) !== JSON.stringify(v)) { patch[k] = v; cambiato = true; }
  }
  if (!cambiato) return prima;
  const dopo = Object.assign({}, prima, rec);
  dopo.agg = new Date().toISOString();
  dopo.autore = IMPOST.io || '';
  patch.agg = dopo.agg;
  patch.autore = dopo.autore;
  DB[tab][rec.id] = dopo;
  // I dati di esempio restano su questo dispositivo: non finiscono mai nel foglio del gruppo
  if (!dopo.demo && !opz.locale) {
    const k = tab + '|' + rec.id;
    OUTBOX[k] = Object.assign({}, OUTBOX[k] || {}, patch);
    programmaSync();
  }
  IDX = null;
  salvaLocale('db');
  return dopo;
}

// Eliminazione "morbida": il record resta con eliminato=1 così la cancellazione arriva anche agli altri
function elimina(tab, id) {
  if (DB[tab][id]) salva(tab, { id, eliminato: 1 });
}

function nuovoId(tab) {
  const p = { sessioni: 'ses', voci: 'voc', missioni: 'mis', rapporti: 'rap', mappe: 'map', config: 'cfg', commercio: 'com' }[tab] || 'x';
  return p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

// Un record è visibile se non è eliminato e, se segreto, solo al Master (o in modalità solo locale)
function visibile(r) {
  return !!r && !r.eliminato && (!r.segreto || IMPOST.master || !IMPOST.url);
}
function elenco(tab, filtro) {
  return Object.values(DB[tab]).filter(r => visibile(r) && (!filtro || filtro(r)));
}
function cfg(k, def) {
  const r = DB.config[k];
  return r && !r.eliminato && r.valore !== undefined && r.valore !== '' ? r.valore : def;
}
// demo = true solo per i dati di esempio (restano su questo dispositivo)
function setCfg(k, v, demo) { salva('config', { id: k, valore: v, demo: demo ? 1 : 0 }, demo ? { locale: true } : {}); }

// I valori che arrivano dal foglio sono testo: riporto a numero i campi numerici
function normalizza(r) {
  CAMPI_NUMERICI.forEach(k => {
    if (r[k] !== undefined && r[k] !== '' && typeof r[k] !== 'number') {
      const n = Number(r[k]);
      if (!isNaN(n)) r[k] = n;
    }
  });
  return r;
}

// ---------------------------------------------------------------------
// IMMAGINI IN INDEXEDDB (mappe e loro cache)
// azione: 'get' | 'put' | 'del'
// ---------------------------------------------------------------------
function idb(azione, chiave, valore) {
  return new Promise((ok, ko) => {
    const req = indexedDB.open('taverna', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('immagini');
    req.onerror = () => ko(req.error);
    req.onsuccess = () => {
      const db = req.result;
      const tx = db.transaction('immagini', azione === 'get' ? 'readonly' : 'readwrite');
      const st = tx.objectStore('immagini');
      const r = azione === 'get' ? st.get(chiave) : azione === 'put' ? st.put(valore, chiave) : st.delete(chiave);
      r.onsuccess = () => ok(r.result);
      r.onerror = () => ko(r.error);
      tx.oncomplete = () => db.close();
    };
  });
}

// ---------------------------------------------------------------------
// SINCRONIZZAZIONE CON IL FOGLIO DEL GRUPPO (Apps Script)
// ---------------------------------------------------------------------
function programmaSync(ritardo) {
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(sincronizza, ritardo || 2500);
  aggiornaStatoSync();
}

/**
 * Chiamata alla web app. Uso POST con Content-Type text/plain perché
 * Apps Script non gestisce la richiesta preliminare CORS (OPTIONS).
 */
async function chiamaServer(dati, timeoutMs) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs || 30000);
  try {
    const corpo = Object.assign({ chiave: IMPOST.chiave, chiaveMaster: IMPOST.chiaveMaster }, dati);
    const r = await fetch(IMPOST.url, {
      method: 'POST', body: JSON.stringify(corpo), redirect: 'follow', signal: ctrl.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    });
    const testo = await r.text();
    let j;
    try { j = JSON.parse(testo); } catch (e) { throw new Error("Il server non ha risposto con dati validi: controlla l'URL della web app"); }
    if (!j.ok) throw new Error(j.errore || 'Errore del server');
    return j;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Il server non risponde (tempo scaduto)');
    if (e instanceof TypeError) throw new Error('Impossibile raggiungere il server: controlla la connessione e l\'URL');
    throw e;
  } finally {
    clearTimeout(t);
  }
}

/**
 * Sincronizzazione in due tempi:
 *  1) invio la coda delle modifiche (solo i campi cambiati)
 *  2) ricevo tutto quello che è cambiato sul foglio dall'ultima volta
 * Se un record arriva dal foglio ma io ho ancora una modifica in coda,
 * riapplico la mia sopra: verrà inviata al prossimo giro.
 */
async function sincronizza(manuale) {
  manuale = manuale === true;
  if (!IMPOST.url || !IMPOST.chiave) {
    SYNC.stato = 'locale'; aggiornaStatoSync();
    if (manuale) avviso('Collega prima il foglio del gruppo nelle impostazioni');
    return;
  }
  if (!navigator.onLine) { SYNC.stato = 'offline'; aggiornaStatoSync(); if (manuale) avviso('Sei offline: invierò le modifiche appena torna la rete'); return; }
  if (SYNC.inCorso) { SYNC.ancora = true; return; }
  SYNC.inCorso = true; SYNC.stato = 'sync'; aggiornaStatoSync();
  try {
    const inviate = Object.assign({}, OUTBOX);
    // con uno script vecchio (senza la tabella commercio) quelle modifiche restano in coda, così non si perdono
    const vecchio = (IMPOST.versioneScript || 1) < VERSIONE_SCRIPT;
    const chiavi = Object.keys(inviate).filter(k => !(vecchio && k.indexOf('commercio|') === 0));
    if (chiavi.length) {
      await chiamaServer({ azione: 'push', modifiche: chiavi.map(k => ({ tab: k.split('|')[0], patch: inviate[k] })) });
      // tolgo dalla coda solo quello che ho inviato e che nel frattempo non è stato modificato di nuovo
      chiavi.forEach(k => { if (OUTBOX[k] === inviate[k]) delete OUTBOX[k]; });
      salvaLocale('db');
    }
    const r = await chiamaServer({ azione: 'pull', dal: IMPOST.ultimoSync || 0 });
    let arrivate = 0;
    TABELLE.forEach(tab => (r.dati[tab] || []).forEach(riga => {
      normalizza(riga);
      const k = tab + '|' + riga.id;
      const nuovo = OUTBOX[k] ? Object.assign({}, riga, OUTBOX[k]) : riga;
      // le mie stesse modifiche tornano indietro dal foglio: se non cambia niente non ridisegno
      if (!stessoRecord(DB[tab][riga.id], nuovo)) arrivate++;
      DB[tab][riga.id] = nuovo;
    }));
    const eraMaster = IMPOST.master;
    IMPOST.master = !!r.master;
    IMPOST.versioneScript = Number(r.versione) || 1;
    IMPOST.ultimoSync = r.ora;
    salvaLocale();
    SYNC.stato = Object.keys(OUTBOX).length ? 'coda' : 'ok';
    SYNC.errore = IMPOST.versioneScript < VERSIONE_SCRIPT ? "Lo script del foglio è vecchio: incolla il nuovo Code.gs e pubblica una nuova versione" : '';
    if (SYNC.errore) SYNC.stato = 'errore';
    SYNC.ultimo = Date.now();
    if (arrivate || eraMaster !== IMPOST.master) { IDX = null; ridisegna(); }
  } catch (e) {
    SYNC.stato = 'errore';
    SYNC.errore = e.message;
    if (manuale) avviso(e.message);
  } finally {
    SYNC.inCorso = false;
    aggiornaStatoSync();
    if (SYNC.ancora) { SYNC.ancora = false; programmaSync(400); }
  }
}

// Confronto due versioni di un record ignorando _ts (vuoto e assente valgono uguale)
function stessoRecord(a, b) {
  if (!a || !b) return false;
  const chiavi = new Set(Object.keys(a).concat(Object.keys(b)));
  for (const k of chiavi) {
    if (k === '_ts') continue;
    const va = a[k] === undefined ? '' : a[k], vb = b[k] === undefined ? '' : b[k];
    if (va === vb) continue;
    if (JSON.stringify(va) !== JSON.stringify(vb)) return false;
  }
  return true;
}

// Pallino nella barra in alto: grigio = solo locale, verde = in pari, ambra = modifiche in coda, rosso = errore
function aggiornaStatoSync() {
  const b = document.querySelector('.stato-sync');
  if (!b) return;
  const coda = Object.keys(OUTBOX).length;
  let s = SYNC.stato;
  if (s === 'ok' && coda) s = 'coda';
  b.dataset.s = s;
  const testi = {
    locale: 'Solo su questo dispositivo: collega il foglio del gruppo nelle impostazioni',
    ok: 'In pari con il foglio del gruppo',
    coda: coda + (coda === 1 ? ' modifica da inviare' : ' modifiche da inviare'),
    sync: 'Sincronizzazione in corso',
    offline: 'Offline: le modifiche partono quando torna la rete',
    errore: 'Errore di sincronizzazione: ' + SYNC.errore
  };
  b.title = testi[s] || '';
  b.setAttribute('aria-label', b.title);
}

// ---------------------------------------------------------------------
// TESTO: escape, normalizzazione, menzioni @[Nome] e #[Luogo]
// ---------------------------------------------------------------------
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// minuscolo, senza accenti né punteggiatura: "Caer-Dineval" e "caer dineval" diventano uguali
function norm(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
}

// Menzioni: @[Nome con spazi], #[Luogo con spazi], oppure @Parola e #Parola singole.
// Gruppi: 1 = simbolo (@ o #), 2 = nome tra parentesi, 3 = parola singola
const RE_MENZIONE = /(?<![\wÀ-ÿ])([@#])(?:\[([^\]\n]{1,80})\]|([A-Za-zÀ-ÖØ-öø-ÿ][\wÀ-ÖØ-öø-ÿ'’-]*))/g;

// Trova l'id di una voce (o missione) a partire da un nome o alias
function risolviNome(nome, preferisciTipo) {
  const ids = indice().perNome.get(norm(nome));
  if (!ids || !ids.length) return null;
  if (preferisciTipo) {
    const t = ids.find(id => DB.voci[id] && DB.voci[id].tipo === preferisciTipo);
    if (t) return t;
  }
  return ids[0];
}
// Un riferimento può essere un id o un nome (le voci importate a volte citano luoghi non ancora creati)
function risolvi(rif, preferisciTipo) {
  if (!rif) return null;
  if (DB.voci[rif] && visibile(DB.voci[rif])) return rif;
  if (DB.missioni[rif] && visibile(DB.missioni[rif])) return rif;
  return risolviNome(rif, preferisciTipo);
}
function nomeDi(rif) {
  const id = risolvi(rif);
  if (id && DB.voci[id]) return DB.voci[id].nome;
  if (id && DB.missioni[id]) return DB.missioni[id].titolo;
  return rif || '';
}
function classeDi(v) {
  if (!v) return 'persona';
  if (v.titolo !== undefined && !v.tipo) return 'missione';
  return (TIPI_VOCE[v.tipo] || TIPI_VOCE.png).classe;
}
function iconaVoce(v) {
  if (!v) return 'punto';
  if (v.tipo === 'luogo') return ICONE_LUOGO[v.icona] ? v.icona : 'citta';
  return (TIPI_VOCE[v.tipo] || TIPI_VOCE.png).icona;
}
// Link a una voce come "chip" (lista di persone, luoghi...)
function chipVoce(rif, testoAlternativo) {
  const id = risolvi(rif);
  const v = id ? (DB.voci[id] || DB.missioni[id]) : null;
  if (!v) return rif ? `<span class="chip">${esc(testoAlternativo || rif)}</span>` : '';
  const missione = !!DB.missioni[id];
  const cl = missione ? 'missione' : classeDi(v);
  return `<a class="chip chip--${cl}" href="#/${missione ? 'missione' : 'voce'}/${encodeURIComponent(id)}">${ico(missione ? 'missioni' : iconaVoce(v))}${esc(missione ? v.titolo : v.nome)}</a>`;
}

/**
 * Trasforma il testo scritto dal gruppo in HTML: paragrafi, **grassetto**,
 * *corsivo* e menzioni cliccabili. Una menzione a una voce che non esiste
 * ancora diventa un link tratteggiato che apre il modulo per crearla.
 * modo = 'riga' -> tutto su una riga, senza paragrafi
 */
function testoRicco(s, modo) {
  if (!s) return '';
  s = String(s);
  let out = '';
  let ultimo = 0;
  s.replace(RE_MENZIONE, (tutto, sig, nb, nn, pos) => {
    out += esc(s.slice(ultimo, pos));
    const nome = nb || nn;
    const id = risolviNome(nome, sig === '#' ? 'luogo' : null);
    if (id && DB.missioni[id]) {
      out += `<a class="m m--missione" href="#/missione/${encodeURIComponent(id)}">${esc(nome)}</a>`;
    } else if (id) {
      out += `<a class="m m--${classeDi(DB.voci[id])}" href="#/voce/${encodeURIComponent(id)}">${esc(nome)}</a>`;
    } else {
      out += `<a class="m m--ignota" href="#/nuova-voce/${encodeURIComponent(nome)}/${sig === '#' ? 'luogo' : 'png'}" title="Non è ancora nel wiki: tocca per aggiungerla">${esc(nome)}</a>`;
    }
    ultimo = pos + tutto.length;
    return tutto;
  });
  out += esc(s.slice(ultimo));
  out = out.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  if (modo === 'riga') return out.replace(/\n+/g, ' ');
  return out.split(/\n{2,}/).map(p => '<p>' + p.trim().replace(/\n/g, '<br>') + '</p>').join('');
}
// Testo senza simboli di menzione, per gli estratti
function testoPiatto(s) {
  return String(s || '').replace(RE_MENZIONE, (t, sig, nb, nn) => nb || nn).replace(/\*+/g, '');
}
// Elenco degli id citati in un testo
function menzioniIn(s) {
  const ids = [];
  if (!s) return ids;
  String(s).replace(RE_MENZIONE, (t, sig, nb, nn) => {
    const id = risolviNome(nb || nn, sig === '#' ? 'luogo' : null);
    if (id && !ids.includes(id)) ids.push(id);
    return t;
  });
  return ids;
}

// ---------------------------------------------------------------------
// INDICE: chi è citato dove, chi sta in quale luogo, cosa è successo dove.
// Si ricostruisce solo quando i dati cambiano (IDX = null).
// ---------------------------------------------------------------------
function indice() {
  if (IDX) return IDX;
  const I = { perNome: new Map(), sessioniDi: {}, eventiIn: {}, abitanti: {}, figli: {}, missioniDi: {}, ultimaVolta: {}, sessioni: [] };
  const aggiungiNome = (n, id) => {
    const k = norm(n);
    if (!k) return;
    if (!I.perNome.has(k)) I.perNome.set(k, []);
    const a = I.perNome.get(k);
    if (!a.includes(id)) a.push(id);
  };
  elenco('voci').forEach(v => { aggiungiNome(v.nome, v.id); (v.alias || []).forEach(a => aggiungiNome(a, v.id)); });
  elenco('missioni').forEach(m => aggiungiNome(m.titolo, m.id));
  IDX = I; // da qui in poi risolvi() può già usare i nomi

  // chi si trova in ogni luogo e quali luoghi stanno dentro altri luoghi
  elenco('voci').forEach(v => {
    const l = risolvi(v.luogo, 'luogo');
    if (!l || l === v.id) return;
    if (v.tipo === 'luogo') (I.figli[l] = I.figli[l] || []).push(v.id);
    else (I.abitanti[l] = I.abitanti[l] || []).push(v.id);
  });
  // missioni collegate a una persona (committente) o a un luogo
  elenco('missioni').forEach(m => {
    [risolvi(m.committente), risolvi(m.luogo, 'luogo')].forEach(id => {
      if (id) { const a = I.missioniDi[id] = I.missioniDi[id] || []; if (!a.includes(m.id)) a.push(m.id); }
    });
  });
  // sessioni in ordine e "apparizioni": ogni voce sa in quali sessioni compare
  I.sessioni = elenco('sessioni').sort((a, b) => (a.numero || 0) - (b.numero || 0));
  I.sessioni.forEach(s => {
    const segna = id => {
      if (!id) return;
      const a = I.sessioniDi[id] = I.sessioniDi[id] || [];
      if (!a.includes(s.id)) a.push(s.id);
      I.ultimaVolta[id] = Math.max(I.ultimaVolta[id] || 0, s.numero || 0);
    };
    menzioniIn(s.riassunto).forEach(segna);
    (s.eventi || []).forEach(e => {
      const ids = menzioniIn(e.t);
      const l = risolvi(e.l, 'luogo');
      ids.forEach(segna);
      segna(l);
      // "cosa abbiamo fatto qui": l'evento appartiene al suo luogo e ai luoghi citati nel testo
      const luoghi = new Set(ids.filter(id => DB.voci[id] && DB.voci[id].tipo === 'luogo'));
      if (l) luoghi.add(l);
      luoghi.forEach(id => (I.eventiIn[id] = I.eventiIn[id] || []).push({ s: s.id, n: s.numero, t: e.t }));
    });
    (s.citazioni || []).forEach(c => menzioniIn(c.testo).forEach(segna));
    segna(risolvi(s.luogo, 'luogo'));
    (s.presenti || []).forEach(p => segna(risolvi(p)));
  });
  // le righe di storia scritte nelle voci contano come apparizioni
  elenco('voci').forEach(v => (v.storia || []).forEach(h => {
    const s = DB.sessioni[h.s];
    if (!s || !visibile(s)) return;
    const a = I.sessioniDi[v.id] = I.sessioniDi[v.id] || [];
    if (!a.includes(s.id)) a.push(s.id);
    I.ultimaVolta[v.id] = Math.max(I.ultimaVolta[v.id] || 0, s.numero || 0);
  }));
  return I;
}

// Sequenza dei luoghi toccati dal gruppo, sessione dopo sessione (per il percorso sulla mappa)
function percorsoGruppo() {
  const seq = [];
  indice().sessioni.forEach(s => {
    (s.eventi || []).forEach(e => { const l = risolvi(e.l, 'luogo'); if (l) seq.push({ id: l, n: s.numero }); });
    const lf = risolvi(s.luogo, 'luogo');
    if (lf) seq.push({ id: lf, n: s.numero });
  });
  return seq;
}
// Dove si trova il gruppo adesso: impostato a mano, oppure l'ultimo luogo del percorso
function posizioneGruppo() {
  const p = risolvi(cfg('posizione'), 'luogo');
  if (p) return p;
  const seq = percorsoGruppo();
  return seq.length ? seq[seq.length - 1].id : null;
}
function prossimoNumero() {
  return elenco('sessioni').reduce((m, s) => Math.max(m, Number(s.numero) || 0), 0) + 1;
}

function dataBella(iso, corta) {
  if (!iso) return '';
  const d = new Date(String(iso).length <= 10 ? iso + 'T12:00:00' : iso);
  if (isNaN(d)) return esc(iso);
  return d.toLocaleDateString('it-IT', corta ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'long', year: 'numeric' });
}
function oggiISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function iniziali(nome) {
  const p = String(nome || '?').replace(/[^A-Za-zÀ-ÿ\s'-]/g, '').trim().split(/[\s-]+/).filter(Boolean);
  if (!p.length) return '?';
  return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
}
function durata(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(n => String(n).padStart(2, '0')).join(':');
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

// Sigillo: l'avatar tondo di una voce (ritratto, oppure iniziali nel colore del tipo)
function sigillo(v, classe) {
  if (!v) return '';
  const cl = classeDi(v);
  const morto = v.stato === 'morto' ? ' sigillo--morto' : '';
  const dentro = v.immagine ? `<img src="${esc(v.immagine)}" alt="">` : (v.tipo === 'luogo' || v.tipo === 'oggetto' || v.tipo === 'fazione' ? ico(iconaVoce(v)) : esc(iniziali(v.nome)));
  return `<span class="sigillo t-${cl}${morto} ${classe || ''}">${dentro}</span>`;
}
// Scala a rombi: atteggiamento (-2..2) o rapporto (-3..3)
function scala(valore, max) {
  valore = Number(valore) || 0;
  let h = `<span class="scala ${valore < 0 ? 'scala-neg' : 'scala-pos'}" aria-label="${valore}">`;
  for (let i = -max; i <= max; i++) {
    const on = (valore < 0 && i >= valore && i < 0) || (valore > 0 && i <= valore && i > 0);
    h += `<i class="${on ? 'on' : ''}${i === 0 ? ' zero' : ''}"></i>`;
  }
  return h + '</span>';
}

async function copiaTesto(testo) {
  try {
    await navigator.clipboard.writeText(testo);
    return true;
  } catch (e) {
    // ripiego per i browser che non danno accesso agli appunti
    const ta = document.createElement('textarea');
    ta.value = testo; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (x) { ok = false; }
    ta.remove();
    return ok;
  }
}

// Ridimensiona un'immagine scelta dall'utente. quadrato = ritaglio centrale (ritratti)
async function ridimensionaImmagine(file, lato, quadrato, qualita) {
  let bmp, urlTemp = null;
  try {
    bmp = await createImageBitmap(file);
  } catch (e) {
    // alcuni telefoni non leggono certi file con createImageBitmap: provo con un'immagine normale
    urlTemp = URL.createObjectURL(file);
    const img = new Image();
    img.src = urlTemp;
    try { await img.decode(); } catch (e2) { URL.revokeObjectURL(urlTemp); throw new Error('il formato non è supportato, usa un JPG o un PNG'); }
    bmp = img;
  }
  const larg = bmp.naturalWidth || bmp.width, alt = bmp.naturalHeight || bmp.height;
  let sx = 0, sy = 0, sw = larg, sh = alt;
  if (quadrato) { const m = Math.min(sw, sh); sx = (sw - m) / 2; sy = (sh - m) / 2; sw = sh = m; }
  const k = Math.min(1, lato / Math.max(sw, sh));
  const c = document.createElement('canvas');
  c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  const g = c.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(bmp, sx, sy, sw, sh, 0, 0, c.width, c.height);
  if (urlTemp) URL.revokeObjectURL(urlTemp);
  if (bmp.close) bmp.close();
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', qualita || .86));
  if (!blob) throw new Error("l'immagine è troppo grande per questo dispositivo");
  return { blob, w: c.width, h: c.height, canvas: c };
}
function blobInBase64(blob) {
  return new Promise((ok, ko) => {
    const fr = new FileReader();
    fr.onload = () => ok(String(fr.result).split(',')[1]);
    fr.onerror = () => ko(fr.error);
    fr.readAsDataURL(blob);
  });
}

// =====================================================================
// 2. VISTE — ogni schermata è una funzione che restituisce HTML.
//    render() legge l'indirizzo (#/vista/parametro) e sceglie la vista.
// =====================================================================
let DA_RIDISEGNARE = false;   // dati arrivati mentre l'utente scriveva: ridisegno appena chiude
let ROTTA_PRECEDENTE = '';
let TIMER_VISTA = 0;

// "#/voce/voc-123?x=1" -> { vista:'voce', a:'voc-123', b:undefined, q:URLSearchParams }
function rotta() {
  const h = location.hash.replace(/^#\/?/, '');
  const [percorso, query] = h.split('?');
  const parti = percorso.split('/').map(p => { try { return decodeURIComponent(p); } catch (e) { return p; } });
  return { vista: parti[0] || 'home', a: parti[1], b: parti[2], q: new URLSearchParams(query || '') };
}
function sezioneDi(vista) {
  return { home: 'home', diario: 'diario', sessione: 'diario', importa: 'diario', mappa: 'mappa', missioni: 'missioni', missione: 'missioni', wiki: 'wiki', voce: 'wiki', scheda: 'wiki', commercio: 'commercio' }[vista] || '';
}

function render() {
  const r = rotta();
  const inMappa = r.vista === 'mappa';
  document.getElementById('vista-mappa').classList.toggle('vis', inMappa);
  document.getElementById('vista').hidden = inMappa;
  document.body.classList.toggle('in-mappa', inMappa);
  const sez = sezioneDi(r.vista);
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('attivo', a.dataset.sez === sez));
  document.querySelector('.barra-top .indietro').hidden = !['sessione', 'voce', 'missione', 'importa', 'impostazioni', 'scheda'].includes(r.vista);
  // in alto a destra il sigillo del mio personaggio porta alla sua scheda
  const mio = IMPOST.pg && DB.voci[IMPOST.pg] && visibile(DB.voci[IMPOST.pg]) ? DB.voci[IMPOST.pg] : null;
  const linkScheda = document.getElementById('link-scheda');
  linkScheda.hidden = !mio;
  if (mio) { linkScheda.href = '#/scheda/' + encodeURIComponent(mio.id); linkScheda.innerHTML = sigillo(mio, 'sigillo--mini'); linkScheda.setAttribute('aria-label', 'Scheda di ' + mio.nome); }
  document.querySelector('.barra-top .marchio').textContent = cfg('campagna', 'Taverna');
  document.title = cfg('campagna', 'Taverna');
  clearInterval(TIMER_VISTA);
  if (inMappa) { mappaApri(r.a || null, r.q.get('luogo')); return; }
  if (MAPPA.montata) mappaNeve();   // fuori dalla mappa la neve si ferma

  let html;
  switch (r.vista) {
    case 'diario': html = vistaDiario(); break;
    case 'sessione': html = vistaSessione(r.a); break;
    case 'missioni': html = vistaMissioni(r.q.get('stato') === 'concluse' ? 'concluse' : 'attive'); break;
    case 'missione': html = vistaMissione(r.a); break;
    case 'wiki': html = vistaWiki(r.q.get('tipo') || '', r.q.get('q') || ''); break;
    case 'voce': html = vistaVoce(r.a); break;
    case 'importa': html = vistaImporta(); break;
    case 'impostazioni': html = vistaImpostazioni(); break;
    case 'scheda': html = vistaScheda(r.a); break;
    case 'commercio': html = vistaCommercio(r.q.get('sez') || 'spedizioni'); break;
    case 'nuova-voce':
      // ci si arriva da un link a una menzione sconosciuta aperto da fuori (di solito lo gestisce il clic)
      history.replaceState(null, '', '#/wiki');
      html = vistaWiki('', '');
      setTimeout(() => apriEditor('voci', null, { nome: r.a || '', tipo: TIPI_VOCE[r.b] ? r.b : 'png' }), 50);
      break;
    default: html = vistaHome();
  }
  document.getElementById('vista').innerHTML = html;
  if (location.hash !== ROTTA_PRECEDENTE) { window.scrollTo(0, 0); ROTTA_PRECEDENTE = location.hash; }
  dopoRender(r);
}

// Chiamata quando arrivano dati nuovi dal foglio: non interrompo chi sta scrivendo
function ridisegna() {
  if (MAPPA.montata) MAPPA.sporca = true;
  const att = document.activeElement;
  const staScrivendo = att && att.closest && att.closest('#vista') && /INPUT|TEXTAREA|SELECT/.test(att.tagName);
  if (foglioAperto() || staScrivendo) { DA_RIDISEGNARE = true; return; }
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

// Lavori da fare dopo aver messo l'HTML nella pagina (immagini, cronometro, filtri)
function dopoRender(r) {
  if (r.vista === 'home') {
    const mm = document.getElementById('miniMappa');
    if (mm) riempiMiniMappa(mm);
    if (TACCUINO.inizio && !TACCUINO.fine) {
      TIMER_VISTA = setInterval(() => {
        const c = document.querySelector('.cronometro');
        if (c) c.textContent = durata(Date.now() - TACCUINO.inizio);
      }, 1000);
    }
  }
  if (r.vista === 'wiki' && r.q.get('q')) filtraWiki(r.q.get('q'));
}

// ---------------------------------------------------------------------
function vistaHome() {
  const I = indice();
  const sessioni = I.sessioni;
  const voci = elenco('voci');
  if (!sessioni.length && !voci.length) {
    return `<section class="benvenuto">

        <a class="btn btn--testo" href="#/importa">Importa la prima sessione</a>
      </div>

  }

      <div class="lettura${lungo ? ' lungo' : ''}">${testoRicco(ultima.riassunto) || '<p class="fioco">Nessun riassunto per questa sessione.</p>'}</div>
      <a class="leggi" href="#/sessione/${encodeURIComponent(ultima.id)}">Leggi tutta la sessione</a>
    </section>`;
  } else {
    h += `<section class="puntate"><h1 class="t1">${esc(cfg('campagna', 'La campagna'))}</h1>
      <div class="lettura fioco"><p>Il diario non ha ancora sessioni.</p></div>
      <div class="azioni"><a class="btn btn--primario" href="#/importa">${ico('importa')}Importa una sessione</a></div></section>`;
  }

  // Dove si trova il gruppo, con un ritaglio della mappa
  const pos = posizioneGruppo();
  if (pos && DB.voci[pos]) {
    h += `<a class="dove" href="#/mappa?luogo=${encodeURIComponent(pos)}">
      <div class="dove-mappa"><div class="dove-img" id="miniMappa" data-luogo="${esc(pos)}"></div><span class="dove-segno"></span></div>
      <div class="dove-testo"><span class="fioco">Il gruppo è a</span><strong class="t2">${esc(DB.voci[pos].nome)}</strong><span class="fioco piccolo">Apri la mappa</span></div>
    </a>`;
  }
  if (!inCorso) h += bloccoTaccuino();

  // Missioni accettate
  const attive = elenco('missioni', m => (m.stato || 'attiva') === 'attiva')
    .sort((a, b) => ((DB.sessioni[b.apertaIn] || {}).numero || 0) - ((DB.sessioni[a.apertaIn] || {}).numero || 0));
  h += `<section class="sezione"><h2>Missioni accettate <span class="conta">${attive.length}</span><a class="dx" href="#/missioni">Tutte</a></h2>
    ${attive.length ? attive.slice(0, 4).map(rigaMissione).join('') : '<p class="vuoto">Nessuna missione in corso.</p>'}</section>`;

  // Favori in sospeso del mio personaggio
  if (IMPOST.pg && DB.voci[IMPOST.pg]) {
    const favori = [];
    elenco('rapporti', r => r.pg === IMPOST.pg).forEach(r => (r.favori || []).forEach(f => {
      if (!f.ok && f.tipo !== 'nota') favori.push({ r, f });
    }));
    if (favori.length) {
      h += `<section class="sezione"><h2>Favori in sospeso <span class="conta">${favori.length}</span></h2><ul class="lista">` +
        favori.map(({ r, f }) => {
          const png = DB.voci[r.png];
          return `<li><a class="riga" href="#/voce/${encodeURIComponent(r.png)}">${sigillo(png, 'sigillo--piccolo')}<div class="corpo"><div class="tit">${esc(png ? png.nome : '')}</div><div class="sub">${esc(TIPI_FAVORE[f.tipo] || '')}: ${testoRicco(f.t, 'riga')}</div></div></a></li>`;

  const recenti = [];
  sessioni.slice(-2).reverse().forEach(s => {
    const ids = [].concat(menzioniIn(s.riassunto), ...(s.eventi || []).map(e => menzioniIn(e.t)));

  });
  elenco('voci', v => v.tipo === 'png' && (v.storia || []).some(x => sessioni.slice(-2).some(s => s.id === x.s))).forEach(v => { if (!recenti.includes(v.id)) recenti.push(v.id); });
  if (recenti.length) {
    h += `<section class="sezione"><h2>Incontri recenti</h2><ul class="lista">` + recenti.slice(0, 6).map(id => {

  }
  return h;
}

// Taccuino della sessione: cronometro e segnalibri con il minuto della registrazione

}

// Riga di una missione (home e quest log)
function rigaMissione(m) {
  const stato = m.stato || 'attiva';
  const comm = m.committente ? nomeDi(m.committente) : '';
  const luogo = m.luogo ? nomeDi(m.luogo) : '';
  const s = DB.sessioni[m.apertaIn];
  let sub = comm ? 'Affidata da ' + esc(comm) : '';
  if (luogo) sub += (sub ? ' a ' : 'A ') + esc(luogo);
  if (s && visibile(s)) sub += (sub ? ', ' : '') + 'sessione ' + esc(s.numero);
  const segno = stato === 'attiva'
    ? `<span class="segno-attiva">${ico('missioni')}</span>`
    : `<span class="timbro timbro--${stato}">${STATI_MISSIONE[stato] || stato}</span>`;
  return `<a class="missione-riga" href="#/missione/${encodeURIComponent(m.id)}"><div class="corpo"><h3>${esc(m.titolo)}</h3>
    ${sub ? `<p class="sub">${sub}</p>` : ''}${m.ricompensa ? `<p class="premio">${esc(m.ricompensa)}</p>` : ''}</div>${segno}</a>`;
}

// DIARIO: la cronaca delle sessioni, dalla più recente

function vistaDiario() {
  const sessioni = indice().sessioni.slice().reverse();
  let h = `<div class="testa-vista"><h1 class="t1">Diario</h1><div class="azioni">
    <a class="btn btn--primario btn--piccolo" href="#/importa">${ico('importa')}Importa</a>
    <button class="btn btn--piccolo" data-a="nuovo" data-tab="sessioni">${ico('modifica')}Scrivi a mano</button></div></div>`;
  if (!sessioni.length) return h + '<p class="vuoto">Nessuna sessione. Importala dalla registrazione con AI Studio oppure scrivila a mano.</p>';
  h += '<ol class="cronaca">' + sessioni.map(s => {
    // luoghi e persone della sessione, per i chip sotto l'estratto
    const ids = [].concat(menzioniIn(s.riassunto), ...(s.eventi || []).map(e => [risolvi(e.l, 'luogo')].concat(menzioniIn(e.t))));
    const lf = risolvi(s.luogo, 'luogo');
    if (lf) ids.push(lf);
    const unici = ids.filter((id, i) => id && ids.indexOf(id) === i && DB.voci[id]);
    const luoghi = unici.filter(id => DB.voci[id].tipo === 'luogo');
    const persone = unici.filter(id => ['png', 'fazione'].includes(DB.voci[id].tipo));
    const chips = luoghi.slice(0, 2).map(id => chipVoce(id)).concat(persone.slice(0, 2).map(id => chipVoce(id)));
    const altri = Math.max(0, luoghi.length - 2) + Math.max(0, persone.length - 2);
    return `<li><a class="num" href="#/sessione/${encodeURIComponent(s.id)}" aria-label="Sessione ${esc(s.numero)}">${esc(s.numero)}</a>
      <h2><a href="#/sessione/${encodeURIComponent(s.id)}">${esc(s.titolo || 'Sessione ' + s.numero)}</a></h2>
      <p class="data">${dataBella(s.data)}</p>
      ${s.riassunto ? `<p class="estratto">${esc(testoPiatto(s.riassunto))}</p>` : ''}
      <div class="chips">${chips.join('')}${altri ? `<span class="chip">e altri ${altri}</span>` : ''}</div></li>`;
  }).join('') + '</ol>';
  return h;
}

function vistaSessione(id) {
  const s = DB.sessioni[id];
  if (!visibile(s)) return nonTrovato('Questa sessione non esiste più o è stata annullata.');
  const tutte = indice().sessioni;
  const pos = tutte.findIndex(x => x.id === id);
  const prec = tutte[pos - 1], succ = tutte[pos + 1];
  const presenti = (s.presenti || []).map(p => risolvi(p)).filter(Boolean);
  let h = `<header class="intestazione"><span class="num-grande">${esc(s.numero || '?')}</span><div class="corpo">
    <h1 class="t1">${esc(s.titolo || 'Sessione ' + s.numero)}</h1>
    <p class="sotto">${s.data ? 'Giocata il ' + dataBella(s.data) : 'Data non indicata'}</p></div></header>`;
  if (presenti.length || s.luogo) {
    h += `<div class="chips" style="margin-top:18px">${presenti.map(p => chipVoce(p)).join('')}${s.luogo ? chipVoce(s.luogo) : ''}</div>`;
  }
  h += `<section class="sezione"><div class="lettura">${testoRicco(s.riassunto) || '<p class="fioco">Nessun riassunto.</p>'}</div></section>`;
  if ((s.eventi || []).length) {
    h += `<section class="sezione"><h2>Fatti principali</h2><ol class="eventi">` + s.eventi.map(e => {
      const l = e.l ? nomeDi(e.l) : '';
      const giaCitato = l && menzioniIn(e.t).includes(risolvi(e.l, 'luogo'));
      return `<li>${testoRicco(e.t, 'riga')}${l && !giaCitato ? `<span class="dove-ev">a ${esc(l)}</span>` : ''}</li>`;
    }).join('') + '</ol></section>';
  }
  if ((s.citazioni || []).length) {
    h += `<section class="sezione"><h2>Frasi memorabili</h2>` + s.citazioni.map(c =>
      `<blockquote class="citazione"><p>${testoRicco(c.testo, 'riga')}</p>${c.chi ? `<footer>${esc(c.chi)}</footer>` : ''}</blockquote>`).join('') + '</section>';
  }
  if (s.bottino) h += `<section class="sezione"><h2>Bottino</h2><div class="lettura">${testoRicco(s.bottino)}</div></section>`;
  if ((s.segnalibri || []).length) {
    h += `<section class="sezione"><h2>Segnalibri della serata</h2><ul class="lista">` + s.segnalibri.map(n =>
      `<li class="riga"><span class="fioco" style="font-variant-numeric:tabular-nums">${durata(n.t)}</span><div class="corpo">${esc(n.testo)}</div></li>`).join('') + '</ul></section>';
  }
  if (s.trascrizione) {
    const url = /^https?:\/\//.test(s.trascrizione) ? s.trascrizione : '';
    h += `<section class="sezione"><h2>Trascrizione</h2>${url ? `<a class="btn btn--piccolo" href="${esc(url)}" target="_blank" rel="noopener">${ico('esterno')}Apri la trascrizione</a>` : `<p>${esc(s.trascrizione)}</p>`}</section>`;
  }
  h += `<div class="azioni" style="margin-top:34px">
    <button class="btn" data-a="modifica" data-tab="sessioni" data-id="${esc(id)}">${ico('modifica')}Modifica</button>
    ${s._annulla ? `<button class="btn" data-a="annulla-import" data-id="${esc(id)}">Annulla l'import</button>` : ''}
    <button class="btn btn--pericolo" data-a="elimina" data-tab="sessioni" data-id="${esc(id)}">${ico('elimina')}Elimina</button></div>`;
  h += `<div class="azioni" style="justify-content:space-between;margin-top:28px">
    ${prec ? `<a class="btn btn--testo" href="#/sessione/${encodeURIComponent(prec.id)}">${ico('indietro')}Sessione ${esc(prec.numero)}</a>` : '<span></span>'}
    ${succ ? `<a class="btn btn--testo" href="#/sessione/${encodeURIComponent(succ.id)}">Sessione ${esc(succ.numero)}${ico('avanti')}</a>` : ''}</div>`;
  return h;
}

  const concluse = elenco('missioni', m => m.stato && m.stato !== 'attiva').sort((a, b) => num(b.chiusaIn) - num(a.chiusaIn));
  const lista = quali === 'concluse' ? concluse : attive;

    <p class="sopra">${stato === 'attiva' ? 'Missione in corso' : 'Missione ' + (STATI_MISSIONE[stato] || stato).toLowerCase()}${m.segreto ? ', visibile solo al Master' : ''}</p>

    storia.forEach(x => { h += `<li>${x.s ? `<a class="n" href="#/sessione/${encodeURIComponent(x.s.id)}">${esc(x.s.numero)}</a>` : '<span class="n"></span>'}<div class="t">${testoRicco(x.t, 'riga')}</div></li>`; });
